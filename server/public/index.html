      d.innerHTML = `<div class="dlg"><div class="dlg-head"><h2></h2></div><div class="dlg-body"><p></p><div class="stop-ask"></div></div></div>`;
      d.querySelector('h2').textContent = tl('Claude is working');
      d.querySelector('p').textContent = text;
      let answer = null;
      const bar = d.querySelector('.stop-ask');
      for (const [value, label, cls] of [['stop', tl('Stop now'), 'btn deny'], ['finish', tl('Ask to finish'), 'btn allow'], [null, tl('Cancel'), 'btn']]) {
        const b = Object.assign(document.createElement('button'), { type: 'button', className: cls, textContent: label });
        b.onclick = () => { answer = value; d.close(); };
        bar.appendChild(b);
      }
      d.addEventListener('close', () => { d.remove(); resolve(answer); });
      document.body.appendChild(d);
      d.showModal();
      bar.children[1].focus();
    });
  }

  /** Tells Claude to wrap up: a message read between its steps; the turn then ends by itself. */
  function askToFinish() {
    sendWhileRunning(tl('Please wrap up: finish the step you are on, don’t start anything new, and briefly sum up where things stand.'));
  }

  async function confirmStop() {
    const choice = await askStop(tl('Stop it now, or ask it to finish what it is doing and wrap up?'));
    if (choice === 'stop') stopRun();
    else if (choice === 'finish' && busy()) askToFinish();
  }

  /** Resolves once Claude's turn is over (at most `ms`; true if it ended). */
  function whenIdle(ms = Infinity) {
    return new Promise((resolve) => {
      const started = Date.now();
      const tick = () => (!busy() ? resolve(true) : Date.now() - started > ms ? resolve(false) : setTimeout(tick, 300));
      tick();
    });
  }

  // --- soft stop: interrupt the turn (the session and its history stay intact) ---
  async function stopRun() {
    if (!busy()) return;
    // A second press, or no run id yet: hard stop (the process is terminated).
    if (!runId || (interruptAt && Date.now() - interruptAt < 4000)) { controller.abort(); return; }
    interruptAt = Date.now();
    if (currentState) currentState.interrupting = true;
    spinner.phase(tl('stopping…'));
    try {
      await runControl({ subtype: 'interrupt' });
      setTimeout(() => { if (controller && currentState?.interrupting) controller.abort(); }, 8000);
    } catch {
      controller?.abort();
    }
  }

  renderMeta();
  /**
   * Left panel: file tree of the current project. Folders are fetched lazily when expanded.
   * Clicking a file inserts its relative path into the message. Files Claude edited during this
   * page session are highlighted. Collapsed state, width and open folders (per project) persist.
   * Like VS Code's explorer: ⌘-click / ⇧-click select several entries (copy, delete, drag them at
   * once); dragging rows onto a folder moves them (⌥ copies), onto a file — into its folder, onto
   * the empty area — into the project; a closed folder opens when hovered during a drag. Files and
   * folders from Finder (the app: copied by path) and files or pictures from pages (uploaded,
   * /api/upload) dropped on the tree are copied there. ⌘V pastes the system clipboard the same way
   * (a copied picture, base64 / data: text too); a picture without a name is opened for renaming.
   */
  const fileTree = (() => {
    const treeEl = $('tree');
    const sidebar = $('sidebar');
    const actionsBtn = $('treeActions');
    const narrow = matchMedia('(max-width: 760px)');
    const edited = new Set(); // absolute paths Claude wrote to
    let root = null; // project folder shown
    let expanded = new Set(); // relative paths of open folders
    let showHidden = store.get('claude.treeHidden') === '1';
    let refreshTimer = null;
    const selection = new Map(); // rel -> { rel, name, isDir } of the selected rows
    let anchor = null; // rel where a ⇧-click range starts

    const openKey = () => 'claude.treeOpen:' + root;
    const saveOpen = () => store.set(openKey(), JSON.stringify([...expanded]));
    const fmtSize = (n) => n == null ? '' : n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`;


    function toggleHidden() {
      showHidden = !showHidden;
      store.set('claude.treeHidden', showHidden ? '1' : '0');
      sync();
    }
    $('treeRefresh').onclick = () => sync();
    // The head's "⋯" opens the project folder's own menu (new file/folder, hidden files, refresh…).
    actionsBtn.onclick = () => {
      if (!menuEl.hidden && menuTarget?.head) return closeMenu();
      if (!root) return;
      const r = actionsBtn.getBoundingClientRect();
      openMenu(r.left, r.bottom + 4, projectTarget({ head: true }));
      actionsBtn.setAttribute('aria-expanded', 'true');
      menuEl.querySelector('.menu-row:not(:disabled)')?.focus();
    };

    // Drag the right edge to resize.
    const savedWidth = Number(store.get('claude.sideWidth'));
    if (savedWidth) sidebar.style.setProperty('--side-w', savedWidth + 'px');
    $('sideResize').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      document.body.classList.add('side-resizing'); // follow the pointer without animation
      const left = sidebar.getBoundingClientRect().left;
      const move = (ev) => {
        const w = Math.min(600, Math.max(180, ev.clientX - left));
        sidebar.style.setProperty('--side-w', w + 'px');
      };
      const up = () => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        document.body.classList.remove('side-resizing');
        store.set('claude.sideWidth', String(Math.round(sidebar.getBoundingClientRect().width)));
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });

    function note(container, text, depth) {
      const n = document.createElement('div');
      n.className = 'tree-note';
      n.style.paddingLeft = 8 + depth * 14 + 16 + 'px';
      n.textContent = text;
      container.appendChild(n);
    }

    /** Inserts a path at the cursor of the message box, separated by spaces. */
    function insertPath(rel) {
      const start = promptEl.selectionStart ?? promptEl.value.length;
      const end = promptEl.selectionEnd ?? start;
      const before = promptEl.value.slice(0, start);
      const sep = before && !/\s$/.test(before) ? ' ' : '';
      promptEl.setRangeText(sep + rel + ' ', start, end, 'end');
      promptEl.dispatchEvent(new Event('input'));
      promptEl.focus();
      if (narrow.matches) sidePanel.hide();
    }

    function makeRow(entry, rel, depth, kids) {
      const row = document.createElement('div');
      row.className = 'tree-row' + (entry.name.startsWith('.') ? ' dotfile' : '');
      row.setAttribute('role', 'treeitem');
      row.tabIndex = 0;
      row.style.paddingLeft = 8 + depth * 14 + 'px';
      row.title = rel + (entry.link ? ' ' + tl('(link)') : '');
      row.dataset.abs = root.replace(/\/$/, '') + '/' + rel;
      row.dataset.rel = rel;
      row.draggable = true;
      const isDir = entry.type === 'dir';
      if (isDir) row.dataset.dir = '1';
      if (selection.has(rel)) row.classList.add('sel');
      const self = { rel, name: entry.name, isDir };
      const open = isDir && expanded.has(rel);
      if (isDir) row.setAttribute('aria-expanded', String(open));
      if (edited.has(row.dataset.abs)) row.classList.add('changed');
      const tw = document.createElement('span');
      tw.className = 'twisty';
      tw.textContent = isDir ? (open ? '▾' : '▸') : '';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = (isDir ? (open ? '📂 ' : '📁 ') : viewer.icon(entry.name) + ' ') + entry.name + (entry.link ? ' ↪' : '');
      if (!isDir) row.title = `${rel}\n` + tl('Click — open in the viewer, ⌥-click — insert the path into the message');
      row.append(tw, name);
      if (!isDir && entry.size != null) {
        const size = document.createElement('span');
        size.className = 'size';
        size.textContent = fmtSize(entry.size);
        row.appendChild(size);
      }
      const activate = (e) => {
        if (!isDir) return e?.altKey ? insertPath(rel) : viewer.open(rel);
        const nowOpen = !expanded.has(rel);
        if (nowOpen) expanded.add(rel); else expanded.delete(rel);
        saveOpen();
        row.setAttribute('aria-expanded', String(nowOpen));
        tw.textContent = nowOpen ? '▾' : '▸';
        name.textContent = (nowOpen ? '📂 ' : '📁 ') + entry.name + (entry.link ? ' ↪' : '');
        if (nowOpen) renderDir(rel, kids, depth + 1); else { kids.replaceChildren(); pruneSelection(); }
      };
      row.expand = () => { if (isDir && !expanded.has(rel)) activate(); };
      row.onclick = (e) => {
        if (row.querySelector('.rename-input')) return;
        if (e.metaKey || e.ctrlKey) {
          if (selection.has(rel)) selection.delete(rel); else selection.set(rel, self);
          anchor = rel;
          return paintSelection();
        }
        if (e.shiftKey) return selectRange(rel);
        selectOnly(self);
        activate(e);
      };
      row.onkeydown = (e) => {
        if (e.target !== row) return; // typing in the rename box
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); return; }
        const target = targetOf(row);
        const mod = e.metaKey || e.ctrlKey;
        if (e.key === 'F2') { e.preventDefault(); startRename({ ...self, row }); }
        else if (e.altKey && e.shiftKey && e.code === 'KeyF') { e.preventDefault(); search.open(isDir ? rel : parentOf(rel)); }
        else if (mod && e.key === 'c') { e.preventDefault(); copyEntry(target); }
        else if (mod && e.key === 'Backspace') { e.preventDefault(); const r = row.getBoundingClientRect(); openMenu(r.left + 24, r.bottom, target, 'delete'); }
        else if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) { e.preventDefault(); const r = row.getBoundingClientRect(); openMenu(r.left + 24, r.bottom, target); }
      };
      row.oncontextmenu = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!selection.has(rel)) selectOnly(self);
        openMenu(e.clientX, e.clientY, targetOf(row));
      };
      row.addEventListener('dragstart', (e) => {
        if (row.querySelector('.rename-input')) return e.preventDefault();
        // Like VS Code: a row outside the selection is dragged alone.
        if (!selection.has(rel)) selectOnly(self);
        const items = topmost([...selection.values()]);
        dragItems = items;
        e.dataTransfer.effectAllowed = 'copyMove';
        e.dataTransfer.setData(TREE_TYPE, JSON.stringify({ cwd: root, items }));
        e.dataTransfer.setData('text/plain', items.map((i) => i.rel).join(' ')); // dropped into the message box: paths
        if (items.length > 1) {
          const label = Object.assign(document.createElement('div'), { className: 'tree-drag-label', textContent: nObjects(items.length) });
          document.body.append(label);
          e.dataTransfer.setDragImage(label, -12, -4);
          setTimeout(() => label.remove());
        }
      });
      row.addEventListener('dragend', () => { dragItems = null; clearDrop(); });
      return row;
    }

    // --- selection (several rows: ⌘-click toggles, ⇧-click selects a range) ---
    const nObjects = (n) => tn(n, '{0} item|{0} items');
    const entryOf = (r) => ({ rel: r.dataset.rel, name: r.dataset.rel.split('/').pop(), isDir: !!r.dataset.dir });

    function paintSelection() {
      for (const r of treeEl.querySelectorAll('.tree-row')) r.classList.toggle('sel', selection.has(r.dataset.rel));
    }
    function selectOnly(entry) {
      selection.clear();
      selection.set(entry.rel, entry);
      anchor = entry.rel;
      paintSelection();
    }
    function selectRange(rel) {
      const rows = [...treeEl.querySelectorAll('.tree-row')];
      const to = rows.findIndex((r) => r.dataset.rel === rel);
      let from = rows.findIndex((r) => r.dataset.rel === anchor);
      if (from < 0) { from = to; anchor = rel; }
      selection.clear();
      for (const r of rows.slice(Math.min(from, to), Math.max(from, to) + 1)) selection.set(r.dataset.rel, entryOf(r));
      paintSelection();
    }
    /** Keeps only the rows still shown (deleted, moved or in a collapsed folder fall out). */
    function pruneSelection() {
      const shown = new Set([...treeEl.querySelectorAll('.tree-row')].map((r) => r.dataset.rel));
      for (const rel of [...selection.keys()]) if (!shown.has(rel)) selection.delete(rel);
    }
    /** Entries without those inside another one of them (a folder carries its contents). */
    const topmost = (items) => items.filter((i) => !items.some((o) => o !== i && o.isDir && i.rel.startsWith(o.rel + '/')));
    /** The menu / key target of a row: the whole selection when the row is in a larger one. */
    function targetOf(row) {
      const self = entryOf(row);
      if (!selection.has(self.rel) || selection.size < 2) return { ...self, row };
      const items = topmost([...selection.values()]);
      return items.length > 1 ? { rel: self.rel, name: nObjects(items.length), isDir: false, row, items } : { ...items[0], row: rowOf(items[0].rel) || row };
    }
    treeEl.addEventListener('click', (e) => {
      if (e.target.closest('.tree-row')) return;
      selection.clear();
      paintSelection();
    });

    // --- drag and drop: rows between folders, files and pictures from outside ---
    const TREE_TYPE = 'application/x-ninebits-tree';
    const EXPAND_MS = 500; // hovering a closed folder this long during a drag opens it
    let dragItems = null; // rows dragged from this window (dataTransfer can't be read in dragover)
    let dropRow = null;
    let expandTimer = null;
    let expandRow = null;

    const accepts = (dt) => [TREE_TYPE, 'Files', 'text/uri-list', 'text/plain'].some((t) => dt.types.includes(t));
    /** The folder a drop at `e` goes to: a folder row, the folder of a file row, or the project. */
    function destOf(e) {
      const row = e.target.closest?.('.tree-row');
      if (!row) return { rel: '', row: null };
      if (row.dataset.dir) return { rel: row.dataset.rel, row };
      const rel = parentOf(row.dataset.rel);
      return { rel, row: rel ? rowOf(rel) : null };
    }
    function clearDrop() {
      dropRow?.classList.remove('drop-into');
      dropRow = null;
      treeEl.classList.remove('drop-root');
      clearTimeout(expandTimer);
      expandRow = null;
    }
    /** Can the rows dragged in this window go into folder `dest`? */
    function canDrop(dest, copy) {
      if (!dragItems) return true;
      if (dragItems.some((i) => i.isDir && (dest === i.rel || dest.startsWith(i.rel + '/')))) return false;
      return copy || dragItems.some((i) => parentOf(i.rel) !== dest);
    }

    treeEl.addEventListener('dragover', (e) => {
      if (!root || !accepts(e.dataTransfer)) return;
      e.preventDefault();
      const dest = destOf(e);
      const own = e.dataTransfer.types.includes(TREE_TYPE);
      const copy = !own || e.altKey;
      const ok = canDrop(dest.rel, copy);
      e.dataTransfer.dropEffect = !ok ? 'none' : copy ? 'copy' : 'move';
      if (dropRow !== dest.row) { dropRow?.classList.remove('drop-into'); dropRow = dest.row; }
      dropRow?.classList.toggle('drop-into', ok);
      treeEl.classList.toggle('drop-root', ok && !dest.row);
      const hover = e.target.closest('.tree-row');
      if (hover !== expandRow) {
        clearTimeout(expandTimer);
        expandRow = hover;
        if (hover?.dataset.dir && hover.getAttribute('aria-expanded') !== 'true') expandTimer = setTimeout(() => hover.expand?.(), EXPAND_MS);
      }
    });
    treeEl.addEventListener('dragleave', (e) => { if (!treeEl.contains(e.relatedTarget)) clearDrop(); });
    treeEl.addEventListener('drop', (e) => {
      if (!root || !accepts(e.dataTransfer)) return;
      e.preventDefault();
      clearDrop();
      const dest = destOf(e).rel;
      const dt = e.dataTransfer;
      // Everything is read now: the data is gone once the handler returns.
      const own = dt.getData(TREE_TYPE);
      if (own) {
        let data;
        try { data = JSON.parse(own); } catch { return; }
        if (data.cwd === root && !canDrop(dest, e.altKey)) return;
        return dropRows(data, dest, e.altKey);
      }
      const files = [...dt.files];
      const entries = [...dt.items].filter((i) => i.kind === 'file').map((i) => i.webkitGetAsEntry?.() || null);
      const html = dt.getData('text/html');
      const url = dt.getData('text/uri-list').split(/\r?\n/).find((l) => l && !l.startsWith('#'))
        || new DOMParser().parseFromString(html, 'text/html').querySelector('img')?.getAttribute('src');
      const text = dt.getData('text/plain');
      if (!files.length && !url) {
        // Dragged text: a picture (or another file) as base64 / a data: URL, or a picture's URL.
        const blob = decodeBase64(text);
        if (blob) return saveIncoming(dest, { blobs: [blob] });
        if (imageUrl(text)) return saveIncoming(dest, { url: text.trim() });
        return flash(tl('Files and images (and a base64 image) can be dropped here'), true);
      }
      saveIncoming(dest, { files, entries, url, html });
    });

    // ⌘V on a row (into its folder) or on the empty tree (into the project): what the system
    // clipboard holds — files, a copied picture, base64 — or the files copied in the tree.
    treeEl.tabIndex = -1;
    treeEl.addEventListener('paste', (e) => {
      if (!root || e.target.closest('input, textarea')) return; // a name being typed
      e.preventDefault();
      const row = e.target.closest('.tree-row');
      const dest = row ? (row.dataset.dir ? row.dataset.rel : parentOf(row.dataset.rel)) : '';
      const cd = e.clipboardData;
      pasteInto({ rel: dest, isDir: true }, {
        files: [...cd.files],
        entries: [...cd.items].filter((i) => i.kind === 'file').map((i) => i.webkitGetAsEntry?.() || null),
        html: cd.getData('text/html'),
        text: cd.getData('text/plain'),
      });
    });

    /** Rows dragged in the tree (maybe another window's): moved within the project, else copied. */
    async function dropRows(data, dest, copy) {
      const move = data.cwd === root && !copy;
      const done = [], errors = [];
      for (const it of data.items) {
        try {
          if (move) {
            if (parentOf(it.rel) === dest) continue;
            const d = await fsop({ cwd: root, op: 'move', path: it.rel, dest });
            viewer.moved(it.rel, d.rel);
            expanded = new Set([...expanded].map((p) => (p === it.rel || p.startsWith(it.rel + '/') ? d.rel + p.slice(it.rel.length) : p)));
            done.push(d);
          } else {
            done.push(await fsop({ cwd: root, op: 'copy', srcCwd: data.cwd, src: it.rel, path: dest }));
          }
        } catch (e) {
          errors.push(`${it.name}: ${e.message}`);
        }
      }
      finishDrop(dest, done, errors, move ? tl('Moved') : tl('Copied'));
    }

    // --- what comes from outside: names, base64 ---
    // Names browsers give to pictures without one ("image.png" of a copied picture and so on).
    const GENERIC_NAME = /^(image|img|blob|file|unknown|untitled|download|изображение|без имени)(\.\w{1,5})?$/i;
    const FILE_EXT = {
      'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif', 'image/webp': 'webp', 'image/svg+xml': 'svg',
      'image/avif': 'avif', 'image/bmp': 'bmp', 'image/heic': 'heic', 'image/tiff': 'tiff', 'image/x-icon': 'ico',
      'application/pdf': 'pdf', 'text/plain': 'txt', 'application/json': 'json',
    };
    const IMAGE_URL = /^https?:\/\/\S+\.(png|jpe?g|gif|webp|svg|avif|bmp|heic|tiff?|ico)(\?\S*)?$/i;
    const imageUrl = (text) => IMAGE_URL.test((text || '').trim()) || /^data:[^,\s]+,/.test((text || '').trim());
    const withExt = (name, type) => (FILE_EXT[type] && !/\.\w{1,5}$/.test(name) ? `${name}.${FILE_EXT[type]}` : name);

    /** The type of a file by its first bytes (for base64 without a data: prefix). */
    function sniff(b) {
      const at = (i, ...v) => v.every((x, k) => b[i + k] === x);
      const ascii = (i, str) => at(i, ...[...str].map((c) => c.charCodeAt(0)));
      if (at(0, 0x89, 0x50, 0x4e, 0x47)) return 'image/png';
      if (at(0, 0xff, 0xd8, 0xff)) return 'image/jpeg';
      if (ascii(0, 'GIF8')) return 'image/gif';
      if (ascii(0, 'RIFF') && ascii(8, 'WEBP')) return 'image/webp';
      if (ascii(4, 'ftypavif')) return 'image/avif';
      if (ascii(4, 'ftypheic') || ascii(4, 'ftypmif1')) return 'image/heic';
      if (ascii(0, '%PDF')) return 'application/pdf';
      if (ascii(0, 'BM') && b.length > 26) return 'image/bmp';
      if (at(0, 0x49, 0x49, 0x2a, 0) || at(0, 0x4d, 0x4d, 0, 0x2a)) return 'image/tiff';
      const head = new TextDecoder().decode(b.subarray(0, 512)).trimStart();
      if (/^(<\?xml[^>]*>\s*)?(<!--[\s\S]*?-->\s*)*<svg[\s>]/i.test(head)) return 'image/svg+xml';
      return null;
    }

    /** A data: URL, or bare base64 of a known file type -> Blob; anything else -> null. */
    function decodeBase64(text) {
      text = (text || '').trim();
      if (text.length < 16) return null;
      const m = /^data:([\w.+-]+\/[\w.+-]+)?((?:;[\w-]+=[^;,]*)*)(;base64)?,([\s\S]*)$/i.exec(text);
      if (m && !m[3]) {
        // data:image/svg+xml,<svg…> (percent-encoded text)
        try { return new Blob([decodeURIComponent(m[4])], { type: m[1] || 'text/plain' }); } catch { return null; }
      }
      let b64 = (m ? m[4] : text).replace(/\s+/g, '');
      if (!/^[A-Za-z0-9+/_-]+={0,2}$/.test(b64)) return null;
      b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
      let bytes;
      try { bytes = Uint8Array.from(atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4)), (c) => c.charCodeAt(0)); } catch { return null; }
      const type = m ? (m[1] || sniff(bytes) || 'application/octet-stream') : sniff(bytes);
      return type ? new Blob([bytes], { type }) : null;
    }

    /** The file name in a URL (the page's own /api/raw?path=… too), or null. */
    function nameOfUrl(url) {
      try {
        const u = new URL(url, location.href);
        const own = u.origin === location.origin && u.searchParams.get('path');
        const seg = own || (/^https?:$/.test(u.protocol) ? decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || '') : '');
        const name = seg.split('/').pop();
        return name && !GENERIC_NAME.test(name) ? name : null;
      } catch {
        return null;
      }
    }
    /** The name of a copied or dragged picture from the HTML that came with it (<img src>). */
    function nameOfHtml(html) {
      if (!html) return null;
      const src = new DOMParser().parseFromString(html, 'text/html').querySelector('img')?.getAttribute('src');
      return src ? nameOfUrl(src) : null;
    }

    /**
     * Saves into folder `dest` what came from outside: `files` (Finder's are copied by path in the
     * app), `blobs` (a copied picture, decoded base64) or a `url`. The name is the file's own, else
     * the one in the HTML that came with it; with none the file gets "image.<ext>" and its name is
     * offered for editing right away.
     */
    async function saveIncoming(dest, { files = [], entries = [], blobs = [], url = null, html = '' }, verb = tl('Copied')) {
      const done = [], errors = [];
      let folders = 0;
      const htmlName = nameOfHtml(html);
      const named = (name, type) => {
        if (name && !GENERIC_NAME.test(name)) return { name, unnamed: false };
        if (htmlName) return { name: withExt(htmlName, type), unnamed: false };
        return { name: withExt(name || 'image', type), unnamed: true };
      };
      const items = [...files.map((f, i) => ({ f, entry: entries[i] })), ...blobs.map((b) => ({ f: b }))];
      if (items.length) {
        flash(tl('Copying {0}…', items.length > 1 ? nObjects(items.length) : items[0].f.name || tl('the image')));
        for (const { f, entry } of items) {
          const abs = f instanceof File && window.ninebits?.pathForFile?.(f);
          try {
            if (abs) {
              // The app knows where the file is: the server copies it (folders too, no upload).
              const k = abs.lastIndexOf('/');
              done.push(await fsop({ cwd: root, op: 'copy', srcCwd: abs.slice(0, k) || '/', src: abs.slice(k + 1), path: dest }));
            } else if (entry?.isDirectory) {
              folders++;
            } else {
              const n = named(f.name, f.type);
              done.push({ ...(await upload(dest, f, n.name)), unnamed: n.unnamed });
            }
          } catch (e) {
            errors.push(`${f.name || tl('image')}: ${e.message}`);
          }
        }
        if (folders) errors.push(tl('folders from a browser are not copied ({0})', folders));
      } else if (url) {
        flash(tl('Saving the image…'));
        try { done.push(await uploadUrl(dest, url, htmlName)); } catch (e) { errors.push(e.message); }
      }
      await finishDrop(dest, done, errors, verb);
      if (done.length === 1 && done[0].unnamed) {
        const row = rowOf(done[0].rel);
        if (row) { startRename({ rel: done[0].rel, name: done[0].name, isDir: false, row }); flash(tl('Enter a file name (Enter — save, Esc — leave as is)')); }
      }
    }

    async function upload(dest, blob, name, url) {
      const q = new URLSearchParams({ cwd: root, path: dest, name: String(name || 'file').replace(/[/\0]/g, '_') });
      if (url) q.set('url', url);
      const r = await fetch('/api/upload?' + q, { method: 'POST', body: blob || '' });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(tlMsg(d.error || r.statusText));
      return d;
    }

    /** A picture (or any file) by URL: read by the page when it can (its own, data:, blob:, CORS), else by the server. */
    async function uploadUrl(dest, url, fallbackName = null) {
      const own = nameOfUrl(url) || fallbackName;
      let name = own || 'image';
      let blob = decodeBase64(url); // data: URLs
      if (!blob) try { const r = await fetch(url); if (r.ok) blob = await r.blob(); } catch {}
      if (blob) return { ...(await upload(dest, blob, withExt(name, blob.type))), unnamed: !own };
      if (!/^https?:/i.test(url)) throw new Error(tl('Could not read what was dropped'));
      return { ...(await upload(dest, null, name, url)), unnamed: !own };
    }

    async function finishDrop(dest, done, errors, verb) {
      if (dest) expanded.add(dest);
      saveOpen();
      selection.clear();
      for (const d of done) selection.set(d.rel, { rel: d.rel, name: d.name, isDir: false });
      await sync();
      // isDir of the new rows comes from the tree now.
      for (const d of done) { const r = rowOf(d.rel); if (r) selection.set(d.rel, entryOf(r)); }
      if (done.length) reveal(done[done.length - 1].rel);
      const what = done.length === 1 ? done[0].name : nObjects(done.length);
      if (errors.length) flash((done.length ? `${verb}: ${what}. ` : '') + tl('Failed: {0}', errors.join('; ')), true);
      else if (done.length) flash(`${verb}: ${what}`);
    }

    // --- context menu: new file/folder, copy, copy path, paste, rename, delete (to the Trash), Finder, info ---
    const menuEl = $('treeMenu');
    const flashEl = $('treeFlash');
    const CLIP_KEY = 'claude.fileClipboard'; // shared by the tabs: copy in one, paste in another
    const parentOf = (rel) => (rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '');
    const absOf = (rel) => root.replace(/\/$/, '') + (rel ? '/' + rel : '');
    let menuTarget = null;
    let flashTimer = null;

    function flash(text, error = false) {
      flashEl.textContent = text;
      flashEl.classList.toggle('error', error);
      flashEl.hidden = false;
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => { flashEl.hidden = true; }, error ? 6000 : 2500);
    }

    // The folder of the entry the menu is open for: the project, or the folder of a file opened from
    // outside it (a viewer tab's menu).
    let opCwd = null;
    async function fsop(body) {
      const r = await fetch('/api/fsop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cwd: opCwd || root, ...body }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(tlMsg(d.error || r.statusText));
      return d;
    }

    /** { cwd, items: [{ rel, name, isDir }], name } (an old single-entry value is converted). */
    function clipboard() {
      let c;
      try { c = JSON.parse(store.get(CLIP_KEY) || 'null'); } catch { return null; }
      if (!c) return null;
      if (!c.items) c.items = [{ rel: c.rel, name: c.name, isDir: c.isDir }];
      c.name = c.items.length === 1 ? c.items[0].name : nObjects(c.items.length);
      return c;
    }

    async function writeClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = Object.assign(document.createElement('textarea'), { value: text });
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
    }

    function copyEntry(t) {
      const items = (t.items || [t]).map(({ rel, name, isDir }) => ({ rel, name, isDir }));
      // The paths go to the system clipboard too: what is copied there later (a picture, text) is
      // then newer than these files and wins on ⌘V.
      const text = items.map((i) => absOf(i.rel)).join('\n');
      store.set(CLIP_KEY, JSON.stringify({ cwd: root, items, text }));
      writeClipboard(text);
      flash(tl('Copied: {0}. Paste — in the folder menu or ⌘V', t.name));
    }

    /**
     * Paste into folder `t` (or the folder of file `t`) from `sys` = { files, entries, blobs, html,
     * text } of the system clipboard: files and pictures are saved; text equal to the paths of files
     * copied in the tree pastes those files; base64 or a picture's URL is saved as a file.
     */
    async function pasteInto(t, sys) {
      const dest = t.isDir ? t.rel : parentOf(t.rel);
      const clip = clipboard();
      const text = (sys.text || '').trim();
      if (sys.files?.length || sys.blobs?.length) return saveIncoming(dest, sys, tl('Pasted'));
      if (clip && text && text === clip.text) return paste(t);
      const blob = decodeBase64(text);
      if (blob) return saveIncoming(dest, { blobs: [blob] }, tl('Pasted'));
      if (imageUrl(text)) return saveIncoming(dest, { url: text, html: sys.html }, tl('Pasted'));
      if (clip && (!text || !clip.text)) return paste(t); // nothing newer in the clipboard (or an old copy)
      flash(text ? tl('The clipboard holds text: files, images and base64 can be pasted') : tl('The clipboard is empty: copy a file, folder or image'), true);
    }

    /** "Paste" in the menu: the system clipboard through the async API (asks for access in a browser). */
    async function pasteMenu(t) {
      const sys = { blobs: [], html: '', text: '' };
      try {
        for (const it of await navigator.clipboard.read()) {
          for (const type of it.types) {
            const b = await it.getType(type);
            if (type === 'text/html') sys.html = await b.text();
            else if (type === 'text/plain') sys.text = await b.text();
            else if (!type.startsWith('text/')) sys.blobs.push(b);
          }
        }
      } catch {
        try { sys.text = await navigator.clipboard.readText(); } catch {}
      }
      // Files copied in Finder come only with ⌘V (the async API sees just their names).
      pasteInto(t, sys);
    }

    async function copyPath(t, relative) {
      const text = relative ? t.rel || '.' : absOf(t.rel);
      await writeClipboard(text);
      flash(tl('Path copied: {0}', text));
    }

    /** Pastes the copied entry into the folder `t` (or the folder of file `t`). */
    async function paste(t) {
      const clip = clipboard();
      if (!clip) return flash(tl('Copy a file or folder first'), true);
      const dest = t.isDir ? t.rel : parentOf(t.rel);
      const done = [], errors = [];
      for (const it of clip.items) {
        try { done.push(await fsop({ op: 'copy', srcCwd: clip.cwd, src: it.rel, path: dest })); } catch (e) { errors.push(`${it.name}: ${e.message}`); }
      }
      if (dest && done.length) { expanded.add(dest); saveOpen(); }
      if (done.length) await sync();
      if (done.length) reveal(done[done.length - 1].rel);
      const what = done.length === 1 ? done[0].name : nObjects(done.length);
      if (errors.length) flash((done.length ? tl('Pasted: {0}.', what) + ' ' : '') + tl('Could not paste: {0}', errors.join('; ')), true);
      else flash(tl('Pasted: {0}', what));
    }

    async function remove(t) {
      const errors = [];
      let n = 0;
      for (const it of t.items || [t]) {
        try {
          await fsop({ op: 'delete', path: it.rel });
          n++;
          viewer.moved(it.rel, null);
          for (const p of [...expanded]) if (p === it.rel || p.startsWith(it.rel + '/')) expanded.delete(p);
        } catch (e) {
          errors.push(`${it.name}: ${e.message}`);
        }
      }
      saveOpen();
      if (n) await sync();
      if (errors.length) flash(tl('Could not delete: {0}', errors.join('; ')), true);
      else flash(t.items ? tl('{0} moved to the Trash', nObjects(n)) : tl('“{0}” moved to the Trash', t.name));
    }

    /** Inline rename: the name becomes an input; Enter saves, Esc or leaving the field cancels. */
    function startRename(t) {
      const nameEl = t.row.querySelector('.name');
      if (!nameEl || t.row.querySelector('.rename-input')) return;
      const input = Object.assign(document.createElement('input'), { className: 'rename-input', value: t.name, spellcheck: false });
      nameEl.hidden = true;
      nameEl.after(input);
      input.focus();
      const dot = t.isDir || t.name.startsWith('.') ? -1 : t.name.lastIndexOf('.');
      input.setSelectionRange(0, dot > 0 ? dot : t.name.length); // the name without its extension, like Finder
      let done = false;
      const finish = async (save) => {
        if (done) return;
        done = true;
        const name = input.value.trim();
        if (!save || !name || name === t.name) { input.remove(); nameEl.hidden = false; t.row.focus(); return; }
        try {
          const d = await fsop({ op: 'rename', path: t.rel, name });
          viewer.moved(t.rel, d.rel);
          expanded = new Set([...expanded].map((p) => (p === t.rel || p.startsWith(t.rel + '/') ? d.rel + p.slice(t.rel.length) : p)));
          saveOpen();
          await sync();
          reveal(d.rel);
          flash(tl('Renamed: {0}', name));
        } catch (e) {
          input.remove();
          nameEl.hidden = false;
          flash(tl('Could not rename: {0}', e.message), true);
        }
      };
      input.onkeydown = (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      };
      input.onblur = () => finish(false);
      input.onclick = (e) => e.stopPropagation();
    }

    /**
     * Inline naming of a new file or folder in folder `t` (or the folder of file `t`): an input row
     * at the top of that folder; Enter or leaving the field creates it, Esc or an empty name cancels.
     * A new file opens in the viewer.
     */
    async function startCreate(t, isDir) {
      if (!root) return;
      const dir = t.isDir ? t.rel : parentOf(t.rel);
      let box = treeEl, depth = 0;
      if (dir) {
        if (!expanded.has(dir)) { expanded.add(dir); saveOpen(); await sync(); }
        const parent = rowOf(dir);
        if (!parent || parent.nextElementSibling?.getAttribute('role') !== 'group') return;
        box = parent.nextElementSibling;
        depth = (parseInt(parent.style.paddingLeft, 10) - 8) / 14 + 1;
      }
      const row = document.createElement('div');
      row.className = 'tree-row';
      row.style.paddingLeft = 8 + depth * 14 + 'px';
      const input = Object.assign(document.createElement('input'), { className: 'rename-input', spellcheck: false, placeholder: isDir ? tl('Folder name') : tl('File name') });
      row.append(Object.assign(document.createElement('span'), { className: 'twisty' }), (isDir ? '📁' : '📄') + ' ', input);
      box.prepend(row);
      row.scrollIntoView({ block: 'nearest' });
      input.focus();
      let done = false;
      const finish = async (save) => {
        if (done) return;
        done = true;
        const name = input.value.trim();
        if (!save || !name) { row.remove(); return; }
        try {
          const d = await fsop({ op: isDir ? 'mkdir' : 'touch', path: dir, name });
          row.remove();
          await sync();
          reveal(d.rel);
          if (!isDir) viewer.open(d.rel);
          flash(tl('Created: {0}', d.name));
        } catch (e) {
          row.remove();
          flash((isDir ? tl('Could not create the folder: {0}', e.message) : tl('Could not create the file: {0}', e.message)), true);
        }
      };
      input.onkeydown = (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      };
      input.onblur = () => finish(true);
      input.onclick = (e) => e.stopPropagation();
    }

    async function showInFinder(t) {
      try { await fsop({ op: 'reveal', path: t.rel }); } catch (e) { flash(tl('Could not show in Finder: {0}', e.message), true); }
    }

    const rowOf = (rel) => [...treeEl.querySelectorAll('.tree-row')].find((r) => r.dataset.abs === absOf(rel));

    /** Scrolls to and focuses the row of `rel` (after a paste or rename). */
    function reveal(rel) {
      const row = rowOf(rel);
      if (row) { row.scrollIntoView({ block: 'nearest' }); row.focus({ preventScroll: true }); }
    }

    const fmtDate = (iso) => new Date(iso).toLocaleString(LOCALE, { dateStyle: 'medium', timeStyle: 'short' });

    async function showInfo(t) {
      menuEl.innerHTML = `<div class="menu-note">${tl('Loading…')}</div>`;
      let d;
      try {
        d = await fsop({ op: 'info', path: t.rel });
      } catch (e) {
        menuEl.innerHTML = '';
        menuEl.appendChild(Object.assign(document.createElement('div'), { className: 'menu-note', textContent: '⚠️ ' + e.message }));
        return;
      }
      if (menuTarget !== t) return;
      const TYPES = { file: tl('File'), dir: tl('Folder'), link: tl('Symbolic link') };
      const rows = [
        [tl('Type'), TYPES[d.type] + (d.type === 'link' ? ` → ${d.targetType === 'missing' ? tl('no target') : d.targetType === 'dir' ? tl('folder') : tl('file')}` : '')],
        [tl('Size'), d.type === 'dir' ? `${fmtSize(d.size)}${d.partial ? '+ ' + tl('(count interrupted)') : ''} · ${tl('files: {0}, folders: {1}', d.files, d.folders)}` : `${fmtSize(d.size)} (${tl('{0} bytes', d.size.toLocaleString(LOCALE))})`],
        ...(d.lines != null ? [[tl('Lines'), d.lines.toLocaleString(LOCALE)]] : []),
        ...(d.target ? [[tl('Link to'), d.target]] : []),
        [tl('Path'), d.abs],
        [tl('Modified'), fmtDate(d.mtime)],
        [tl('Created'), fmtDate(d.birthtime)],
        [tl('Permissions'), `${d.mode} · ${d.owner}`],
      ];
      menuEl.innerHTML = '';
      menuEl.appendChild(Object.assign(document.createElement('div'), { className: 'info-title', textContent: (t.isDir ? '📁 ' : viewer.icon(d.name) + ' ') + (d.name || '/') }));
      const dl = document.createElement('dl');
      dl.className = 'info-grid';
      for (const [k, v] of rows) dl.append(Object.assign(document.createElement('dt'), { textContent: k }), Object.assign(document.createElement('dd'), { textContent: v }));
      menuEl.appendChild(dl);
      placeMenu();
    }

    let menuX = 0, menuY = 0;
    function placeMenu() {
      const r = menuEl.getBoundingClientRect();
      menuEl.style.left = Math.max(4, Math.min(menuX, innerWidth - r.width - 4)) + 'px';
      menuEl.style.top = Math.max(4, Math.min(menuY, innerHeight - r.height - 4)) + 'px';
    }

    function closeMenu() {
      if (menuEl.hidden) return;
      menuEl.hidden = true;
      menuTarget?.row?.classList.remove('ctx');
      if (menuTarget?.head) actionsBtn.setAttribute('aria-expanded', 'false');
      menuTarget = null;
    }

    const projectTarget = (extra) => ({ rel: '', name: root.split('/').filter(Boolean).pop() || '/', isDir: true, root: true, ...extra });

    /** `t` = { rel, name, isDir, row } of an entry, or the project folder ({ rel: '', isDir, root, head? }). */
    function openMenu(x, y, t, mode = 'menu') {
      closeMenu();
      menuTarget = t;
      opCwd = t.cwd || null;
      menuX = x; menuY = y;
      t.row?.classList.add('ctx');
      menuEl.innerHTML = '';
      const item = (label, kbd, onClick, { danger = false, disabled = false } = {}) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'menu-row' + (danger ? ' danger' : '');
        b.setAttribute('role', 'menuitem');
        b.disabled = disabled;
        b.append(label);
        if (kbd) b.appendChild(Object.assign(document.createElement('span'), { className: 'kbd', textContent: kbd }));
        b.onclick = (e) => { e.stopPropagation(); onClick(); };
        menuEl.appendChild(b);
        return b;
      };
      const hr = () => menuEl.appendChild(Object.assign(document.createElement('div'), { className: 'menu-hr' }));
      const pasteLabel = tl('Paste'); // the system clipboard may hold something newer than the copied files

      if (mode === 'delete') {
        const what = t.items ? t.name : `«${t.name}»`;
        const withContents = t.items ? t.items.some((i) => i.isDir) : t.isDir;
        menuEl.appendChild(Object.assign(document.createElement('div'), { className: 'menu-note', textContent: tl('Move {0} to the Trash?', what) + (withContents ? ' ' + tl('With all its contents.') : '') }));
        item(tl('🗑 To the Trash'), '', () => { closeMenu(); remove(t); }, { danger: true }).focus();
        item(tl('Cancel'), 'Esc', () => { closeMenu(); t.row?.focus(); });
      } else if (t.cwd) {
        // A file outside the project (its viewer tab): paths and properties only.
        const abs = `${t.cwd.replace(/\/$/, '')}/${t.rel}`;
        item(tl('Copy the path'), '', async () => { closeMenu(); await writeClipboard(abs); flash(tl('Path copied: {0}', abs)); });
        item(tl('Insert the path into the message'), '', () => { closeMenu(); insertPath(abs); });
        item(tl('Show in Finder'), '', () => { closeMenu(); showInFinder(t); });
        hr();
        item(tl('Properties'), '', () => showInfo(t));
      } else if (t.items) {
        // Several selected entries.
        menuEl.appendChild(Object.assign(document.createElement('div'), { className: 'menu-note', textContent: tl('Selected: {0}', t.name) }));
        item(tl('Copy'), '⌘C', () => { closeMenu(); copyEntry(t); });
        item(tl('Copy the paths'), '', async () => { closeMenu(); await writeClipboard(t.items.map((i) => absOf(i.rel)).join('\n')); flash(tl('Paths copied')); });
        item(tl('Insert the paths into the message'), '', () => { closeMenu(); insertPath(t.items.map((i) => i.rel).join(' ')); });
        hr();
        item(tl('Delete'), '⌘⌫', () => openMenu(x, y, t, 'delete'), { danger: true });
        hr();
        item(tl('Clear the selection'), '', () => { closeMenu(); selection.clear(); paintSelection(); });
      } else if (t.root) {
        item(tl('New file…'), '', () => { closeMenu(); startCreate(t, false); });
        item(tl('New folder…'), '', () => { closeMenu(); startCreate(t, true); });
        hr();
        item(tl('Find in the project…'), '⇧⌘F', () => { closeMenu(); search.open(''); });
        hr();
        item(pasteLabel, '⌘V', () => { closeMenu(); pasteMenu(t); });
        hr();
        item(tl('Copy the folder path'), '', () => { closeMenu(); copyPath(t, false); });
        item(tl('Open in Finder'), '', () => { closeMenu(); showInFinder(t); });
        item(tl('Properties'), '', () => showInfo(t));
        hr();
        item(tl('Show hidden files'), showHidden ? '✓' : '', () => { closeMenu(); toggleHidden(); });
        item(tl('Refresh'), '', () => { closeMenu(); sync(); });
      } else {
        item(tl('New file…'), '', () => { closeMenu(); startCreate(t, false); });
        item(tl('New folder…'), '', () => { closeMenu(); startCreate(t, true); });
        hr();
        item(t.isDir ? tl('Find in the folder…') : tl('Find in the file’s folder…'), '⌥⇧F', () => { closeMenu(); search.open(t.isDir ? t.rel : parentOf(t.rel)); });
        hr();
        item(tl('Copy'), '⌘C', () => { closeMenu(); copyEntry(t); });
        item(pasteLabel, '⌘V', () => { closeMenu(); pasteMenu(t); });
        hr();
        item(tl('Copy the path'), '', () => { closeMenu(); copyPath(t, false); });
        item(tl('Copy the relative path'), '', () => { closeMenu(); copyPath(t, true); });
        item(tl('Insert the path into the message'), tl('⌥click'), () => { closeMenu(); insertPath(t.rel); });
        item(tl('Show in Finder'), '', () => { closeMenu(); showInFinder(t); });
        hr();
        item(tl('Rename'), 'F2', () => { closeMenu(); startRename(t); });
        item(tl('Delete'), '⌘⌫', () => openMenu(x, y, t, 'delete'), { danger: true });
        hr();
        item(tl('Properties'), '', () => showInfo(t));
      }
      menuEl.hidden = false;
      placeMenu();
    }

    treeEl.addEventListener('contextmenu', (e) => {
      if (e.target.closest('.tree-row') || !root) return;
      e.preventDefault();
      openMenu(e.clientX, e.clientY, projectTarget());
    });
    // The "⋯" button toggles the menu itself.
    document.addEventListener('pointerdown', (e) => { if (!menuEl.hidden && !menuEl.contains(e.target) && !actionsBtn.contains(e.target)) closeMenu(); }, true);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !menuEl.hidden) { const row = menuTarget?.row; closeMenu(); row?.focus(); }
    });
    treeEl.addEventListener('scroll', closeMenu, { passive: true });

    /**
     * Fills `container` with one folder level (and open subfolders). Built off-screen and swapped
     * in at once, so a refresh doesn't flicker.
     */
    async function renderDir(rel, container, depth) {
      const box = document.createElement('div');
      let d;
      try {
        d = await getJson(`/api/tree?cwd=${encodeURIComponent(root)}&path=${encodeURIComponent(rel)}${showHidden ? '&hidden=1' : ''}`);
      } catch (e) {
        note(box, '⚠️ ' + e.message, depth);
        container.replaceChildren(...box.childNodes);
        return;
      }
      const nested = [];
      for (const entry of d.entries) {
        const childRel = rel ? `${rel}/${entry.name}` : entry.name;
        const kids = document.createElement('div');
        kids.setAttribute('role', 'group');
        box.appendChild(makeRow(entry, childRel, depth, kids));
        if (entry.type === 'dir') {
          box.appendChild(kids);
          if (expanded.has(childRel)) nested.push(renderDir(childRel, kids, depth + 1));
        }
      }
      if (d.truncated) note(box, '… ' + tl('and {0} more', d.total - d.entries.length), depth);
      if (!d.entries.length) note(box, depth ? tl('empty') : tl('The folder is empty'), depth);
      await Promise.all(nested);
      container.replaceChildren(...box.childNodes);
    }

    /** Shows the current project (cwd) and reloads open folders. */
    async function sync() {
      if (!sidePanel.isShowing('files') || !cwd) return; // loaded when the view is opened
      if (root !== cwd) {
        root = cwd;
        selection.clear();
        search.reset();
        try { expanded = new Set(JSON.parse(store.get(openKey()) || '[]')); } catch { expanded = new Set(); }
        treeEl.scrollTop = 0;
      }
      $('treeTitle').textContent = tl('Navigator') + ' · ' + (root.split('/').filter(Boolean).pop() || '/');
      $('treeTitle').title = root;
      const top = treeEl.scrollTop;
      await renderDir('', treeEl, 0);
      treeEl.scrollTop = top;
      pruneSelection();
    }

    /**
     * Search in files (server/search.js): names of files and folders and lines of text in a folder
     * of the project — the one picked (⌥⇧F, the menu) or, from the head's button, the selected
     * folder (the selected file's folder), else the whole project. The results replace the tree
     * while there is a query; a line opens the file in the editor with the match selected.
     */
    const search = (() => {
      const panelEl = $('treeSearch'), input = $('treeSearchInput'), resultsEl = $('treeResults');
      const statusEl = $('treeSearchStatus'), scopeEl = $('treeSearchScope'), allBtn = $('treeSearchAll'), btn = $('treeSearchBtn');
      const OPTS_KEY = 'claude.treeSearchOpts';
      const opts = { case: false, word: false, regex: false };
      try { Object.assign(opts, JSON.parse(store.get(OPTS_KEY) || '{}')); } catch {}
      const optBtns = { case: $('treeSearchCase'), word: $('treeSearchWord'), regex: $('treeSearchRegex') };
      let scope = '';
      let ctrl = null;
      let timer = null;

      const status = (text, error = false) => { statusEl.textContent = text; statusEl.classList.toggle('error', error); };
      function paintOpts() {
        for (const [k, b] of Object.entries(optBtns)) b.setAttribute('aria-pressed', String(!!opts[k]));
      }
      for (const [k, b] of Object.entries(optBtns)) {
        b.onclick = () => { opts[k] = !opts[k]; store.set(OPTS_KEY, JSON.stringify(opts)); paintOpts(); run(0); input.focus(); };
      }
      paintOpts();

      function paintScope() {
        const project = root?.split('/').filter(Boolean).pop() || '/';
        scopeEl.textContent = '📁 ' + (scope ? scope : project + ' ' + tl('(the whole project)'));
        scopeEl.title = tl('Where to search: {0}', absOf(scope));
        allBtn.hidden = !scope;
      }
      allBtn.onclick = () => { scope = ''; paintScope(); run(0); input.focus(); };

      function showTree(on) {
        treeEl.hidden = !on;
        resultsEl.hidden = on;
      }

      /** Opens the panel for folder `rel` ('' = the project); undefined: the tree's selected folder. */
      function open(rel) {
        if (!root) return;
        if (rel === undefined) {
          const sel = [...selection.values()];
          rel = sel.length === 1 ? (sel[0].isDir ? sel[0].rel : parentOf(sel[0].rel)) : (panelEl.hidden ? '' : scope);
        }
        scope = rel;
        panelEl.hidden = false;
        btn.setAttribute('aria-pressed', 'true');
        paintScope();
        input.focus();
        input.select();
        run(0);
      }
      function close() {
        stop();
        panelEl.hidden = true;
        btn.setAttribute('aria-pressed', 'false');
        status('');
        resultsEl.replaceChildren();
        showTree(true);
      }
      function stop() {
        clearTimeout(timer);
        ctrl?.abort();
        ctrl = null;
      }

      btn.onclick = () => (panelEl.hidden ? open() : close());
      input.addEventListener('input', () => run(250));
      input.addEventListener('keydown', (e) => {
        e.stopPropagation(); // Esc here closes the search, it must not interrupt Claude
        if (e.key === 'Escape') { e.preventDefault(); close(); }
        else if (e.key === 'Enter') { e.preventDefault(); run(0); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); resultsEl.querySelector('.sr-line, .sr-name')?.focus(); }
      });
      // ⇧⌘F: the navigator with the search (in the selected folder).
      document.addEventListener('keydown', (e) => {
        if (!(e.metaKey || e.ctrlKey) || !e.shiftKey || e.altKey || e.code !== 'KeyF') return;
        if (e.target.closest?.('.xterm, .monaco-editor')) return;
        e.preventDefault();
        sidePanel.show('files');
        // The view loads its tree when shown; the project is known once it has.
        if (root) open(); else sync().then(() => open());
      });

      /** Text with the match highlighted: [before, <mark>match</mark>, after]. */
      function lineText(m) {
        const t = document.createElement('span');
        t.className = 't';
        t.append(m.text.slice(0, m.at), Object.assign(document.createElement('mark'), { textContent: m.text.slice(m.at, m.at + m.len) }), m.text.slice(m.at + m.len));
        return t;
      }
      const focusable = (el, onActivate) => {
        el.tabIndex = 0;
        el.onclick = onActivate;
        el.onkeydown = (e) => {
          if (e.key === 'Enter') { e.preventDefault(); onActivate(e); }
          else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            const all = [...resultsEl.querySelectorAll('.sr-line, .sr-name')].filter((x) => x.offsetParent);
            const k = all.indexOf(el) + (e.key === 'ArrowDown' ? 1 : -1);
            if (k < 0) input.focus(); else all[k]?.focus();
          }
        };
        return el;
      };

      function group(label, dir, count, icon) {
        const g = document.createElement('div');
        g.className = 'sr-group';
        const head = document.createElement('div');
        head.className = 'sr-head';
        const tw = Object.assign(document.createElement('span'), { className: 'twisty', textContent: '▾' });
        head.append(tw, Object.assign(document.createElement('span'), { className: 'name', textContent: icon + ' ' + label }));
        if (dir) head.append(Object.assign(document.createElement('span'), { className: 'dir', textContent: dir }));
        const n = Object.assign(document.createElement('span'), { className: 'n', textContent: String(count) });
        head.append(n);
        head.onclick = () => {
          const c = g.toggleAttribute('data-collapsed');
          tw.textContent = c ? '▸' : '▾';
        };
        g.append(head);
        return { g, n };
      }

      /** A folder from the results: shown in the tree (its parents opened). */
      async function revealFolder(rel) {
        close();
        const parts = rel.split('/');
        for (let i = 1; i <= parts.length; i++) expanded.add(parts.slice(0, i).join('/'));
        saveOpen();
        await sync();
        const r = rowOf(rel);
        if (r) { selectOnly(entryOf(r)); reveal(rel); }
      }

      function run(delay) {
        stop();
        const q = input.value;
        input.classList.remove('bad');
        if (!q) { status(''); resultsEl.replaceChildren(); showTree(true); return; }
        timer = setTimeout(() => go(q), delay);
      }

      async function go(q) {
        const c = (ctrl = new AbortController());
        const params = new URLSearchParams({ cwd: root, path: scope, q });
        for (const k of ['case', 'word', 'regex']) if (opts[k]) params.set(k, '1');
        if (showHidden) params.set('hidden', '1');
        status(tl('Searching…'));
        let r;
        try {
          r = await fetch('/api/search?' + params, { signal: c.signal });
        } catch (e) {
          if (c === ctrl) status('⚠️ ' + e.message, true);
          return;
        }
        if (c !== ctrl) return;
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          if (c !== ctrl) return;
          input.classList.add('bad');
          resultsEl.replaceChildren();
          showTree(false);
          return status(d.error || r.statusText, true);
        }
        resultsEl.replaceChildren();
        showTree(false);
        let names = null, files = 0, matches = 0;
        const prefix = scope ? scope + '/' : '';
        const short = (rel) => (rel.startsWith(prefix) ? rel.slice(prefix.length) : rel);
        const onItem = (o) => {
          if (o.type === 'name') {
            if (!names) { names = group(tl('Names'), '', 0, '🔤'); resultsEl.prepend(names.g); names.count = 0; }
            names.n.textContent = String(++names.count);
            const row = document.createElement('div');
            row.className = 'sr-name';
            row.title = o.rel;
            row.append(Object.assign(document.createElement('span'), { className: 't', textContent: (o.isDir ? '📁 ' : viewer.icon(o.rel) + ' ') + short(o.rel) }));
            names.g.append(focusable(row, (e) => (o.isDir ? revealFolder(o.rel) : e?.altKey ? insertPath(o.rel) : viewer.open(o.rel))));
          } else if (o.type === 'file') {
            files++;
            matches += o.matches.length + o.more;
            const name = o.rel.split('/').pop();
            const dir = parentOf(short(o.rel));
            const { g } = group(name, dir, o.matches.length + o.more, viewer.icon(name));
            g.title = o.rel;
            for (const m of o.matches) {
              const row = document.createElement('div');
              row.className = 'sr-line';
              row.title = `${o.rel}:${m.line}\n` + tl('Click — open, ⌥-click — insert “path:line” into the message');
              row.append(Object.assign(document.createElement('span'), { className: 'ln', textContent: String(m.line) }), lineText(m));
              g.append(focusable(row, (e) => (e?.altKey ? insertPath(`${o.rel}:${m.line}`) : viewer.open(o.rel, { line: m.line, col: m.col, len: m.len }))));
            }
            if (o.more) g.append(Object.assign(document.createElement('div'), { className: 'sr-note', textContent: '… ' + tl('and {0} more', o.more) }));
            resultsEl.append(g);
            status(tl('{0} in {1} files — searching…', matches, files));
          } else if (o.type === 'progress') {
            status(tl('{0} in {1} files — {2} scanned…', matches, files, o.scanned));
          } else if (o.type === 'done') {
            const parts = [];
            if (o.matches) parts.push(tl('{0} matches in {1} files', o.matches, o.files));
            if (o.names) parts.push(tl('names: {0}', o.names));
            status((parts.join(', ') || tl('Nothing found')) + (o.truncated ? ' ' + tl('(not everything — refine the query)') : ''));
            if (!parts.length) resultsEl.append(Object.assign(document.createElement('div'), { className: 'tree-note', textContent: tl('Nothing found in {0} files', o.scanned) }));
          }
        };
        // NDJSON stream: results appear as files are searched.
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        try {
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            let nl;
            while ((nl = buf.indexOf('\n')) >= 0) {
              const line = buf.slice(0, nl);
              buf = buf.slice(nl + 1);
              if (line && c === ctrl) onItem(JSON.parse(line));
            }
          }
        } catch (e) {
          if (c === ctrl && e.name !== 'AbortError') status('⚠️ ' + e.message, true);
        }
      }

      return {
        open,
        /** Another project: the search is closed. */
        reset() { scope = ''; if (!panelEl.hidden) close(); },
      };
    })();

    return {
      sync,
      insertPath,
      /** The entry menu for a viewer tab: t = { rel, name, isDir, row, cwd? (outside the project) }. */
      contextMenu: (x, y, t) => openMenu(x, y, t),
      /** Debounced refresh while Claude works (files appear and change). */
      refreshSoon() {
        clearTimeout(refreshTimer);
        // A re-render would drop a name being typed (rename, new file or folder): wait for it.
        const later = () => (treeEl.querySelector('.rename-input') ? (refreshTimer = setTimeout(later, 800)) : sync());
        refreshTimer = setTimeout(later, 800);
      },
      /** Highlights a file Claude wrote to (absolute path from Edit/Write input). */
      noteEdited(abs) {
        if (!abs) return;
        edited.add(abs);
        for (const r of treeEl.querySelectorAll('.tree-row')) if (r.dataset.abs === abs) r.classList.add('changed');
      },
    };
  })();

  /**
   * Terminal view: tabs of shells running on the server (server/terminal.js), drawn with xterm.js
   * (server/public/vendor, loaded the first time the view opens). A new terminal starts in the
   * chat's project folder. The ids of this window's terminals are kept in sessionStorage, so a
   * reload reattaches to the same shells with their recent output.
   */
  const terminalView = (() => {
    const tabsEl = $('termTabs');
    const body = $('termBody');
    const KEY = 'claude.terms';
    const tabs = []; // { id, title, term, fit, pane, tabEl, ctrl, exited, sending, pending }
    let current = null;
    let lib = null;
    let restored = false;
    let counter = 0;

    const post = (op, data) => fetch('/api/term/' + op, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
    });

    function loadLib() {
      if (lib) return lib;
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = '/vendor/xterm.css';
      document.head.append(css);
      // Run as plain scripts with `define` shadowed: once the editor's AMD loader (Monaco) is on
      // the page, these UMD bundles would register as AMD modules instead of globals.
      const script = async (src) => {
        const r = await fetch(src);
        if (!r.ok) throw new Error(tl('failed to load {0}', src));
        new Function('define', 'exports', 'module', await r.text())();
      };
      lib = script('/vendor/xterm.js').then(() => script('/vendor/addon-fit.js'));
      lib.catch(() => { lib = null; });
      return lib;
    }

    function theme() {
      const cs = getComputedStyle(document.documentElement);
      const v = (n) => cs.getPropertyValue(n).trim();
      return { background: v('--bg'), foreground: v('--text'), cursor: v('--accent'), cursorAccent: v('--bg'), selectionBackground: 'rgba(128, 128, 128, .35)' };
    }
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      for (const t of tabs) t.term.options.theme = theme();
    });

    const save = () => sessionStorage.setItem(KEY, JSON.stringify(tabs.map((t) => ({ id: t.id, title: t.title }))));
    const visible = () => body.clientWidth > 40 && body.clientHeight > 20;
    const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

    function fitCurrent() {
      if (!current || !visible()) return;
      try { current.fit.fit(); } catch {}
    }
    new ResizeObserver(() => requestAnimationFrame(fitCurrent)).observe(body);

    function renderTabs() {
      tabsEl.textContent = '';
      for (const t of tabs) {
        const el = document.createElement('div');
        el.className = 'term-tab' + (t === current ? ' on' : '') + (t.exited ? ' exited' : '');
        el.setAttribute('role', 'tab');
        el.setAttribute('aria-selected', String(t === current));
        el.title = t.exited ? `${t.title} — ${tl('finished')}` : t.title;
        const name = document.createElement('span');
        name.className = 't';
        name.textContent = t.title;
        const x = document.createElement('button');
        x.className = 'x';
        x.type = 'button';
        x.textContent = '×';
        x.title = tl('Close the terminal');
        x.onclick = (e) => { e.stopPropagation(); close(t); };
        el.append(name, x);
        el.onclick = () => select(t, true);
        tabsEl.append(el);
      }
    }

    /** Shows a tab; the keyboard goes to it only on the user's own action (not on a refresh). */
    function select(t, focus = false) {
      current = t;
      for (const o of tabs) o.pane.hidden = o !== t;
      renderTabs();
      if (!t) return;
      requestAnimationFrame(() => { fitCurrent(); if (focus) t.term.focus(); });
    }

    // Typed input goes out in order, batched while a request is in flight.
    function send(t, data) {
      t.pending += data;
      if (t.sending) return;
      const flush = () => {
        const chunk = t.pending;
        t.pending = '';
        if (!chunk || t.exited) { t.sending = false; return; }
        t.sending = true;
        post('input', { id: t.id, data: chunk }).catch(() => {}).finally(flush);
      };
      flush();
    }

    function ended(t, text) {
      t.exited = true;
      t.term.write(`\r\n\x1b[2m[${text}]\x1b[0m\r\n`);
      renderTabs();
    }

    /** Streams the terminal's output (its recent output first) into xterm; reconnects if dropped. */
    function attach(t) {
      const c = (t.ctrl = new AbortController());
      fetch('/api/term/stream?id=' + encodeURIComponent(t.id), { signal: c.signal }).then(async (r) => {
        if (!r.ok) return ended(t, tl('the terminal is closed (the server restarted)'));
        t.term.reset(); // the stream replays the screen from the start
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf('\n')) >= 0) {
            const ev = JSON.parse(buf.slice(0, nl));
            buf = buf.slice(nl + 1);
            if (ev.t === 'o') t.term.write(bytes(ev.d));
            else if (ev.t === 'exit') return ended(t, tl('the process has finished, code {0}', ev.code));
          }
        }
        if (!c.signal.aborted && !t.exited) setTimeout(() => attach(t), 1000);
      }).catch(() => {
        if (!c.signal.aborted && !t.exited) setTimeout(() => attach(t), 1000);
      });
    }

    function make(id, title) {
      const pane = document.createElement('div');
      pane.className = 'term-pane';
      pane.hidden = true;
      body.append(pane);
      const term = new Terminal({
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', fontSize: 12, lineHeight: 1.15,
        cursorBlink: true, scrollback: 5000, macOptionIsMeta: true, theme: theme(),
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(pane);
      const t = { id, title, term, fit, pane, ctrl: null, exited: false, sending: false, pending: '' };
      term.onData((d) => send(t, d));
      term.onResize(({ cols, rows }) => { if (t.id && !t.exited) post('resize', { id: t.id, cols, rows }).catch(() => {}); });
      tabs.push(t);
      return t;
    }

    async function create() {
      try {
        await loadLib();
      } catch (e) {
        body.innerHTML = `<div class="term-note">${escapeHtml(tl('The terminal is unavailable: {0}', e.message))}</div>`;
        return;
      }
      const t = make(null, `${(cwd.split('/').pop() || '~')} ${++counter}`);
      select(t, true);
      fitCurrent();
      try {
        const r = await post('open', { cwd, cols: t.term.cols, rows: t.term.rows });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
        t.id = d.id;
        save();
        attach(t);
      } catch (e) {
        ended(t, tl('could not open: {0}', e.message));
      }
    }

    function close(t) {
      t.ctrl?.abort();
      if (t.id) post('close', { id: t.id }).catch(() => {});
      t.term.dispose();
      t.pane.remove();
      const i = tabs.indexOf(t);
      tabs.splice(i, 1);
      save();
      select(current === t ? tabs[Math.min(i, tabs.length - 1)] || null : current);
    }

    async function show() {
      if (!restored) {
        restored = true;
        let saved = [];
        try { saved = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch {}
        if (saved.length) {
          try { await loadLib(); } catch {}
          if (window.Terminal) {
            for (const s of saved) attach(make(s.id, s.title));
            counter = tabs.length;
            select(tabs[0]);
          }
        }
      }
      if (!tabs.length) return create();
      select(current || tabs[0]);
    }

    $('termNew').onclick = () => create();
    return { show };
  })();

  /**
   * The side panel has two halves, one per group of side-bar buttons (like VS Code's side bar with
   * two sections): a button shows its view in its group's half, the active button again closes
   * that half; with one half closed the other takes the whole height, with both closed the panel
   * hides. Buttons can be dragged between the groups (and reordered) to move a view to the other
   * half. The divider between open halves can be dragged. Groups, active views, open halves and
   * the split persist.
   */
  const sidePanel = (() => {
    const VIEWS = {
      files: { button: 'sideToggle', label: tl('Project files'), load: () => fileTree.sync() },
      projects: { button: 'projectsBtn', label: tl('Projects'), load: () => openProjects() },
      history: { button: 'historyBtn', label: tl('Session history'), load: () => renderSessions() },
      procs: { button: 'procBtn', label: tl('Processes'), load: () => renderProcesses() },
      agents: { button: 'agentsBtn', label: tl('Subagents'), load: () => renderAgents() },
      term: { button: 'termBtn', label: tl('Terminal'), load: () => terminalView.show() },
    };
    const HALVES = ['top', 'bottom'];
    const sidebar = $('sidebar');
    const inner = sidebar.querySelector('.side-inner');
    const narrow = matchMedia('(max-width: 760px)');
    const json = (key) => { try { return JSON.parse(store.get(key) || 'null'); } catch { return null; } };

    // groups: half -> [view]; active: half -> view; opened: half -> bool.
    let groups = json('claude.sideGroups');
    if (!groups || !HALVES.every((h) => Array.isArray(groups[h]))) groups = { top: ['files'], bottom: [] };
    // Every known view once; views added later (or never placed) go to the lower half.
    const seen = new Set();
    for (const h of HALVES) groups[h] = groups[h].filter((v) => VIEWS[v] && !seen.has(v) && seen.add(v));
    for (const v of Object.keys(VIEWS)) if (!seen.has(v)) groups[v === 'projects' ? 'top' : 'bottom'].push(v); // projects: next to the files
    const active = { top: null, bottom: null, ...json('claude.sideActive') };
    const wasCollapsed = (store.get('claude.sideCollapsed') ?? (narrow.matches ? '1' : '0')) === '1';
    const opened = { top: !wasCollapsed, bottom: !wasCollapsed, ...json('claude.sideOpen') };
    for (const h of HALVES) if (!groups[h].includes(active[h])) active[h] = groups[h][0] || null;

    const halfOf = (v) => HALVES.find((h) => groups[h].includes(v));
    const shown = (h) => opened[h] && !!active[h];
    const isOpen = () => HALVES.some(shown);

    function apply() {
      // Buttons and sections follow the groups.
      for (const h of HALVES) {
        const bar = document.querySelector(`.act-group[data-half="${h}"]`);
        const half = sidebar.querySelector(`.half[data-half="${h}"]`);
        for (const v of groups[h]) {
          bar.appendChild($(VIEWS[v].button));
          half.appendChild(sidebar.querySelector(`.view[data-view="${v}"]`));
        }
        half.hidden = !shown(h);
        for (const sec of half.querySelectorAll('.view')) sec.hidden = sec.dataset.view !== active[h];
      }
      const both = HALVES.every(shown);
      inner.classList.toggle('both', both);
      $('sideSplit').hidden = !both;
      document.body.classList.toggle('side-collapsed', !isOpen());
      document.body.classList.toggle('procs-in-side', shown(halfOf('procs')) && active[halfOf('procs')] === 'procs');
      document.body.classList.toggle('agents-in-side', shown(halfOf('agents')) && active[halfOf('agents')] === 'agents');
      for (const [v, def] of Object.entries(VIEWS)) {
        const on = shown(halfOf(v)) && active[halfOf(v)] === v;
        $(def.button).classList.toggle('on', on);
        $(def.button).setAttribute('aria-expanded', String(on));
      }
      sidebar.setAttribute('aria-label', HALVES.filter(shown).map((h) => VIEWS[active[h]].label).join(', ') || tl('Side panel'));
      store.set('claude.sideGroups', JSON.stringify(groups));
      store.set('claude.sideActive', JSON.stringify(active));
      store.set('claude.sideOpen', JSON.stringify(opened));
      store.set('claude.sideCollapsed', isOpen() ? '0' : '1');
    }

    const load = (h) => { if (shown(h) && cwd) VIEWS[active[h]].load(); };
    function refresh() { for (const h of HALVES) load(h); }
    function show(v) {
      const h = halfOf(v);
      if (shown(h) && active[h] === v) return;
      if (!isOpen()) for (const o of HALVES) opened[o] = o === h; // reopening: only the asked half
      active[h] = v;
      opened[h] = true;
      apply();
      load(h);
    }
    function hide() {
      for (const h of HALVES) opened[h] = false;
      apply();
    }
    function closeHalf(h) {
      opened[h] = false;
      apply();
    }
    function toggle(v) {
      const h = halfOf(v);
      if (shown(h) && active[h] === v) closeHalf(h); else show(v);
    }

    // Drag a button to the other group (or to another place in its own group).
    for (const [v, def] of Object.entries(VIEWS)) {
      const b = $(def.button);
      b.draggable = true;
      b.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/x-side-view', v);
        e.dataTransfer.effectAllowed = 'move';
        b.classList.add('dragging');
      });
      b.addEventListener('dragend', () => {
        b.classList.remove('dragging');
        for (const g of document.querySelectorAll('.act-group.drop')) g.classList.remove('drop');
      });
    }
    for (const bar of document.querySelectorAll('.act-group')) {
      const h = bar.dataset.half;
      bar.addEventListener('dragover', (e) => {
        if (!e.dataTransfer.types.includes('text/x-side-view')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        bar.classList.add('drop');
      });
      bar.addEventListener('dragleave', (e) => { if (!bar.contains(e.relatedTarget)) bar.classList.remove('drop'); });
      bar.addEventListener('drop', (e) => {
        const v = e.dataTransfer.getData('text/x-side-view');
        if (!VIEWS[v]) return;
        e.preventDefault();
        bar.classList.remove('drop');
        const from = halfOf(v);
        // Before the button under the pointer (upper part of it), otherwise at the end.
        const target = [...bar.querySelectorAll('.act-btn')].find((x) => {
          const r = x.getBoundingClientRect();
          return x.id !== VIEWS[v].button && e.clientY < r.top + r.height / 2;
        });
        groups[from] = groups[from].filter((x) => x !== v);
        const at = target ? groups[h].indexOf(Object.keys(VIEWS).find((k) => VIEWS[k].button === target.id)) : -1;
        if (at >= 0) groups[h].splice(at, 0, v); else groups[h].push(v);
        if (from !== h) {
          if (active[from] === v) active[from] = groups[from][0] || null;
          active[h] = v;
          opened[h] = true;
        }
        apply();
        refresh();
      });
    }

    // The divider: the share of the upper half, 20–80 %; a double click splits the panel in half again.
    const setSplit = (pct) => inner.style.setProperty('--split', pct + '%');
    const savedSplit = Number(store.get('claude.sideSplit'));
    if (savedSplit) setSplit(savedSplit);
    const split = $('sideSplit');
    split.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      document.body.classList.add('split-resizing');
      const box = inner.getBoundingClientRect();
      let pct = Number(store.get('claude.sideSplit')) || 50;
      const move = (ev) => {
        pct = Math.round(Math.min(80, Math.max(20, ((ev.clientY - box.top) / box.height) * 100)) * 10) / 10;
        setSplit(pct);
      };
      const up = () => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        document.body.classList.remove('split-resizing');
        store.set('claude.sideSplit', String(pct));
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
    split.addEventListener('dblclick', () => {
      setSplit(50);
      store.set('claude.sideSplit', '50');
    });

    for (const [v, def] of Object.entries(VIEWS)) $(def.button).onclick = () => toggle(v);
    // «« in a view's header closes its half.
    for (const b of sidebar.querySelectorAll('.side-close')) b.onclick = () => closeHalf(halfOf(b.closest('.view').dataset.view));
    apply();

    return { show, hide, toggle, refresh, isShowing: (v) => shown(halfOf(v)) && active[halfOf(v)] === v };
  })();
  /**
   * Markdown -> HTML for the file viewer (CommonMark-ish subset: headings, paragraphs, lists
   * with nesting and task items, fenced code, blockquotes, tables, rules, links, images,
   * emphasis). Raw HTML in the file is escaped, never rendered, so a .md file can't run script.
   * `resolve(href)` maps relative links/images; it returns { href, mdPath?, raw? }.
   */
  function renderMarkdownDoc(src, resolve) {
    const lines = src.replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n');
    const esc = escapeHtml;
    const slugs = new Map();
    const slug = (t) => {
      let s = t.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^\p{L}\p{N}\s-]/gu, '').trim().replace(/\s+/g, '-') || 'section';
      const n = slugs.get(s) || 0;
      slugs.set(s, n + 1);
      return n ? `${s}-${n}` : s;
    };
    const safeUrl = (u) => /^(https?:|mailto:|#)/i.test(u) || !/^[a-z][a-z0-9+.-]*:/i.test(u);

    function inline(text) {
      const tokens = [];
      const keep = (html) => `\u0000${tokens.push(html) - 1}\u0000`;
      let t = text
        .replace(/`([^`]+)`/g, (_, c) => keep(`<code>${esc(c)}</code>`))
        .replace(/!\[([^\]]*)\]\(\s*<?([^)\s>]+)>?(?:\s+"([^"]*)")?\s*\)/g, (_, alt, href, title) => {
          if (!safeUrl(href)) return keep(esc(alt));
          const r = resolve(href);
          return keep(`<img src="${esc(r.raw || r.href)}" alt="${esc(alt)}"${title ? ` title="${esc(title)}"` : ''} loading="lazy">`);
        })
        .replace(/\[([^\]]+)\]\(\s*<?([^)\s>]+)>?(?:\s+"([^"]*)")?\s*\)/g, (_, label, href, title) => {
          if (!safeUrl(href)) return label;
          const r = resolve(href);
          const attrs = r.mdPath
            ? ` href="#" data-md-path="${esc(r.mdPath)}"${r.anchor ? ` data-anchor="${esc(r.anchor)}"` : ''}`
            : href.startsWith('#') ? ` href="#" data-anchor="${esc(href.slice(1))}"`
            : ` href="${esc(r.href)}" target="_blank" rel="noopener noreferrer"`;
          return keep(`<a${attrs}${title ? ` title="${esc(title)}"` : ''}>`) + label + keep('</a>');
        })
        .replace(/<(https?:\/\/[^>\s]+)>/g, (_, u) => keep(`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`));
      t = esc(t)
        .replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g, (_, pre, u) => `${pre}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`)
        .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>')
        // __bold__ only at word boundaries: identifiers like __init__ or window.__x stay as they are.
        .replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, '$1<strong>$2</strong>')
        .replace(/(^|[^*\w])\*(?=\S)([^*]*?\S)\*(?!\*)/g, '$1<em>$2</em>')
        .replace(/(^|[^_\w])_(?=\S)([^_]*?\S)_(?![_\w])/g, '$1<em>$2</em>')
        .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>')
        .replace(/ {2,}\n|\\\n/g, '<br>\n');
      return t.replace(/\u0000(\d+)\u0000/g, (_, i) => tokens[i]);
    }

    const isFence = (l) => /^\s{0,3}(```+|~~~+)/.exec(l);
    const isHr = (l) => /^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l);
    const isHeading = (l) => /^\s{0,3}#{1,6}(\s|$)/.test(l);
