      if (h.undo.length > 2000) h.undo.shift();
      h.pieces = normalize(fn(h.pieces));
      h.len = piecesLen(h.pieces);
      updateDirty(t);
    }
    const one = (v) => ({ a: Uint8Array.of(v) });
    function hexReplace(t, o, v) {
      hexEdit(t, (ps) => { const [l, r] = splitPieces(ps, o); return [...l, one(v), ...splitPieces(r, 1)[1]]; });
    }
    function hexInsert(t, o, v) {
      hexEdit(t, (ps) => { const [l, r] = splitPieces(ps, o); return [...l, one(v), ...r]; });
    }
    function hexDelete(t, o) {
      hexEdit(t, (ps) => { const [l, r] = splitPieces(ps, o); return [...l, ...splitPieces(r, 1)[1]]; });
    }

    // ----- view -----
    function ensureHexEl() {
      if (hexEl) return;
      hexEl = Object.assign(document.createElement('div'), { className: 'hex-view', tabIndex: 0 });
      hexScroll = Object.assign(document.createElement('div'), { className: 'hex-scroll' });
      hexRows = Object.assign(document.createElement('div'), { className: 'hex-rows' });
      hexSpacer = document.createElement('div');
      hexStatus = Object.assign(document.createElement('div'), { className: 'hex-status' });
      hexScroll.append(hexRows, hexSpacer);
      hexEl.append(hexScroll, hexStatus);
      hexScroll.addEventListener('scroll', () => {
        if (expectedScroll != null && Math.abs(hexScroll.scrollTop - expectedScroll) < 48) return;
        expectedScroll = null;
        hexTop = topFromScroll();
        drawHex();
      }, { passive: true });
      hexEl.addEventListener('focus', () => hexEl.classList.add('focus'));
      hexEl.addEventListener('blur', () => hexEl.classList.remove('focus'));
      hexEl.addEventListener('keydown', hexKey);
      hexRows.addEventListener('mousedown', (e) => {
        const span = e.target.closest('[data-o]');
        const h = tabs[active]?.hex;
        if (!span || !h) return;
        h.cursor = Number(span.dataset.o);
        h.col = span.parentElement.classList.contains('hex-text') ? 'text' : 'hex';
        h.nibble = 0;
        drawHex();
      });
      new ResizeObserver(() => { if (body.contains(hexEl)) { layoutHex(); drawHex(); } }).observe(hexEl);
    }

    // One more row than the bytes when inserting at the very end needs a place for the cursor.
    const hexRowsCount = (h) => Math.max(1, Math.ceil(((h.pieces ? h.len : h.size || 0) + (h.insert ? 1 : 0)) / HEX_ROW));
    const hexVisible = () => Math.max(1, Math.floor((hexScroll.clientHeight - 8) / HEX_RH));
    const hexScaled = (h) => hexRowsCount(h) * HEX_RH > HEX_MAX_H;
    /** The last offset the cursor may take: one past the end while inserting (to append). */
    const hexLast = (h) => Math.max(0, h.len - (h.insert ? 0 : 1));

    function layoutHex() {
      const h = tabs[active]?.hex;
      if (!h) return;
      const full = Math.min(hexRowsCount(h) * HEX_RH + 8, HEX_MAX_H);
      hexSpacer.style.height = Math.max(0, full - hexScroll.clientHeight) + 'px';
    }

    function topFromScroll() {
      const h = tabs[active].hex, max = Math.max(0, hexRowsCount(h) - hexVisible());
      if (!hexScaled(h)) return Math.min(max, Math.floor(hexScroll.scrollTop / HEX_RH));
      // At these heights browsers stop short of the computed maximum (rounding): the last few
      // dozen pixels mean the end.
      const range = hexScroll.scrollHeight - hexScroll.clientHeight - 40;
      return range > 0 ? Math.round(Math.min(1, hexScroll.scrollTop / range) * max) : 0;
    }

    function scrollToRow(row) {
      const h = tabs[active].hex, max = Math.max(0, hexRowsCount(h) - hexVisible());
      hexTop = Math.max(0, Math.min(max, row));
      const range = hexScroll.scrollHeight - hexScroll.clientHeight - 40;
      hexScroll.scrollTop = hexScaled(h) ? (max ? (hexTop / max) * range + (hexTop === max ? 40 : 0) : 0) : hexTop * HEX_RH;
      expectedScroll = hexScroll.scrollTop;
    }

    async function loadHexBlock(t, b) {
      const h = t.hex;
      h.blocks.set(b, 'loading');
      try {
        // The first read also asks how much room the disk has (for inserting/deleting).
        const askFree = h.free == null;
        const r = await fetch(`/api/bytes?cwd=${encodeURIComponent(rootOf(t))}&path=${encodeURIComponent(t.path)}&offset=${b * HEX_BLOCK}&length=${HEX_BLOCK}${askFree ? '&free=1' : ''}`);
        if (!r.ok) throw new Error(tlMsg((await r.json().catch(() => ({}))).error || r.statusText));
        const size = Number(r.headers.get('X-File-Size')), mtime = r.headers.get('X-File-Mtime');
        const data = new Uint8Array(await r.arrayBuffer());
        if (t.hex !== h) return; // reset meanwhile
        if (h.mtime && mtime !== h.mtime) {
          // The file changed on disk: start over, or ask if there are edits.
          h.blocks.delete(b);
          return hexDiskChanged(t);
        }
        if (askFree && r.headers.has('X-Disk-Free')) {
          h.free = Number(r.headers.get('X-Disk-Free'));
          h.canResize = h.free >= size + HEX_SLACK;
          if (!h.canResize) h.insert = false;
        } else if (askFree) h.free = -1; // unknown: allowed, the server checks again when saving
        h.size = size;
        h.mtime = mtime;
        if (!h.pieces) { h.pieces = size ? [{ d: 0, n: size }] : []; h.len = size; }
        h.blocks.set(b, data);
        while (h.blocks.size > HEX_BLOCKS_KEPT) h.blocks.delete(h.blocks.keys().next().value);
      } catch (e) {
        h.blocks.delete(b);
        barMessage(t, tl('Could not read the bytes: {0}', e.message));
        return;
      }
      if (tabs[active] === t && body.contains(hexEl)) { layoutHex(); drawHex(); }
    }

    /** A fresh hex state for `t` (the file is read again), keeping where the cursor was. */
    function hexReset(t) {
      const old = t.hex;
      t.hex = null;
      if (old) Object.assign(hexState(t), { cursor: old.cursor, col: old.col, insert: old.insert });
    }

    function hexDiskChanged(t) {
      if (hexDirty(t.hex)) { t.conflict = 'hexdisk'; if (tabs[active] === t) renderBar(); return; }
      hexReset(t);
      if (tabs[active] === t && body.contains(hexEl)) startHex(t);
    }

    /** After the file was saved from the editor: the hex view (without edits) reads it again. */
    function hexFollowDisk(t) {
      if (t.hex && !hexDirty(t.hex)) hexReset(t);
    }

    /** Asks whether the file changed on disk (hex views have their own base mtime). */
    async function hexRefresh(t) {
      if (!t.hex?.mtime) return;
      try {
        const r = await fetch(`/api/bytes?cwd=${encodeURIComponent(rootOf(t))}&path=${encodeURIComponent(t.path)}&offset=0&length=0`);
        if (r.ok && r.headers.get('X-File-Mtime') !== t.hex.mtime) hexDiskChanged(t);
      } catch {}
    }

    function startHex(t) {
      const h = hexState(t);
      if (h.size == null) loadHexBlock(t, 0);
      layoutHex();
      const row = Math.floor(h.cursor / HEX_ROW);
      scrollToRow(row - Math.floor(hexVisible() / 2));
      drawHex();
    }

    function showHex(t) {
      ensureHexEl();
      if (!body.contains(hexEl)) { body.replaceChildren(hexEl); }
      startHex(t);
      hexEl.focus({ preventScroll: true });
    }

    const hex2 = (n) => n.toString(16).toUpperCase().padStart(2, '0');
    const fmtBytes = (n) => { const f = (x) => x.toLocaleString(LOCALE, { maximumFractionDigits: 1 }); return n < 1024 ? tl('{0} B', n) : n < 1048576 ? tl('{0} KB', f(n / 1024)) : n < 1073741824 ? tl('{0} MB', f(n / 1048576)) : tl('{0} GB', f(n / 1073741824)); };

    function drawHex() {
      const t = tabs[active], h = t?.hex;
      if (!h || !hexEl) return;
      hexEl.classList.toggle('ins', h.insert);
      const len = h.pieces ? h.len : h.size || 0;
      const digits = Math.max(8, len.toString(16).length);
      const first = hexTop * HEX_ROW, count = (Math.min(hexRowsCount(h), hexTop + hexVisible() + 1) - hexTop) * HEX_ROW;
      const { vals, mods } = h.pieces ? readRange(t, first, Math.max(0, Math.min(count, len - first))) : { vals: [], mods: [] };
      const rows = [];
      for (let r = 0; r * HEX_ROW < count; r++) {
        const start = first + r * HEX_ROW;
        let bytes = '', text = '';
        for (let i = 0; i < HEX_ROW; i++) {
          const o = start + i, k = o - first;
          const cur = o === h.cursor;
          if (h.size != null && o >= len) {
            // Past the end: empty, except the slot where an appended byte would go.
            const slot = cur ? ` data-o="${o}" class="c${h.col === 'hex' ? ' on' : ''}"` : '';
            const tslot = cur ? ` data-o="${o}" class="c${h.col === 'text' ? ' on' : ''}"` : '';
            bytes += `<span${slot}${i === 7 && !slot ? ' class="g"' : ''}>  </span>`;
            text += `<span${tslot}> </span>`;
            continue;
          }
          const v = vals[k];
          const cls = [i === 7 ? 'g' : '', mods[k] ? 'm' : '', v === 0 ? 'z' : '', cur ? 'c' : ''];
          const on = (col) => (cur && h.col === col ? ' on' : '');
          bytes += `<span data-o="${o}" class="${cls.join(' ')}${on('hex')}">${v === undefined ? '··' : hex2(v)}</span>`;
          const ch = v === undefined ? '·' : v >= 0x20 && v < 0x7f ? escapeHtml(String.fromCharCode(v)) : '.';
          text += `<span data-o="${o}" class="${cls.slice(1).join(' ')}${on('text')}">${ch}</span>`;
        }
        rows.push(`<div class="hex-row"><span class="hex-off">${start.toString(16).toUpperCase().padStart(digits, '0')}</span><span class="hex-bytes">${bytes}</span><span class="hex-text">${text}</span></div>`);
      }
      hexRows.innerHTML = rows.join('');
      if (!hexGoto) drawHexStatus(t);
    }

    function drawHexStatus(t) {
      const h = t.hex, v = h.pieces && h.cursor < h.len ? hexByte(t, h.cursor) : undefined;
      const ch = v !== undefined && v >= 0x20 && v < 0x7f ? ` «${String.fromCharCode(v)}»` : '';
      hexStatus.innerHTML = '';
      const part = (text, cls) => hexStatus.append(Object.assign(document.createElement('span'), { textContent: text, className: cls || '' }));
      if (h.size != null && !h.canResize) {
        part('⚠️ ' + tl('Low disk space: {0} free, while inserting and deleting bytes needs about {1} — they are unavailable, only overwriting works.', fmtBytes(Math.max(0, h.free)), fmtBytes(h.size + HEX_SLACK)), 'warn');
      }
      part(h.size == null ? tl('Loading…') : tl('Offset {0}', `0x${h.cursor.toString(16).toUpperCase()} (${h.cursor.toLocaleString(LOCALE)})`));
      if (v !== undefined) part(tl('byte {0}', `0x${hex2(v)} = ${v}${ch}`));
      if (h.size != null) part(h.len !== h.size ? `${fmtBytes(h.len)} (${tl('was {0}', fmtBytes(h.size))})` : fmtBytes(h.len));
      if (h.pieces && hexDirty(h)) {
        const c = hexChanges(h);
        part(tl('edits: new bytes {0}', c.added) + (c.delta ? ', ' + tl('size {0}', (c.delta > 0 ? '+' : '−') + tl('{0} B', Math.abs(c.delta))) : ''));
      }
      const mode = Object.assign(document.createElement('button'), {
        type: 'button', textContent: h.insert ? tl('mode: insert') : tl('mode: overwrite'),
        title: h.canResize ? tl('Insert or overwrite bytes (Insert or ⌘I)') : tl('Insert is unavailable: low disk space'),
        disabled: !h.canResize,
      });
      mode.onclick = () => { hexToggleInsert(t); hexEl.focus({ preventScroll: true }); };
      hexStatus.append(mode);
      part(h.col === 'hex' ? tl('input: hex') : tl('input: text'));
      const go = Object.assign(document.createElement('button'), { type: 'button', textContent: tl('⌘G — go to'), title: tl('Go to offset') });
      go.onclick = () => hexAskGoto(t);
      hexStatus.append(go);
      part(tl('Tab — hex/text') + (h.canResize ? ' · ' + tl('Delete/⌫ — delete a byte') : '') + ' · ' + tl('⌘Z — undo · ⌘S — save'));
    }

    function hexToggleInsert(t) {
      const h = t.hex;
      if (!h.canResize) return;
      h.insert = !h.insert;
      h.nibble = 0;
      h.cursor = Math.min(h.cursor, hexLast(h));
      layoutHex();
      drawHex();
    }

    function hexAskGoto(t) {
      hexGoto = true;
      hexStatus.innerHTML = '';
      const input = Object.assign(document.createElement('input'), { placeholder: tl('0x1F00 or 7936'), title: tl('Offset: hexadecimal with 0x or decimal; +/- from the current one works too') });
      hexStatus.append(Object.assign(document.createElement('span'), { textContent: tl('Go to offset:') }), input);
      const done = (go) => {
        hexGoto = false;
        if (go) {
          const raw = input.value.trim().toLowerCase(), rel = /^[+-]/.test(raw) ? raw[0] : '';
          const num = raw.replace(/^[+-]/, '');
          const n = /^0x[0-9a-f]+$/.test(num) ? parseInt(num, 16) : /^[0-9]+$/.test(num) ? Number(num) : /^[0-9a-f]+h$/.test(num) ? parseInt(num, 16) : NaN;
          if (Number.isFinite(n)) {
            const h = t.hex, target = rel === '+' ? h.cursor + n : rel === '-' ? h.cursor - n : n;
            h.cursor = Math.max(0, Math.min(hexLast(h), target));
            h.nibble = 0;
            scrollToRow(Math.floor(h.cursor / HEX_ROW) - Math.floor(hexVisible() / 2));
          }
        }
        drawHex();
        hexEl.focus({ preventScroll: true });
      };
      input.onkeydown = (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); done(true); }
        if (e.key === 'Escape') { e.preventDefault(); done(false); }
      };
      input.onblur = () => { if (hexGoto) done(false); };
      input.focus();
    }

    function hexKey(e) {
      const t = tabs[active], h = t?.hex;
      if (!h || !h.pieces) return;
      const mod = e.metaKey || e.ctrlKey, page = hexVisible() * HEX_ROW;
      let to = null;
      const k = e.key.toLowerCase();
      if (mod && k === 's') { e.preventDefault(); return hexSave(t); }
      if (mod && k === 'g') { e.preventDefault(); return hexAskGoto(t); }
      if ((mod && k === 'i') || e.key === 'Insert') { e.preventDefault(); return hexToggleInsert(t); }
      if (mod && k === 'z') {
        e.preventDefault();
        const u = h.undo.pop();
        if (u) { h.pieces = u.pieces; h.len = piecesLen(h.pieces); h.cursor = u.cursor; h.nibble = 0; updateDirty(t); layoutHex(); }
        to = h.cursor;
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        if (!h.canResize) return;
        const o = e.key === 'Backspace' ? h.cursor - 1 : h.cursor;
        if (o < 0 || o >= h.len) return;
        hexDelete(t, o);
        h.nibble = 0;
        h.cursor = Math.max(0, Math.min(hexLast(h), o));
        layoutHex();
        return revealCursor(), drawHex();
      } else if (e.key === 'Tab') { e.preventDefault(); h.col = h.col === 'hex' ? 'text' : 'hex'; h.nibble = 0; to = h.cursor; }
      else if (e.key === 'ArrowLeft') to = h.cursor - 1;
      else if (e.key === 'ArrowRight') to = h.cursor + 1;
      else if (e.key === 'ArrowUp') to = mod ? 0 : h.cursor - HEX_ROW;
      else if (e.key === 'ArrowDown') to = mod ? hexLast(h) : h.cursor + HEX_ROW;
      else if (e.key === 'PageUp') to = h.cursor - page;
      else if (e.key === 'PageDown') to = h.cursor + page;
      else if (e.key === 'Home') to = mod ? 0 : h.cursor - (h.cursor % HEX_ROW);
      else if (e.key === 'End') to = mod ? hexLast(h) : Math.min(hexLast(h), h.cursor - (h.cursor % HEX_ROW) + HEX_ROW - 1);
      else if (!mod && !e.altKey && e.key.length === 1) {
        let v;
        if (h.col === 'hex') {
          if (!/^[0-9a-f]$/i.test(e.key)) return;
          const d = parseInt(e.key, 16);
          if (h.insert && h.nibble === 0) v = d << 4; // a new byte, its low half comes next
          else {
            const cur = h.cursor < h.len ? hexByte(t, h.cursor) : undefined;
            if (cur === undefined) return; // its block isn't loaded yet (or past the end)
            v = h.nibble ? (cur & 0xf0) | d : (d << 4) | (cur & 0x0f);
          }
        } else {
          v = e.key.charCodeAt(0);
          if (v < 0x20 || v > 0x7e) return;
          if (!h.insert && (h.cursor >= h.len || hexByte(t, h.cursor) === undefined)) return;
        }
        e.preventDefault();
        if (h.insert && !(h.col === 'hex' && h.nibble)) hexInsert(t, h.cursor, v); else hexReplace(t, h.cursor, v);
        if (h.col === 'hex' && !h.nibble) { h.nibble = 1; to = h.cursor; } else { h.nibble = 0; to = h.cursor + 1; }
        h.cursor = Math.max(0, Math.min(hexLast(h), to));
        layoutHex();
        return revealCursor(), drawHex();
      } else return;
      e.preventDefault();
      if (to !== h.cursor) h.nibble = 0;
      h.cursor = Math.max(0, Math.min(hexLast(h), to));
      revealCursor();
      drawHex();
    }

    function revealCursor() {
      const h = tabs[active].hex, row = Math.floor(h.cursor / HEX_ROW), vis = hexVisible();
      if (row < hexTop) scrollToRow(row);
      else if (row >= hexTop + vis) scrollToRow(row - vis + 1);
    }

    /** Base64 of a byte array, in slices (spreading a huge array into fromCharCode overflows the stack). */
    function toBase64(bytes) {
      let bin = '';
      for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      return btoa(bin);
    }

    async function hexSave(t, { force = false } = {}) {
      const h = t.hex;
      if (!hexDirty(h)) return;
      const patch = hexPatchable(h);
      const pieces = h.pieces;
      let r;
      try {
        if (patch) {
          // Same size, every byte in place: write only the new bytes.
          const patches = [];
          let pos = 0;
          for (const p of pieces) { if (p.a) patches.push({ offset: pos, data: toBase64(p.a) }); pos += plen(p); }
          r = await fetch('/api/bytes/save', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cwd: rootOf(t), path: t.path, mtime: h.mtime, force, patches }),
          });
        } else {
          // Bytes moved: the server rebuilds the file from ranges of it and the new bytes.
          r = await fetch('/api/bytes/rewrite', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cwd: rootOf(t), path: t.path, mtime: h.mtime, size: h.size, pieces: pieces.map((p) => (p.a ? { data: toBase64(p.a) } : { from: p.d, length: p.n })) }),
          });
        }
        const d = await r.json().catch(() => ({}));
        if (r.status === 409) { t.conflict = patch ? 'hexsave' : 'hexsave-moved'; renderBar(); return; }
        if (!r.ok) throw new Error(tlMsg(d.error || r.statusText));
        if (t.hex !== h) return;
        // Edits typed while saving stay only if nothing moved meanwhile; otherwise start over.
        const typed = h.pieces !== pieces;
        if (typed) barMessage(t, tl('Saved, but the edits made during saving were dropped — the file was reloaded.'));
        hexReset(t);
        t.hex.mtime = d.mtime;
        t.conflict = typed ? t.conflict : null;
        updateDirty(t);
        renderBar();
        if (tabs[active] === t && body.contains(hexEl)) startHex(t);
        fileTree.refreshSoon();
        // The text views follow the new bytes (or ask, if they have edits of their own).
        if (['md', 'txt', 'html', 'text', 'bigtext'].includes(t.kind)) { await load(t); if (t.conflict && tabs[active] === t) renderBar(); }
        if (['image', 'audio', 'video'].includes(t.kind)) { t.version = Date.now(); t.player?.pause(); delete t.player; }
      } catch (e) {
        barMessage(t, tl('Could not save: {0}', e.message));
      }
    }

    function hexRevert(t) {
      hexReset(t);
      t.conflict = null;
      updateDirty(t);
      renderBody();
    }

    // ---------- editor (Monaco) ----------
    const EDIT_MAX = 50 * 1024 * 1024; // the server's limit for `edit=1`
    const barEl = $('viewerBar');
    let monacoReady = null; // Promise of window.monaco
    let editor = null;
    let editorHost = null;
    let diffEditor = null;
    let diffHost = null;

    /** Loads the whole file for the editor; false when it's too large (then it is viewed in pieces). */
    async function loadForEdit(tab) {
      if (tab.size > EDIT_MAX) return false;
      const r = await fetch(`/api/file?cwd=${encodeURIComponent(rootOf(tab))}&path=${encodeURIComponent(tab.path)}&edit=1`);
      const d = await r.json().catch(() => ({}));
      if (r.status === 413) { tab.editable = false; return false; }
      if (!r.ok) throw Object.assign(new Error(tlMsg(d.error || r.statusText)), { status: r.status });
      tab.kind = MD.test(tab.path) ? 'md' : HTML_RE.test(tab.path) ? 'html' : TXT_RE.test(tab.path) ? 'txt' : 'text';
      const changed = d.content !== tab.content;
      const conflict = changed && tab.model && !tab.model.isDisposed() && isDirty(tab) && !tab.discard;
      // On a conflict `mtime` stays that of the text the edits started from, so saving still
      // asks before overwriting the newer file (like VS Code); `content` is the disk's now.
      Object.assign(tab, { content: d.content, size: d.size, next: null, error: null, editable: true });
      if (!conflict) tab.mtime = d.mtime;
      if (tab.model && !tab.model.isDisposed() && changed) {
        if (conflict) {
          // Changed on disk (by Claude?) while there are unsaved edits here: ask — or, while
          // comparing, show the new disk text on the left.
          if (tab.compare) tab.compare.setValue(d.content);
          else tab.conflict = 'disk';
        } else {
          // One edit for the whole text: the undo history survives a reload.
          tab.model.pushEditOperations([], [{ range: tab.model.getFullModelRange(), text: d.content }], () => null);
          markSaved(tab);
        }
      }
      tab.discard = false;
      return true;
    }

    /** The model's text is what is on disk now. */
    function markSaved(t) {
      t.saved = t.model.getAlternativeVersionId();
      updateDirty(t);
    }

    function loadMonaco() {
      if (monacoReady) return monacoReady;
      const script = (src) => new Promise((ok, fail) => {
        const el = Object.assign(document.createElement('script'), { src });
        el.onload = ok;
        el.onerror = () => fail(new Error(tl('the editor failed to load')));
        document.head.append(el);
      });
      // The Russian UI strings are a plain script that must run before the editor (not an AMD
      // module: asking the loader for it via 'vs/nls' config never completes).
      monacoReady = script('/vendor/monaco/vs/nls/lang/ru.js')
        .then(() => script('/vendor/monaco/vs/loader.js'))
        .then(() => new Promise((ok, fail) => {
          window.require.config({ paths: { vs: '/vendor/monaco/vs' } });
          window.require(['vs/editor/editor.main'], () => ok(window.monaco), fail);
        }));
      monacoReady.catch(() => { monacoReady = null; });
      return monacoReady;
    }

    const darkMq = matchMedia('(prefers-color-scheme: dark)');
    const editorTheme = () => (darkMq.matches ? 'vs-dark' : 'vs');
    darkMq.addEventListener('change', () => window.monaco?.editor.setTheme(editorTheme()));

    function ensureEditor(monaco) {
      if (editor) return editor;
      editorHost = Object.assign(document.createElement('div'), { className: 'viewer-editor' });
      editor = monaco.editor.create(editorHost, {
        model: null, theme: editorTheme(), automaticLayout: true, wordWrap: wrap ? 'on' : 'off',
        fontSize: 12.5, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', scrollBeyondLastLine: false,
        minimap: { enabled: true }, renderWhitespace: 'selection', unicodeHighlight: { ambiguousCharacters: false },
      });
      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => { const t = tabs[active]; if (t?.model) save(t); });
      return editor;
    }

    function ensureDiffEditor(monaco) {
      if (diffEditor) return diffEditor;
      diffHost = Object.assign(document.createElement('div'), { className: 'viewer-editor' });
      diffEditor = monaco.editor.createDiffEditor(diffHost, {
        automaticLayout: true, originalEditable: false, ignoreTrimWhitespace: false, renderMarginRevertIcon: true,
        useInlineViewWhenSpaceIsLimited: true, wordWrap: wrap ? 'on' : 'off', fontSize: 12.5,
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', scrollBeyondLastLine: false, minimap: { enabled: false },
      });
      // ⌘S while comparing keeps your version, like "accept" in the bar.
      diffEditor.getModifiedEditor().addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => {
        const t = tabs[active];
        if (t?.compare) save(t, { force: true });
      });
      return diffEditor;
    }

    /**
     * Opens the comparison for a conflict: the file as it is on disk (left, read-only) against the
     * edits here (right, still editable; the arrows in the margin take changes over from the disk).
     */
    async function startCompare(t) {
      if (!window.monaco || !t.model) return;
      let disk;
      try {
        const r = await fetch(`/api/file?cwd=${encodeURIComponent(rootOf(t))}&path=${encodeURIComponent(t.path)}&edit=1`);
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(tlMsg(d.error || r.statusText));
        disk = d.content;
      } catch (e) {
        return barMessage(t, tl('Could not read the file from the disk: {0}', e.message));
      }
      keepViewState();
      endCompare(t);
      t.compare = monaco.editor.createModel(disk, t.model.getLanguageId());
      t.conflict = 'compare';
      if (tabs[active] === t) renderBody();
    }

    function endCompare(t) {
      if (!t.compare) return;
      if (diffEditor?.getModel()?.original === t.compare) diffEditor.setModel(null);
      t.compare.dispose();
      t.compare = null;
      if (t.conflict === 'compare') t.conflict = null;
    }

    function showDiff(t) {
      const de = ensureDiffEditor(window.monaco);
      if (de.getModel()?.original !== t.compare) de.setModel({ original: t.compare, modified: t.model });
      if (body.firstChild !== diffHost || body.childNodes.length !== 1) body.replaceChildren(diffHost);
      const name = t.path.split('/').pop();
      pathEl.textContent = tl('{0} (on disk) ↔ {0} (your version) — comparison', name);
    }

    function modelFor(t, monaco) {
      if (t.model && !t.model.isDisposed()) return t.model;
      // The URI's extension picks the language (and lets TS/JSON services resolve neighbours).
      const uri = monaco.Uri.file(fullPath(t));
      monaco.editor.getModel(uri)?.dispose();
      t.model = monaco.editor.createModel(t.content || '', undefined, uri);
      t.saved = t.model.getAlternativeVersionId();
      t.dirty = false;
      t.model.onDidChangeContent(() => updateDirty(t));
      // Unsaved edits of a file renamed meanwhile come back as an edit (so it stays unsaved).
      if (t.pendingText != null && t.pendingText !== t.content) {
        t.model.pushEditOperations([], [{ range: t.model.getFullModelRange(), text: t.pendingText }], () => null);
      }
      t.pendingText = null;
      return t.model;
    }

    const isDirty = (t) => !!t.model && !t.model.isDisposed() && t.model.getAlternativeVersionId() !== t.saved;

    function syncSaveButton() {
      const t = tabs[active];
      const hex = t && modeOf(t) === 'hex';
      $('viewerSave').hidden = !(hex || (t?.editable && t.model && modeOf(t) === 'editor'));
      $('viewerSave').disabled = hex ? !hexDirty(t.hex) : !isDirty(t || {});
    }

    /** Unsaved: edits in the editor's model or in the hex view. */
    function updateDirty(t) {
      const d = isDirty(t) || hexDirty(t.hex);
      if (d !== t.dirty) { t.dirty = d; renderTabs(); }
      syncSaveButton();
    }

    /** Shows the editor for tab `t` (the read-only view meanwhile, while Monaco loads). */
    function showEditor(t) {
      if (!window.monaco) {
        loadMonaco().then(() => { if (tabs[active] === t) renderBody(); }, (e) => { barMessage(t, e.message); });
        return false;
      }
      const ed = ensureEditor(window.monaco);
      const model = modelFor(t, window.monaco);
      if (ed.getModel() !== model) {
        ed.setModel(model);
        if (t.viewState) ed.restoreViewState(t.viewState);
      }
      if (body.firstChild !== editorHost || body.childNodes.length !== 1) body.replaceChildren(editorHost);
      if (t.goto) {
        // A search result: select the match (the file may have changed since: clamped by Monaco).
        const { line, col, len } = t.goto;
        delete t.goto;
        const range = model.validateRange(new window.monaco.Range(line, col, line, col + len));
        ed.setSelection(range);
        requestAnimationFrame(() => ed.revealRangeInCenter(range));
      }
      return true;
    }

    /** Remembers the active tab's cursor and scroll in the editor before another tab is shown. */
    function keepViewState() {
      const t = tabs[active];
      if (editor && t?.model && !t.compare && editor.getModel() === t.model) t.viewState = editor.saveViewState();
    }

    async function save(t, { force = false } = {}) {
      if (!t.model) return;
      const content = t.model.getValue(), version = t.model.getAlternativeVersionId();
      try {
        const r = await fetch('/api/file/save', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cwd: rootOf(t), path: t.path, content, mtime: t.mtime, force }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.status === 409) { t.conflict = 'save'; renderBar(); return; }
        if (!r.ok) throw new Error(tlMsg(d.error || r.statusText));
        endCompare(t);
        Object.assign(t, { mtime: d.mtime, size: d.size, content, saved: version, conflict: null });
        updateDirty(t); // typed on while saving: still unsaved
        hexFollowDisk(t);
        if (tabs[active] === t) renderBody();
        renderTabs();
        syncSaveButton();
        renderBar();
        fileTree.refreshSoon();
      } catch (e) {
        barMessage(t, tl('Could not save: {0}', e.message));
      }
    }

    /** Re-reads the file from disk, dropping unsaved edits. */
    async function revert(t) {
      endCompare(t);
      t.discard = true; // loadForEdit replaces the model's text instead of asking
      t.content = null;
      t.conflict = null;
      await load(t);
      if (t.model && !t.model.isDisposed()) markSaved(t);
      render();
    }

    function barMessage(t, text) {
      t.conflict = { text };
      if (tabs[active] === t) renderBar();
    }

    function renderBar() {
      const t = tabs[active];
      const c = t?.conflict;
      barEl.hidden = !c;
      barEl.innerHTML = '';
      if (!c) return;
      const btn = (label, fn) => Object.assign(document.createElement('button'), { type: 'button', className: 'btn', textContent: label, onclick: fn });
      const msg = Object.assign(document.createElement('span'), { className: 'msg' });
      barEl.append(msg);
      if (c === 'disk') {
        msg.textContent = tl('⚠️ The file changed on disk (maybe by Claude), and there are unsaved edits here.');
        barEl.append(
          btn(tl('Compare'), () => startCompare(t)),
          btn(tl('Reload from disk'), () => revert(t)),
          btn(tl('Keep mine'), () => { t.conflict = null; renderBar(); }), // saving asks before overwriting
        );
      } else if (c === 'save') {
        msg.textContent = tl('⚠️ Not saved: the file on disk is newer. Compare your version with the file or overwrite it with your edits.');
        barEl.append(
          btn(tl('Compare'), () => startCompare(t)),
          btn(tl('Overwrite'), () => save(t, { force: true })),
          btn(tl('Reload from disk (lose my edits)'), () => revert(t)),
          btn(tl('Cancel'), () => { t.conflict = null; renderBar(); }),
        );
      } else if (c === 'compare') {
        msg.textContent = tl('On the left is the file on disk, on the right your version: it can be edited, the arrows in the margins carry changes over from the disk. Then accept your version (it overwrites the file) or undo your edits.');

        barEl.append(
          btn(tl('✓ Accept my version'), () => save(t, { force: true })),
          btn(tl('↶ Undo my edits'), () => revert(t)),
          btn(tl('Close the comparison'), () => { keepViewState(); endCompare(t); t.conflict = null; renderBody(); }),
        );
      } else if (c === 'hexsave' || c === 'hexdisk' || c === 'hexsave-moved') {
        // Inserted/deleted bytes refer to the old file, so they can't be laid over the new one.
        const moved = c === 'hexsave-moved' || (t.hex && !hexPatchable(t.hex));
        msg.textContent = (c === 'hexdisk'
          ? tl('⚠️ The file changed on disk (maybe by Claude), and the hex editor has unsaved edits.')
          : tl('⚠️ Not saved: the file on disk changed after its bytes were read.'))
          + (moved ? ' ' + tl('Insertions and deletions rely on the previous version of the file, so they can’t be written over the new one.') : '');
        if (!moved) barEl.append(btn(tl('Write my bytes'), () => hexSave(t, { force: true })));
        barEl.append(
          btn(tl('Reload from disk (lose the hex edits)'), () => hexRevert(t)),
          btn(tl('Cancel'), () => { t.conflict = null; renderBar(); }),
        );
      } else if (c === 'hexreload') {
        msg.textContent = tl('Reload the file from disk? Unsaved hex edits will be lost.');
        barEl.append(btn(tl('Reload'), () => hexRevert(t)), btn(tl('Cancel'), () => { t.conflict = null; renderBar(); }));
      } else if (c === 'reload') {
        msg.textContent = tl('Reload the file from disk? Unsaved edits will be lost.');
        barEl.append(btn(tl('Reload'), () => revert(t)), btn(tl('Cancel'), () => { t.conflict = null; renderBar(); }));
      } else {
        msg.textContent = c.text;
        barEl.append(btn('OK', () => { t.conflict = null; renderBar(); }));
      }
    }

    /** Two presses close a tab (or all) with unsaved edits; the first one arms the button. */
    function confirmDiscard(button, count) {
      if (!count || button.classList.contains('armed')) return true;
      button.classList.add('armed');
      const title = button.title;
      button.title = count > 1 ? tl('Unsaved files: {0} — click again to close without saving', count) : tl('Not saved — click again to close without saving');
      setTimeout(() => { button.classList.remove('armed'); button.title = title; }, 3000);
      return false;
    }

    function disposeTab(t) {
      t.player?.pause();
      endCompare(t);
      if (t.model && editor?.getModel() === t.model) editor.setModel(null);
      t.model?.dispose();
      t.model = null;
    }

    function renderTabs() {
      tabsEl.innerHTML = '';
      tabs.forEach((t, i) => {
        const b = document.createElement('div');
        b.className = 'viewer-tab' + (i === active ? ' active' : '');
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', String(i === active));
        b.title = t.root ? fullPath(t) : t.path;
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = `${icon(t.path)} ${t.path.split('/').pop()}`;
        if (t.dirty) name.prepend(Object.assign(document.createElement('span'), { className: 'dirty', textContent: '● ', title: tl('Not saved') }));
        const x = document.createElement('button');
        x.type = 'button';
        x.className = 'x';
        x.textContent = '×';
        x.title = tl('Close the tab');
        x.onclick = (e) => { e.stopPropagation(); if (confirmDiscard(x, t.dirty ? 1 : 0)) close(i); };
        b.append(name, x);
        b.onclick = () => { if (!suppressClick) activate(i); };
        b.onauxclick = (e) => { if (e.button === 1 && confirmDiscard(x, t.dirty ? 1 : 0)) close(i); }; // middle click closes, like browsers
        // Right click: the navigator's menu for this file.
        b.oncontextmenu = (e) => {
          e.preventDefault();
          fileTree.contextMenu(e.clientX, e.clientY, { rel: t.path, name: t.path.split('/').pop(), isDir: false, row: b, ...(t.root ? { cwd: t.root } : {}) });
        };
        b.addEventListener('pointerdown', (e) => startDrag(e, i, b));
        tabsEl.appendChild(b);
      });
      tabsEl.querySelector('.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    /**
     * Reordering tabs by dragging (pointer events: mouse and touch). The tab follows the pointer;
     * a line marks where it will land; the strip scrolls when dragged to its edge. A press that
     * moves less than a few pixels stays a click.
     */
    let suppressClick = false;
    function startDrag(e, from, tabEl) {
      if (e.button !== 0 || e.target.closest('.x')) return;
      const startX = e.clientX;
      const startScroll = tabsEl.scrollLeft;
      let dragging = false;
      let to = from;
      let edgeTimer = null;
      const others = () => [...tabsEl.children].filter((c) => c !== tabEl);

      function place(clientX) {
        // Where the dragged tab's centre is, among the other tabs' centres.
        tabEl.style.transform = `translateX(${clientX - startX + tabsEl.scrollLeft - startScroll}px)`;
        const r = tabEl.getBoundingClientRect();
        const centre = r.left + r.width / 2;
        const rest = others();
        let idx = rest.findIndex((c) => { const cr = c.getBoundingClientRect(); return centre < cr.left + cr.width / 2; });
        if (idx < 0) idx = rest.length;
        to = idx;
        rest.forEach((c, k) => {
          c.classList.toggle('drop-before', k === idx);
          c.classList.toggle('drop-after', idx === rest.length && k === rest.length - 1);
        });
      }
      function edgeScroll(clientX) {
        clearInterval(edgeTimer);
        const r = tabsEl.getBoundingClientRect();
        const dir = clientX < r.left + 30 ? -1 : clientX > r.right - 30 ? 1 : 0;
        if (dir) edgeTimer = setInterval(() => { tabsEl.scrollLeft += dir * 12; place(lastX); }, 30);
      }
      let lastX = startX;
      function move(ev) {
        lastX = ev.clientX;
        if (!dragging) {
          if (Math.abs(ev.clientX - startX) < 5) return;
          dragging = true;
          tabEl.classList.add('dragging');
          tabsEl.classList.add('reordering');
        }
        ev.preventDefault();
        place(ev.clientX);
        edgeScroll(ev.clientX);
      }
      function up() {
        tabEl.removeEventListener('pointermove', move);
        tabEl.removeEventListener('pointerup', up);
        tabEl.removeEventListener('pointercancel', up);
        clearInterval(edgeTimer);
        if (!dragging) return;
        // The click that follows a drag must not switch tabs.
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 0);
        const activeTab = tabs[active];
        const [moved] = tabs.splice(from, 1);
        tabs.splice(to, 0, moved);
        active = tabs.indexOf(activeTab);
        render(); // re-creates the strip; persist() keeps the new order
      }
      // Captured from the start: a fast drag must not lose the tab before the threshold.
      try { tabEl.setPointerCapture(e.pointerId); } catch {}
      tabEl.addEventListener('pointermove', move);
      tabEl.addEventListener('pointerup', up);
      tabEl.addEventListener('pointercancel', up);
    }

    function renderBody() {
      const t = tabs[active];
      if (!t) return;
      const projectName = project.split('/').filter(Boolean).pop() || '/';
      pathEl.textContent = t.root ? shortPath(fullPath(t)) : `${projectName}/${t.path}`;
      pathEl.title = fullPath(t) + (t.root ? ' ' + tl('(outside the project)') : '');
      if (t.error) {
        modeBtn.hidden = true;
        langEl.hidden = true;
        speakBtn.hidden = true;
        findBtn.hidden = true;
        findClose();
        stopReading();
        syncSaveButton();
        renderBar();
        body.innerHTML = '';
        body.appendChild(Object.assign(document.createElement('div'), { className: 'error', textContent: t.error }));
        return;
      }
      renderModeButton(t);
      const mode = modeOf(t);
      if (mode === 'hex') {
        showHex(t);
      } else if (mode === 'preview' && t.kind === 'md') {
        const base = dirOf(t.path);
        body.innerHTML = `<article class="md">${renderMarkdownDoc(t.content || '', (href) => {
          if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith('#')) return { href };
          const [p, anchor] = href.split('#');
          const target = joinPath(base, decodeURIComponent(p));
          const q = `cwd=${encodeURIComponent(rootOf(t))}&path=${encodeURIComponent(target)}`;
          return { href: '#', mdPath: target, anchor, raw: `/api/raw?${q}` };
        })}</article>`;
      } else if (mode === 'preview' && t.kind === 'txt') {
        // Paragraphs (blank-line separated) keep their line breaks; each is one node to translate.
        const article = Object.assign(document.createElement('article'), { className: 'txt-doc' });
        for (const para of (t.content || '').split(/\n[ \t]*\n/)) if (para.trim()) article.append(Object.assign(document.createElement('p'), { textContent: para }));
        body.replaceChildren(article);
      } else if (mode === 'preview' && t.kind === 'html') {
        // A sandbox without scripts; the CSP blocks every load (external CSS, images, fonts), so
        // the page is shown with its inline styles only. Same origin, so its text can be translated.
        const frame = Object.assign(document.createElement('iframe'), { className: 'html-frame', title: t.path });
        frame.setAttribute('sandbox', 'allow-same-origin');
        // The style paints the search matches (see findPaint).
        frame.srcdoc = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">`
          + '<style>::highlight(viewer-find){background:rgba(255,200,0,.4)}::highlight(viewer-find-cur){background:#ff9632;color:#000}</style>'
          + (t.content || '');
        frame.onload = () => {
          frame.contentDocument?.addEventListener('keydown', findKey); // the frame runs no scripts of its own
          if (tabs[active] === t) translatePreview();
        };
        body.replaceChildren(frame);
      } else if (t.kind === 'image') {
        const img = document.createElement('img');
        img.className = 'viewer-image';
        img.alt = t.path;
        img.src = `${rawUrl(t)}&v=${t.version}`;
        const meta = document.createElement('div');
        meta.className = 'viewer-meta';
        img.onload = () => { meta.textContent = `${img.naturalWidth} × ${img.naturalHeight}`; };
        img.onerror = () => { meta.textContent = tl('Could not show the image'); };
        body.replaceChildren(img, meta);
      } else if (t.kind === 'audio') {
        // The player lives with its tab: re-rendering (tab drag, refresh) must not stop playback.
        const src = `${rawUrl(t)}&v=${t.version}`;
        if (t.player?.dataset.src !== src) {
          t.player?.pause();
          const audio = Object.assign(document.createElement('audio'), { controls: true, preload: 'metadata', className: 'viewer-audio' });
          audio.dataset.src = src;
          audio.src = src;
          const meta = document.createElement('div');
          meta.className = 'viewer-meta';
          const ext = t.path.split('.').pop().toUpperCase();
          audio.onloadedmetadata = () => { meta.textContent = `${ext} · ${formatDuration(audio.duration)}`; };
          audio.onerror = () => { meta.textContent = tl('Could not play the file'); };
          t.player = Object.assign(document.createElement('div'), { className: 'viewer-player' });
          t.player.dataset.src = src;
          t.player.pause = () => audio.pause();
          t.player.append(audio, waveform(audio, src), audioTags(t), meta);
        }
        body.replaceChildren(t.player);
      } else if (t.kind === 'video') {
        // Like the audio player, the video lives with its tab so re-rendering doesn't stop it.
        const src = `${rawUrl(t)}&v=${t.version}`;
        if (t.player?.dataset.src !== src) {
          t.player?.pause();
          const video = Object.assign(document.createElement('video'), { controls: true, preload: 'metadata', playsInline: true, className: 'viewer-video' });
          video.src = src;
          const meta = document.createElement('div');
          meta.className = 'viewer-meta';
          const ext = t.path.split('.').pop().toUpperCase();
          video.onloadedmetadata = () => {
            const size = video.videoWidth ? ` · ${video.videoWidth} × ${video.videoHeight}` : tl(' · no video track');
            meta.textContent = `${ext}${size} · ${formatDuration(video.duration)}`;
          };
          // MEDIA_ERR_SRC_NOT_SUPPORTED: usually a codec Chromium can't decode (e.g. ProRes, some MKV).
          video.onerror = () => {
            meta.textContent = video.error?.code === 4 ? tl('The video format or codec isn’t supported') : tl('Could not play the file');
          };
          t.player = Object.assign(document.createElement('div'), { className: 'viewer-player' });
          t.player.dataset.src = src;
          t.player.pause = () => video.pause();
          t.player.append(video, meta);
        }
        body.replaceChildren(t.player);
      } else if (mode === 'editor' && t.compare && t.model && window.monaco) {
        showDiff(t);
      } else if (mode === 'editor' && t.editable && showEditor(t)) {
        // Text files that fit: the editor (Markdown source too).
      } else {
        // Larger text files read-only (or while the editor loads): line numbers, optional wrapping.
        const pre = document.createElement('pre');
        pre.className = 'code-view' + (wrap ? ' wrap' : '');
        pre.innerHTML = linesHtml(t.content || '');
        body.replaceChildren(pre);
        if (t.next != null) body.append(Object.assign(document.createElement('div'), { className: 'viewer-more' }));
        moreNote(t);
      }
      $('viewerWrap').hidden = !(mode === 'editor' || (mode === 'preview' && t.kind === 'bigtext'));
      langEl.hidden = !(mode === 'preview' && ['md', 'txt', 'html'].includes(t.kind));
      speakBtn.hidden = langEl.hidden;
      if (reading && (reading.tab !== t || langEl.hidden)) stopReading(); // another tab or view
      else if (reading && reading.lit && !reading.lit.isConnected) reading.lit = null; // re-rendered
      syncSpeakButton();
      if (!langEl.hidden && t.kind !== 'html') translatePreview(); // HTML: once its frame has loaded
      findBtn.hidden = !findTarget();
      if (findBtn.hidden) findClose(); else findRefresh();
      if (!body.contains(editorHost) && !body.contains(diffHost) && !body.contains(hexEl)) body.scrollTop = t.scroll || 0;
      syncSaveButton();
      renderBar();
      loadMoreSoon();
    }

    /** Text as numbered line rows (a trailing "\n" doesn't make an empty last row). */
    function linesHtml(text) {
      const lines = text.split('\n');
      if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
      return lines.map((l) => `<div class="l">${escapeHtml(l) || ' '}</div>`).join('');
    }

    const fmtMb = (n) => tl('{0} MB', (n / 1048576).toLocaleString(LOCALE, { maximumFractionDigits: 1 }));
    function moreNote(t) {
      const el = body.querySelector('.viewer-more');
      if (!el) return;
      if (t.next == null) { el.remove(); return; }
      el.textContent = t.loadingMore
        ? tl('Loading…')
        : tl('Shown {0} of {1} — scroll down to load more', fmtMb(t.next), fmtMb(t.size));
    }

    /** Appends the next piece of the active tab when its end is near (or the view isn't full yet). */
    async function loadMoreSoon() {
      const t = tabs[active];
      if (!t || t.next == null || t.loadingMore || t.error) return;
      const pre = body.querySelector('.code-view');
      if (!pre || body.scrollHeight - body.scrollTop - body.clientHeight > 3000) return;
      t.loadingMore = true;
      moreNote(t);
      const path = t.path;
      try {
        const d = await getJson(`/api/file?cwd=${encodeURIComponent(rootOf(t))}&path=${encodeURIComponent(path)}&offset=${t.next}&limit=${CHUNK}`);
        if (t.path !== path || d.offset !== t.next) { t.loadingMore = false; return; } // renamed or reloaded meanwhile
        if (d.mtime !== t.mtime) { t.loadingMore = false; t.stale = true; return viewer.refreshSoon(); } // changed: start over
        const html = linesHtml(d.content);
        // A piece cut inside a very long line continues that line.
        if (t.content && !t.content.endsWith('\n') && pre.lastElementChild) {
          const nl = d.content.indexOf('\n');
          pre.lastElementChild.textContent += nl < 0 ? d.content : d.content.slice(0, nl);
          pre.insertAdjacentHTML('beforeend', nl < 0 ? '' : linesHtml(d.content.slice(nl + 1)));
        } else {
          pre.insertAdjacentHTML('beforeend', html);
        }
        t.content += d.content;
        t.next = d.next;
        if (tabs[active] === t) findRefresh();
      } catch (e) {
        t.next = null;
        const el = body.querySelector('.viewer-more');
        if (el) el.textContent = tl('Could not load the rest: {0}', e.message);
        t.loadingMore = false;
        return;
      }
      t.loadingMore = false;
      if (tabs[active] === t) { moreNote(t); requestAnimationFrame(loadMoreSoon); }
    }
    body.addEventListener('scroll', loadMoreSoon, { passive: true });

    function render() {
      panel.hidden = !tabs.length;
      document.body.classList.toggle('viewer-open', !!tabs.length);
      renderTabs();
      renderBody();
      persist();
    }

    async function activate(i) {
      keepViewState();
      if (tabs[active]) tabs[active].scroll = body.scrollTop;
      if (i !== active) tabs[active]?.player?.pause(); // a hidden tab must not keep playing
      active = i;
      if (tabs[i]?.stale) await load(tabs[i]);
      render();
    }

    /**
     * Opens `path` (relative to the project, or to `root` for a file outside it) in a tab — a new one,
     * or the existing one. `line` (1-based; with `col`, `len` of a search match) shows the file in the
     * editor with that text selected.
     */
    async function open(path, { anchor, root, line, col = 1, len = 0 } = {}) {
      if (!cwd) return;
      if (project !== cwd) syncProject();
      root = root || undefined;
      let i = tabs.findIndex((t) => t.path === path && t.root === root);
      if (i < 0) {
        const tab = { path, scroll: 0, ...(root ? { root } : {}) };
        await load(tab);
        tabs.push(tab);
        i = tabs.length - 1;
      }
      if (line && modesOf(tabs[i]).includes('editor')) {
        if (i === active) keepViewState();
        tabs[i].mode = 'editor';
        tabs[i].goto = { line, col, len };
      }
      await activate(i);
      if (anchor) scrollToAnchor(anchor);
    }

    function close(i) {
      if (tabs[i] === reading?.tab) stopReading();
      if (i === active) keepViewState();
      disposeTab(tabs[i]);
      tabs.splice(i, 1);
      if (active >= tabs.length) active = tabs.length - 1;
      else if (i < active) active--;
      render();
    }

    function closeAll() {
      stopReading();
      tabs.forEach(disposeTab);
      tabs = [];
      active = -1;
      render();
    }

    function scrollToAnchor(anchor) {
      const target = body.querySelector(`#${CSS.escape(decodeURIComponent(anchor).toLowerCase())}`) || body.querySelector(`[id="${CSS.escape(anchor)}"]`);
      target?.scrollIntoView({ block: 'start' });
    }

    // Links inside a rendered file: other files open as tabs, #anchors scroll.
    body.addEventListener('click', (e) => {
      const a = e.target.closest('a[data-md-path], a[data-anchor]');
      if (!a) return;
      e.preventDefault();
      if (a.dataset.mdPath) open(a.dataset.mdPath, { anchor: a.dataset.anchor, root: tabs[active]?.root });
      else scrollToAnchor(a.dataset.anchor);
    });

    $('viewerClose').onclick = () => { if (confirmDiscard($('viewerClose'), tabs.filter((t) => t.dirty).length)) closeAll(); };
    $('viewerSave').onclick = () => { const t = tabs[active]; if (t && modeOf(t) === 'hex') hexSave(t); else if (t?.model) save(t); };
    $('viewerWrap').classList.toggle('on', wrap);
    $('viewerWrap').onclick = () => {
      wrap = !wrap;
      store.set('claude.viewerWrap', wrap ? '1' : '0');
      $('viewerWrap').classList.toggle('on', wrap);
      body.querySelector('.code-view')?.classList.toggle('wrap', wrap);
      editor?.updateOptions({ wordWrap: wrap ? 'on' : 'off' });
      diffEditor?.updateOptions({ wordWrap: wrap ? 'on' : 'off' });
    };
    $('viewerReload').onclick = async () => {
      const t = tabs[active];
      if (!t) return;
      if (modeOf(t) === 'hex') { if (hexDirty(t.hex)) { t.conflict = 'hexreload'; renderBar(); } else hexRevert(t); return; }
      if (isDirty(t)) { t.conflict = 'reload'; renderBar(); return; }
      t.scroll = body.scrollTop;
      await load(t);
      render();
    };
    $('viewerInsert').onclick = () => { const t = tabs[active]; if (t) fileTree.insertPath(t.root ? fullPath(t) : t.path); };

    // Resizable width, remembered (like the side panel).
    const savedWidth = Number(store.get('claude.viewerWidth'));
    if (savedWidth) panel.style.setProperty('--viewer-w', savedWidth + 'px');
    $('viewerResize').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      document.body.classList.add('side-resizing');
      const left = panel.getBoundingClientRect().left;
      const max = () => Math.max(320, document.querySelector('.workspace').getBoundingClientRect().right - left - 320);
      const move = (ev) => panel.style.setProperty('--viewer-w', Math.min(max(), Math.max(260, ev.clientX - left)) + 'px');
      const up = () => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        document.body.classList.remove('side-resizing');
        store.set('claude.viewerWidth', String(Math.round(panel.getBoundingClientRect().width)));
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });

    /** Shows the open tabs of the current project (after a project switch or on start). */
    async function syncProject() {
      if (!cwd || project === cwd) return;
      project = cwd;
      tabs.forEach(disposeTab);
      tabs = [];
      active = -1;
      let saved = null;
      try { saved = JSON.parse(sessionStorage.getItem(key()) || 'null'); } catch {}
      if (saved?.paths?.length) {
        tabs = saved.paths.map((p) => (typeof p === 'string' ? { path: p, scroll: 0, stale: true } : { path: p.path, root: p.root, scroll: 0, stale: true }));
        active = Math.min(Math.max(0, saved.active), tabs.length - 1);
        await load(tabs[active]);
      }
      render();
    }

    /** Opens a file by its absolute path (File → Open): inside the project as usual, else in a tab of its own folder. */
    function openPath(abs) {
      if (!abs || !cwd) return;
      const base = cwd.replace(/\/$/, '') + '/';
      if (abs.startsWith(base)) return open(abs.slice(base.length));
      const cut = abs.lastIndexOf('/');
      return open(abs.slice(cut + 1), { root: abs.slice(0, cut) || '/' });
    }

    // File → Open (the app's menu, ⌘O): the standard file picker; the app gives the file's path.
    const fileInput = $('openFileInput');
    window.openFilePicker = () => { fileInput.value = ''; fileInput.click(); };
    fileInput.onchange = () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      const abs = window.ninebits?.pathForFile?.(file);
      if (abs) openPath(abs);
      else el('div', 'error', tl('Opening a file by path works only in the Claude-AI app'));
    };

    return {
      open,
      openPath,
      icon,
      syncProject,
      /** A project entry was renamed (newRel) or deleted (null): fix or close its tabs. */
      moved(oldRel, newRel) {
        const hit = (p, t) => !t?.root && (p === oldRel || p.startsWith(oldRel + '/'));
        if (!tabs.some((t) => hit(t.path, t))) return;
        if (newRel == null) {
          for (let i = tabs.length - 1; i >= 0; i--) if (hit(tabs[i].path, tabs[i])) close(i);
          return;
        }
        for (const t of tabs) {
          if (!hit(t.path, t)) continue;
          // The editor model is keyed by the old path: a renamed file starts a new one (edits kept).
          const text = t.dirty ? t.model.getValue() : null;
          disposeTab(t);
          t.path = newRel + t.path.slice(oldRel.length);
          t.stale = true;
          delete t.player;
          if (text != null) t.pendingText = text;
        }
        if (tabs[active]?.stale) load(tabs[active]).then(render); else render();
      },
      /** Files may have changed (a tool ran): reload the visible tab, mark the others. */
      refreshSoon() {
        clearTimeout(refreshTimer);
        refreshTimer = setTimeout(async () => {
          if (!tabs.length) return;
          tabs.forEach((t, i) => { if (i !== active) t.stale = true; });
          const t = tabs[active];
          const before = t.mtime;
          t.scroll = body.scrollTop;
          await load(t);
          if (modeOf(t) === 'hex') return hexRefresh(t);
          if (t.mtime !== before || t.error || t.conflict) render();
        }, 800);
      },
    };
  })();

  // --- Inside the VS Code extension: the chat only, the rest is VS Code's ---
  if (EMBED) {
    // Voice and microphone right after the permission mode, then the settings — one block that
    // wraps to the next line as a whole.
    const [gear, ...sound] = document.querySelectorAll('nav.activity .voice-wrap');
    const tools = Object.assign(document.createElement('span'), { className: 'head-tools' });
    tools.append(...sound, gear);
    tools.querySelector('#micBtn').closest('.voice-wrap').hidden = true; // no speech recognition here yet (see hearing)
    $('mode').after(tools);
    // A menu of those buttons opens under its button, right-aligned; in a narrow panel (the block
    // wrapped to the left) it would stick out of the window: kept inside it.
    const head = document.querySelector('.chat-head');
    const clampMenus = () => {
      const W = document.documentElement.getBoundingClientRect().width;
      const z = parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
      for (const m of head.querySelectorAll('.menu')) {
        if (m.hidden || !m.offsetParent) continue;
        m.style.translate = '';
        const r = m.getBoundingClientRect();
        const dx = r.left < 4 ? 4 - r.left : r.right > W - 4 ? Math.max(4 - r.left, W - 4 - r.right) : 0;
        if (dx) m.style.translate = `${dx / z}px 0`;
      }
    };
    new MutationObserver((list) => { if (list.some((r) => r.attributeName !== 'style')) clampMenus(); })
      .observe(head, { attributes: true, subtree: true, attributeFilter: ['hidden', 'class', 'aria-expanded'] });
    window.addEventListener('resize', clampMenus);
    // Files open in VS Code's editor, not in the page's viewer.
    const abs = (p, root) => (p.startsWith('/') ? p : (root || cwd).replace(/\/$/, '') + '/' + p);
    viewer.open = (p, { root, line, col } = {}) => toHost({ type: 'openFile', path: abs(p, root), line, col });
    viewer.openPath = (p) => p && toHost({ type: 'openFile', path: p });
    // From the extension: open a project folder's chat, a session from its history, a new chat.
    window.addEventListener('message', (e) => {
      const m = e.data;
      if (!HOST_ORIGIN || m?.target !== 'claude-wrapper') return; // from the extension only
      if (m.type === 'setProject' && m.cwd && m.cwd !== cwd) setProject(m.cwd);
      else if (m.type === 'loadSession' && m.id) loadSession(m.id, { title: m.title || '' });
      else if (m.type === 'newChat') $('newChat').click();
      else if (m.type === 'stop') stopRun();
      else if (m.type === 'finish' && busy()) askToFinish();
      else if (m.type === 'ttsInfo') voice.setHost(m.info);
      else if (m.type === 'tts') voice.hostDone(m);
    });
    // The extension asks before switching the folder while Claude works (it follows `busy`) and
    // manages the MCP servers of the chat's live process (`runId`).
    const hostKey = () => `${busy()}|${liveRun()}`;
    let was = hostKey();
    setInterval(() => { if (hostKey() !== was) { was = hostKey(); renderMeta(); } }, 500);
    toHost({ type: 'ready' });
  }
</script>
</body>
</html>
