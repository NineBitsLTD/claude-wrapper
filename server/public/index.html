    const listRe = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
    const isTableSep = (l) => /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/.test(l) && l.includes('-');
    const cells = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, '|'));

    function blocks(ls) {
      let html = '';
      let i = 0;
      while (i < ls.length) {
        const line = ls[i];
        if (!line.trim()) { i++; continue; }
        const fence = isFence(line);
        if (fence) {
          const mark = fence[1];
          const lang = line.slice(line.indexOf(mark) + mark.length).trim().split(/\s+/)[0];
          const body = [];
          i++;
          while (i < ls.length && !ls[i].trim().startsWith(mark)) body.push(ls[i++]);
          i++;
          html += `<pre><code${lang ? ` class="lang-${esc(lang)}"` : ''}>${esc(body.join('\n'))}</code></pre>`;
          continue;
        }
        if (isHeading(line)) {
          const m = /^\s*(#{1,6})\s*(.*?)\s*#*\s*$/.exec(line);
          const content = inline(m[2]);
          html += `<h${m[1].length} id="${esc(slug(m[2]))}">${content}</h${m[1].length}>`;
          i++;
          continue;
        }
        if (isHr(line)) { html += '<hr>'; i++; continue; }
        if (/^\s{0,3}>/.test(line)) {
          const q = [];
          while (i < ls.length && ls[i].trim() && /^\s{0,3}>/.test(ls[i])) q.push(ls[i++].replace(/^\s{0,3}>\s?/, ''));
          html += `<blockquote>${blocks(q)}</blockquote>`;
          continue;
        }
        if (line.includes('|') && i + 1 < ls.length && isTableSep(ls[i + 1])) {
          const head = cells(line);
          const aligns = cells(ls[i + 1]).map((c) => (c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : ''));
          i += 2;
          const rows = [];
          while (i < ls.length && ls[i].trim() && ls[i].includes('|')) rows.push(cells(ls[i++]));
          const td = (tag, c, k) => `<${tag}${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${inline(c)}</${tag}>`;
          html += `<div class="md-table"><table><thead><tr>${head.map((c, k) => td('th', c, k)).join('')}</tr></thead><tbody>${
            rows.map((r) => `<tr>${head.map((_, k) => td('td', r[k] ?? '', k)).join('')}</tr>`).join('')}</tbody></table></div>`;
          continue;
        }
        if (listRe.test(line)) {
          // One list = consecutive items of the same kind (bullets vs numbers) at this indent,
          // plus their deeper lines; a change of kind starts a new list.
          const first = listRe.exec(line);
          const base = first[1].length;
          const ordered = /\d/.test(first[2]);
          const sameList = (l) => {
            const m = listRe.exec(l);
            return !!m && (m[1].length > base + 1 || /\d/.test(m[2]) === ordered);
          };
          const chunk = [];
          while (i < ls.length) {
            const l = ls[i];
            const next = ls[i + 1];
            const belongs = listRe.test(l) ? sameList(l)
              : l.trim() ? /^\s{2,}/.test(l)
              : next !== undefined && (sameList(next) || /^\s{2,}\S/.test(next));
            if (!belongs) break;
            chunk.push(l);
            i++;
          }
          html += list(chunk);
          continue;
        }
        const para = [];
        while (i < ls.length && ls[i].trim() && !isFence(ls[i]) && !isHeading(ls[i]) && !isHr(ls[i]) && !/^\s{0,3}>/.test(ls[i]) && !listRe.test(ls[i]) && !(ls[i].includes('|') && i + 1 < ls.length && isTableSep(ls[i + 1]))) para.push(ls[i++]);
        if (para.length) html += `<p>${inline(para.join('\n'))}</p>`;
        else i++;
      }
      return html;
    }

    /** A list chunk: items at the first item's indent; deeper lines belong to the item. */
    function list(ls) {
      const first = listRe.exec(ls[0]);
      const base = first[1].length;
      const ordered = /\d/.test(first[2]);
      const start = ordered ? parseInt(first[2], 10) : 1;
      const items = [];
      for (const l of ls) {
        const m = listRe.exec(l);
        if (m && m[1].length <= base + 1) items.push([m[3]]);
        else if (items.length) items[items.length - 1].push(l.slice(Math.min(base + 2, l.search(/\S|$/))));
      }
      const li = items.map((it) => {
        let [head, ...rest] = it;
        // Lines right after the first one (up to a blank line or another block) continue its
        // paragraph, as in CommonMark — not a new paragraph inside the item.
        while (rest.length && rest[0].trim() && !listRe.test(rest[0]) && !isFence(rest[0]) && !isHeading(rest[0])
               && !isHr(rest[0]) && !/^\s{0,3}>/.test(rest[0])) head += '\n' + rest.shift();
        let box = '';
        const task = /^\[([ xX])\]\s+/.exec(head);
        if (task) { box = `<input type="checkbox" disabled${task[1] !== ' ' ? ' checked' : ''}> `; head = head.slice(task[0].length); }
        const inner = rest.some((r) => r.trim()) ? blocks(rest) : '';
        return `<li${task ? ' class="task"' : ''}>${box}${inline(head)}${inner}</li>`;
      }).join('');
      return ordered ? `<ol${start !== 1 ? ` start="${start}"` : ''}>${li}</ol>` : `<ul>${li}</ul>`;
    }

    return blocks(lines);
  }

  /**
   * File viewer panel between the side panel and the chat: tabs of open files, path in the
   * header, resizable width (remembered). Markdown is rendered; other text files are shown as-is.
   * Open tabs are remembered per browser tab and project.
   */
  const viewer = (() => {
    const panel = $('viewer');
    const tabsEl = $('viewerTabs');
    const pathEl = $('viewerPath');
    const body = $('viewerBody');
    const MD = /\.(md|markdown|mdx)$/i;
    const HTML_RE = /\.(html?|xhtml)$/i;
    const TXT_RE = /\.txt$/i;
    const IMG = /\.(png|jpe?g|gif|webp|svg|ico|avif)$/i;
    const AUDIO = /\.(wav|mp3|ogg|oga|opus|flac|m4a|aac|weba)$/i;
    const VIDEO = /\.(mp4|m4v|mov|webm|ogv|mkv)$/i;
    const icon = (p) => (MD.test(p) ? '📝' : IMG.test(p) ? '🖼' : AUDIO.test(p) ? '🔊' : VIDEO.test(p) ? '🎬' : '📄');
    let wrap = store.get('claude.viewerWrap') === '1';
    // Text comes in pieces (/api/file): `next` = byte offset of the next piece (null: all loaded),
    // `size` = file size; scrolling near the end loads the next piece.
    // Text files up to EDIT_MAX open in the editor (Monaco, the editor of VS Code): one model per
    // tab, `saved` = its alternative version id when it matched the disk, `conflict` = what the
    // bar above the editor asks about. Larger files stay read-only, loaded in pieces.
    // `compare`: while resolving a conflict, a read-only model of the disk text shown left of the
    // tab's own model in a diff editor (VS Code's "Compare" of a save conflict).
    let tabs = []; // { path, content, mtime, error, scroll, stale, version, player, raw, next, size, editable, model, saved, viewState, conflict, compare }
    const CHUNK = 1024 * 1024, RELOAD_MAX = 16 * 1024 * 1024;
    let active = -1;
    let project = null;
    let refreshTimer = null;
    // A tab of a file outside the project (File → Open) has its own `root`, the file's folder; every
    // request of the tab is relative to it instead of the project.
    const rootOf = (t) => t.root || project;
    const fullPath = (t) => `${rootOf(t).replace(/\/$/, '')}/${t.path}`;

    const key = () => 'claude.viewer:' + project;
    function persist() {
      try { sessionStorage.setItem(key(), JSON.stringify({ paths: tabs.map((t) => (t.root ? { path: t.path, root: t.root } : t.path)), active })); } catch {}
    }

    const dirOf = (p) => (p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '');
    function joinPath(base, rel) {
      const out = [];
      for (const part of (rel.startsWith('/') ? rel : (base ? base + '/' : '') + rel).split('/')) {
        if (!part || part === '.') continue;
        if (part === '..') out.pop(); else out.push(part);
      }
      return out.join('/');
    }

    /** Like the native player: 75.8 -> "1:15", 3725 -> "1:02:05". */
    function formatDuration(sec) {
      if (!Number.isFinite(sec)) return '—';
      const s = Math.floor(sec), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, r = String(s % 60).padStart(2, '0');
      return h ? `${h}:${String(m).padStart(2, '0')}:${r}` : `${m}:${r}`;
    }

    const WAVE_MAX_BYTES = 150 * 1024 * 1024; // larger files get no waveform (decoding is in memory)
    const WAVE_BUCKETS = 2000;

    /**
     * Waveform of `src` under `audio`: min/max peaks of the decoded file, the played part in the
     * accent colour and a line at the current position; click or drag to seek.
     */
    function waveform(audio, src) {
      const box = Object.assign(document.createElement('div'), { className: 'viewer-wave', title: tl('Click to go to the position') });
      const canvas = document.createElement('canvas');
      const note = Object.assign(document.createElement('div'), { className: 'note', textContent: tl('Building the sound graph…') });
      box.append(canvas, note);
      let peaks = null; // [min0, max0, min1, max1, …], -1..1
      let frame = 0;

      function draw() {
        const w = box.clientWidth, h = box.clientHeight, dpr = devicePixelRatio || 1;
        if (!peaks || !w) return;
        if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
        }
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        const css = getComputedStyle(box);
        const accent = css.getPropertyValue('--accent').trim(), muted = css.getPropertyValue('--muted').trim();
        const pos = audio.duration ? (audio.currentTime / audio.duration) * w : 0;
        const n = peaks.length / 2, mid = h / 2;
        for (let x = 0; x < w; x++) {
          // Every pixel column takes the extremes of the buckets it covers.
          let lo = 1, hi = -1;
          for (let b = Math.floor((x / w) * n), end = Math.max(b + 1, Math.floor(((x + 1) / w) * n)); b < end; b++) {
            lo = Math.min(lo, peaks[2 * b]);
            hi = Math.max(hi, peaks[2 * b + 1]);
          }
          ctx.fillStyle = x < pos ? accent : muted;
          ctx.globalAlpha = x < pos ? 1 : 0.55;
          ctx.fillRect(x, mid - Math.max(hi, 0) * mid, 1, Math.max(1, (Math.max(hi, 0) - Math.min(lo, 0)) * mid));
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = accent;
        ctx.fillRect(Math.min(pos, w - 2), 0, 2, h);
      }

      function tick() {
        draw();
        frame = audio.paused ? 0 : requestAnimationFrame(tick);
      }
      audio.addEventListener('play', () => { if (!frame) frame = requestAnimationFrame(tick); });
      for (const ev of ['pause', 'seeked', 'timeupdate', 'loadedmetadata', 'ended']) audio.addEventListener(ev, () => { if (!frame) draw(); });
      new ResizeObserver(() => draw()).observe(box);

      function seek(e) {
        const r = box.getBoundingClientRect();
        if (audio.duration) audio.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * audio.duration;
        draw();
      }
      box.addEventListener('pointerdown', (e) => {
        if (!peaks) return;
        box.setPointerCapture(e.pointerId);
        seek(e);
        const move = (ev) => seek(ev);
        box.addEventListener('pointermove', move);
        box.addEventListener('pointerup', () => box.removeEventListener('pointermove', move), { once: true });
      });

      (async () => {
        const ctrl = new AbortController();
        const res = await fetch(src, { signal: ctrl.signal });
        if (!res.ok) throw new Error(res.status);
        if (Number(res.headers.get('Content-Length')) > WAVE_MAX_BYTES) {
          ctrl.abort();
          throw new Error(tl('The file is too large for a sound graph'));
        }
        const buf = await new OfflineAudioContext(1, 1, 44100).decodeAudioData(await res.arrayBuffer());
        const channels = Array.from({ length: buf.numberOfChannels }, (_, c) => buf.getChannelData(c));
        const n = Math.min(WAVE_BUCKETS, buf.length), out = new Float32Array(2 * n);
        for (let b = 0; b < n; b++) {
          let lo = 0, hi = 0;
          const from = Math.floor((b / n) * buf.length), to = Math.floor(((b + 1) / n) * buf.length);
          for (const data of channels) for (let i = from; i < to; i++) { const v = data[i]; if (v < lo) lo = v; else if (v > hi) hi = v; }
          out[2 * b] = lo; out[2 * b + 1] = hi;
        }
        // Quiet recordings still fill the height: scale to the loudest peak.
        let top = 0;
        for (const v of out) top = Math.max(top, Math.abs(v));
        if (top) for (let i = 0; i < out.length; i++) out[i] /= top;
        peaks = out;
        note.remove();
        draw();
      })().catch((e) => { note.textContent = e.message === tl('The file is too large for a sound graph') ? e.message : tl('Could not build the sound graph'); });
      return box;
    }

    const TAG_LABELS = {
      title: tl('Title'), artist: tl('Artist'), album: tl('Album'), albumartist: tl('Album artist'), date: tl('Year'),
      track: tl('Track'), disc: tl('Disc'), genre: tl('Genre'), comment: tl('Comment'), composer: tl('Composer'), lyrics: tl('Lyrics'),
      encoder: tl('Encoder'), encodedby: tl('Encoded by'), copyright: tl('Copyright'), bpm: tl('Tempo (BPM)'), picture: tl('Cover'),
    };

    /** The file's metadata tags (/api/audiotags): cover picture, label (raw tag id in the tooltip) and value. */
    function audioTags(t) {
      const p = t.path, version = t.version;
      const box = Object.assign(document.createElement('div'), { className: 'viewer-tags' });
      const head = Object.assign(document.createElement('div'), { className: 'head', textContent: tl('Tags: loading…') });
      box.append(head);
      getJson(`/api/audiotags?cwd=${encodeURIComponent(rootOf(t))}&path=${encodeURIComponent(p)}`).then((d) => {
        if (d.cover) {
          const q = `cwd=${encodeURIComponent(rootOf(t))}&path=${encodeURIComponent(p)}&v=${version}`;
          const img = Object.assign(document.createElement('img'), { className: 'viewer-cover', alt: tl('Cover'), src: `/api/audiocover?${q}` });
          img.onerror = () => img.remove();
          box.before(img);
        }
        if (!d.tags.length) { head.textContent = d.format ? tl('Tags ({0}): empty', d.format) : tl('No tags'); return; }
        head.textContent = tl('Tags ({0})', d.format);
        const dl = document.createElement('dl');
        for (const t of d.tags) {
          dl.append(Object.assign(document.createElement('dt'), { textContent: TAG_LABELS[t.key] || t.id, title: t.id }),
            Object.assign(document.createElement('dd'), { textContent: t.value }));
        }
        box.append(dl);
      }).catch((e) => { head.textContent = tl('Could not read the tags: {0}', e.message); });
      return box;
    }

    const rawUrl = (t) => `/api/raw?cwd=${encodeURIComponent(rootOf(t))}&path=${encodeURIComponent(t.path)}`;

    async function load(tab) {
      if (IMG.test(tab.path) || AUDIO.test(tab.path) || VIDEO.test(tab.path)) {
        // Images, audio and video come straight from /api/raw; a new version number defeats the cache.
        tab.kind = IMG.test(tab.path) ? 'image' : AUDIO.test(tab.path) ? 'audio' : 'video';
        tab.version = Date.now();
        tab.error = null;
        tab.stale = false;
        return;
      }
      try {
        if (await loadForEdit(tab)) { tab.stale = false; return; }
        // A reload takes as much as was shown, so the scroll position stays valid.
        const loaded = tab.next != null ? tab.next : tab.content != null ? tab.size || 0 : 0;
        const limit = Math.min(RELOAD_MAX, Math.max(CHUNK, loaded));
        const d = await getJson(`/api/file?cwd=${encodeURIComponent(rootOf(tab))}&path=${encodeURIComponent(tab.path)}&limit=${limit}`);
        tab.content = d.content;
        tab.next = d.next;
        tab.size = d.size;
        tab.mtime = d.mtime;
        tab.error = null;
        tab.kind = 'bigtext';
      } catch (e) {
        // Not text (a NUL byte): only the hex view can show it.
        if (e.status === 415) Object.assign(tab, { kind: 'binary', error: null, content: null, next: null, editable: false });
        else tab.error = e.message;
      }
      tab.stale = false;
    }

    // ---------- translation of the preview (Markdown, text, HTML) ----------
    // Like labi.one's docs viewer: RU / UA / EN translate the text nodes of the rendered document in
    // place (code, pre, translate="no" and .notranslate are skipped); pressing the active language
    // shows the original again; the choice is per tab (a new file opens in the original). Chrome's on-device Translator API is used
    // when the browser has it (with LanguageDetector for the source); otherwise — in the app, whose
    // Electron declares these APIs but can't run them — the server translates through claude
    // (/api/translate) in batches. Translations are
    // cached per text, so re-renders and tab switches don't translate again.
    const langEl = $('viewerLang'), langStatus = langEl.querySelector('.st');
    // The translation is per tab (tab.lang): a newly opened file always starts in the original.
    const viewLangOf = () => tabs[active]?.lang || null;
    const trCache = new Map();          // `${lang}\n${text}` -> translation (of trimmed text)
    const trOriginals = new WeakMap();  // text node -> its original text
    const trBrowser = new Map();        // `${src}:${lang}` -> Translator (or null: unavailable)
    let trSeq = 0;
    const TR_BATCH_ITEMS = 60, TR_BATCH_CHARS = 8000;
    const trKey = (lang, text) => `${lang}\n${text}`;

    const langSel = $('viewerLangSel');
    const LANG_LABELS = { '': 'DEF', ru: 'RU', uk: 'UA', en: 'EN' };
    /** Progress inside the dropdown's selected item: "RU 20/120", "RU 45%"; null restores the label. */
    function setLangProgress(text) {
      for (const o of langSel.options) o.textContent = LANG_LABELS[o.value] + (o.selected && text ? ' ' + text : '');
    }
    function syncLangButtons(busy = false) {
      langSel.value = viewLangOf() || '';
      if (!busy) setLangProgress(null);
      langSel.classList.toggle('on', !!viewLangOf());
      langSel.disabled = busy;
    }
    syncLangButtons();
    langSel.onchange = () => {
      const t = tabs[active];
      if (t) t.lang = langSel.value || null;
      translatePreview();
      syncSpeakButton(); // its title says whether it reads the translation
    };

    /** The rendered document of the active tab (the article, or the HTML frame's body). */
    function previewRoot() {
      if (langEl.hidden) return null;
      const frame = body.querySelector(':scope > .html-frame');
      if (frame) return frame.contentDocument?.body || null;
      return body.querySelector(':scope > article');
    }

    function translatableNodes(root) {
      const skip = (el) => {
        for (; el && el !== root.parentElement; el = el.parentElement) {
          if (/^(CODE|PRE|SCRIPT|STYLE|TEXTAREA|KBD|SAMP)$/.test(el.tagName)) return true;
          if (el.getAttribute?.('translate') === 'no' || el.classList?.contains('notranslate')) return true;
          if (el === root) break;
        }
        return false;
      };
      const nodes = [];
      const walker = root.ownerDocument.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: (n) => (n.nodeValue.trim() && !skip(n.parentElement) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT),
      });
      for (let n; (n = walker.nextNode());) nodes.push(n);
      return nodes;
    }

    /** Puts the cached translation (or the original) into each node, keeping its outer whitespace. */
    function applyTranslations(nodes, lang) {
      for (const n of nodes) {
        const orig = trOriginals.get(n);
        const core = orig.trim();
        const tr = lang ? trCache.get(trKey(lang, core)) : null;
        const value = tr == null ? orig : orig.slice(0, orig.indexOf(core)) + tr + orig.slice(orig.indexOf(core) + core.length);
        if (n.nodeValue !== value) n.nodeValue = value;
      }
      findRefresh(); // the matches follow the text shown
    }

    async function translatePreview() {
      const seq = ++trSeq;
      const root = previewRoot();
      syncLangButtons();
      if (!root) return;
      const nodes = translatableNodes(root);
      for (const n of nodes) if (!trOriginals.has(n)) trOriginals.set(n, n.nodeValue);
      const lang = viewLangOf();
      applyTranslations(nodes, lang);
      langStatus.textContent = '';
      syncSpeakButton(); // the estimate follows the text (original, cached translation)
      if (!lang) return;
      const todo = [...new Set(nodes.map((n) => trOriginals.get(n).trim()))].filter((x) => !trCache.has(trKey(lang, x)));
      if (!todo.length) return;
      syncLangButtons(true);
      const progress = (done) => { if (seq === trSeq) { setLangProgress(`${done}/${todo.length}`); applyTranslations(nodes, lang); } };
      try {
        if (!(await translateInBrowser(todo, lang, root, progress))) await translateOnServer(todo, lang, progress);
        if (seq === trSeq) langStatus.textContent = '';
      } catch (e) {
        if (seq === trSeq) { langStatus.textContent = '⚠️ ' + e.message; langStatus.title = e.message; }
      } finally {
        if (seq === trSeq) { applyTranslations(nodes, lang); syncLangButtons(); syncSpeakButton(); }
      }
    }

    /** Resolves with `p`, or with `fallback` after `ms` (the built-in AI APIs can hang). */
    const within = (p, ms, fallback) => Promise.race([p, new Promise((ok) => setTimeout(() => ok(fallback), ms))]);

    /**
     * Chrome's on-device Translator; false when the browser has none (or not for this pair). Not in
     * the app: Electron declares Translator/LanguageDetector but can't run them (availability()
     * never settles, models can't be downloaded) — every call is time-limited in browsers too.
     */
    async function translateInBrowser(texts, lang, root, progress) {
      if (window.ninebits || typeof Translator === 'undefined' || typeof Translator.create !== 'function') return false;
      let src = 'en';
      if (typeof LanguageDetector !== 'undefined') {
        try {
          // Only an already installed detector: downloading one needs a fresh user gesture.
          if ((await within(LanguageDetector.availability(), 3000, 'timeout')) === 'available') {
            const detector = await within(LanguageDetector.create(), 5000, null);
            const found = detector && (await within(detector.detect(root.textContent.slice(0, 1000)), 5000, []))[0];
            if (found?.confidence > 0.5) src = found.detectedLanguage;
          }
        } catch {}
      }
      if (src === lang) { for (const x of texts) trCache.set(trKey(lang, x), x); return true; }
      const key = `${src}:${lang}`;
      if (!trBrowser.has(key)) {
        let tr = null;
        try {
          const opts = { sourceLanguage: src, targetLanguage: lang };
          const avail = await within(Translator.availability(opts), 4000, 'unavailable');
          if (avail !== 'unavailable') {
            tr = await within(Translator.create({ ...opts, monitor: (m) => m.addEventListener('downloadprogress', (e) => { setLangProgress(`${Math.round((e.loaded || 0) * 100)}%`); }) }), avail === 'available' ? 10000 : 120000, null);
          }
        } catch {}
        trBrowser.set(key, tr);
      }
      const tr = trBrowser.get(key);
      if (!tr) return false;
      let next = 0, done = 0;
      await Promise.all(Array.from({ length: 3 }, async () => {
        while (next < texts.length) {
          const x = texts[next++];
          try { trCache.set(trKey(lang, x), await within(tr.translate(x), 30000, x)); } catch {}
          if (++done % 8 === 0 || done === texts.length) progress(done);
        }
      }));
      return true;
    }

    /** Through claude on the server, a few batches at a time. */
    async function translateOnServer(texts, lang, progress) {
      const batches = [];
      let cur = [], chars = 0;
      for (const x of texts) {
        if (cur.length && (cur.length >= TR_BATCH_ITEMS || chars + x.length > TR_BATCH_CHARS)) { batches.push(cur); cur = []; chars = 0; }
        cur.push(x.slice(0, TR_BATCH_CHARS));
        chars += Math.min(x.length, TR_BATCH_CHARS);
      }
      if (cur.length) batches.push(cur);
      let next = 0, done = 0, failed = null;
      setLangProgress(`0/${texts.length}`);
      await Promise.all(Array.from({ length: 2 }, async () => {
        while (next < batches.length && !failed) {
          const batch = batches[next++];
          try {
            const d = await postJson('/api/translate', { texts: batch, target: lang });
            batch.forEach((x, i) => trCache.set(trKey(lang, x), String(d.texts[i] ?? x).trim() || x));
          } catch (e) { failed = e; }
          done += batch.length;
          progress(done);
        }
      }));
      if (failed) throw new Error(tl('Could not translate: {0}', failed.message));
    }

    // ---------- reading the preview aloud ----------
    // The text is taken from the rendered document, so it is read in the current translation;
    // phrase by phrase (blocks split into sentences, code blocks skipped), the block of the phrase
    // being read highlighted and scrolled to. While reading: pause / resume and a phrase back or on.
    const speakBtn = $('viewerSpeak');
    const readingBar = $('viewerReading'), pauseBtn = $('viewerPause');
    const prevIcon = () => svgIcon('<path d="M18 6L9 12l9 6z"/><path d="M6 6v12"/>');
    const nextIcon = () => svgIcon('<path d="M6 6l9 6-9 6z"/><path d="M18 6v12"/>');
    const pauseIcon = () => svgIcon('<path d="M9 6v12"/><path d="M15 6v12"/>');
    const playIcon = () => svgIcon('<path d="M8 5l11 7-11 7z"/>');
    // Built on use: svgIcon is declared further down.
    const speakIcon = () => svgIcon('<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>');
    const stopIcon = () => svgIcon('<rect x="7" y="7" width="10" height="10" rx="1.5"/>');
    const BLOCKS = 'h1,h2,h3,h4,h5,h6,p,li,blockquote,dt,dd,td,th,figcaption,caption';
    // spent: ms read so far without the paused time; since: when the current running stretch began.
    let reading = null; // { tab, phrases: [{ text, el }], index, paused, lit, spent, since }
    let readingClock = null;
    const fmtClock = (ms) => {
      const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, r = String(s % 60).padStart(2, '0');
      return h ? `${h}:${String(m).padStart(2, '0')}:${r}` : `${m}:${r}`;
    };
    const readingMs = () => (reading ? reading.spent + (reading.since ? Date.now() - reading.since : 0) : 0);
    function tickClock() {
      const el = pauseBtn.querySelector('.time');
      if (el) el.textContent = fmtClock(readingMs());
    }

    /**
     * About how long reading the preview takes, in ms: Silero reads ~15 Cyrillic and ~11 Latin
     * letters a second (English is transliterated, longer), a digit ~0.6 s (numbers become words),
     * plus a short gap per phrase; divided by the voice menu's rate. Fitted on Silero's Xenia.
     */
    let estimateMemo = { root: null, len: -1, ms: 0 };
    function estimateReading() {
      const root = previewRoot();
      if (!root) return 0;
      const len = root.textContent.length; // changes with the translation
      if (estimateMemo.root !== root || estimateMemo.len !== len) {
        const text = readableBlocks(root).map((b) => b.text).join(' ');
        const count = (re) => (text.match(re) || []).length;
        const phrases = count(/[.!?…]+(?=\s|$)/g) + 1;
        const sec = count(/[а-яё]/gi) / 15 + count(/[a-z]/gi) / 11 + count(/\d/g) * 0.6 + phrases * 0.2;
        estimateMemo = { root, len, ms: sec * 1000 };
      }
      return estimateMemo.ms / (voice.rate || 1);
    }

    function syncSpeakButton() {
      readingBar.hidden = !reading;
      clearInterval(readingClock);
      if (reading && !reading.paused) readingClock = setInterval(tickClock, 1000);
      if (reading) {
        $('viewerPrev').innerHTML = prevIcon();
        $('viewerNext').innerHTML = nextIcon();
        pauseBtn.innerHTML = (reading.paused ? playIcon() : pauseIcon()) + `<span class="time">${fmtClock(readingMs())}</span>`;
        pauseBtn.title = reading.paused ? tl('Resume') : tl('Pause');
        pauseBtn.classList.toggle('on', reading.paused);
        $('viewerPrev').disabled = reading.index <= 0;

    }

    /**
     * [{ el, text }] of the preview, without code blocks. A list item, quote or cell is one part

     */

    // ---------- hex view (any file size, like Midnight Commander's hex editor) ----------

    // { a } (new bytes) — so overwriting, inserting and deleting never need the file in memory.

    // through a temporary copy (/api/bytes/rewrite), which needs about the file's size free on disk
    // — checked when the view opens; without it inserting and deleting are off.

    const HEX_ROW = 16, HEX_RH = 18, HEX_BLOCK = 64 * 1024, HEX_BLOCKS_KEPT = 128;

    function readRange(t, start, count) {
