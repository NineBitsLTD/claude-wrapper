      if (item.chime !== undefined) {
        chime(item.chime);
        setTimeout(finish, 450);
        return;
      }
      if (useHost()) return speakHost(item, finish);
      if (!item.audio && useSilero()) prefetch(item);
      if (item.audio) {
        prefetch(queue.find((q) => q.chime === undefined)); // the next phrase is synthesized while this one plays
        item.audio.then((blob) => {
          if (current !== item) return;
          if (!blob) return finish(); // nothing to say (only code or symbols)
          const url = URL.createObjectURL(blob);
          const a = (playing = new Audio(url));
          a.preservesPitch = true;
          a.playbackRate = rate;
          const done = () => { URL.revokeObjectURL(url); if (playing === a) playing = null; finish(); };
          a.onended = done;
          a.onerror = done;
          if (item.cat === 'doc' && docPaused) return; // resumeReading() starts it
          a.play().catch((e) => {
            if (e.name === 'NotAllowedError') { blockedNote = tl('The browser blocked sound: click the page'); render(); }
            done();
          });
        }, (e) => {
          if (current !== item || e.name === 'AbortError') return;
          // Service down: the system voice takes over for a while, then Silero is tried again.
          sileroDownUntil = Date.now() + SILERO_RETRY_MS;
          sileroError = e.message;
          queue.forEach((q) => { q.ctrl?.abort(); delete q.audio; });
          renderMenu();
          speakSystem(item, finish);
        });
        return;
      }
      speakSystem(item, finish);
    }

    /**
     * A phrase spoken by TTS / STT MD Aloud (the next one is prepared meanwhile). If it fails, this
     * phrase is spoken by the system voice here and the menu shows why.
     */
    function speakHost(item, finish) {
      const id = ++hostSeq;
      item.hostId = id;
      hostWaits.set(id, (m) => {
        if (current !== item) return;
        if (m.error) {
          hostError = m.error;
          renderMenu();
          return speakSystem(item, finish);
        }
        if (hostError) { hostError = ''; renderMenu(); }
        finish();
      });
      const next = queue.find((q) => q.chime === undefined && q.text);
      toHost({ type: 'tts', op: 'speak', id, text: item.text, lang: langOf(item.text), next: next ? { text: next.text, lang: langOf(next.text) } : undefined });
    }

    function speakSystem(item, finish) {
      if (!supported) return finish();
      const u = new SpeechSynthesisUtterance(item.text);
      const v = voiceFor(item.text);
      u.lang = v?.lang || LOCALE;
      if (v) u.voice = v;
      u.rate = rate;
      u.onend = finish;
      u.onerror = (e) => {
        if (e.error === 'not-allowed') { blockedNote = tl('The browser blocked sound: click the page'); render(); }
        finish();
      };
      speechSynthesis.speak(u);
      if (item.cat === 'doc' && docPaused) speechSynthesis.pause();
    }

    /** Starts synthesizing `item` on the Silero service; item.audio resolves to a WAV blob or null. */
    function prefetch(item) {
      if (!item || item.audio || item.chime !== undefined || !useSilero()) return;
      item.ctrl = new AbortController();
      item.audio = fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: item.text, speaker }),
        signal: item.ctrl.signal,
      }).then(async (r) => {
        if (r.status === 204) return null;
        if (!r.ok) throw new Error(tlMsg((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`));
        return r.blob();
      });
      item.audio.catch(() => {}); // handled when the item is played
    }

    function cancelCurrent() {
      if (!current) return;
      const item = current;
      current = null; // its onend/onerror are ignored now
      hearing.speaking(null);
      item.ctrl?.abort();
      if (item.hostId && hostWaits.delete(item.hostId)) toHost({ type: 'tts', op: 'stop' });
      if (playing) { playing.pause(); playing = null; }
      if (supported) speechSynthesis.cancel();
      item.onDone?.('interrupted');
    }

    function drop(pred) {
      for (let i = queue.length - 1; i >= 0; i--) {
        if (!pred(queue[i])) continue;
        const [item] = queue.splice(i, 1);
        item.ctrl?.abort();
        item.onDone?.('interrupted');
      }
    }

    function enqueue(items) {
      if (!items.length) return;
      queue.push(...items);
      pump();
    }

    function stopAll() {
      drop(() => true);
      cancelCurrent();
      pump();
    }

    /** Two short tones (rising — done, falling — error) via Web Audio; no audio files needed. */
    let audioCtx = null;
    function chime(failed) {
      try {
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = failed ? [660, 440] : [660, 880];
        notes.forEach((freq, i) => {
          const t = audioCtx.currentTime + i * 0.16;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.32);
        });
      } catch {
        // No Web Audio — the spoken phrase is enough.
      }
    }

    // --- texts ---
    /** Markdown answer -> plain speech: code blocks are named, not read; markup is dropped. */
    function speakable(md, rest = ' ' + tl('The rest is in the answer text.')) {
      let t = md
        .replace(/```[\s\S]*?(```|$)/g, ` (${tl('code fragment')}) `)
        .replace(/`([^`]+)`/g, '$1')
        .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
        .replace(/https?:\/\/\S+/g, tl('link'))
        // Paths: only the last name is worth hearing ("/Users/me/project/src" -> "src").
        // Segments must contain a letter, so dates like 29/09/2026 are left alone.
        .replace(/(?:~|\.{1,2})?\/?(?:[\w.@-]*[A-Za-z_][\w.@-]*\/){2,}[\w.@-]*/g, (m) => m.split('/').filter(Boolean).pop() || m)
        .replace(/^\s*\|?[\s:|-]+\|[\s:|-]*$/gm, '') // table separator rows
        .replace(/\|/g, ', ')
        .replace(/^\s{0,3}(#{1,6}|>|[-*+]|\d+[.)])\s+/gm, '')
        .replace(/[*_~]{1,3}([^*_~\n]+)[*_~]{1,3}/g, '$1')
        .replace(/\s+/g, ' ')
        .trim();
      if (answerMaxChars && t.length > answerMaxChars) {
        const cut = t.slice(0, answerMaxChars);
        const end = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('! '), cut.lastIndexOf('? '));
        t = (end > 200 ? cut.slice(0, end + 1) : cut) + rest;
      }
      return t;
    }

    /** Splits into sentence-sized chunks (Chrome stops long utterances midway). */
    function chunks(text) {
      const out = [];
      let buf = '';
      for (const part of text.match(/[^.!?…]+[.!?…]*\s*/g) || [text]) {
        if (buf && (buf + part).length > CHUNK_CHARS) { out.push(buf.trim()); buf = ''; }
        buf += part;
      }
      if (buf.trim()) out.push(buf.trim());
      return out;
    }

    const baseName = (p) => String(p || '').split('/').pop();
    /**
     * The project's name in spoken phrases, so that it is clear which window speaks: its folder's
     * name, dashes and underscores read as spaces; '' without a project (the phrases then go without it).
     */
    const projectName = () => baseName(String(cwd || '').replace(/\/+$/, '')).replace(/[-_]+/g, ' ').trim();
    /** tl(withProject, name, ...args) when there is a project, else tl(without, ...args). */
    const inProject = (withProject, without, ...args) => {
      const name = projectName();
      return name ? tl(withProject, name, ...args) : tl(without, ...args);
    };

    /** Short spoken description of what Claude wants to do (permission prompt). */
    function describe(ev) {
      const input = ev.input || {};
      let what;
      if (ev.tool_name === 'Bash') {
        const cmd = String(input.command || '').trim().split(/\s+/)[0] || '';
        what = tl('run the command {0}', cmd) + (input.description ? `. ${input.description}` : '');
      } else if (/^(Edit|Write|NotebookEdit)$/.test(ev.tool_name)) {
        what = tl('change the file {0}', baseName(input.file_path || input.notebook_path));
      } else if (ev.tool_name === 'AskUserQuestion') {
        const qs = input.questions || [];
        return (inProject('Question on the project {0}:', 'Claude is asking a question.') + ' ' + qs.map((q) =>
          `${q.question} ${tl('Options: {0}.', (q.options || []).map((o) => o.label).join(', '))}`).join(' ')).slice(0, 400) +
          // No command words in the phrase: with a misdetected output device its echo must not
          // submit or skip the form (at most it adds text to a field, which stays visible).
          (hearing.active ? ' ' + tl('Dictate the answer.') : '');
      } else if (ev.tool_name === 'WebFetch') {
        let host = '';
        try { host = new URL(input.url).hostname; } catch {}
        what = tl('open the site {0}', host);
      } else {
        what = tl('use the tool {0}', ev.tool_name.replace(/^mcp__/, '').replace(/__/g, ' '));
      }
      // No "разреш…" / "запрещ…" / "allow" / "deny" in anything spoken while the microphone listens
      // for the answer: it must not take the page's own words for one ("confirm" then).
      return (hearing.active
        ? inProject('Confirm in the project {0}: {1}', 'Your confirmation is needed: {0}', what)
        : inProject('Allow in the project {0}: {1}', 'Your confirmation is needed: {0}', what)).slice(0, 200);
    }

    /** Short spoken description of a tool call that is starting. */
    function describeTool(b) {
      const input = b.input || {};
      switch (b.name) {
        case 'Bash': return tl('Running the command {0}', String(input.command || '').trim().split(/\s+/)[0] || '');
        case 'Read': return tl('Reading the file {0}', baseName(input.file_path));
        case 'Edit': case 'Write': case 'NotebookEdit': return tl('Changing the file {0}', baseName(input.file_path || input.notebook_path));
        case 'Grep': case 'Glob': return tl('Searching the files');
        case 'WebSearch': return tl('Searching the web');
        case 'WebFetch': {
          let host = '';
          try { host = new URL(input.url).hostname; } catch {}
          return tl('Opening the site {0}', host);
        }
        case 'Agent': case 'Task': return tl('Starting a subagent') + (input.description ? `: ${input.description}` : '');
        default: return tl('Using the tool {0}', b.name.replace(/^mcp__/, '').replace(/__/g, ' '));
      }
    }

    // --- menu ---
    function render() {
      const any = Object.values(cats).some(Boolean);
      const hostOff = useHost() && !host.enabled;
      const on = supported && enabled && any && !hostOff;
      btn.innerHTML = on ? ICONS.speaker : ICONS.speakerOff;
      btn.classList.toggle('off', !on);
      btn.title = !supported ? tl('The browser doesn’t support speech synthesis') : hostOff ? tl('Speech is turned off in TTS / STT MD Aloud') : blockedNote || tl('Voice settings');
    }

    function renderMenu() {
      render();
      if (menu.hidden) return;
      menu.innerHTML = '';
      const row = (label, checked, onChange, { disabled = false, strong = false } = {}) => {
        const l = document.createElement('label');
        l.className = 'menu-row' + (strong ? ' strong' : '') + (disabled ? ' disabled' : '');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = checked;
        cb.disabled = disabled;
        cb.onchange = () => onChange(cb.checked);
        l.append(cb, ' ' + label);
        menu.appendChild(l);
      };
      if (!supported) {
        menu.textContent = tl('The browser doesn’t support speech synthesis');
        return;
      }
      row(tl('Speech'), enabled, (v) => {
        enabled = v;
        store.set('claude.voice', v ? 'on' : 'off');
        if (!v) stopAll();
        renderMenu();
      }, { strong: true });
      const hostSettings = () => {
        const b = Object.assign(document.createElement('button'), { type: 'button', className: 'menu-row', textContent: tl('Voice, speed and volume…'), title: tl('The settings of TTS / STT MD Aloud') });
        b.onclick = (e) => { e.stopPropagation(); toggleMenu(false); toHost({ type: 'tts', op: 'settings' }); };
        menu.appendChild(b);
      };
      if (useHost() && !host.enabled) {
        menu.appendChild(Object.assign(document.createElement('div'), { className: 'menu-note', textContent: tl('Speech is turned off in TTS / STT MD Aloud') }));
        hostSettings();
      }
      for (const [cat, label] of Object.entries(CATS)) {
        row(label, cats[cat], (v) => {
          cats[cat] = v;
          store.set('claude.voiceCats', JSON.stringify(cats));
          if (!v) { drop((q) => q.cat === cat); if (current?.cat === cat) { cancelCurrent(); } }
          pump();
        }, { disabled: !enabled });
      }
      {
        // Length of spoken answers.
        const l = document.createElement('label');
        l.className = 'menu-row menu-select' + (enabled && cats.answers ? '' : ' disabled');
        const sel = document.createElement('select');
        for (const [v, t] of ANSWER_LIMITS) sel.add(new Option(t, String(v)));
        sel.value = String(answerMaxChars);
        sel.disabled = !enabled || !cats.answers;
        sel.onchange = () => { answerMaxChars = Number(sel.value); store.set('claude.voiceAnswerMax', sel.value); };
        l.append(tl('Read the answer'), sel);
        menu.appendChild(l);
      }
      if (useHost()) {
        // The voice, its speed and volume are TTS / STT MD Aloud's.
        const DRIVERS = { system: tl('system voices'), piper: 'Piper', silero: 'Silero' };
        const driver = String(host.driver || 'system');
        menu.appendChild(Object.assign(document.createElement('div'), { className: 'menu-section', textContent: tl('Voice') }));
        menu.appendChild(Object.assign(document.createElement('div'), { className: 'menu-note', textContent: tl('TTS / STT MD Aloud speaks: {0}', DRIVERS[driver] || driver.replace(/^external:/, '')) }));
        if (host.enabled) hostSettings();
        const test = Object.assign(document.createElement('button'), { type: 'button', className: 'menu-row', textContent: tl('▶ Test the voice'), disabled: !enabled || !host.enabled });
        test.onclick = (e) => { e.stopPropagation(); enqueue([{ cat: 'test', text: inProject('Allow in the project {0}: {1}', 'Your confirmation is needed: {0}', tl('run the command {0}', 'npm install')) + '. ' + tl('Version 2.1, port 3443.') + ' The build finished successfully.' }]); };
        menu.appendChild(test);
        if (hostError) menu.appendChild(Object.assign(document.createElement('div'), { className: 'menu-note', textContent: '⚠️ ' + tl('TTS / STT MD Aloud: {0} — the system voice speaks for now', hostError) }));
        return;
      }
      if (EMBED) menu.appendChild(Object.assign(document.createElement('div'), { className: 'menu-note', textContent: tl('More voices (Piper, Silero): the TTS / STT MD Aloud extension') }));
      {
        // Speech rate (both voices); double-click resets to normal.
        const l = document.createElement('label');
        l.className = 'menu-row menu-select' + (enabled ? '' : ' disabled');
        l.title = tl('Speech rate: Silero changes right away, the system voice from the next phrase. Double-click — normal speed');
        const inp = Object.assign(document.createElement('input'), { type: 'range', min: String(RATE_MIN), max: String(RATE_MAX), step: '0.1', value: String(rate), disabled: !enabled });
        inp.className = 'rate';
        const val = Object.assign(document.createElement('span'), { className: 'rate-val' });
        const show = () => { val.textContent = rate.toLocaleString(LOCALE, { minimumFractionDigits: 1 }) + '×'; };
        inp.oninput = () => { setRate(inp.value); show(); };
        inp.ondblclick = () => { setRate(1); inp.value = '1'; show(); };
        show();
        const box = Object.assign(document.createElement('span'), { className: 'rate-box' });
        box.append(inp, val);
        l.append(tl('Speech rate'), box);
        menu.appendChild(l);
      }
      if (!sileroAvailable) return;

      const select = (label, value, options, onChange) => {
        const l = document.createElement('label');
        l.className = 'menu-row menu-select' + (enabled ? '' : ' disabled');
        const sel = document.createElement('select');
        for (const [v, t] of options) sel.add(new Option(t, v));
        sel.value = value;
        sel.disabled = !enabled;
        sel.onchange = () => onChange(sel.value);
        l.append(label, sel);
        menu.appendChild(l);
      };
      menu.appendChild(Object.assign(document.createElement('div'), { className: 'menu-section', textContent: tl('Voice') }));
      select(tl('Engine'), engine, [['silero', 'Silero'], ['system', tl('System')]], (v) => {
        engine = v;
        store.set('claude.voiceEngine', v);
        sileroDownUntil = 0;
        renderMenu();
      });
      if (engine === 'silero') {
        select(tl('Speaker'), speaker, SILERO_SPEAKERS, (v) => {
          speaker = v;
          store.set('claude.voiceSpeaker', v);
          queue.forEach((q) => { q.ctrl?.abort(); delete q.audio; }); // queued phrases: in the new voice
        });
      }
      const test = document.createElement('button');
      test.type = 'button';
      test.className = 'menu-row';
      test.disabled = !enabled;
      test.textContent = tl('▶ Test the voice');
      // stopPropagation: re-rendering detaches the button, and the outside-click handler would close the menu.
      test.onclick = (e) => { e.stopPropagation(); playTest(); };
      const playTest = () => enqueue([{ cat: 'test', text: inProject('Allow in the project {0}: {1}', 'Your confirmation is needed: {0}', tl('run the command {0}', 'npm install')) + '. ' + tl('Version 2.1, port 3443.') + ' The build finished successfully.' }]);
      menu.appendChild(test);
      if (engine === 'silero' && Date.now() < sileroDownUntil) {
        menu.appendChild(Object.assign(document.createElement('div'), {
          className: 'menu-note',
          textContent: '⚠️ ' + tl('Silero is unavailable ({0}); the system voice speaks for now, retrying in a minute', sileroError),
        }));
      }
    }

    function toggleMenu(open = menu.hidden) {
      menu.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
      if (open) {
        // Clicking the speaker counts as a user gesture: unlock audio for later alerts.
        blockedNote = '';
        try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
      }
      renderMenu();
    }
    btn.onclick = (e) => { e.stopPropagation(); hearing.closeMenu(); toggleMenu(); };
    document.addEventListener('click', (e) => {
      if (!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) toggleMenu(false);
    });

    if (supported) {
      pickVoices();
      speechSynthesis.addEventListener?.('voiceschanged', pickVoices);
    }
    render();

    function resolved(id) {
      hearing.stop(id);
      for (const t of reminders.get(id) || []) clearTimeout(t);
      reminders.delete(id);
      drop((q) => q.permId === id);
      if (current?.permId === id) cancelCurrent();
      pump();
    }

    return {
      get menuOpen() { return !menu.hidden; },
      refreshMenu: renderMenu,
      /** The server offers the Silero voice (from /api/info). */
      setSilero(available) { sileroAvailable = !!available; renderMenu(); },
      /** In VS Code: whether TTS / STT MD Aloud speaks, and its settings ({ available, enabled, driver }). */
      setHost(info) {
        const had = useHost();
        host = info || null;
        // It went away mid-phrase: that phrase is over, the next ones in the system voice.
        if (had && !useHost() && current?.hostId) { cancelCurrent(); pump(); }
        if (useHost() && !host.enabled) stopAll();
        renderMenu();
      },
      /** TTS / STT MD Aloud's answer for a phrase: { id, done } or { id, error }. */
      hostDone(m) {
        const handle = hostWaits.get(m.id);
        if (!handle) return;
        hostWaits.delete(m.id);
        handle(m);
      },
      /**
       * Reads a document aloud (the file viewer's button), part by part, whatever the chat voice
       * switches say: it was asked for explicitly. onStart(i) / onEnd(finished) report progress.
       */
      read(parts, { onStart, onEnd } = {}) {
        docPaused = false;
        drop((q) => q.cat === 'doc');
        if (current?.cat === 'doc') cancelCurrent();
        const last = parts.length - 1;
        enqueue(parts.map((text, i) => ({
          cat: 'doc', text,
          onStart: () => onStart?.(i),
          onDone: (how) => { if (how !== 'spoken' || i === last) onEnd?.(how === 'spoken'); },
        })));
      },
      /** The speech rate of the voice menu (1 = normal), for estimates. */
      get rate() { return rate; },
      /** Holds the document's phrase where it is (a phrase still being synthesized waits too). */
      pauseReading() {
        docPaused = true;
        if (current?.cat !== 'doc') return;
        if (playing) playing.pause();
        else if (supported && speechSynthesis.speaking) speechSynthesis.pause();
      },
      resumeReading() {
        docPaused = false;
        if (current?.cat !== 'doc') return;
        if (playing) playing.play().catch(() => {});
        else if (supported) speechSynthesis.resume();
      },
      stopReading() {
        docPaused = false;
        drop((q) => q.cat === 'doc');
        if (current?.cat === 'doc') cancelCurrent();
        pump();
      },
      /** Speaks a phrase of category `cat`; `onDone('spoken' | 'skipped' | 'interrupted')`. */
      speak(cat, text, onDone) {
        if (!on(cat)) return setTimeout(() => onDone?.('skipped'), 0);
        enqueue([{ cat, text, onDone }]);
      },
      closeMenu() { toggleMenu(false); },
      /**
       * Announces a prompt after whatever is already queued. Voice answers to it are listened for
       * from the start of the announcement (hearing.arm), or at once if it isn't spoken.
       */
      permission(ev) {
        const arm = () => hearing.arm(ev.id);
        if (!on('permissions')) return arm();
        const text = describe(ev) + (hearing.active && ev.tool_name !== 'AskUserQuestion' ? '. ' + tl('Answer by voice or with a button') : '');
        // onDone: dropped or interrupted before it started (e.g. "Stop speech") — listen anyway.
        enqueue([{ cat: 'permissions', permId: ev.id, text, onStart: arm, onDone: arm }]);
        reminders.set(ev.id, REMIND_AFTER_MS.map((ms) => setTimeout(() => {
          if (on('permissions') && !queue.some((q) => q.permId === ev.id)) {
            enqueue([{ cat: 'permissions', permId: ev.id, text: inProject('Claude is still waiting for your answer on the project {0}', 'Claude is still waiting for your answer') }]);
          }
        }, ms)));
      },
      /** Short spoken confirmation of a voice decision. */
      confirm(text) { if (on('permissions')) enqueue([{ cat: 'permissions', text }]); },
      /** A finished text block of Claude's answer. */
      answer(md) {
        if (!on('answers')) return;
        const text = speakable(md);
        if (text) enqueue(chunks(inProject('Regarding the project {0}: {1}', '{0}', text)).map((t) => ({ cat: 'answers', text: t })));
      },
      /** Whether a category is read aloud now (voice on, its switch on). */
      speaks: on,
      /** A finished thinking block (its summary), read before the answer that follows it. */
      thinking(md) {
        if (!on('thinking')) return;
        const text = speakable(md, ' ' + tl('The rest is in the thinking block.'));
        if (text) enqueue(chunks(inProject('Regarding the project {0}, I think: {1}', 'Thinking — {0}', text)).map((c) => ({ cat: 'thinking', text: c })));
      },
      /** A tool call of the main agent is starting; only the latest pending one is kept. */
      tool(block) {
        if (!on('tools')) return;
        drop((q) => q.cat === 'tools');
        enqueue([{ cat: 'tools', text: inProject('In the project {0}: {1}', '{0}', describeTool(block)) }]);
      },
      /** End of a run: a chime and a phrase ("all tasks done" or "finished with an error"). */
      finished({ failed }) {
        if (!on('done')) return;
        enqueue([
          { cat: 'done', chime: failed },
          { cat: 'done', text: failed
            ? inProject('Work on the project {0} ended with an error', 'Claude finished with an error')
            : inProject('All the tasks on the project {0} are complete', 'Done, all the tasks are complete') },
        ]);
      },
      resolved,
      /** Run ended: prompts are gone; queued answers and the end-of-work phrase still play. */
      clear() { for (const id of [...reminders.keys()]) resolved(id); hearing.clear(); },
      stopAll,
    };
  })();

  /**
   * Voice dictation (headphones only — through speakers the microphone would hear the page).
   * Recognized phrases are appended to the message box; the message is sent after a pause in
   * speech or on the word "send" («отправить»). Before sending it is read back (category "Messages
   * being sent") and there are a few seconds to say "cancel" / "stop" or press "Cancel"; the text
   * then stays in the box. "clear" / "erase" clears the box. Clicking or typing into the box
   * while a message waits for auto-send cancels it: the message then goes only by the "Send"
   * button (or the spoken "send") until it is sent or the box is emptied; Russian and English words both work.
   */
  const dictation = (() => {
    const bar = $('dictBar');
    const txt = bar.querySelector('.txt');
    const cancelBtn = $('dictCancel');
    // Silence before auto-send in "pause" mode, seconds; set in the microphone menu.
    const PAUSE_DEFAULT_S = 1.6;
    const PAUSE_MIN_S = 0.5;
    const PAUSE_MAX_S = 30;
    const clampPause = (v) => {
      const n = Number(String(v ?? '').replace(',', '.'));
      if (!Number.isFinite(n) || n <= 0) return PAUSE_DEFAULT_S;
      return Math.round(Math.min(PAUSE_MAX_S, Math.max(PAUSE_MIN_S, n)) * 10) / 10;
    };
    let pauseS = clampPause(store.get('claude.dictationPause'));
    const CANCEL_MS = 2500;
    const CANCEL = /^(отмена|отмени(ть)?|стоп|не отправляй|не надо|cancel|stop|don'?t send|do not send|never ?mind)$/;
    const CLEAR = /^(очисти(ть)?|сотри|стереть|clear( it)?|erase( it)?)$/;
    // «отправить» / «отправь» / "send (it)" at the end of a phrase, but not «не отправляй» / "don't send".
    const SEND_WORD = /(^|\s)(отправ(ить|ь)|send( it)?)$/;
    const NEGATED = /(^|\s)(не\s+отправ|don'?t\s+send|do\s+not\s+send)/;
    let enabled = store.get('claude.dictation') !== 'off';
    let sendMode = store.get('claude.dictationSend') || 'pause'; // pause | word
    let isListening = false;
    let pauseTimer = null;
    let pending = null; // read-back / cancel window of a message about to be sent
    let held = false; // the user took over the box: no auto-send until it is sent or emptied

    const norm = (t) => t.toLowerCase().replace(/ё/g, 'е').replace(/[.,!?…]/g, '').trim();

    function show(text, cls = '') {
      bar.hidden = !text;
      bar.className = cls;
      txt.textContent = text;
      cancelBtn.hidden = cls !== 'confirm';
    }

    function idle() {
      if (pending) return;
      if (!isListening) return show('');
      show(held ? tl('🎧 Listening: auto-send is cancelled — press “Send”')
        : sendMode === 'word' ? tl('🎧 Listening: dictate the message and say “send”') : tl('🎧 Listening: dictate the message'), 'live');
    }

    /** The user clicked or typed into the message box: drop a scheduled or announced auto-send. */
    function hold() {
      if (held || !promptEl.value.trim()) return;
      const waiting = pauseTimer !== null || pending;
      clearTimeout(pauseTimer);
      pauseTimer = null;
      held = true;
      if (pending) cancel(tl('Auto-send cancelled'));
      else if (waiting) show(tl('🎧 Auto-send cancelled — press “Send”'), 'live');
    }
    const userHold = (e) => { if (e.isTrusted) hold(); };
    promptEl.addEventListener('pointerdown', userHold);
    promptEl.addEventListener('keydown', userHold);
    promptEl.addEventListener('input', () => { if (!promptEl.value.trim()) held = false; });
    form.addEventListener('submit', () => { held = false; });

    function append(text) {
      const v = promptEl.value;
      promptEl.value = v + (v && !/\s$/.test(v) ? ' ' : '') + text;
      promptEl.dispatchEvent(new Event('input'));
    }

    /** A phrase from the recognizer while no permission prompt is waiting. */
    function heard(text, final) {
      const n = norm(text);
      if (pending) {
        // While a message is about to go out, only a cancel matters.
        if (final && CANCEL.test(n)) cancel(tl('Cancelled by voice'));
        return;
      }
      if (!final) {
        clearTimeout(pauseTimer); // still speaking
        pauseTimer = null;
        return show(`🎧 «${text}»`, 'live');
      }
      if (CLEAR.test(n)) {
        promptEl.value = '';
        promptEl.dispatchEvent(new Event('input'));
        return show(tl('🎧 The input box is cleared'), 'live');
      }
      if (CANCEL.test(n)) return idle(); // nothing to cancel
      const sendNow = SEND_WORD.test(n) && !NEGATED.test(n);
      const body = sendNow ? text.replace(/[\s,.]*(отправ(ить|ь)|send( it)?)[\s.!]*$/i, '').trim() : text;
      if (body) append(body);
      if (sendNow || (sendMode === 'pause' && !held)) {
        clearTimeout(pauseTimer);
        pauseTimer = setTimeout(beginSend, sendNow ? 0 : pauseS * 1000);
      }
      const hint = held && !sendNow ? tl('press “Send”')
        : sendMode === 'word' && !sendNow ? tl('say “send”') : tl('I’ll send after a pause');
      show(`🎧 ${hint}: «${promptEl.value.trim().slice(-120)}»`, 'live');
    }

    function beginSend() {
      pauseTimer = null;
      const text = promptEl.value.trim();
      if (!text || pending) return;
      const p = (pending = { cancelled: false, timer: null });
      show(tl('Sending: “{0}”', text), 'confirm');
      voice.speak('sent', tl('Sending: {0}', text), (result) => {
        if (p.cancelled) return;
        if (result === 'interrupted') return cancel(tl('Not sent: a permission request interrupted the speech'));
        show(tl('Sending in {0} s — say “cancel”: “{1}”', (CANCEL_MS / 1000).toLocaleString(LOCALE), text), 'confirm');
        p.timer = setTimeout(() => {
          if (p.cancelled) return;
          pending = null;
          if (promptEl.value.trim()) form.requestSubmit();
          idle();
        }, CANCEL_MS);
      });
    }

    function cancel(msg) {
      if (!pending) return;
      pending.cancelled = true;
      clearTimeout(pending.timer);
      pending = null;
      show(tl('{0} — the text stayed in the input box', msg));
      setTimeout(idle, 2500);
    }
    cancelBtn.onclick = () => cancel(tl('Cancelled'));

    return {
      get enabled() { return enabled; },
      setEnabled(v) {
        enabled = v;
        store.set('claude.dictation', v ? 'on' : 'off');
        hearing.update();
        idle();
      },
      get sendMode() { return sendMode; },
      get pauseMs() { return pauseS * 1000; },
      get pauseSeconds() { return pauseS; },
      pauseLimits: { min: PAUSE_MIN_S, max: PAUSE_MAX_S },
      /** Sets the silence before auto-send (seconds, clamped); returns the value actually used. */
      setPauseSeconds(v) {
        pauseS = clampPause(v);
        store.set('claude.dictationPause', String(pauseS));
        return pauseS;
      },
      setSendMode(v) {
        sendMode = v;
        store.set('claude.dictationSend', v);
        idle();
      },
      heard,
      /** The recognizer started or stopped (paused while the page speaks). */
      listening(on) {
        isListening = on && audioOut.isHeadphones() && enabled;
        idle();
      },
    };
  })();

  // tool_use ids the user denied in this page (button or voice): the CLI reports those as
  // "permission-rule", which would read as if a settings rule had blocked them.
  const deniedByUser = new Set();

  /**
   * An MCP server asks for input (elicitation): a form built from its JSON schema (strings, numbers,
   * yes/no, choices and multiple choices), or in mode "url" a page to open. The answer goes back as
   * accept + the values, decline or cancel (/api/elicitation).
   */
  function showElicitation(ev) {
    const card = el('div', 'perm elicit');
    card.id = 'elicit-' + ev.id;
    const url = ev.mode === 'url';
    card.append(node('div', 'title', ev.title || (url ? tl('MCP server “{0}” asks to open a page', ev.server) : tl('MCP server “{0}” asks for data', ev.server))));
    if (ev.description) card.append(node('div', 'perm-reason', ev.description));
    if (ev.message) card.append(node('div', 'elicit-msg', ev.message));
    const schema = ev.schema || {};
    const props = schema.properties || {};
    const required = new Set(schema.required || []);
    const fields = [];
    if (url) {
      const open = node('button', 'btn', tl('Open the page'));
      open.type = 'button';
      open.onclick = () => window.open(ev.url, '_blank');
      card.append(node('div', 'perm-reason', ev.url || ''), open);
    } else {
      for (const key of ev.order?.length ? ev.order : Object.keys(props)) {
        const p = props[key];
        if (!p) continue;
        const f = node('label', 'elicit-field');
        f.append(node('span', 'elicit-label', (p.title || key) + (required.has(key) ? ' *' : '')));
        const choices = p.enum || (Array.isArray(p.oneOf) ? p.oneOf.map((o) => o.const) : null);
        const names = p.enumNames || (Array.isArray(p.oneOf) ? p.oneOf.map((o) => o.title || o.const) : null);
        let get;
        if (p.type === 'array' && (p.items?.enum || p.items?.anyOf)) {
          const opts = p.items.enum || p.items.anyOf.map((o) => o.const);
          const box = node('div', 'elicit-multi');
          const cbs = opts.map((o, i) => {
            const l = node('label');
            const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: (p.default || []).includes(o) });
            l.append(cb, ' ' + (p.items.anyOf?.[i]?.title || o));
            box.append(l);
            return [o, cb];
          });
          f.append(box);
          get = () => cbs.filter(([, cb]) => cb.checked).map(([o]) => o);
        } else if (choices) {
          const sel = document.createElement('select');
          if (!required.has(key)) sel.add(new Option('—', ''));
          choices.forEach((c, i) => sel.add(new Option(names?.[i] ?? String(c), String(c))));
          if (p.default != null) sel.value = String(p.default);
          f.append(sel);
          get = () => (sel.value === '' ? undefined : choices.find((c) => String(c) === sel.value));
        } else if (p.type === 'boolean') {
          const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: !!p.default });
          f.classList.add('inline');
          f.prepend(cb);
          get = () => cb.checked;
        } else {
          const num = p.type === 'number' || p.type === 'integer';
          const TYPES = { email: 'email', uri: 'url', date: 'date', 'date-time': 'datetime-local' };
          const inp = Object.assign(document.createElement('input'), { type: num ? 'number' : TYPES[p.format] || 'text' });
          if (p.default != null) inp.value = p.default;
          if (num) { if (p.minimum != null) inp.min = p.minimum; if (p.maximum != null) inp.max = p.maximum; inp.step = p.type === 'integer' ? '1' : 'any'; }
          if (p.maxLength) inp.maxLength = p.maxLength;
          inp.onkeydown = (e) => e.stopPropagation();
          f.append(inp);
          get = () => (inp.value === '' ? undefined : num ? Number(inp.value) : inp.value);
        }
        if (p.description) f.append(node('span', 'elicit-hint', p.description));
        card.append(f);
        fields.push([key, get]);
      }
    }
    const actions = node('div', 'actions');
    const mk = (label, cls, fn) => { const b = node('button', 'btn ' + cls, label); b.type = 'button'; b.onclick = fn; actions.append(b); };
    const answer = (action, content) => {
      card.querySelectorAll('button, input, select').forEach((x) => (x.disabled = true));
      postJson('/api/elicitation', { runId, id: ev.id, action, content }).catch((e) => el('div', 'error', tl('Could not send the answer: {0}', e.message)));
    };
    mk(url ? tl('Done') : tl('Send'), 'allow', () => {
      if (url) return answer('accept');
      const content = {};
      for (const [key, get] of fields) { const v = get(); if (v !== undefined) content[key] = v; }
      const missing = [...required].filter((k) => content[k] === undefined || content[k] === '');
      if (missing.length) return alertInline(card, tl('Fill in: {0}', missing.map((k) => props[k]?.title || k).join(', ')));
      answer('accept', content);
    });
    mk(tl('Deny'), '', () => answer('decline'));
    mk(tl('Cancel'), '', () => answer('cancel'));
    card.append(actions);
    revealEnd(card, { urgent: true });
    try { new Notification(tl('MCP server “{0}” asks for data', ev.server), { body: ev.message || '' }); } catch {}
  }

  const RULE_PLACES = { session: tl('in this session'), localSettings: tl('in this project'), projectSettings: tl('in the project (for everyone)'), userSettings: tl('in all projects') };

  /** A permission_suggestions entry as a button label: "Always allow Bash(npm test:*) in this project". */
  function suggestionLabel(sug) {
    const place = RULE_PLACES[sug.destination] ? ' ' + RULE_PLACES[sug.destination] : '';
    if (sug.type === 'addRules' && sug.behavior === 'allow' && sug.rules?.length) {
      return tl('Always allow {0}', sug.rules.map((r) => (r.ruleContent ? `${r.toolName}(${r.ruleContent})` : r.toolName)).join(', ')) + place;
    }
    if (sug.type === 'setMode' && sug.mode) return tl('Allow and switch to the {0} mode', sug.mode) + place;
    if (sug.type === 'addDirectories' && sug.directories?.length) return tl('Allow access to {0}', sug.directories.map(shortPath).join(', ')) + place;
    return '';
  }

  function answerPermission(card, id, allow, extra = {}) {
    voice.resolved(id);
    card.querySelectorAll('button, input').forEach((b) => (b.disabled = true));
    fetch('/api/permission', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ runId, id, allow, ...extra }),
    }).catch((e) => el('div', 'error', tl('Could not send the answer: {0}', e.message)));
  }

  /**
   * Claude's clarifying questions (AskUserQuestion) arrive as permission requests (can_use_tool). They
   * get a form instead of Allow/Deny: options as radio buttons (single choice) or checkboxes
   * (multiSelect), plus a free-text "other" answer per question. The answers go back as
   * updatedInput.answers = { [question]: "label" | "label1, label2" | "own text" }.
   */
  function showQuestion(ev) {
    const questions = Array.isArray(ev.input?.questions) ? ev.input.questions : [];
    const card = el('div', 'perm ask');
    card.id = 'perm-' + ev.id;
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = questions.length > 1 ? tl('Claude is asking {0} questions', questions.length) : tl('Claude is asking a question');
    card.appendChild(title);

    const readers = questions.map((q, qi) => {
      const box = document.createElement('fieldset');
      box.className = 'ask-q';
      const legend = document.createElement('legend');
      if (q.header) {
        const chip = document.createElement('span');
        chip.className = 'ask-chip';
        chip.textContent = q.header;
        legend.appendChild(chip);
      }
      legend.append(q.question || '');
      if (q.multiSelect) {
        const hint = document.createElement('span');
        hint.className = 'ask-hint';
        hint.textContent = tl('several allowed');
        legend.appendChild(hint);
      }
      box.appendChild(legend);
      const type = q.multiSelect ? 'checkbox' : 'radio';
      const name = `ask-${ev.id}-${qi}`;
      const opts = (q.options || []).map((o) => {
        const l = document.createElement('label');
        l.className = 'ask-opt';
        const input = document.createElement('input');
        input.type = type;
        input.name = name;
        input.value = o.label;
        const text = document.createElement('span');
        const b = document.createElement('b');
        b.textContent = o.label;
        text.appendChild(b);
        if (o.description) {
          const d = document.createElement('small');
          d.textContent = o.description;
          text.appendChild(d);
        }
        l.append(input, text);
        box.appendChild(l);
        return input;
      });
      // "Other": free text. For a single choice it replaces the options, for several it is added.
      const other = document.createElement('label');
      other.className = 'ask-opt ask-other';
      const otherToggle = document.createElement('input');
      otherToggle.type = type;
      otherToggle.name = name;
      const otherText = document.createElement('input');
      otherText.type = 'text';
      otherText.placeholder = tl('Other — your own answer');
      otherText.addEventListener('input', () => { otherToggle.checked = !!otherText.value.trim(); update(); });
      other.append(otherToggle, otherText);
      box.appendChild(other);
      box.addEventListener('change', update);
      card.appendChild(box);
      return () => {
        const picked = opts.filter((i) => i.checked).map((i) => i.value);
        const own = otherToggle.checked ? otherText.value.trim() : '';
        if (own) picked.push(own);
        return picked.join(', ');
      };
    });

    const voiceStatus = document.createElement('div');
    voiceStatus.className = 'voice-status';
    card.appendChild(voiceStatus);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const send = document.createElement('button');
    send.type = 'button';
    send.className = 'btn allow';
    send.textContent = tl('Answer');
    const skip = document.createElement('button');
    skip.type = 'button';
    skip.className = 'btn';
    skip.textContent = tl('Skip');
    actions.append(send, skip);
    card.appendChild(actions);

    function update() {
      send.disabled = readers.some((read) => !read());
    }
    update();

    send.onclick = () => {
      const answers = {};
      questions.forEach((q, i) => { answers[q.question] = readers[i](); });
      card.dataset.answers = JSON.stringify(answers);
      answerPermission(card, ev.id, true, { updatedInput: { ...ev.input, answers } });
    };
    skip.onclick = () => {
      cancelAuto();
      answerPermission(card, ev.id, false, {
        message: 'The user chose not to answer these questions. Continue with your best judgement or ask in plain text.',
      });
    };
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !send.disabled && e.target.type === 'text') { e.preventDefault(); send.click(); }
    });
    // Voice: «пропустить» / "skip" skips, «ответить» / "answer" submits, anything else becomes answer text
    // in the "other" field of the focused question, or of the first one still unanswered.
    const otherFields = [...card.querySelectorAll('.ask-other input[type=text]')];
    let focusedField = null;
    otherFields.forEach((f) => f.addEventListener('focus', () => { focusedField = f; }));
    const normVoice = (t) => t.toLowerCase().replace(/ё/g, 'е').replace(/[.,!?…]/g, '').trim();

    // Send mode of the microphone menu: "word" waits for «ответить» / "answer", "pause" sends by itself once
    // every question has an answer and the speaker has paused. «стоп» / "stop" / a manual edit cancels that.
    let autoTimer = null;
    const cancelAuto = () => { clearTimeout(autoTimer); autoTimer = null; };
    function scheduleAuto() {
      cancelAuto();
      if (dictation.sendMode !== 'pause' || send.disabled) return;
      autoTimer = setTimeout(() => {
        autoTimer = null;
        if (send.disabled || !card.querySelector('.actions')) return;
        send.click();
        voiceStatus.textContent = tl('🎙️ Pause → the answer is sent');
      }, dictation.pauseMs);
    }
    card.addEventListener('input', (e) => { if (e.isTrusted) cancelAuto(); });
    card.addEventListener('change', (e) => { if (e.isTrusted) cancelAuto(); });

    function onPhrase(text) {
      const n = normVoice(text);
      if (/^(стоп|отмена|подожди|не отправляй|stop|cancel|wait|don'?t send)$/.test(n)) {
        if (!autoTimer) return '🎙️ ' + tl('“{0}”: nothing to cancel', text);
        cancelAuto();
        return '🎙️ ' + tl('“{0}” → not sending. Say “answer” when you are ready', text);
      }
      if (/^(пропусти(ть)?|пропуск|без ответа|дальше|skip( it)?|no answer|next)$/.test(n)) {
        cancelAuto();
        skip.click();
        voiceStatus.textContent = '🎙️ ' + tl('“{0}” → going on without an answer', text);
        return 'done';
      }
      if (/^(ответить|ответь|отправить|отправь|готово|answer|submit|send( it)?|done)$/.test(n)) {
        if (send.disabled) return '🎙️ ' + tl('“{0}”: every question needs an answer first', text);
        cancelAuto();
        send.click();
        voiceStatus.textContent = '🎙️ ' + tl('“{0}” → the answer is sent', text);
        return 'done';
      }
      const i = focusedField ? otherFields.indexOf(focusedField) : readers.findIndex((read) => !read());
      const qi = i >= 0 ? i : otherFields.length - 1;
      const field = otherFields[qi];
      field.value = field.value.trim() ? `${field.value.trim()} ${text}` : text;
      field.dispatchEvent(new Event('input', { bubbles: true })); // marks "other" and updates the button
      const label = questions[qi]?.header || tl('question {0}', qi + 1);
      scheduleAuto();
      const next = send.disabled ? tl('Dictate the next answer')
        : autoTimer ? tl('I’ll send after a pause — “stop” to not send')
        : tl('“Answer” sends');
      return '🎙️ ' + tl('“{0}” → into the answer to “{1}”. {2}, “skip” goes on without an answer', text, label, next);
    }
    // Still speaking: wait for the pause again.
    const onInterim = () => { if (autoTimer) scheduleAuto(); };

    revealEnd(card, { urgent: true });
    card.querySelector('input')?.focus({ preventScroll: true });
    try { new Notification(tl('Claude is asking a question'), { body: questions[0]?.question || '' }); } catch {}
    hearing.listen(ev.id, voiceStatus, null, { kind: 'question', onPhrase, onInterim });
    // After listen(): the prompt is listened for once its announcement starts (in headphones right
    // away, through speakers after the phrase).
    voice.permission(ev);
  }

  function showPermissionRequest(ev) {
    if (ev.tool_name === 'AskUserQuestion') return showQuestion(ev);
    if (alwaysAllowed.has(ev.tool_name)) {
      const n = el('div', 'status', tl('Allowed automatically: {0}', ev.tool_name));
      return answerPermission(n, ev.id, true);
    }
    const card = el('div', 'perm');
    card.id = 'perm-' + ev.id;
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = tl('Claude wants to use {0}', ev.tool_name) + (ev.description && ev.description !== ev.input?.command ? ': ' + ev.description : '');
    // Why the CLI asks (the rule or check that escalated), and a path outside the allowed folders.
    const why = [ev.reason, ev.blocked_path ? tl('Path: {0}', ev.blocked_path) : ''].filter(Boolean).join(' · ');
    const reason = Object.assign(document.createElement('div'), { className: 'perm-reason', textContent: why.replace(/\x1b\[[0-9;]*m/g, '') });
    const pre = document.createElement('pre');
    const input = ev.input || {};
    pre.textContent = truncate(input.command ? input.command : JSON.stringify(input, null, 2));
    if (/^(Edit|MultiEdit|Write)$/.test(ev.tool_name)) {
      if (ev.tool_name === 'Write') currentFileText(input.file_path).then((old) => { showAsDiff(pre, editDiff('Write', input, old)); revealEnd(pre, { urgent: true }); });
      else queueMicrotask(() => showAsDiff(pre, editDiff(ev.tool_name, input)));
    }
    const actions = document.createElement('div');
    actions.className = 'actions';
    const mk = (label, cls, fn) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn ' + cls; b.textContent = label; b.onclick = fn;
      actions.appendChild(b);
    };
    mk(tl('Allow'), 'allow', () => answerPermission(card, ev.id, true));
    // The CLI's own "always allow" rules (permission_suggestions), saved into its settings.
    for (const sug of ev.suggestions || []) {
      const label = suggestionLabel(sug);
      if (label) mk(label, '', () => answerPermission(card, ev.id, true, { updatedPermissions: [sug] }));
    }
    mk(tl('Always allow {0} in this chat', ev.tool_name), '', () => { alwaysAllowed.add(ev.tool_name); answerPermission(card, ev.id, true); });
    mk(tl('Deny'), '', () => { if (ev.tool_use_id) deniedByUser.add(ev.tool_use_id); answerPermission(card, ev.id, false); });
    const voiceStatus = document.createElement('div');
    voiceStatus.className = 'voice-status';
    card.append(title, ...(why ? [reason] : []), pre, voiceStatus, actions);
    revealEnd(pre, { urgent: true });
    try { new Notification(tl('Claude is waiting for permission'), { body: ev.tool_name }); } catch {}
    hearing.listen(ev.id, voiceStatus, (decision) => {
      if (decision === 'always') alwaysAllowed.add(ev.tool_name);
      if (decision === 'deny' && ev.tool_use_id) deniedByUser.add(ev.tool_use_id);
      answerPermission(card, ev.id, decision !== 'deny');
      voice.confirm(decision === 'deny' ? tl('Cancelled') : tl('OK, doing it'));
    });
    // After listen(): the prompt is listened for once its announcement starts.
    voice.permission(ev);
  }

  /**
   * Terminal-style progress line: "✻ Whirring… (1m 33s · ↓ 5.7k tokens · thinking)".
   * Output tokens = exact `output_tokens` of finished API messages + a live estimate
   * for the message being generated (thinking estimate from the CLI + ~4 chars per token).
   */
  const spinner = (() => {
    const FRAMES = ['·', '✢', '✳', '✶', '✻', '✽', '✻', '✶', '✳', '✢'];
    const VERBS = ['Whirring', 'Pondering', 'Thinking', 'Brewing', 'Crafting', 'Musing', 'Noodling',
      'Percolating', 'Cogitating', 'Conjuring', 'Tinkering', 'Mulling', 'Churning', 'Computing', 'Ruminating'];
    const root = $('spinner'), glyphEl = root.querySelector('.glyph'),
      verbEl = root.querySelector('.verb'), infoEl = root.querySelector('.info'), queuedEl = root.querySelector('.queued-count');
    let timer = null, frame = 0, started = 0;
    const s = { done: 0, thinking: 0, chars: 0, phase: '' };

    const fmtTime = (ms) => {
      const sec = Math.floor(ms / 1000);
      return sec < 60 ? `${sec}s` : `${Math.floor(sec / 60)}m ${sec % 60}s`;
    };
    const fmtTokens = (n) => (n < 1000 ? String(n) : (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k');
    const tokens = () => s.done + s.thinking + Math.round(s.chars / 4);

    function render() {
      glyphEl.textContent = FRAMES[frame++ % FRAMES.length];
      const parts = [fmtTime(Date.now() - started)];
      const t = tokens();
      if (t > 0) parts.push(`↓ ${fmtTokens(t)} tokens`);
      if (s.phase) parts.push(s.phase);
      infoEl.textContent = `(${parts.join(' · ')}) · ${tl('esc to interrupt')}`;
      // Messages typed meanwhile, whose bubbles may have scrolled far up.
      const waiting = inFlight.length + laterQueue.length;
      queuedEl.hidden = !waiting;
      if (waiting) queuedEl.textContent = '· ⏳ ' + tl('queued: {0}', waiting);
    }
    queuedEl.onclick = () => {
      const b = (inFlight[0] || laterQueue[0])?.bubble;
      if (!b) return;
      b.scrollIntoView({ block: 'center', behavior: 'smooth' });
      b.animate([{ outline: '2px solid var(--accent)' }, { outline: '2px solid transparent' }], { duration: 1500 });
    };

    return {
      start() {
        Object.assign(s, { done: 0, thinking: 0, chars: 0, phase: '' });
        started = Date.now();
        verbEl.textContent = VERBS[Math.floor(Math.random() * VERBS.length)] + '…';
        root.classList.add('on');
        render();
        clearInterval(timer);
        timer = setInterval(render, 120);
      },
      stop() { clearInterval(timer); timer = null; root.classList.remove('on'); },
      phase(p) { s.phase = p; },
      /** Feeds a stream-json event into the counters. */
      onEvent(ev) {
        if (ev.type === 'system' && ev.subtype === 'thinking_tokens') {
          s.thinking += ev.estimated_tokens_delta || 0;
        } else if (ev.type === 'stream_event') {
          const e = ev.event || {};
          if (e.type === 'content_block_start') {
            const b = e.content_block || {};
            s.phase = b.type === 'thinking' || b.type === 'redacted_thinking' ? 'thinking'
              : b.type === 'tool_use' ? b.name : '';
          } else if (e.type === 'content_block_delta') {
            const d = e.delta || {};
            s.chars += (d.text || d.partial_json || '').length;
          } else if (e.type === 'message_delta' && e.usage?.output_tokens != null) {
            // Exact count for the finished message replaces the running estimate.
            s.done += e.usage.output_tokens;
            s.thinking = 0; s.chars = 0;
          }
        } else if (ev.type === 'assistant') {
          const tool = (ev.message?.content || []).find((b) => b.type === 'tool_use');
          if (tool) s.phase = tl('running {0}', tool.name);
        } else if (ev.type === 'user') {
          s.phase = '';
        } else if (ev.type === 'permission_request') {
          s.phase = ev.tool_name === 'AskUserQuestion' ? tl('waiting for an answer to a question') : tl('waiting for permission: {0}', ev.tool_name);
        } else if (ev.type === 'permission_resolved') {
          s.phase = ev.behavior === 'allow' ? tl('running') : '';
        }
      },
    };
  })();

  // --- Messages typed while Claude is working ---
  // Sent into the running process; the CLI takes them only once every tool call of the main
  // agent has returned — a subagent counts as one call however long it works. Bubbles wait in
  // `inFlight` until the CLI echoes them back, their note saying what they wait for, with
  // "read now" (commands and subagents go to the background, as Ctrl+B does; another tool's step
  // is interrupted, as Esc does). `laterQueue` holds messages for a new
  // run (the run was already finishing, or a slash command that must not interrupt the turn).
  let runPid = null;
  const inFlight = [];
  const laterQueue = [];
  // Main-agent tool calls without a result yet: tool_use_id -> { name, input, started, actions }.
  const runningSteps = new Map();
  const BACKGROUNDABLE = new Set(['Bash', 'Agent', 'Task']);
  let queueTimer = null;

  const stepsTrack = {
    /** Tool calls of an `assistant` event: main-agent ones start steps, a subagent's count as its actions. */
    calls(ev) {
      for (const b of ev.message?.content || []) {
        if (b.type !== 'tool_use') continue;
        if (!ev.parent_tool_use_id) runningSteps.set(b.id, { name: b.name, input: b.input || {}, started: Date.now(), actions: 0 });
        else if (runningSteps.has(ev.parent_tool_use_id)) runningSteps.get(ev.parent_tool_use_id).actions++;
      }
      renderQueueNotes();
    },
    /** Tool results of a main-agent `user` event end their steps. */
    results(ev) {
      if (ev.parent_tool_use_id) return;
      for (const b of ev.message?.content || []) if (b.type === 'tool_result') runningSteps.delete(b.tool_use_id);
      renderQueueNotes();
    },
    clear() { runningSteps.clear(); renderQueueNotes(); },
  };

  /** "subagent “…” (1m 23s, actions: 7)", "command `npm test` (40s)", "WebFetch (5s)". */
  function stepLabel(st) {
    const dur = fmtDur(Date.now() - st.started);
    const cut = (t, n = 60) => (t.length > n ? t.slice(0, n - 1) + '…' : t);
    if (st.name === 'Agent' || st.name === 'Task') {
      return tl('subagent “{0}”', cut(st.input.description || st.input.subagent_type || tl('untitled'))) + ` (${dur}${st.actions ? ', ' + tl('actions: {0}', st.actions) : ''})`;
    }
    if (st.name === 'Bash') return tl('command {0}', '`' + cut(String(st.input.command || '').replace(/\s+/g, ' ')) + '`') + ` (${dur})`;
    return `${st.name} (${dur})`;
  }

  /** Updates the notes of messages waiting in the running process (every second while any wait). */
  function renderQueueNotes() {
    clearInterval(queueTimer);
    queueTimer = null;
    if (!inFlight.length) return;
    queueTimer = setInterval(renderQueueNotes, 1000);
    const steps = [...runningSteps.values()].map(stepLabel);
    // Commands and subagents can go to the background (background_tasks): nothing is lost.
    const canBackground = [...runningSteps.values()].every((st) => BACKGROUNDABLE.has(st.name));
    for (const x of inFlight) {
      const n = x.bubble.querySelector('.queue-note');
      if (!n) continue;
      if (!n.querySelector('.queue-text')) {
        n.textContent = '';
        n.append(Object.assign(document.createElement('span'), { className: 'queue-text' }));
      }
      n.querySelector('.queue-text').textContent = x.status
        || (steps.length
          ? '⏳ ' + (steps.length > 1 ? tl('queued — Claude reads it when everything started finishes: {0}', steps.join('; ')) : tl('queued — Claude reads it when the current step finishes: {0}', steps.join('; ')))
          : tl('⏳ queued — Claude reads it after the model’s current answer'));
      let actions = n.querySelector('.queue-actions');
      if ((!steps.length && !x.uuid) || x.status) { actions?.remove(); continue; }
      if (!actions) {
        actions = Object.assign(document.createElement('div'), { className: 'queue-actions' });
        const now = Object.assign(document.createElement('button'), { type: 'button', className: 'btn now', textContent: tl('Read now') });
        // Withdraw it while the CLI hasn't taken it (cancel_async_message); its text returns to the input.
        const cancel = Object.assign(document.createElement('button'), { type: 'button', className: 'btn cancel', textContent: tl('Withdraw'), title: tl('Take the message out of the queue before Claude reads it; the text goes back to the input box') });
        cancel.onclick = () => cancelQueued(x);
        actions.append(now, cancel);
        n.append(actions);
      }
      actions.querySelector('.cancel').hidden = !x.uuid;
      const now = actions.querySelector('.now');
      now.hidden = !steps.length;
      now.title = canBackground
        ? tl('Send the current steps to the background (like Ctrl+B): they keep working and Claude reads this message right away')
        : tl('Interrupt the current step (like Esc) so Claude reads this message right away');
      now.onclick = canBackground ? () => readNow(x, true) : () => { x.confirming = !x.confirming; renderQueueNotes(); };
      let confirm = actions.querySelector('.queue-confirm');
      if (!x.confirming || canBackground) { confirm?.remove(); continue; }
      if (!confirm) {
        confirm = Object.assign(document.createElement('div'), { className: 'queue-confirm' });
        const text = document.createElement('div');
        const yes = Object.assign(document.createElement('button'), { type: 'button', className: 'btn', textContent: tl('Interrupt and read') });
        const no = Object.assign(document.createElement('button'), { type: 'button', className: 'btn', textContent: tl('Cancel') });
        yes.onclick = () => readNow(x, false);
        no.onclick = () => { x.confirming = false; renderQueueNotes(); };
        confirm.append(text, yes, no);
        actions.append(confirm);
      }
      confirm.firstChild.textContent = tl('Will be interrupted:') + `\n• ${steps.join('\n• ')}\n\n` +
        tl('Claude won’t get the result of the interrupted steps. Background tasks keep working, files already changed stay as they are.');

    }
  }

  /** Withdraws a message Claude hasn't taken yet; its text goes back into the empty input. */
  async function cancelQueued(x) {
    if (!runId || !x.uuid) return;
    x.confirming = false;
    x.status = tl('⏳ withdrawing…');
    renderQueueNotes();
    try {
      const { cancelled } = await runControl({ subtype: 'cancel_async_message', message_uuid: x.uuid });
      if (!cancelled) {
        x.status = null;
        el('div', 'status', tl('Not withdrawn: Claude has already read this message'));
        return renderQueueNotes();
      }
      inFlight.splice(inFlight.indexOf(x), 1);
      x.bubble.remove();
      if (!promptEl.value.trim()) { promptEl.value = x.text; autoresize(); updateSendBtn(); promptEl.focus(); }
      el('div', 'status', '↶ ' + (promptEl.value === x.text ? tl('Message withdrawn — the text is in the input box') : tl('Message withdrawn')));
      renderQueueNotes();
    } catch (e) {
      x.status = null;
      el('div', 'error', tl('Could not withdraw: {0}', e.message));
      renderQueueNotes();
    }
  }

  /**
   * Lets the CLI take the queued messages right away: moves the current commands and subagents to
   * the background (they keep working, their results come later), or interrupts a step of another
   * tool. The CLI reads queued messages between tool calls.
   */
  async function readNow(x, background) {
    if (!controller || !runId) return;
    x.confirming = false;
    x.status = background ? tl('⏳ sending the current steps to the background…') : tl('⏳ interrupting the current step…');
    renderQueueNotes();
    if (!background && currentState) { currentState.interrupting = true; currentState.readNow = true; }
    spinner.phase(background ? tl('sending to the background…') : tl('interrupting the current step…'));
    try {
      await runControl({ subtype: background ? 'background_tasks' : 'interrupt' });
      if (background) {
        x.status = null;
        el('div', 'status', tl('⇣ The current steps went to the background — they keep working, Claude is reading the new message'));
      }
    } catch (e) {
      x.status = null;
      if (currentState) currentState.interrupting = currentState.readNow = false;
      el('div', 'error', background ? tl('Could not send to the background: {0}', e.message) : tl('Could not interrupt the step: {0}', e.message));
      renderQueueNotes();
    }
  }

  /** Ctrl+B, as in the terminal: every foreground command and subagent goes to the background. */
  async function backgroundAll() {
    if (!busy() || !runId) return;
    if (![...runningSteps.values()].some((st) => BACKGROUNDABLE.has(st.name))) {
      el('div', 'status', tl('Nothing to send to the background: no commands or subagents are running now'));
      return;
    }
    try {
      await runControl({ subtype: 'background_tasks' });
      el('div', 'status', tl('⇣ Commands and subagents went to the background — Claude goes on'));
    } catch (e) {
      el('div', 'error', tl('Could not send to the background: {0}', e.message));
    }
  }

  function userBubble(text, note, images) {
    const b = el('div', 'msg user' + (note ? ' queued' : ''), text);
    decorateUserBubble(b, { images });
    toBottom(); // after the note is appended below, the observer keeps it in view
    if (note) {
      const n = document.createElement('span');
      n.className = 'queue-note';
      n.textContent = note;
      b.appendChild(n);
    }
    return b;
  }

  function setBubbleNote(b, note, queued = false) {
    b.classList.toggle('queued', queued);
    const n = b.querySelector('.queue-note');
    if (note && n) n.textContent = note;
    else if (!note && n) n.remove();
  }

  function markDelivered(content, uuid) {
    const text = typeof content === 'string'
      ? content
      : (content || []).filter((c) => c.type === 'text').map((c) => c.text).join('\n');
    // The replay keeps the uuid the server gave the message; older servers: match by text.
    let i = uuid ? inFlight.findIndex((x) => x.uuid === uuid) : -1;
    if (i < 0) i = inFlight.findIndex((x) => x.text === text.trim());
    if (i < 0) return null; // the run's first message
    const { bubble } = inFlight[i];
    setBubbleNote(bubble, null);
    inFlight.splice(i, 1);
    renderQueueNotes();
    spinner.phase(tl('reading the new message'));
    return bubble;
  }

  async function sendWhileRunning(prompt, images = []) {
    if ((prompt.startsWith('/') && !images.length) || !runId) {
      laterQueue.push({ text: prompt, images, bubble: userBubble(prompt, tl('⏳ will be sent after the current answer'), images) });
      return;
    }
    const bubble = userBubble(prompt, tl('⏳ queued — Claude reads it after the current step'), images);
    try {
      const r = await fetch('/api/chat/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ runId, prompt, images: images.map(({ media_type, data }) => ({ media_type, data })) }),
      });
      if (r.status === 409) {
        // The run is finishing — send as a new message right after it.
        setBubbleNote(bubble, tl('⏳ will be sent after the current answer'), true);
        laterQueue.push({ text: prompt, images, bubble });
        return;
      }
      if (!r.ok) throw new Error(tlMsg((await r.json().catch(() => ({}))).error || r.statusText));
      const { uuid } = await r.json().catch(() => ({}));
      inFlight.push({ text: prompt, bubble, uuid });
      renderQueueNotes();
    } catch (e) {
      setBubbleNote(bubble, '⚠️ ' + tl('not sent: {0}', e.message), true);
    }
  }

  function updateSendBtn() {
    sendBtn.textContent = busy() && !promptEl.value.trim() && !attachments.count ? tl('Stop') : tl('Send');
  }
  promptEl.addEventListener('input', updateSendBtn);

  // --- Tasks: subagents and long-running shell commands (system task_* events) ---
  // A row keeps its element across the per-second re-render, so its buttons stay clickable:
  // "to background" moves a foreground command or subagent to the background (background_tasks with its
  // tool_use_id), "output" shows the end of a shell's or Monitor's output (get_task_output, read
  // every 2 s while open), ✕ stops the task (stop_task). The server declares that per-task stop
  // (initialize perTaskStopAffordance), so Esc ends only the turn: background tasks keep working.
  const tasksEl = $('tasks');
  const tasks = new Map();
  let tasksTimer = null;
  const DONE_STATUSES = new Set(['completed', 'failed', 'killed', 'stopped']);
  const OUTPUT_KINDS = new Set(['local_bash', 'monitor']);

  const fmtDur = (ms) => {
    const sec = Math.max(0, Math.floor(ms / 1000));
    return sec < 60 ? `${sec}s` : `${Math.floor(sec / 60)}m ${sec % 60}s`;
  };
  const fmtTok = (n) => (n < 1000 ? String(n) : n < 1e6 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M');
  const stripAnsi = (text) => text.replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]|\x1b\][^\x07\x1b]*(\x07|\x1b\\)/g, '');

  function onTaskEvent(ev) {
    const id = ev.task_id;
    if (!id) return;
    const t = tasks.get(id) || { id, started: Date.now() };
    if (ev.subtype === 'task_started') {
      Object.assign(t, {
        kind: ev.task_type, desc: ev.description, agent: ev.subagent_type, toolUseId: ev.tool_use_id,
        background: ev.is_backgrounded, depth: ev.spawn_depth || 1, status: 'running',
      });
    } else if (ev.subtype === 'task_progress') {
      if (ev.summary || ev.description) t.activity = ev.summary || ev.description;
      if (ev.usage) t.usage = ev.usage;
      if (ev.last_tool_name) t.lastTool = ev.last_tool_name;
    } else if (ev.subtype === 'task_updated') {
      if (ev.patch?.status) t.status = ev.patch.status;
      if (ev.patch?.is_backgrounded != null) t.background = ev.patch.is_backgrounded;
    } else if (ev.subtype === 'task_notification') {
      t.status = ev.status || 'completed';
      if (ev.usage) t.usage = ev.usage;
    }
    if (DONE_STATUSES.has(t.status) && !t.doneAt) {
      t.doneAt = Date.now();
      if (t.outputOpen) readOutput(t); // the last of it
      // The row goes away after a few seconds, unless its output is open (closing it removes it).
      setTimeout(() => { if (!t.outputOpen) { tasks.delete(id); renderTasks(); } }, 4000);
    }
    tasks.set(id, t);
    renderTasks();
    if (ev.subtype === 'task_started' || ev.subtype === 'task_notification') agentsChanged();
  }

  async function taskControl(request, failure) {
    try {
      return await runControl(request);
    } catch (e) {
      el('div', 'error', `${failure}: ${e.message}`);
      return null;
    }
  }

  /** The end of a shell's or Monitor's output: at most the last 8 KiB (get_task_output). */
  async function readOutput(t) {
    if (!runId || t.reading) return;
    t.reading = true;
    t.outputAt = Date.now();
    const pre = taskRow(t).querySelector('.task-out');
    try {
      const r = await runControl({ subtype: 'get_task_output', task_id: t.id });
      const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
      pre.textContent = (r.truncated ? '… ' + tl('the last 8 KB of {0}', tl('{0} KB', Math.round((r.total_bytes || 0) / 1024))) + '\n' : '') + (stripAnsi(r.output || '') || tl('(no output yet)'));
      if (atEnd) pre.scrollTop = pre.scrollHeight;
    } catch (e) {
      pre.textContent = tl('Could not read the output: {0}', e.message);
    } finally {
      t.reading = false;
    }
  }

  function taskRow(t) {
    if (t.row) return t.row;
    const row = document.createElement('div');
    const line = Object.assign(document.createElement('div'), { className: 'row-line' });
    const button = (className, textContent, title) => Object.assign(document.createElement('button'), { type: 'button', className, textContent, title });
    const bg = button('task-act bg', tl('⇣ to background'), tl('Send to the background (Ctrl+B — all at once): the task keeps working and Claude keeps answering'));
    bg.onclick = async () => {
      bg.disabled = true;
      const r = await taskControl({ subtype: 'background_tasks', tool_use_id: t.toolUseId }, tl('Could not send to the background'));
      bg.disabled = false;
      if (r?.backgrounded === false) el('div', 'status', tl('“{0}” is no longer running in the foreground', t.desc || tl('Task')));
    };
    const out = button('task-act out', tl('output'), tl('The end of the command’s output'));
    out.onclick = () => {
      t.outputOpen = !t.outputOpen;
      if (t.outputOpen) readOutput(t);
      else if (t.doneAt) tasks.delete(t.id);
      renderTasks();
    };
    const stop = button('x stop', '✕', tl('Stop the task (click twice)'));
    // Two-step confirmation instead of confirm(), which would block the page.
    stop.onclick = () => {
      if (!stop.classList.contains('armed')) {
        stop.classList.add('armed');
        stop.textContent = tl('stop?');
        setTimeout(() => { stop.classList.remove('armed'); stop.textContent = '✕'; }, 3000);
        return;
      }
      stop.classList.remove('armed');
      stop.textContent = '✕';
      taskControl({ subtype: 'stop_task', task_id: t.id }, tl('Could not stop the task'));
    };
    line.append(
      Object.assign(document.createElement('span'), { className: 'mark' }),
      Object.assign(document.createElement('span'), { className: 'txt' }),
      bg, out, stop,
    );
    row.append(line, Object.assign(document.createElement('pre'), { className: 'task-out', hidden: true }));
    t.row = row;
    return row;
  }

  function updateRow(t) {
    const row = taskRow(t);
    const line = row.firstChild;
    line.className = 'row-line' + (t.doneAt ? ' done' : '');
    const isAgent = t.kind === 'local_agent' || !!t.agent;
    row.classList.toggle('task-agent', isAgent); // hidden while the agents view is open
    line.querySelector('.mark').textContent = t.doneAt ? (t.status === 'completed' ? '✓' : '✗') : isAgent ? '◐' : '⏵';
    const elapsed = t.usage?.duration_ms != null && t.doneAt ? t.usage.duration_ms : (t.doneAt || Date.now()) - t.started;
    const bits = [fmtDur(elapsed)];
    if (t.usage?.total_tokens) bits.push(tl('context+output {0}', fmtTok(t.usage.total_tokens)));
    if (t.usage?.tool_uses) bits.push(`${t.usage.tool_uses} tool uses`);
    if (!t.doneAt && t.lastTool) bits.push(t.lastTool);
    const who = (isAgent ? t.agent || 'agent' : t.kind === 'monitor' ? 'Monitor' : 'Bash') + (t.background ? ' ' + tl('(background)') : '');
    const txt = line.querySelector('.txt');
    txt.textContent = `${'  '.repeat(Math.max(0, t.depth - 1))}${who}: ${t.desc || ''} (${bits.join(' · ')})`;
    txt.title = t.activity || t.desc || '';
    const live = !t.doneAt && !!runId;
    line.querySelector('.bg').hidden = !live || t.background || !t.toolUseId || !(isAgent || t.kind === 'local_bash');
    const out = line.querySelector('.out');
    out.hidden = !OUTPUT_KINDS.has(t.kind);
    out.textContent = t.outputOpen ? tl('hide output') : tl('output');
    line.querySelector('.stop').hidden = !live;
    row.lastChild.hidden = !t.outputOpen;
    return row;
  }

  function renderTasks() {
    const list = [...tasks.values()];
    for (const t of list) if (t.outputOpen && !t.doneAt && Date.now() - (t.outputAt || 0) >= 2000) readOutput(t);
    const rows = list.map(updateRow);
    // Rows move only when the set changes: a click in progress on one of them is not lost.
    if (rows.length !== tasksEl.children.length || rows.some((r, i) => tasksEl.children[i] !== r)) tasksEl.replaceChildren(...rows);
    clearInterval(tasksTimer);
    tasksTimer = list.some((t) => !t.doneAt) ? setInterval(renderTasks, 1000) : null;
  }

  function clearTasks() {
    tasks.clear();
    renderTasks();
  }

  /** A collapsed thinking block in the log; `text` for one from history (else it streams in). */
  function thinkingBlock(text) {
    const d = el('details', 'thinking');
    d.append(Object.assign(document.createElement('summary'), { textContent: '💭 ' + (text ? tl('Thinking') : tl('Thinking…')) }), Object.assign(document.createElement('div'), { className: 'think-body' }));
    if (text) d.lastChild.innerHTML = renderMarkdown(text);
    return d;
  }

  /**
   * Claude Code's thinking (and so its summary) is in English whatever the conversation's language,
   * and asking it to think in Russian doesn't work with its long system prompt. When the thinking is
   * read aloud (voice switch "Claude’s thinking"), the summary is translated for it first
   * (/api/translate, Haiku) and shown translated, the original a click away; otherwise it stays as
   * it is. Only with the Russian UI. Resolves to the text to read aloud.
   */
  async function translateThinking(block, text) {
    const latin = (text.match(/[a-z]/gi) || []).length, cyrillic = (text.match(/[а-яё]/gi) || []).length;
    if (LANG !== 'ru' || !voice.speaks('thinking') || latin <= cyrillic * 2) return text;
    const body = block.querySelector('.think-body');
    try {
      const [ru] = (await postJson('/api/translate', { texts: [text], target: 'ru' })).texts;
      if (!ru || !block.isConnected) return text;
      let original = false;
      const toggle = Object.assign(document.createElement('button'), { type: 'button', className: 'think-orig', textContent: tl('original') });
      const show = () => {
        body.innerHTML = renderMarkdown(original ? text : ru);
        toggle.textContent = original ? tl('translation') : tl('original');
        body.append(toggle);
      };
      toggle.onclick = (e) => { e.preventDefault(); original = !original; show(); };
      show();
      return ru;
    } catch {
      return text;
    }
  }

  /**
   * The thinking block's line: "💭 Thinking… (2s · ~120 tokens)" while it streams, "💭 Thinking
   * (3s · ~260 tokens)" once done. The tokens are the CLI's estimate (system thinking_tokens);
   * the exact count only exists for the whole message, answer included.
   */
  function startThinking(state) {
    clearInterval(state.thinkTimer);
    state.thinkEl = thinkingBlock();
    Object.assign(state, { think: '', thinkTokens: 0, thinkStarted: Date.now() });
    // The estimate comes in bursts with the summary's chunks: the time ticks on in between.
    state.thinkTimer = setInterval(() => { if (state.thinkEl?.isConnected) thinkingLabel(state, false); else clearInterval(state.thinkTimer); }, 1000);
  }

  function thinkingLabel(state, done) {
    const bits = [fmtDur(Date.now() - state.thinkStarted)];
    if (state.thinkTokens) bits.push('~' + tl('{0} tokens', fmtTok(state.thinkTokens)));
    state.thinkEl.querySelector('summary').textContent = `💭 ${done ? tl('Thinking') : tl('Thinking…')} (${bits.join(' · ')})`;
  }

  /** API errors the CLI retries (system api_retry): one status line per turn, updated in place. */
  function apiRetry(ev, state) {
    const why = ev.error_status ? tl('error {0}', ev.error_status) : tl('no connection');
    const text = '⚠️ ' + tl('API: {0} — retry {1} of {2} in {3} s', why, ev.attempt, ev.max_retries, Math.max(1, Math.round((ev.retry_delay_ms || 0) / 1000)));
    if (state.retryNote?.isConnected) state.retryNote.textContent = text;
    else state.retryNote = el('div', 'status', text);
    spinner.phase(tl('retrying the API request ({0}/{1})', ev.attempt, ev.max_retries));
  }

  /** Handles one stream-json event from `claude -p --output-format stream-json`. */
  function handleEvent(ev, state) {
    // The waiting process started a turn by itself (e.g. with a background task's notification).
    if (runWaiting && (ev.type === 'assistant' || ev.type === 'stream_event')) wakeRun(state);
    spinner.onEvent(ev);
    if (ev.type === 'system' && /^task_/.test(ev.subtype || '')) onTaskEvent(ev);
    switch (ev.type) {
      case 'wrapper_run':
        runId = ev.runId;
        runPid = ev.pid || null;
        refreshProcs();
        break;
      case 'wrapper_init': // the CLI's answer to `initialize`: commands with descriptions, models, styles
        setCliCommands(ev.commands);
        applyModelCatalog(ev.models, ev.defaultModel);
        setOutputStyles(ev.outputStyles, ev.outputStyle);
        break;
      case 'rate_limit_event':
        usageMeter.fromEvent(ev.rate_limit_info);
        break;
      case 'permission_request':
        showPermissionRequest(ev);
        break;
      case 'elicitation_request':
        showElicitation(ev);
        break;
      case 'elicitation_resolved': {
        const VERDICT = { accept: '✅ ' + tl('Sent'), decline: '⛔ ' + tl('Denied'), cancel: '↷ ' + tl('Cancelled'), cancelled: '↷ ' + tl('Request withdrawn') };
        document.getElementById('elicit-' + ev.id)?.querySelector('.actions')?.replaceWith(node('div', 'verdict', VERDICT[ev.action] || ev.action));
        break;
      }
      case 'permission_resolved': {
        voice.resolved(ev.id);
        const card = document.getElementById('perm-' + ev.id);
        if (card?.classList.contains('ask')) {
          let summary = '';
          try {
