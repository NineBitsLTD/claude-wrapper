            summary = Object.entries(JSON.parse(card.dataset.answers || '{}')).map(([q, a]) => `${q} — ${a}`).join('\n');
          } catch {}
          const v = document.createElement('div');
          v.className = 'verdict';
          v.textContent = ev.behavior === 'allow' ? '✅ ' + tl('Answer sent') + (summary ? ':\n' + summary : '') : '↷ ' + tl('No answer');
          card.querySelector('.actions')?.replaceWith(v);
        } else if (card) {
          card.querySelector('.actions').outerHTML =
            `<div class="verdict">${ev.behavior === 'allow' ? '✅ ' + tl('Allowed') : ev.behavior === 'cancelled' ? '↷ ' + tl('Request withdrawn: the step was interrupted') : '⛔ ' + tl('Denied')}</div>`;
        }
        break;
      }
      case 'system':
        if (ev.subtype === 'thinking_tokens' && state.thinkEl) {
          state.thinkTokens += ev.estimated_tokens_delta || 0;
          thinkingLabel(state, false);
        }
        if (ev.subtype === 'commands_changed') setCliCommands(ev.commands);
        if (ev.subtype === 'notification' && ev.text) el('div', 'status', '🔔 ' + ev.text);
        // Auto-denied without a prompt (auto mode's classifier, dontAsk, a deny rule): shown at once.
        if (ev.subtype === 'permission_denied') markDenied(ev.tool_use_id, ev.decision_reason || DENIAL_TYPES[ev.decision_reason_type] || ev.decision_reason_type);
        if (ev.subtype === 'api_retry') apiRetry(ev, state);
        if (ev.subtype === 'status' && ev.status === 'compacting') {
          compactNote.start();
          spinner.phase(tl('compacting the history'));
        } else if (ev.subtype === 'status' && ev.compact_result) {
          spinner.phase('');
          if (ev.compact_result !== 'success') compactNote.failed(ev.compact_error || ev.compact_result);
        } else if (ev.subtype === 'compact_boundary') {
          spinner.phase('');
          const m = ev.compact_metadata || {};
          compactNote.done({ trigger: m.trigger, preTokens: m.pre_tokens, postTokens: m.post_tokens, durationMs: m.duration_ms });
          if (m.post_tokens) ctxMeter.setUsed(m.post_tokens);
        }
        if (ev.subtype === 'init') {
          if (ev.session_id) { sessionId = ev.session_id; store.set('claude.sessionId', sessionId); }
          if (ev.model) { activeModel = ev.model; syncModelSelect(); syncEffortSelect(); }
          refreshApplied();
          if (ev.permissionMode) {
            state.permissionMode = ev.permissionMode;
            // The CLI reports the mode it actually applied; flag a mismatch with the dropdown.
            if (ev.permissionMode !== modeInfo(state.requestedMode).value) {
              el('div', 'error', tl('The CLI started in the “{0}” mode, but “{1}” is selected.', modeInfo(ev.permissionMode).label, modeInfo(state.requestedMode).label));
            }
          }
          if (Array.isArray(ev.mcp_servers)) { settings.setMcp(ev.mcp_servers); toHost({ type: 'mcp', servers: ev.mcp_servers }); }
          if (Array.isArray(ev.slash_commands)) {
            setCliCommands(ev.slash_commands);
          }
          renderMeta();
        }
        break;
      case 'stream_event': {
        const e = ev.event || {};
        // Thinking summaries (--thinking-display summarized): a collapsed block before the answer.
        if (e.type === 'content_block_start' && e.content_block?.type === 'thinking') {
          startThinking(state);
          break;
        }
        if (e.type === 'content_block_delta' && e.delta?.type === 'thinking_delta') {
          if (!state.thinkEl) startThinking(state);
          state.think += e.delta.thinking || '';
          state.thinkEl.querySelector('.think-body').innerHTML = renderMarkdown(state.think);
          thinkingLabel(state, false);
          scrollDown();
          break;
        }
        if (e.type === 'content_block_stop' && state.thinkEl) {
          clearInterval(state.thinkTimer);
          // Without summaries a thinking block carries no text: nothing to show.
          if (!state.think.trim()) state.thinkEl.remove();
          else { thinkingLabel(state, true); translateThinking(state.thinkEl, state.think).then((t) => voice.thinking(t)); }
          state.thinkEl = null;
          break;
        }
        if (e.type === 'content_block_start' && e.content_block?.type === 'text') {
          state.textEl = el('div', 'msg assistant');
          state.text = '';
          state.textOpen = true;
        } else if (e.type === 'content_block_delta' && e.delta?.type === 'text_delta') {
          if (!state.textEl) { state.textEl = el('div', 'msg assistant'); state.text = ''; state.textOpen = true; }
          state.text += e.delta.text;
          state.hadText = true;
          state.textEl.innerHTML = renderMarkdown(state.text);
          scrollDown();
        } else if (e.type === 'content_block_stop') {
          if (state.textEl) addTime(state.textEl);
          state.textEl = null;
          if (state.textOpen) { state.textOpen = false; voice.answer(state.text); }
        }
        break;
      }
      case 'assistant':
        if (!ev.parent_tool_use_id) ctxMeter.fromUsage(ev.message?.usage);
        stepsTrack.calls(ev);
        // Text is rendered from partial deltas; here we only pick up tool calls.
        for (const b of ev.message?.content || []) {
          if (b.type !== 'tool_use') continue;
          addToolCard(b, { live: true, parentId: ev.parent_tool_use_id });
          if (!ev.parent_tool_use_id) voice.tool(b);
          if (/^(Edit|Write|NotebookEdit)$/.test(b.name)) fileTree.noteEdited(b.input?.file_path || b.input?.notebook_path);
        }
        break;
      case 'user':
        // The CLI echoes each user message back when it takes it (--replay-user-messages).
        if (ev.isReplay) {
          // Each taken user message gets its uuid: rewind / continue-from-here need it.
          const b = markDelivered(ev.message?.content, ev.uuid) || (state.firstBubble && !state.firstBubble.dataset.uuid ? state.firstBubble : null);
          if (b && ev.uuid) setBubbleUuid(b, ev.uuid);
          break;
        }
        // The summary that replaced the history comes as a plain user message after compact_boundary.
        if (typeof ev.message?.content === 'string' && !/^<local-command-/.test(ev.message.content) && compactNote.summary(ev.message.content)) break;
        stepsTrack.results(ev);
        for (const b of ev.message?.content || []) {
          if (b.type !== 'tool_result') continue;
          fileTree.refreshSoon(); // a tool may have created or changed files
          viewer.refreshSoon();
          const meta = (ev.tool_result_meta || []).find((m) => m.id === b.tool_use_id);
          addToolResult(b, deniedByUser.has(b.tool_use_id) ? 'user-rejected' : meta?.non_execution_kind);
        }
        break;
      case 'result': {
        if (ev.session_id) { sessionId = ev.session_id; store.set('claude.sessionId', sessionId); renderMeta(); }
        for (const d of ev.permission_denials || []) markDenied(d.tool_use_id, 'user-rejected');
        state.retryNote = null;
        usageMeter.refresh();
        for (const u of Object.values(ev.modelUsage || {})) ctxMeter.setMax(u.contextWindow);
        ctxMeter.refresh();
        stepsTrack.clear(); // a turn ended: nothing of it is still running
        if (state.interrupting && ev.subtype === 'error_during_execution') {
          // Our own interrupt: the turn stopped, the session is fine.
          state.interrupting = false;
          if (state.readNow) {
            // "Read now": the CLI goes on with the queued message in the same run.
            state.readNow = false;
            el('div', 'status', tl('⏹ The current step was interrupted — Claude is reading the new message'));
            break;
          }
          state.aborted = true;
          el('div', 'status', tl('⏹ Stopped — the session is saved, you can go on'));
          break;
        }
        state.failed = !!ev.is_error; // a run can have several results (queued messages): the last one counts
        if (ev.is_error) el('div', 'error', ev.result || ev.subtype || tl('Error'));
        // Slash commands (e.g. /context, /usage) print their output only into `result`.
        else if (!state.hadText && ev.result) el('div', 'msg assistant').innerHTML = renderMarkdown(ev.result);
        const cost = ev.total_cost_usd != null ? ` · $${ev.total_cost_usd.toFixed(4)}` : '';
        const secs = ev.duration_ms != null ? tl('{0} s', (ev.duration_ms / 1000).toFixed(1)) : '';
        const mode = state.permissionMode ? ` · ${modeInfo(state.permissionMode).label}` : '';
        el('div', 'status', `${secs}${cost}${mode}`);
        break;
      }
      case 'wrapper_idle':
        turnDone(state, ev.until);
        break;
      case 'wrapper_error':
        state.failed = true;
        el('div', 'error', ev.message);
        break;
    }
  }

  async function send(prompt, bubble, images = []) {
    if (controller && runWaiting) return continueRun(prompt, bubble, images);
    if (!bubble) { bubble = el('div', 'msg user', prompt); decorateUserBubble(bubble, { images }); }
    toBottom();
    let ended;
    runEnded = new Promise((resolve) => { ended = resolve; });
    controller = new AbortController();
    updateSendBtn();
    const fork = pendingFork && pendingFork.sessionId === sessionId ? pendingFork : null;
    pendingFork = null;
    const state = { textEl: null, text: '', hadText: false, requestedMode: modeEl.value, permissionMode: null,
      startedAt: Date.now(), failed: false, aborted: false, firstBubble: bubble,
      newSession: !sessionId || !!fork, firstPrompt: prompt };
    currentState = state;
    spinner.start();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt, sessionId, cwd, permissionMode: modeEl.value, model: model || undefined,
          effort: effort || undefined, ultracode: ultracode || undefined, thinking: settings.get('thinking'),
          images: images.length ? images.map(({ media_type, data }) => ({ media_type, data })) : undefined,
          forkAt: fork?.uuid,
        }),
        signal: controller.signal,
      });
      if (!res.ok) throw new Error(tlMsg((await res.json().catch(() => ({}))).error || res.statusText));

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line) continue;
          try { handleEvent(JSON.parse(line), state); } catch (e) { console.warn('Bad line', line, e); }
        }
      }
    } catch (e) {
      if (e.name === 'AbortError') state.aborted = true; else state.failed = true;
      el('div', e.name === 'AbortError' ? 'status' : 'error', e.name === 'AbortError' ? tl('Stopped') : String(e.message || e));
    } finally {
      spinner.stop();
      compactNote.end();
      finishRunningTools();
      clearTasks();
      voice.clear();
      // A thinking block cut off by a stop gets its final line (or goes, if it had no text).
      clearInterval(state.thinkTimer);
      if (state.thinkEl) { if (state.think?.trim()) thinkingLabel(state, true); else state.thinkEl.remove(); state.thinkEl = null; }
      controller = null;
      runId = null;
      runPid = null;
      applied = null;
      syncEffortSelect();
      currentState = null;
      interruptAt = 0;
      runWaiting = false;
      waitNote.ended();
      settleTurn(state);
      // Messages the CLI never picked up: offer them again instead of losing them.
      for (const x of inFlight.splice(0)) setBubbleNote(x.bubble, tl('⚠️ not delivered — Claude finished earlier'), true);
      stepsTrack.clear();
      updateSendBtn();
      promptEl.focus();
      refreshProcs();
      refreshHistoryCount();
      sidePanel.refresh();
      const next = laterQueue.shift();
      if (next) {
        setBubbleNote(next.bubble, null);
        if (!runLocalCommand(next.text, { echo: false })) send(next.text, next.bubble, next.images || []);
      } else if (!state.aborted && !state.announced) {
        announceFinished(state);
      }
      ended();
    }
  }

  /** Once per turn: a new session (or a new branch) gets a title once it has a first answer. */
  function settleTurn(state) {
    if (state.newSession && !state.failed && !state.aborted && sessionId) autoTitle(state.firstPrompt, sessionId);
    state.newSession = false;
  }

  /**
   * The turn is over and the process waits for the next message (wrapper_idle): the page looks
   * idle, the next message goes into the same process (continueRun), so what lives in it — MCP
   * servers such as the Chrome tab group, background shells — survives between messages.
   */
  function turnDone(state, until) {
    runWaiting = true;
    spinner.stop();
    compactNote.end();
    finishRunningTools();
    voice.clear();
    interruptAt = 0;
    settleTurn(state);
    updateSendBtn();
    refreshProcs();
    refreshHistoryCount();
    sidePanel.refresh();
    waitNote.show(until);
    const next = laterQueue.shift();
    if (next) {
      setBubbleNote(next.bubble, null);
      if (!runLocalCommand(next.text, { echo: false })) send(next.text, next.bubble, next.images || []);
    } else if (!state.aborted) {
      announceFinished(state);
      state.announced = true;
    }
  }

  /** The waiting process is working again: a new turn of the same send() state. */
  function wakeRun(state, bubble = null, prompt = '') {
    runWaiting = false;
    waitNote.hide();
    Object.assign(state, { textEl: null, text: '', hadText: false, startedAt: Date.now(), failed: false,
      aborted: false, announced: false, firstBubble: bubble, requestedMode: modeEl.value });
    if (prompt) state.firstPrompt = prompt;
    spinner.start();
    updateSendBtn();
  }

  /** Sends a message into the process waiting for it (see turnDone). */
  async function continueRun(prompt, bubble, images = []) {
    // "Continue from before a message" needs a new process (--fork-session).
    if (pendingFork) { await releaseRun(); return send(prompt, bubble, images); }
    if (!bubble) { bubble = el('div', 'msg user', prompt); decorateUserBubble(bubble, { images }); }
    toBottom();
    const state = currentState;
    wakeRun(state, bubble, prompt);
    try {
      const r = await fetch('/api/chat/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ runId, prompt, images: images.map(({ media_type, data }) => ({ media_type, data })) }),
      });
      if (r.status === 409 || r.status === 404) {
        // The process has just exited (idle timeout): start a new one.
        state.announced = true;
        if (controller) laterQueue.push({ text: prompt, images, bubble }); else send(prompt, bubble, images);
        return;
      }
      if (!r.ok) throw new Error(tlMsg((await r.json().catch(() => ({}))).error || r.statusText));
    } catch (e) {
      setBubbleNote(bubble, '⚠️ ' + tl('not sent: {0}', e.message), true);
      if (controller) turnDone(state, null);
    }
  }

  /** Lets the waiting process exit (a hard stop if it is working) and waits for send() to finish. */
  async function releaseRun() {
    if (!controller) return;
    const ended = runEnded;
    if (runWaiting && runId) await postJson('/api/chat/finish', { runId }).catch(() => controller?.abort());
    else controller.abort();
    await ended;
  }

  /** The line under the last answer while its process waits for the next message. */
  const waitNote = (() => {
    let node = null;
    return {
      show(until) {
        node?.remove();
        const time = until ? new Date(until).toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit' }) : '';
        node = el('div', 'status wait-note', '⏸ ' + (time ? tl('The Claude process waits for the next message until {0} — Chrome tabs and background commands stay alive', time) : tl('The Claude process waits for the next message — Chrome tabs and background commands stay alive')));
        node.title = tl('The next message goes to the same process. Without messages it ends by itself.');
        const btn = Object.assign(document.createElement('button'), { type: 'button', className: 'btn', textContent: tl('End') });
        btn.title = tl('End the process now: the next message starts a new one');
        btn.onclick = () => { btn.disabled = true; releaseRun(); };
        node.append(btn);
      },
      hide() { node?.remove(); node = null; },
      /** The process exited: say so, since the next message starts from the saved session. */
      ended() {
        if (!node) return;
        node.textContent = tl('⏹ The Claude process has ended — the next message starts a new one');
        node.title = '';
        node = null;
      },
    };
  })();

  // Quick answers are not announced unless the tab is in the background.
  const ANNOUNCE_AFTER_MS = 10000;

  /** "All tasks done": sound + phrase, and a system notification when the tab is hidden. */
  function announceFinished(state) {
    const long = Date.now() - state.startedAt >= ANNOUNCE_AFTER_MS;
    if (!long && !document.hidden) return;
    voice.finished({ failed: state.failed });
    if (document.hidden) {
      try { new Notification(state.failed ? tl('Claude finished with an error') : tl('Claude: all the tasks are complete')); } catch {}
    }
  }

  // /btw: side_question to the live process (or a short one resuming the session). Earlier side
  // questions of this chat go along as history, so follow-ups work; none of it enters the session.
  const asideHistory = [];

  async function askAside(question) {
    const card = el('div', 'msg assistant aside', tl('💬 Claude is answering on the side…'));
    try {
      const request = { subtype: 'side_question', question, history: asideHistory.slice(-10) };
      const d = controller && runId ? await runControl(request) : sessionId ? await sessionControl(request) : null;
      if (!d) { card.textContent = tl('A side question is about the current conversation — send a message first'); return; }
      if (d.response == null) { card.textContent = tl('Claude didn’t answer this question'); return; }
      asideHistory.push({ question, response: d.response });
      card.innerHTML = renderMarkdown(d.response);
      card.prepend(Object.assign(document.createElement('div'), { className: 'aside-label', textContent: tl('💬 on the side — not recorded in the session') }));
      addTime(card);
    } catch (e) {
      card.className = 'error';
      card.textContent = tl('The side question failed: {0}', e.message);
    }
  }

  /** Returns true if the command was handled by the page and must not reach the CLI. */
  function runLocalCommand(prompt, { echo = true } = {}) {
    const m = prompt.match(/^\/(\w+)\s*(.*)$/s);
    if (!m || !(m[1] in LOCAL_COMMANDS)) return false;
    const [, name, arg] = m;
    if (echo) el('div', 'msg user', prompt);
    // /resume and /project drop their echo line; a queued command's bubble must survive that.
    else if (name === 'resume' || name === 'project') el('div', 'status', '');
    if (name === 'model') {
      if (arg.trim()) {
        setModel(arg.trim() === 'default' ? '' : arg.trim());
      } else {
        el('div', 'msg assistant').innerHTML = renderMarkdown(
          tl('Current model: {0}', '`' + (model || activeModel || 'default') + '`') + '\n\n' +
          tl('Usage: `/model <ID>` — for example `claude-opus-5-5`, `claude-opus-5-5[1m]`; `opus`, `sonnet`, `haiku`, `fable` are replaced with an ID from the list. `/model default` resets it.'));
      }
    } else if (name === 'effort') {
      const [a, b] = arg.trim().toLowerCase().split(/\s+/);
      if (a === 'ultracode') setEffort(effort, b !== 'off');
      else if (a === 'default' || a === 'auto') setEffort('');
      else if (EFFORT_LEVELS.includes(a)) setEffort(a);
      else {
        el('div', 'msg assistant').innerHTML = renderMarkdown(
          (a ? tl('Unknown level {0}.', '`' + a + '`') + '\n\n' : '') +
          tl('Now: {0}', '`' + (effort || 'default') + '`' + (ultracode ? ' + `ultracode`' : '')) +
          (applied ? '; ' + tl('the process runs with: {0}', appliedText('')) : '') + '\n\n' +
          tl('Usage: `/effort low|medium|high|xhigh|max` — thinking depth; `/effort default` — as in the CLI settings. `/effort ultracode` and `/effort ultracode off` turn ultracode on and off (orchestration through Workflow on every task); it doesn’t change the effort level.'));

      }
    } else if (name === 'btw') {
      if (arg.trim()) askAside(arg.trim());
      else {
        el('div', 'msg assistant').innerHTML = renderMarkdown(
          tl('Usage: `/btw <question>` — Claude answers with the current conversation in mind, but the answer doesn’t go into the session history and doesn’t interrupt the current work.'));
      }
    } else if (name === 'resume') {
      log.lastChild?.remove();  // the echoed "/resume" line
      if (arg.trim()) loadSession(arg.trim()); else sidePanel.show('history');
    } else if (name === 'project') {
      log.lastChild?.remove();
      if (arg.trim()) {
        getJson('/api/fs?path=' + encodeURIComponent(arg.trim()))
          .then((d) => setProject(d.path))
          .catch((e) => el('div', 'error', e.message));
      } else sidePanel.show('projects');
    } else if (name === 'clear') {
      $('newChat').click();
    } else if (name === 'help') {
      const local = Object.entries(LOCAL_COMMANDS).map(([k, v]) => `\`/${k}\` — ${v}`).join('\n');
      el('div', 'msg assistant').innerHTML = renderMarkdown(
        `**${tl('Page commands')}**\n${local}\n\n**${tl('Claude CLI commands')}** (${tl('passed to claude -p')})\n` +
        (cliCommands.length
          ? cliCommands.map((c) => {
            const about = c.description && c.description.length > 140 ? c.description.slice(0, 139) + '…' : c.description;
            return `\`/${c.name}${c.argumentHint ? ' ' + c.argumentHint : ''}\`${about ? ' — ' + about : ''}`;
          }).join('\n')
          : tl('the list appears after the first message')));
    }
    return true;
  }

  /**
   * History of sent messages, like a shell: ⌘↑ / ⌘↓ (Ctrl on other systems) in the input walk
   * back and forth; past the newest entry the unsent draft comes back. Shared by all tabs.
   */
  const inputHistory = (() => {
    const KEY = 'claude.inputHistory';
    const MAX = 200;
    const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
    let items = [];
    try { items = JSON.parse(store.get(KEY) || '[]'); } catch {}
    let pos = null; // index while browsing; null = editing the draft
    let draft = '';

    $('histKeys').textContent = isMac ? '⌘↑/⌘↓' : 'Ctrl+↑/↓';

    function show(text) {
      promptEl.value = text;
      promptEl.dispatchEvent(new Event('input')); // resize, button label
      hideSlash();
      promptEl.setSelectionRange(text.length, text.length);
    }

    promptEl.addEventListener('keydown', (e) => {
      const mod = isMac ? e.metaKey && !e.ctrlKey : e.ctrlKey && !e.metaKey;
      if (!mod || e.shiftKey || e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
      // Handled here, before the slash-command list and the caret movement of the textarea.
      e.preventDefault();
      e.stopImmediatePropagation();
      if (!items.length) return;
      if (e.key === 'ArrowUp') {
        if (pos === null) { draft = promptEl.value; pos = items.length; }
        if (pos === 0) return; // oldest reached
        pos--;
        show(items[pos]);
      } else {
        if (pos === null) return;
        pos++;
        if (pos >= items.length) { pos = null; show(draft); } // back to what was being typed
        else show(items[pos]);
      }
    }, true);

    return {
      /** A message was sent: remember it (no consecutive duplicates) and stop browsing. */
      add(text) {
        pos = null;
        draft = '';
        if (items[items.length - 1] === text) return;
        items.push(text);
        if (items.length > MAX) items = items.slice(-MAX);
        store.set(KEY, JSON.stringify(items));
      },
    };
  })();

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const prompt = promptEl.value.trim();
    if (busy() && !prompt && !attachments.count) { confirmStop(); return; }
    if (!prompt && !attachments.count) return;
    const images = attachments.take();
    if (prompt) inputHistory.add(prompt);
    promptEl.value = '';
    autoresize();
    hideSlash();
    mention.hide();
    updateSendBtn();
    if (busy()) {
      // Page commands (/model, /clear…) change the next run; don't send them to the CLI mid-turn.
      if (!images.length && /^\/(\w+)/.test(prompt) && prompt.match(/^\/(\w+)/)[1] in LOCAL_COMMANDS) {
        laterQueue.push({ text: prompt, bubble: userBubble(prompt, tl('⏳ runs after the current answer')) });
      } else sendWhileRunning(prompt, images);
      return;
    }
    if (images.length || !runLocalCommand(prompt)) send(prompt, null, images);
  });

  // --- Slash command autocomplete ---
  const slashEl = $('slash');
  let slashItems = [], slashIndex = 0;

  function hideSlash() { slashEl.style.display = 'none'; slashItems = []; }

  function updateSlash() {
    const v = promptEl.value;
    if (!/^\/[\w:-]*$/.test(v)) return hideSlash();
    const q = v.slice(1).toLowerCase();
    const all = [
      ...Object.entries(LOCAL_COMMANDS).map(([name, hint]) => ({ name, hint })),
      ...cliCommands.filter((c) => !(c.name in LOCAL_COMMANDS))
        .map((c) => ({ name: c.name, hint: [c.argumentHint, c.description].filter(Boolean).join(' — ') })),
    ];
    slashItems = all.filter((c) => c.name.toLowerCase().includes(q))
      .sort((a, b) => a.name.toLowerCase().startsWith(q) === b.name.toLowerCase().startsWith(q) ? 0 : a.name.toLowerCase().startsWith(q) ? -1 : 1)
      .slice(0, 50);
    if (!slashItems.length) return hideSlash();
    slashIndex = 0;
    renderSlash();
  }

  function renderSlash() {
    slashEl.innerHTML = '';
    slashItems.forEach((c, i) => {
      const d = document.createElement('div');
      d.className = i === slashIndex ? 'active' : '';
      d.textContent = '/' + c.name;
      if (c.hint) { const s = document.createElement('small'); s.textContent = c.hint; d.appendChild(s); d.title = '/' + c.name + ' — ' + c.hint; }
      d.onmousedown = (e) => { e.preventDefault(); pickSlash(i); };
      slashEl.appendChild(d);
    });
    slashEl.style.display = 'block';
    slashEl.children[slashIndex]?.scrollIntoView({ block: 'nearest' });
  }

  function pickSlash(i) {
    promptEl.value = '/' + slashItems[i].name + ' ';
    hideSlash();
    promptEl.focus();
  }

  promptEl.addEventListener('input', updateSlash);
  promptEl.addEventListener('blur', () => setTimeout(hideSlash, 100));

  promptEl.addEventListener('keydown', (e) => {
    if (slashItems.length) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        slashIndex = (slashIndex + (e.key === 'ArrowDown' ? 1 : -1) + slashItems.length) % slashItems.length;
        return renderSlash();
      }
      if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey && promptEl.value.trim() !== '/' + slashItems[slashIndex].name)) {
        e.preventDefault();
        return pickSlash(slashIndex);
      }
      if (e.key === 'Escape') return hideSlash();
    }
    if (e.key === 'Tab' && e.shiftKey) { e.preventDefault(); return cycleMode(); }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      // Setting "send with ⌘/Ctrl+Enter": a plain Enter is a new line.
      if (settings.get('ctrlEnter') && !(e.metaKey || e.ctrlKey)) return;
      e.preventDefault();
      form.requestSubmit();
    }
  });

  function autoresize() {
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 240) + 'px';
  }
  promptEl.addEventListener('input', autoresize);

  document.addEventListener('keydown', (e) => {
    // Keys typed into a terminal or the file editor belong to them (Esc in vim, closing a suggestion…).
    if (e.target.closest?.('.xterm, .monaco-editor, .hex-view')) return;
    if (e.key === 'Escape' && (voice.menuOpen || hearing.menuOpen)) {
      e.preventDefault();
      voice.closeMenu();
      hearing.closeMenu();
      return;
    }
    // Ctrl+B (not ⌘B), as in the terminal: the running commands and subagents go to the background.
    if (e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey && e.code === 'KeyB' && busy()) {
      e.preventDefault();
      backgroundAll();
      return;
    }
    if (e.key !== 'Escape' || !busy()) return;
    if (document.querySelector('dialog[open]') || slashItems.length) return;
    e.preventDefault();
    stopRun(); // first Esc: interrupt the turn; a second one within a few seconds: terminate
  });

  function resetChat() {
    if (controller) controller.abort();
    sessionId = null;
    store.set('claude.sessionId', null);
    alwaysAllowed.clear();
    asideHistory.length = 0;
    log.innerHTML = '';
    compactNote.reset();
    pendingFork = null;
    sessionTitle = '';
    ctxMeter.reset();
    renderMeta();
  }

  $('newChat').onclick = () => { resetChat(); promptEl.focus(); sidePanel.refresh(); };

  // =====================================================================================
  // Chat features modelled on the Claude Code VS Code extension, built on the CLI's control
  // requests (server: /api/chat/control for the running process, /api/session/control for a
  // saved session): soft interrupt, model/mode/effort switch mid-run, rewind of files and of the
  // conversation, diffs, context and plan-limit meters, @-mentions, images, session titles,
  // settings, MCP; tasks (stop, background, output) are in the tasks panel above.
  // =====================================================================================

  async function postJson(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(tlMsg(d.error || r.statusText));
    return d;
  }
  const runControl = (request) => postJson('/api/chat/control', { runId, request });
  const sessionControl = (request, sid = sessionId) => postJson('/api/session/control', { sessionId: sid, cwd, request });

  // --- settings (gear menu) ---
  const settings = (() => {
    const DEFS = {
      focus: { label: tl('Focus mode'), hint: tl('Hide the tool calls — dialogue only'), def: false },
      times: { label: tl('Message times'), hint: tl('Show when each message was sent'), def: false },
      ctrlEnter: { label: tl('Send with ⌘/Ctrl+Enter'), hint: tl('Enter — new line'), def: false },
      autoTitle: { label: tl('Session titles'), hint: tl('Claude comes up with a title for a new session after the first answer'), def: true },
      diffs: { label: tl('Edits as a diff'), hint: tl('Edit/Write are shown as line changes'), def: true },
      thinking: { label: tl('Claude’s thinking'), hint: tl('A summary of what Claude thinks over before answering (from the next run)'), def: true },
    };
    const values = {};
    for (const [k, d] of Object.entries(DEFS)) values[k] = (store.get('claude.set.' + k) ?? (d.def ? '1' : '0')) === '1';
    const apply = () => {
      document.body.classList.toggle('focus-view', values.focus);
      document.body.classList.toggle('show-times', values.times);
      document.body.classList.toggle('hide-thinking', !values.thinking);
    };
    apply();
    const btn = $('settingsBtn'), menu = $('settingsMenu');
    let mcp = []; // [{ name, status }] from the last init event or an explicit check

    async function refreshMcp() {
      try {
        const d = controller && runId ? await runControl({ subtype: 'mcp_status' }) : await sessionControl({ subtype: 'mcp_status' }, sessionId || undefined);
        mcp = (d.mcpServers || []).map((x) => ({ name: x.name, status: x.status, error: x.error }));
      } catch (err) { mcp = [{ name: tl('error'), status: err.message, failed: true }]; }
      render();
    }

    function render() {
      if (menu.hidden) return;
      menu.innerHTML = '';
      for (const [k, d] of Object.entries(DEFS)) {
        const l = document.createElement('label');
        l.className = 'menu-row';
        l.title = d.hint;
        const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: values[k] });
        cb.onchange = () => { values[k] = cb.checked; store.set('claude.set.' + k, cb.checked ? '1' : '0'); apply(); };
        l.append(cb, ' ' + d.label);
        menu.appendChild(l);
      }
      // Output style (the CLI's /output-style): saved in the project's settings, applied at once.
      const styleRow = Object.assign(document.createElement('label'), { className: 'menu-row menu-select', title: tl('How Claude writes its answers (Claude Code’s output style); saved in the project settings') });
      const styleSel = document.createElement('select');
      for (const st of outputStyles.length ? outputStyles : ['default']) styleSel.add(new Option(STYLE_NAMES[st] || st, st));
      styleSel.value = outputStyle || 'default';
      styleSel.onchange = () => setOutputStyle(styleSel.value);
      styleSel.onclick = (e) => e.stopPropagation();
      styleRow.append(tl('Answer style') + ' ', styleSel);
      menu.appendChild(styleRow);
      menu.appendChild(Object.assign(document.createElement('div'), { className: 'menu-section', textContent: 'Claude Code' }));
      const tool = (label, title, fn) => {
        const b = Object.assign(document.createElement('button'), { type: 'button', className: 'menu-row', textContent: label, title });
        b.onclick = (e) => { e.stopPropagation(); menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); fn(); };
        menu.appendChild(b);
      };
      tool(tl('Permission rules…'), tl('What is allowed, asked and denied — with the source of each rule'), showRules);
      tool(tl('Hooks…'), tl('Hooks from the settings and plugins'), showHooks);
      tool(tl('Status…'), tl('Version, account, model, MCP, settings — like /status in the terminal'), showStatus);
      tool(tl('Current plan…'), tl('The plan from this session’s plan mode'), showPlan);
      tool(tl('Export the conversation…'), tl('The whole conversation as text, like /export'), exportConversation);
      tool(tl('Reload skills and plugins'), tl('New and changed skills, plugins and styles — without restarting the process'), () => reloadExtensions());
      // MCP servers: in VS Code a section of the extension's side bar instead.
      if (EMBED) return;
      menu.appendChild(Object.assign(document.createElement('div'), { className: 'menu-section', textContent: tl('MCP servers') }));
      const ICON = { connected: '🟢', pending: '🟡', 'needs-auth': '🔑', failed: '🔴', disabled: '⚪' };
      if (!mcp.length) menu.appendChild(Object.assign(document.createElement('div'), { className: 'menu-note', textContent: tl('The list appears after the first message or with the button below') }));
      // Managing a server needs the chat's live process (it also waits between messages).
      const live = !!(controller && runId);
      for (const m of mcp) {
        const row = Object.assign(document.createElement('div'), { className: 'menu-note mcp-row', title: m.error || '' });
        row.append(Object.assign(document.createElement('span'), { textContent: `${ICON[m.status] || '⚪'} ${m.name} — ${m.status}` }));
        if (live && !m.failed) {
          const act = (label, title, request, after) => {
            const b = Object.assign(document.createElement('button'), { type: 'button', className: 'mcp-act', textContent: label, title });
            b.onclick = async (e) => {
              e.stopPropagation();
              b.disabled = true;
              try {
                const r = await runControl({ ...request, serverName: m.name });
                after?.(r);
              } catch (err) {
                m.error = err.message;
                m.status = 'failed';
              }
              await refreshMcp();
            };
            row.append(b);
          };
          if (m.status === 'needs-auth') {
            // OAuth: the CLI gives the sign-in address; the browser comes back to the CLI itself.
            act(tl('sign in'), tl('Sign in to this MCP server (a browser opens)'), { subtype: 'mcp_authenticate' }, (r) => { if (r?.authUrl) window.open(r.authUrl, '_blank'); });
          }
          if (m.status === 'failed' || m.status === 'pending' || m.status === 'connected') act('↻', tl('Reconnect'), { subtype: 'mcp_reconnect' });
          act(m.status === 'disabled' ? tl('enable') : tl('disable'), m.status === 'disabled' ? tl('Enable the server') : tl('Disable the server (Claude loses its tools)'), { subtype: 'mcp_toggle', enabled: m.status === 'disabled' });
        }
        menu.appendChild(row);
      }
      if (mcp.length && !live) menu.appendChild(Object.assign(document.createElement('div'), { className: 'menu-note', textContent: tl('Servers can be enabled, disabled and reconnected while this chat’s Claude process is running') }));
      const check = Object.assign(document.createElement('button'), { type: 'button', className: 'menu-row', textContent: tl('↻ Check the MCP servers') });
      check.onclick = async (e) => {
        e.stopPropagation();
        check.textContent = tl('Checking…');
        await refreshMcp();
      };
      menu.appendChild(check);
    }
    btn.onclick = (e) => {
      e.stopPropagation();
      voice.closeMenu(); hearing.closeMenu();
      menu.hidden = !menu.hidden;
      btn.setAttribute('aria-expanded', String(!menu.hidden));
      render();
    };
    document.addEventListener('click', (e) => { if (!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); } });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menu.hidden) { e.stopImmediatePropagation(); menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); btn.focus(); } }, true);
    return {
      get: (k) => values[k],
      setMcp(list) { mcp = (list || []).map((x) => ({ name: x.name, status: x.status })); render(); },
    };
  })();

  // --- Claude Code's own screens through control requests: the gear menu's «Claude Code» part ---
  const STYLE_NAMES = { default: tl('normal'), Proactive: tl('proactive'), Concise: tl('concise'), Explanatory: tl('explanatory'), Learning: tl('learning') };
  let outputStyles = [];
  try { outputStyles = JSON.parse(store.get('claude.outputStyles') || '[]'); } catch {}
  let outputStyle = store.get('claude.outputStyle') || '';

  /** The output styles and the current one from the CLI (wrapper_init, reload_output_styles). */
  function setOutputStyles(list, current) {
    if (Array.isArray(list) && list.length) { outputStyles = list; store.set('claude.outputStyles', JSON.stringify(list)); }
    if (typeof current === 'string') { outputStyle = current; store.set('claude.outputStyle', current); }
  }

  /** A control request to the chat's live process, else a short one (resuming the session with `session`). */
  const cliAsk = (request, { session = false } = {}) => (controller && runId ? runControl(request) : sessionControl(request, session ? sessionId : null));

  async function setOutputStyle(style) {
    try {
      await cliAsk({ subtype: 'update_settings', settings: { outputStyle: style } });
      setOutputStyles(null, style);
      el('div', 'status', tl('Answer style: {0}', STYLE_NAMES[style] || style) + ' — ' + (controller && runId ? tl('already in effect') : tl('from the next message')));
    } catch (e) {
      el('div', 'error', tl('Could not change the style: {0}', e.message));
    }
  }

  /** A modal window with a title; returns its body. Closed by ✕, Esc or a click beside it. */
  function infoDialog(title) {
    const d = document.createElement('dialog');
    d.innerHTML = `<div class="dlg"><div class="dlg-head"><h2></h2><button class="btn icon" type="button" title="${tl('Close')}">✕</button></div><div class="dlg-body"></div></div>`;
    d.querySelector('h2').textContent = title;
    d.querySelector('.dlg-head button').onclick = () => d.close();
    d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
    d.addEventListener('close', () => d.remove());
    document.body.appendChild(d);
    d.showModal();
    const body = d.querySelector('.dlg-body');
    body.textContent = tl('Loading…');
    return body;
  }
  const node = (tag, cls, text) => Object.assign(document.createElement(tag), cls ? { className: cls } : {}, text != null ? { textContent: text } : {});

  const RULE_SOURCES = {
    userSettings: tl('your settings'), projectSettings: tl('project (.claude/settings.json)'), localSettings: tl('project, local (settings.local.json)'),
    policySettings: tl('organization'), flagSettings: tl('launch flags'), cliArg: tl('launch flags'), session: tl('this session'), command: tl('command'),
  };

  /** list_permission_rules: what is allowed, asked or denied, each rule with its source. */
  async function showRules() {
    const body = infoDialog(tl('Permission rules'));
    try {
      const { state } = await cliAsk({ subtype: 'list_permission_rules' });
      body.textContent = '';
      const rules = state?.rules || [];
      for (const [b, title] of [['allow', tl('Allowed')], ['ask', tl('Ask')], ['deny', tl('Forbidden')]]) {
        const list = rules.filter((r) => r.behavior === b);
        if (!list.length) continue;
        body.append(node('h3', '', `${title} (${list.length})`));
        for (const r of list) {
          const row = node('div', 'rule-row' + (r.notInEffect ? ' off' : ''));
          row.append(node('code', '', r.rule));
          if (r.description) {
            const d = node('div', 'rule-desc');
            d.append(r.description.prefix || '', node('b', '', r.description.emphasis || ''), r.description.suffix || '');
            row.append(d);
          }
          row.append(node('div', 'rule-src', (RULE_SOURCES[r.source] || r.source) + (r.notInEffect ? ' · ' + tl('not in effect: the organization allows only its own rules') : '')));
          body.append(row);
        }
      }
      if (!rules.length) body.append(node('div', 'menu-note', tl('No rules: Claude asks about everything that needs permission')));
      body.append(node('h3', '', tl('Folders')));
      for (const d of [{ path: state?.originalCwd, source: tl('session folder') }, ...(state?.workspaceDirectories || [])]) {
        if (d.path) body.append(node('div', 'rule-row', `${shortPath(d.path)} — ${RULE_SOURCES[d.source] || d.source}`));
      }
      body.append(node('div', 'menu-note', tl('The “Always allow … in this project” buttons on permission cards add rules to “project, local”.')));
    } catch (e) {
      body.textContent = tl('Could not get the rules: {0}', e.message);
    }
  }

  /** get_hooks_listing: the hooks by event, as the terminal's /hooks shows them. */
  async function showHooks() {
    const body = infoDialog(tl('Hooks'));
    try {
      const h = await cliAsk({ subtype: 'get_hooks_listing' });
      body.textContent = '';
      if (h.policy?.allDisabled) body.append(node('div', 'menu-note', tl('All hooks are disabled (disableAllHooks)')));
      for (const ev of h.events || []) {
        body.append(node('h3', '', `${ev.name} — ${ev.summary}`));
        for (const k of (h.hooks || []).filter((x) => x.event === ev.name)) {
          const row = node('div', 'rule-row');
          row.append(node('code', '', k.displayText || k.commandText || k.type));
          row.append(node('div', 'rule-src', [k.matcher ? tl('for: {0}', k.matcher) : tl('for all'), k.pluginName || k.sourceLabel].filter(Boolean).join(' · ')));
          body.append(row);
        }
      }
      if (!(h.events || []).length) body.append(node('div', 'menu-note', tl('No hooks')));
    } catch (e) {
      body.textContent = tl('Could not get the hooks: {0}', e.message);
    }
  }

  /** get_status (the terminal's /status) and, with a live process, its cost (get_session_cost). */
  async function showStatus() {
    const body = infoDialog(tl('Claude Code status'));
    try {
      const st = await cliAsk({ subtype: 'get_status' });
      body.textContent = '';
      for (const sec of st.sections || []) {
        body.append(node('h3', '', sec.title));
        for (const r of sec.rows || []) {
          const row = node('div', 'status-row');
          if (r.label) row.append(node('span', 'k', r.label));
          row.append(node('span', 'v', r.value));
          body.append(row);
        }
      }
      if (controller && runId) {
        const { text } = await runControl({ subtype: 'get_session_cost' });
        body.append(node('h3', '', tl('Usage of the current process')), node('pre', 'status-pre', text));
      }
    } catch (e) {
      body.textContent = tl('Could not get the status: {0}', e.message);
    }
  }

  /** get_plan: the plan the session wrote in plan mode. */
  async function showPlan() {
    if (!sessionId && !(controller && runId)) return el('div', 'status', tl('No plan: this chat has no messages yet'));
    const body = infoDialog(tl('Current plan'));
    try {
      const p = await cliAsk({ subtype: 'get_plan' }, { session: true });
      body.textContent = '';
      if (!p.exists) return body.append(node('div', 'menu-note', tl('No plan — it appears when Claude works in plan mode')));
      const md = node('div', 'msg assistant');
      md.innerHTML = renderMarkdown(p.content || '');
      body.append(md);
      if (p.path) body.append(node('div', 'menu-note', p.path));
    } catch (e) {
      body.textContent = tl('Could not get the plan: {0}', e.message);
    }
  }

  /** export_conversation: the whole conversation as /export writes it, to save or copy. */
  async function exportConversation() {
    if (!sessionId && !(controller && runId)) return el('div', 'status', tl('Nothing to export: this chat has no messages yet'));
    const body = infoDialog(tl('Export the conversation'));
    try {
      const { text, default_filename: name } = await cliAsk({ subtype: 'export_conversation' }, { session: true });
      body.textContent = '';
      const bar = node('div', 'export-bar');
      const save = node('button', 'btn allow', tl('Save {0}', name || 'conversation.txt'));
      save.type = 'button';
      save.onclick = () => {
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' })), download: name || 'conversation.txt' });
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      };
      const copy = node('button', 'btn', tl('Copy'));
      copy.type = 'button';
      copy.onclick = () => navigator.clipboard.writeText(text).then(() => { copy.textContent = tl('Copied'); }, (e) => { copy.textContent = tl('Not copied: {0}', e.message); });
      bar.append(save, copy, node('span', 'menu-note', text.length < 1024 ? tl('{0} characters', text.length) : tl('{0} KB', Math.round(text.length / 1024))));
      body.append(bar, node('pre', 'status-pre export-pre', text.length > 20000 ? text.slice(0, 20000) + '\n…' : text));
    } catch (e) {
      body.textContent = tl('Could not export: {0}', e.message);
    }
  }

  /** reload_skills / reload_plugins / reload_output_styles in the live process. */
  async function reloadExtensions(force = false) {
    if (!(controller && runId)) return el('div', 'status', tl('Nothing to reload: a new Claude process reads everything anew anyway — send a message'));
    try {
      await runControl({ subtype: 'reload_skills' });
      const p = await runControl({ subtype: 'reload_plugins', force });
      const st = await runControl({ subtype: 'reload_output_styles' });
      if (Array.isArray(p.commands)) setCliCommands(p.commands);
      setOutputStyles(st.available_output_styles);
      if (p.held) {
        const n = el('div', 'status', tl('Plugins not reloaded: the set of tools would change, and the prompt cache would have to be rebuilt.') + ' ');
        const b = node('button', 'btn', tl('Reload anyway'));
        b.type = 'button';
        b.onclick = () => { b.remove(); reloadExtensions(true); };
        n.append(b);
      } else {
        el('div', 'status', tl('↻ Skills, plugins and styles reloaded'));
      }
    } catch (e) {
      el('div', 'error', tl('Could not reload: {0}', e.message));
    }
  }

  // --- message times ---
  const fmtTime = (ts) => {
    const d = ts ? new Date(ts) : new Date();
    const today = d.toDateString() === new Date().toDateString();
    return d.toLocaleString(LOCALE, today ? { hour: '2-digit', minute: '2-digit' } : { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  };
  function addTime(node, ts) {
    if (!node || node.querySelector(':scope > .msg-time')) return;
    node.appendChild(Object.assign(document.createElement('div'), { className: 'msg-time', textContent: fmtTime(ts) }));
  }

  // --- user message bubbles: images, time, actions (rewind / continue from here) ---
  function decorateUserBubble(b, { uuid, ts, images } = {}) {
    if (images?.length) {
      const box = document.createElement('div');
      box.className = 'msg-images';
      for (const im of images) box.appendChild(Object.assign(document.createElement('img'), { src: im.url || `data:${im.media_type};base64,${im.data}`, alt: im.name || tl('image') }));
      b.prepend(box);
    }
    addTime(b, ts);
    if (uuid) setBubbleUuid(b, uuid);
  }

  function setBubbleUuid(b, uuid) {
    b.dataset.uuid = uuid;
    if (b.querySelector('.msg-actions')) return;
    const bar = document.createElement('div');
    bar.className = 'msg-actions';
    const mk = (label, title, fn) => {
      const x = Object.assign(document.createElement('button'), { type: 'button', textContent: label, title });
      x.onclick = (e) => { e.stopPropagation(); fn(); };
      bar.appendChild(x);
    };
    mk(tl('↶ Rewind'), tl('Return the files and/or the dialogue to the moment before this message'), () => openRewind(b));
    mk('⧉', tl('Copy the message text'), () => navigator.clipboard?.writeText(bubbleText(b)));
    b.appendChild(bar);
  }

  const bubbleText = (b) => [...b.childNodes].filter((n) => n.nodeType === Node.TEXT_NODE).map((n) => n.textContent).join('').trim();

  // --- rewind: files (rewind_files), conversation (continue in a fork from before the message) ---

  async function openRewind(b) {
    document.querySelector('.rewind-card')?.remove();
    const uuid = b.dataset.uuid;
    const card = document.createElement('div');
    card.className = 'rewind-card';
    b.after(card);
    if (busy()) { card.textContent = tl('Wait for the answer to end or stop Claude (Esc), then rewind.'); return; }
    card.textContent = tl('Checking which files changed after this message…');
    let preview = null, previewError = '';
    try { preview = await sessionControl({ subtype: 'rewind_files', user_message_id: uuid, dry_run: true }); } catch (e) { previewError = e.message; }
    card.innerHTML = '';
    const title = document.createElement('div');
    const files = preview?.filesChanged || [];
    if (preview?.canRewind && files.length) {
      title.innerHTML = `<b>${tl('Return to the moment before this message.')}</b> ${tl('Changed files ({0}):', `${files.length}, +${preview.insertions || 0} −${preview.deletions || 0}`)}`;
      const ul = document.createElement('ul');
      for (const f of files.slice(0, 12)) ul.appendChild(Object.assign(document.createElement('li'), { textContent: shortPath(f) }));
      if (files.length > 12) ul.appendChild(Object.assign(document.createElement('li'), { textContent: '… ' + tl('and {0} more', files.length - 12) }));
      card.append(title, ul);
    } else {
      title.innerHTML = `<b>${tl('Go back to the moment before this message.')}</b> ` +
        escapeHtml(preview?.canRewind ? tl('The files haven’t changed since.') : tl('Rewinding files is unavailable{0} (only messages sent from the wrapper after the update have file snapshots).', preview?.error || previewError ? ': ' + (preview?.error || previewError) : ''));
      card.append(title);
    }
    const opts = document.createElement('div');
    opts.className = 'opts';
    const mk = (label, cls, fn) => { const x = Object.assign(document.createElement('button'), { type: 'button', className: 'btn ' + cls, textContent: label }); x.onclick = fn; opts.appendChild(x); return x; };
    const canFiles = preview?.canRewind && files.length;
    if (canFiles) mk(tl('Restore the code and the dialogue'), 'allow', () => doRewind(b, card, { files: true, chat: true }));
    if (canFiles) mk(tl('Code only'), '', () => doRewind(b, card, { files: true, chat: false }));
    mk(tl('Dialogue only'), canFiles ? '' : 'allow', () => doRewind(b, card, { files: false, chat: true }));
    mk(tl('Cancel'), '', () => card.remove());
    card.appendChild(opts);
    card.scrollIntoView({ block: 'nearest' });
  }

  async function doRewind(b, card, { files, chat }) {
    const uuid = b.dataset.uuid;
    card.querySelectorAll('button').forEach((x) => (x.disabled = true));
    try {
      if (files) await sessionControl({ subtype: 'rewind_files', user_message_id: uuid });
    } catch (e) {
      card.querySelectorAll('button').forEach((x) => (x.disabled = false));
      card.appendChild(Object.assign(document.createElement('div'), { className: 'error', textContent: tl('Could not restore the files: {0}', e.message) }));
      return;
    }
    fileTree.refreshSoon();
    viewer.refreshSoon();
    if (!chat) {
      card.replaceWith(Object.assign(document.createElement('div'), { className: 'status', textContent: tl('↶ The files are back to their state before this message') }));
      return;
    }
    // The conversation continues from before this message: drop it and everything after it from
    // the log, put its text back into the input; the next send forks the session at that point.
    pendingFork = { sessionId, uuid };
    const text = bubbleText(b);
    while (b.nextSibling) b.nextSibling.remove();
    b.remove();
    el('div', 'history-sep', '↶ ' + (files ? tl('The code and the dialogue are back to this point — the next message goes on from here (a new branch of the session)') : tl('The dialogue is back to this point — the next message goes on from here (a new branch of the session)')));
    promptEl.value = text;
    promptEl.dispatchEvent(new Event('input'));
    promptEl.focus();
    ctxMeter.reset();
  }

  // --- diffs for Edit / MultiEdit / Write ---
  /** Line diff (LCS) -> [{ t: ' ' | '+' | '-', s }], unchanged runs folded to 3 lines of context. */
  function lineDiff(a, b) {
    const A = a.split('\n'), B = b.split('\n');
    if (A.length * B.length > 4e6) return [...A.map((s) => ({ t: '-', s })), ...B.map((s) => ({ t: '+', s }))];
    let pre = 0;
    while (pre < A.length && pre < B.length && A[pre] === B[pre]) pre++;
    let suf = 0;
    while (suf < A.length - pre && suf < B.length - pre && A[A.length - 1 - suf] === B[B.length - 1 - suf]) suf++;
    const a1 = A.slice(pre, A.length - suf), b1 = B.slice(pre, B.length - suf);
    const n = a1.length, m = b1.length;
    const L = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a1[i] === b1[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const mid = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a1[i] === b1[j]) { mid.push({ t: ' ', s: a1[i] }); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) mid.push({ t: '-', s: a1[i++] });
      else mid.push({ t: '+', s: b1[j++] });
    }
    while (i < n) mid.push({ t: '-', s: a1[i++] });
    while (j < m) mid.push({ t: '+', s: b1[j++] });
    return [...A.slice(0, pre).map((s) => ({ t: ' ', s })), ...mid, ...A.slice(A.length - suf).map((s) => ({ t: ' ', s }))];
  }

  function renderDiff(oldText, newText) {
    const rows = lineDiff(oldText || '', newText || '');
    const box = document.createElement('div');
    box.className = 'diff';
    const changed = rows.map((r) => r.t !== ' ');
    const keep = rows.map((_, k) => changed.slice(Math.max(0, k - 3), k + 4).some(Boolean));
    let skipped = 0;
    const flush = () => { if (skipped) { box.appendChild(Object.assign(document.createElement('div'), { className: 'gap', textContent: '… ' + tl('{0} unchanged', skipped) })); skipped = 0; } };
    rows.forEach((r, k) => {
      if (!keep[k]) { skipped++; return; }
      flush();
      box.appendChild(Object.assign(document.createElement('div'), { className: r.t === '+' ? 'add' : r.t === '-' ? 'del' : '', textContent: `${r.t} ${r.s}` }));
    });
    flush();
    return box;
  }

  /** Diff view of an edit tool's input, or null when the tool is not an edit. */
  function editDiff(name, input, oldFileText) {
    if (!settings.get('diffs') || !input) return null;
    const wrap = document.createElement('div');
    const file = input.file_path || input.notebook_path;
    if (file) wrap.appendChild(Object.assign(document.createElement('div'), { className: 'diff-file', textContent: shortPath(file) }));
    if (name === 'Edit') wrap.appendChild(renderDiff(input.old_string, input.new_string));
    else if (name === 'MultiEdit' && Array.isArray(input.edits)) input.edits.forEach((e) => wrap.appendChild(renderDiff(e.old_string, e.new_string)));
    else if (name === 'Write' && typeof input.content === 'string') wrap.appendChild(renderDiff(oldFileText ?? '', input.content));
    else return null;
    return wrap;
  }

  /** Current text of a project file (for the diff of a Write that overwrites it), or null. */
  async function currentFileText(abs) {
    if (!abs || !cwd || !abs.startsWith(cwd.replace(/\/$/, '') + '/')) return null;
    try { return (await getJson(`/api/file?cwd=${encodeURIComponent(cwd)}&path=${encodeURIComponent(abs.slice(cwd.replace(/\/$/, '').length + 1))}&whole=1`)).content; } catch { return null; }
  }

  /** Replaces the JSON <pre> of a tool card / prompt with a diff (the JSON stays one click away). */
  function showAsDiff(pre, diffEl) {
    if (!diffEl) return;
    const toggle = Object.assign(document.createElement('button'), { type: 'button', className: 'raw-toggle', textContent: tl('show JSON') });
    pre.hidden = true;
    toggle.onclick = (e) => { e.preventDefault(); e.stopPropagation(); pre.hidden = !pre.hidden; diffEl.hidden = !pre.hidden; toggle.textContent = pre.hidden ? tl('show JSON') : tl('show diff'); };
    pre.before(diffEl, toggle);
  }

  // --- context meter ---
  /** A popover under a header button (closed by a click elsewhere); its content starts as `text`. */
  function headerPop(btn, text) {
    document.querySelector('.ctx-pop')?.remove();
    const pop = Object.assign(document.createElement('div'), { className: 'ctx-pop', textContent: text });
    document.body.appendChild(pop);
    const r = btn.getBoundingClientRect();
    pop.style.top = r.bottom + 6 + 'px';
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - 380)) + 'px';
    const close = (ev) => { if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('pointerdown', close, true); } };
    document.addEventListener('pointerdown', close, true);
    return pop;
  }

  // Context meter: the CLI's own numbers (get_context_usage: the window it compacts against, which
  // on 1M models may be smaller than the model's window) after a session opens and after each
  // answer; while Claude answers, an estimate from the usage of its API messages.
  const ctxMeter = (() => {
    const btn = $('ctxMeter');
    let used = 0, max = 0, exact = null, seq = 0;
    const fmt = (n) => (n >= 1000 ? Math.round(n / 1000) + 'k' : String(n));
    function render() {
      if (!used) { btn.hidden = true; return; }
      const limit = max || (/\[1m\]/.test(model) ? 1000000 : 200000);
      const pct = exact ?? Math.min(100, Math.round((used / limit) * 100));
      btn.hidden = false;
      btn.textContent = tl('context {0}%', pct);
      btn.title = tl('{0} of {1} context tokens used', fmt(used), fmt(limit)) + (exact == null ? ' ' + tl('(estimate)') : '') + ' — ' + tl('click for details');
      btn.classList.toggle('warn', pct >= 70 && pct < 90);
      btn.classList.toggle('full', pct >= 90);
    }
    const apply = (d) => {
      if (!d?.maxTokens) return;
      used = d.totalTokens || 0;
      max = d.maxTokens;
      exact = Number.isFinite(d.percentage) ? Math.round(d.percentage) : null;
      render();
    };
    // The session's context as the CLI counts it (the live process, else a short one resuming it).
    const ask = () => (controller && runId ? runControl({ subtype: 'get_context_usage' }) : sessionControl({ subtype: 'get_context_usage' }));
    btn.onclick = async (e) => {
      e.stopPropagation();
      const pop = headerPop(btn, tl('Loading…'));
      try {
        const d = await ask();
        apply(d);
        pop.innerHTML = '';
        pop.appendChild(Object.assign(document.createElement('div'), { innerHTML: `<b>${tl('Context: {0} of {1}', fmt(d.totalTokens), fmt(d.maxTokens))}</b> (${d.percentage}%)` }));
        const bar = document.createElement('div');
        bar.className = 'bar';
        const COLORS = ['#8b949e', '#6e7681', '#a371f7', '#3fb950', '#d29922', '#58a6ff', '#f778ba', '#79c0ff'];
        const used_ = (d.categories || []).filter((c) => c.kind !== 'deferred' && c.name !== 'Free space' && c.tokens > 0);
        const colorOf = new Map(used_.map((c, k) => [c, COLORS[k % COLORS.length]]));
        used_.forEach((c) => bar.appendChild(Object.assign(document.createElement('span'), { style: `width:${(c.tokens / d.maxTokens) * 100}%;background:${colorOf.get(c)}`, title: c.name })));
        pop.appendChild(bar);
        for (const c of d.categories || []) {
          if (!c.tokens) continue;
          const row = document.createElement('div');
          row.className = 'row';
          // Free space is the bar's empty background; deferred categories have no segment.
          const dot = document.createElement('i');
          if (colorOf.has(c)) { dot.className = 'on'; dot.style.background = colorOf.get(c); }
          else if (c.name === 'Free space') dot.className = 'free';
          const label = document.createElement('span');
          label.append(dot, c.name + (c.isDeferred ? ' ' + tl('(on demand)') : ''));
          row.append(label, Object.assign(document.createElement('span'), { textContent: fmt(c.tokens) }));
          pop.appendChild(row);
        }
        const compact = Object.assign(document.createElement('button'), {
          type: 'button', className: 'btn ctx-compact', textContent: tl('Compact the history (/compact)'),
          title: busy() ? tl('Claude is working now: it compacts after the current answer') : tl('Claude replaces the history with a summary and goes on with it'),
        });
        compact.onclick = () => { pop.remove(); compactNow(); };
        pop.appendChild(compact);
      } catch (err) {
        pop.textContent = sessionId ? tl('Could not get the data: {0}', err.message) : tl('The context appears after the first message');
      }
    };
    return {
      /** Usage of a main-agent API message: everything it read is the current context (an estimate). */
      fromUsage(u) {
        if (!u) return;
        const n = (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.output_tokens || 0);
        if (n) { used = n; exact = null; render(); }
      },
      /** The model's window from a result: only until the CLI has told its own (smaller) one. */
      setMax(n) { if (n && !max) { max = n; render(); } },
      setUsed(n) { used = n; exact = null; render(); },
      reset() { used = 0; max = 0; exact = null; seq++; render(); },
      /** Exact numbers from the CLI; a reply for a session no longer shown is dropped. */
      async refresh() {
        if (!sessionId && !(controller && runId)) return;
        const mine = ++seq, sid = sessionId;
        try {
          const d = await ask();
          if (mine === seq && sid === sessionId) apply(d);
        } catch {}
      },
    };
  })();

  /** /compact as if typed (the context popover's button): now, or after the current answer. */
  function compactNow() {
    if (!sessionId) return el('div', 'status', tl('Nothing to compact yet: this chat has no messages'));
    if (busy()) sendWhileRunning('/compact');
    else send('/compact', null, []);
  }

  // --- Plan limits of the claude.ai subscription (5-hour and weekly windows) ---
  // /api/usage (the server's cached get_usage, experimental in the CLI; no model call) every
  // minute while the window is visible, at once when it shows again, after each answer and,
  // bypassing the cache, on a click; rate_limit_event from the stream updates it in between and
  // warns once per window when a limit is near or hit. Hidden for logins without plan limits.
  const usageMeter = (() => {
    const btn = $('usageMeter');
    let limits = [];   // [{ key, label, pct, resetsAt (ms), severity, status }]
    let extra = null;  // extra usage (paid overage), when enabled
    let reading = false, warned = '';
    const LABELS = {
      session: tl('5 hours'), weekly_all: tl('week'), seven_day_opus: tl('week') + ' · Opus', seven_day_sonnet: tl('week') + ' · Sonnet',
      seven_day_overage_included: tl('week with extra usage'), overage: tl('extra usage'),
    };
    const SHORT = { session: tl('5h'), weekly_all: tl('wk') };
    const WINDOW_KEY = { five_hour: 'session', seven_day: 'weekly_all' }; // rate_limit_event → get_usage names
    const pctOf = (u) => (u <= 1 ? u * 100 : u); // the event's utilization is a fraction
    const msOf = (t) => (t && t < 1e12 ? t * 1000 : t) || null; // the event's times are in seconds

    function render() {
      btn.hidden = !limits.length;
      if (!limits.length) return;
      const main = ['session', 'weekly_all'].map((k) => limits.find((l) => l.key === k)).filter(Boolean);
      btn.textContent = tl('limit') + ' ' + (main.length ? main : limits.slice(0, 2)).map((l) => `${SHORT[l.key] || l.label} ${Math.round(l.pct)}%`).join(' · ');
      const worst = Math.max(...limits.map((l) => l.pct));
      const full = worst >= 95 || limits.some((l) => l.status === 'rejected');
      btn.classList.toggle('full', full);
      btn.classList.toggle('warn', !full && (worst >= 75 || limits.some((l) => (l.severity && l.severity !== 'normal') || l.status === 'allowed_warning')));
      btn.title = limits.map((l) => `${l.label}: ${Math.round(l.pct)}%${l.resetsAt ? ', ' + tl('resets {0}', fmtDate(l.resetsAt)) : ''}`).join('\n') + '\n' + tl('Click for details');
    }

    function fromUsage(d) {
      const rl = d?.rate_limits_available !== false ? d?.rate_limits : null;
      if (!rl) { limits = []; extra = null; render(); return; }
      const at = (iso) => (iso ? Date.parse(iso) : null);
      limits = Array.isArray(rl.limits) && rl.limits.length
        ? rl.limits.map((l) => {
          const scoped = l.kind === 'weekly_scoped' ? l.scope?.model?.display_name || tl('model') : '';
          return { key: scoped ? 'weekly:' + scoped : l.kind, label: scoped ? tl('week') + ' · ' + scoped : LABELS[l.kind] || l.kind, pct: l.percent ?? 0, resetsAt: at(l.resets_at), severity: l.severity };
        })
        : [['session', rl.five_hour], ['weekly_all', rl.seven_day]].filter(([, w]) => w?.utilization != null)
          .map(([key, w]) => ({ key, label: LABELS[key], pct: w.utilization, resetsAt: at(w.resets_at) }));
      extra = rl.extra_usage?.is_enabled ? rl.extra_usage : null;
      render();
    }

    async function refresh(force = false) {
      if (reading) return;
      reading = true;
      try {
        fromUsage(await getJson('/api/usage' + (force ? '?fresh=1' : '')));
      } catch {
        // The meter keeps what it had (no network, or a CLI without get_usage).
      } finally {
        reading = false;
      }
    }

    const visible = () => document.visibilityState === 'visible';
    setInterval(() => { if (visible()) refresh(); }, 60_000);
    document.addEventListener('visibilitychange', () => { if (visible()) refresh(); });

    btn.onclick = async (e) => {
      e.stopPropagation();
      const pop = headerPop(btn, tl('Loading…'));
      await refresh(true);
      pop.innerHTML = '';
      pop.appendChild(Object.assign(document.createElement('div'), { innerHTML: `<b>${tl('Subscription limits')}</b>` }));
      for (const l of limits) {
        const row = document.createElement('div');
        row.className = 'row';
        row.append(
          Object.assign(document.createElement('span'), { textContent: l.label }),
          Object.assign(document.createElement('span'), { textContent: `${Math.round(l.pct)}%${l.resetsAt ? ' · ' + tl('resets {0}', fmtDate(l.resetsAt)) : ''}` }),
        );
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.appendChild(Object.assign(document.createElement('span'), { style: `width:${Math.min(100, l.pct)}%;background:${l.pct >= 95 ? '#e5534b' : l.pct >= 75 ? '#d29922' : 'var(--accent)'}` }));
        pop.append(row, bar);
      }
      if (!limits.length) pop.appendChild(Object.assign(document.createElement('div'), { textContent: tl('No data on limits') }));
      if (extra) {
        pop.appendChild(Object.assign(document.createElement('div'), {
          className: 'menu-note', textContent: tl('Extra usage is on') + (extra.monthly_limit != null ? ': ' + tl('{0} of {1} used', extra.used_credits ?? 0, extra.monthly_limit) : ''),
        }));
      }
      pop.appendChild(Object.assign(document.createElement('div'), { className: 'menu-note', textContent: tl('Usage details — the /usage command') }));
    };

    /** rate_limit_event: the windows' utilization from the API's response headers. */
    function fromEvent(info) {
      if (!info) return;
      for (const [name, w] of Object.entries(info.unifiedWindows || {})) {
        if (!w || w.utilization == null) continue;
        const key = WINDOW_KEY[name] || name;
        let l = limits.find((x) => x.key === key);
        if (!l) limits.push(l = { key, label: LABELS[key] || name });
        Object.assign(l, { pct: pctOf(w.utilization), resetsAt: msOf(w.resetsAt) || l.resetsAt, status: w.status });
      }
      render();
      if (info.status !== 'allowed_warning' && info.status !== 'rejected') return;
      const id = `${info.status}:${info.rateLimitType}:${info.resetsAt}`;
      if (warned === id) return;
      warned = id;
      const label = LABELS[WINDOW_KEY[info.rateLimitType] || info.rateLimitType] || tl('limit');
      const until = msOf(info.resetsAt) ? ', ' + tl('resets {0}', fmtDate(msOf(info.resetsAt))) : '';
      if (info.status === 'rejected') el('div', 'error', tl('The subscription limit is used up ({0})', label) + until);
      else el('div', 'status', '⚠️ ' + tl('The subscription limit is almost used up ({0})', label + (info.utilization != null ? ': ' + Math.round(pctOf(info.utilization)) + '%' : '')) + until);
    }

    return { refresh, fromEvent };
  })();

  // --- @-mentions of project files ---
  const mention = (() => {
    const box = $('mention');
    let items = [], index = 0, token = null, timer = null, seq = 0, loading = false;
    const hide = () => { box.hidden = true; items = []; token = null; loading = false; };
    function current() {
      const caret = promptEl.selectionStart;
      if (caret !== promptEl.selectionEnd) return null;
      const m = /(^|\s)@([^\s@]*)$/.exec(promptEl.value.slice(0, caret));
      return m ? { start: caret - m[2].length - 1, end: caret, q: m[2] } : null;
    }
    function render() {
      box.innerHTML = '';
      items.forEach((f, k) => {
        const d = Object.assign(document.createElement('div'), { className: k === index ? 'active' : '', textContent: (f.endsWith('/') ? '📁 ' : viewer.icon(f) + ' ') + f, title: f });
        d.onmousedown = (e) => { e.preventDefault(); pick(k); };
        box.appendChild(d);
      });
      box.hidden = !items.length;
      box.children[index]?.scrollIntoView({ block: 'nearest' });
    }
    function pick(k) {
      const f = items[k];
      if (!f || !token) return;
      const ref = /\s/.test(f) ? `@"${f}"` : '@' + f;
      promptEl.setRangeText(ref + (f.endsWith('/') ? '' : ' '), token.start, token.end, 'end');
      hide();
      promptEl.dispatchEvent(new Event('input'));
      if (f.endsWith('/')) update(); // a folder: keep completing inside it
    }
    function update() {
      const t = current();
      if (!t || !cwd) return hide();
      token = t;
      loading = true;
      clearTimeout(timer);
      timer = setTimeout(async () => {
        const my = ++seq;
        try {
          const d = await getJson(`/api/files?cwd=${encodeURIComponent(cwd)}&q=${encodeURIComponent(t.q)}`);
          if (my !== seq || !token) return;
          items = d.files; index = 0; loading = false; render();
        } catch { hide(); }
      }, 120);
    }
    promptEl.addEventListener('input', update);
    promptEl.addEventListener('click', update);
    promptEl.addEventListener('blur', () => setTimeout(hide, 100));
    // Capture phase: before the slash list and the Enter-to-send handler.
    promptEl.addEventListener('keydown', (e) => {
      // Enter while the list for "@…" is still loading must not send the half-typed message.
      if (e.key === 'Enter' && !e.shiftKey && token && loading) { e.preventDefault(); e.stopImmediatePropagation(); return; }
      if (box.hidden || !items.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { index = (index + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; render(); }
      else if (e.key === 'Enter' || e.key === 'Tab') pick(index);
      else if (e.key === 'Escape') hide();
      else return;
      e.preventDefault();
      e.stopImmediatePropagation();
    }, true);
    return { hide };
  })();

  // --- image attachments: paste or drop into the message box ---
  const attachments = (() => {
    const box = $('attachments');
    let list = []; // { media_type, data, name, url }
    const TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
    const MAX_B64 = 6.5 * 1024 * 1024;
    function render() {
      box.innerHTML = '';
      list.forEach((a, k) => {
        const w = document.createElement('div');
        w.className = 'att';
        const x = Object.assign(document.createElement('button'), { type: 'button', textContent: '×', title: tl('Remove') });
        x.onclick = () => { URL.revokeObjectURL(a.url); list.splice(k, 1); render(); };
        w.append(Object.assign(document.createElement('img'), { src: a.url, alt: a.name, title: a.name }), x);
        box.appendChild(w);
      });
      box.hidden = !list.length;
    }
    const toB64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
    /** Big photos are scaled down (longest side 2000 px, JPEG) to fit the API's 5 MB limit. */
    async function shrink(file) {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const c = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return new Promise((res) => c.toBlob(res, 'image/jpeg', 0.85));
    }
    async function add(file) {
      if (!file || !file.type.startsWith('image/')) return false;
      let blob = file;
      let type = file.type;
      if (!TYPES.includes(type) || file.size > MAX_B64 * 0.7) { blob = await shrink(file); type = 'image/jpeg'; }
      const data = await toB64(blob);
      if (data.length > MAX_B64) { el('div', 'error', tl('The image “{0}” is too large', file.name)); return true; }
      list.push({ media_type: type, data, name: file.name || 'image', url: URL.createObjectURL(blob) });
      render();
      return true;
    }
    promptEl.addEventListener('paste', (e) => {
      const files = [...(e.clipboardData?.items || [])].filter((i) => i.kind === 'file').map((i) => i.getAsFile());
      if (!files.some((f) => f?.type.startsWith('image/'))) return;
      e.preventDefault();
      files.forEach(add);
    });
    // Images dropped anywhere on the page (not taken by something under the pointer, like the file
    // tree) go into the message. In VS Code's webview the host takes a drag of files from outside
    // (Finder) for itself, to open them in the editor, unless Shift is held: its script in the
    // webview listens on the window — a dragenter the page hasn't handled, and every dragover, tell
    // the workbench, which then makes the webview ignore the pointer until the drag ends. So an
    // image drag is handled on the document, which the events reach first, and goes no further.
    const hasImage = (dt) => !!dt && [...dt.items].some((i) => i.type.startsWith('image/'));
    const claim = (e) => {
      const ours = !e.defaultPrevented && hasImage(e.dataTransfer);
      if (e.type === 'dragover') form.classList.toggle('dragover', ours);
      if (!ours) return;
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'copy';
    };
    document.addEventListener('dragenter', claim);
    document.addEventListener('dragover', claim);
    document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) form.classList.remove('dragover'); });
    document.addEventListener('drop', (e) => {
      form.classList.remove('dragover');
      if (e.defaultPrevented) return;
      const files = [...(e.dataTransfer?.files || [])].filter((f) => f.type.startsWith('image/'));
      if (!files.length) return;
      e.preventDefault();
      files.forEach(add);
      promptEl.focus();
    });
    return {
      get count() { return list.length; },
      /** Takes the attachments for sending (the strip is cleared; the previews stay valid). */
      take() { const out = list; list = []; render(); return out; },
    };
  })();

  // --- session titles ---
  async function autoTitle(firstPrompt, sid) {
    if (!settings.get('autoTitle') || !firstPrompt || !sid) return;
    try {
      const { title } = await sessionControl({ subtype: 'generate_session_title', description: firstPrompt.slice(0, 1000) }, sid);
      if (!title) return;
      await sessionControl({ subtype: 'rename_session', title }, sid);
      if (sessionId === sid) { sessionTitle = title; renderMeta(); }
      refreshHistoryCount();
      if (sidePanel.isShowing('history')) renderSessions();
    } catch {}
  }

  async function renameSession(id, title) {
    await sessionControl({ subtype: 'rename_session', title }, id);
    if (id === sessionId) { sessionTitle = title; renderMeta(); }
  }

  /**
   * While Claude works, the Stop button (and switching the project) ask first: stop now, ask Claude
   * to finish (a message telling it to wrap up, read between its steps), or cancel.
   * Resolves to 'stop' | 'finish' | null.
   */
  function askStop(text) {
    return new Promise((resolve) => {
      const d = document.createElement('dialog');
