<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="i18n.js"></script>
<script>
  // Without i18n.js (e.g. an older server that doesn't serve it) the page still works, in English.
  if (typeof tl !== 'function') {
    window.LANG = 'en'; window.LOCALE = 'en-US';
    window.tl = (s, ...a) => (a.length ? String(s).replace(/\{(\d+)\}/g, (m, i) => (i < a.length ? String(a[i]) : m)) : s);
    window.tlMsg = (m) => String(m ?? '');
    window.tn = (n, forms) => { const f = forms.split('|'); return (n === 1 ? f[0] : f[f.length - 1]).replace(/\{0\}/g, String(n)); };
    window.i18nDom = () => {};
  }
</script>
<script>if (window.CW?.embed === 'vscode' || /[?&]embed=vscode\b/.test(location.search)) document.documentElement.classList.add('embed');</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude-AI</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --text: #1f1e1c; --muted: #6b6860;
    --border: #e3e0d8; --accent: #c96442; --accent-text: #ffffff;
    --user-bg: #efece4; --code-bg: #f1efe9; --tool-bg: #f4f2ec; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19; --panel: #252422; --text: #ece9e1; --muted: #a39f95;
      --border: #3a3834; --accent: #d97757; --accent-text: #1c1b19;
      --user-bg: #302e2a; --code-bg: #2d2b28; --tool-bg: #2a2926; --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; flex: 1; min-width: 200px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  select, button, textarea { font: inherit; color: inherit; }
  select, .btn {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
  }
  .btn { cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:hover { border-color: var(--muted); }
  main { flex: 1; overflow-y: auto; }
  #log { max-width: 860px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; overflow-wrap: anywhere; }
  .msg.user { background: var(--user-bg); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .msg.assistant { background: transparent; padding-left: 0; padding-right: 0; }
  .msg.assistant p { margin: 0 0 .6em; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  :not(pre) > code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  details.tool {
    background: var(--tool-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 13px;
  }
  /* A long command or URL in the title wraps anywhere instead of widening the chat. */
  details.tool summary { cursor: pointer; color: var(--muted); overflow-wrap: anywhere; word-break: break-word; min-width: 0; }
  details.tool summary b { color: var(--text); }
  details.tool.running { border-color: var(--accent); }
  details.tool.denied { border: 2px solid var(--error); }
  details.tool.denied summary { color: var(--error); }
  details.tool.running summary::after { content: var(--running-label, ' — running…'); color: var(--accent); }
  details.tool pre { margin: 6px 0 0; max-height: 320px; }
  details.tool pre.wrap { white-space: pre-wrap; }
  .status { color: var(--muted); font-size: 12px; text-align: center; }
  .status.wait-note .btn { margin-left: 8px; font-size: 11px; padding: 1px 8px; }
  .error { color: var(--error); white-space: pre-wrap; font-size: 13px; }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; position: relative; }
  .jump {
    position: absolute; top: -46px; left: 50%; transform: translateX(-50%); z-index: 5;
    background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.18);
  }
  .jump[hidden] { display: none; }
  .jump.urgent { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  form { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 240px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send { background: var(--accent); color: var(--accent-text); border: none; border-radius: 10px;
          padding: 10px 16px; cursor: pointer; min-width: 90px; }
  #send:disabled { opacity: .5; cursor: default; }
  #stopSpeech {
    width: 44px; height: 44px; flex: none; display: grid; place-items: center; padding: 0; cursor: pointer;
    background: var(--bg); color: var(--accent); border: 1px solid var(--accent); border-radius: 10px;
  }
  #stopSpeech[hidden] { display: none; }
  #stopSpeech:hover { background: var(--user-bg); }
  #stopSpeech svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #stopSpeech svg rect { fill: currentColor; stroke: none; }
  .hint { max-width: 860px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
  .perm {
    border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; background: var(--panel);
  }
  .perm .title { font-weight: 600; margin-bottom: 6px; }
  .perm pre { margin: 0 0 8px; max-height: 240px; }
  .perm .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn.allow { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn.deny { border-color: var(--danger, #e5534b); color: var(--danger, #e5534b); }
  .perm .verdict { color: var(--muted); font-size: 13px; }
  .perm .perm-reason { color: var(--muted); font-size: 12px; margin: -2px 0 6px; }
  .history-more { display: block; margin: 8px auto 14px; }
  .elicit .elicit-msg { margin: 4px 0 8px; white-space: pre-wrap; }
  .elicit .elicit-field { display: flex; flex-direction: column; gap: 3px; margin: 6px 0; font-size: 13px; }
  .elicit .elicit-field.inline { flex-direction: row; align-items: center; gap: 6px; flex-wrap: wrap; }
  .elicit .elicit-field input:not([type=checkbox]), .elicit .elicit-field select { padding: 5px 8px; font: inherit; max-width: 420px; }
  .elicit .elicit-hint { color: var(--muted); font-size: 12px; }
  .elicit .elicit-multi { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .rule-row { padding: 5px 8px; border-radius: 6px; font-size: 13px; }
  .rule-row:hover { background: var(--user-bg); }
  .rule-row code { font-size: 12px; }
  .rule-row.off { opacity: .55; }
  .rule-desc { margin-top: 2px; }
  .rule-src { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .status-row { display: flex; gap: 12px; padding: 3px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  .status-row .k { color: var(--muted); min-width: 140px; }
  .status-row .v { flex: 1; overflow-wrap: anywhere; }
  .status-pre { font-size: 12px; white-space: pre-wrap; }
  .export-bar { display: flex; gap: 8px; align-items: center; margin: 6px 0 10px; }
  .export-pre { max-height: 50vh; overflow: auto; }
  .ctx-pop .ctx-compact { display: block; width: 100%; margin-top: 8px; }
  .msg.assistant.aside { border-left: 3px solid var(--accent); padding-left: 10px; }
  .msg.assistant.aside .aside-label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .mcp-row { display: flex; align-items: center; gap: 6px; }
  .mcp-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mcp-act { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 11px; padding: 0 6px; cursor: pointer; }
  .mcp-act:hover { color: var(--accent); border-color: var(--accent); }
  /* Left, like the answers and tool cards: #log is a flex column, so auto margins would centre it. */
  details.thinking { align-self: stretch; padding: 2px 10px; color: var(--muted); font-size: 13px; border-left: 2px solid var(--border); }
  details.thinking summary { cursor: pointer; user-select: none; }
  details.thinking .think-body { padding: 4px 0 2px; font-style: italic; }
  details.thinking .think-orig { background: none; border: none; padding: 0; color: var(--accent); font: inherit; font-size: 12px; font-style: normal; cursor: pointer; text-decoration: underline; }
  body.hide-thinking details.thinking, body.focus-view details.thinking { display: none; }
  .composer { position: relative; flex: 1; display: flex; }
  #slash {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); max-height: 260px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 4px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12); display: none;
  }
  #slash div { padding: 5px 10px; border-radius: 6px; cursor: pointer; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #slash div small { color: var(--muted); font-family: inherit; margin-left: 8px; }
  #slash div.active, #slash div:hover { background: var(--user-bg); }
  dialog {
    width: min(720px, calc(100vw - 32px)); max-height: min(80vh, 760px); padding: 0;
    border: 1px solid var(--border); border-radius: 14px; background: var(--panel); color: var(--text);
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg { display: flex; flex-direction: column; max-height: min(80vh, 760px); }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .dlg-head h2 { font-size: 15px; margin: 0; flex: 1; }
  .dlg-body { overflow-y: auto; padding: 8px 16px 16px; }
  .stop-ask { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 12px; }
  .dlg-body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
  .row {
    display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
    border-radius: 8px; padding: 7px 10px; cursor: pointer; color: inherit; font: inherit;
  }
  .row:hover { background: var(--user-bg); }
  .row.current { border-color: var(--accent); }
  .row.missing .s:not(.where) { color: var(--error); }
  .relink-note { margin: 10px 0 12px; line-height: 1.45; }
  .relink-offer { margin: 8px 4px; padding: 8px; font-size: 12px; line-height: 1.45; border: 1px dashed var(--border); border-radius: 8px; }
  .relink-offer .btn { margin-top: 6px; }
  .row .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .s { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pathbar { display: flex; gap: 6px; }
  .projects-body { padding: 8px 10px 16px; }
  .projects-body .side-sub { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin: 10px 2px 6px; }
  .projects-body .side-sub:first-child { margin-top: 2px; }
  .projects-body .pathbar input { min-width: 0; }
  .projects-body .browser { max-height: 220px; }
  .pathbar input {
    flex: 1; min-width: 0; font: 13px ui-monospace, Menlo, monospace; color: inherit;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  .browser { border: 1px solid var(--border); border-radius: 8px; margin-top: 6px; max-height: 260px; overflow-y: auto; padding: 4px; }
  .browser .row { padding: 4px 8px; font-size: 14px; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 10px; }
  .history-sep { color: var(--muted); font-size: 12px; text-align: center; border-top: 1px dashed var(--border); padding-top: 8px; }
  #spinner {
    max-width: 860px; margin: 0 auto 8px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); display: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #spinner.on { display: block; }
  #spinner .glyph { color: var(--accent); display: inline-block; width: 1.2em; }
  #spinner .verb { color: var(--accent); }
  #spinner .queued-count { font: inherit; color: var(--accent); background: none; border: none; padding: 0 0 0 .5em; cursor: pointer; text-decoration: underline dotted; }
  .proc-toggle { font-size: 13px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
  .proc { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; }
  .proc:hover { background: var(--user-bg); }
  .proc .info { flex: 1; min-width: 0; }
  .proc .cmd { font: 13px ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proc .s { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proc.exited .cmd { color: var(--muted); text-decoration: line-through; }
  .proc .kind { color: var(--accent); display: inline-block; width: 1.2em; text-align: center; margin-right: 4px; }
  #procList .proc .info { cursor: pointer; }
  .proc-more { margin: 0 6px 6px; padding: 6px 8px; font-size: 12px; background: var(--user-bg); border: 1px solid var(--border); border-radius: 6px; overflow-wrap: anywhere; }
  .proc-more[hidden] { display: none; }
  .proc-more b { font-weight: 600; }
  .proc-more .proc-cmdline { font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  .proc-more .proc-out { margin: 4px 0 0; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 11px; }
  .proc .fold { flex: none; align-self: flex-start; margin-top: 3px; width: 1.1em; padding: 0; background: none; border: none; color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; text-align: center; }
  .proc span.fold { cursor: default; }
  .proc button.fold:hover { color: var(--accent); }
  /* The processes view is open: the same list under the input would only repeat it. */
  body.procs-in-side #procs { display: none; }
  /* Likewise the agents view and the agent rows of the tasks panel. */
  body.agents-in-side #tasks .task-agent { display: none; }
  .agent .info { cursor: pointer; }
  .agent.ended .cmd { color: var(--muted); }
  .agent-more { margin: 0 6px 6px 30px; padding: 6px 8px; font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto;
    background: var(--user-bg); border: 1px solid var(--border); border-radius: 6px; }
  .agent-more[hidden] { display: none; }
  .agent-more b { font-weight: 600; }
  .agent-run .what { font-weight: 600; }
  .agent-run.ended .cmd { color: var(--muted); }
  #procBtn .count, #historyBtn .count { color: var(--accent); margin-left: 4px; }
  .msg.user .queue-note { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .msg.user .queue-note .btn { font-size: 12px; padding: 1px 8px; margin: 4px 6px 0 0; }
  .msg.user .queue-confirm { margin-top: 6px; padding: 6px 8px; border: 1px solid #d29922; border-radius: 6px; color: var(--text); white-space: pre-wrap; }
  /* Message actions (rewind / continue from here), times, attachments */
  .msg.user { position: relative; }
  .msg-actions { position: absolute; top: -12px; right: 8px; display: none; gap: 2px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 1px; box-shadow: 0 2px 8px rgba(0,0,0,.12); white-space: nowrap; }
  .msg.user:hover .msg-actions, .msg.user:focus-within .msg-actions { display: flex; }
  .msg-actions button { background: none; border: 0; color: var(--text); font: inherit; font-size: 12px; padding: 2px 7px; border-radius: 6px; cursor: pointer; }
  .msg-actions button:hover { background: var(--user-bg); }
  .msg-time { display: none; font-size: 11px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
  body.show-times .msg-time { display: block; }
  .msg.user .msg-time { text-align: right; }
  .msg-images { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .msg-images img { max-width: 220px; max-height: 160px; border-radius: 8px; border: 1px solid var(--border); }
  .rewind-card { align-self: flex-end; max-width: 85%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--panel); font-size: 13px; }
  .rewind-card .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rewind-card ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
  /* Diffs of Edit / Write */
  .diff { margin: 0; padding: 6px 0; font: 12px/1.45 ui-monospace, Menlo, monospace; overflow: auto; max-height: 420px;
    background: var(--code-bg, rgba(127,127,127,.08)); border-radius: 8px; }
  .diff div { padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diff .add { background: rgba(46, 160, 67, .18); }
  .diff .del { background: rgba(248, 81, 73, .18); }
  .diff .gap { color: var(--muted); font-style: italic; }
  .diff-file { font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  .tool .diff { margin: 6px 0; }
  .raw-toggle { font-size: 12px; color: var(--muted); cursor: pointer; background: none; border: 0; padding: 0; text-decoration: underline; }
  /* Focus view: only the conversation (prompts and permission cards stay) */
  body.focus-view #log > details.tool, body.focus-view #log > .status, body.focus-view #tasks { display: none; }
  /* Context and plan-limit meters in the chat header */
  #ctxMeter, #usageMeter { font-size: 12px; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
  #ctxMeter.warn, #usageMeter.warn { color: #d29922; border-color: #d29922; }
  #ctxMeter.full, #usageMeter.full { color: #e5534b; border-color: #e5534b; }
  #ctxMeter[hidden], #usageMeter[hidden] { display: none; }
  /* Chat panel header: the session's title, then its context, model and permission mode. */
  .chat-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 16px; border-bottom: 1px solid var(--border); background: var(--user-bg); flex: none; flex-wrap: wrap; }
  .chat-title { flex: 1; min-width: 80px; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-head select { padding: 3px 8px; font-size: 12px; }
  .ctx-pop { position: fixed; z-index: 70; min-width: 280px; max-width: 360px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18); font-size: 13px; }
  .ctx-pop .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--user-bg); margin: 6px 0 8px; }
  .ctx-pop .row { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
  .ctx-pop .row span:last-child { color: var(--muted); }
  /* Legend marker: the category's colour in the bar; outlined when it has no segment there. */
  .ctx-pop .row i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; vertical-align: -1px;
    box-sizing: border-box; border: 1px dashed var(--muted); }
  .ctx-pop .row i.on { border: none; }
  .ctx-pop .row i.free { border: 1px solid var(--border); background: var(--user-bg); }
  /* @-mentions and image attachments in the composer */
  #mention { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); max-height: 260px; overflow-y: auto; z-index: 5;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  #mention[hidden] { display: none; }
  #mention div { padding: 4px 10px; border-radius: 6px; cursor: pointer; font: 13px ui-monospace, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mention div.active, #mention div:hover { background: var(--user-bg); }
  #attachments { display: flex; flex-wrap: wrap; gap: 6px; max-width: 860px; margin: 0 auto 6px; }
  #attachments[hidden] { display: none; }
  #attachments .att { position: relative; }
  #attachments img { height: 56px; border-radius: 6px; border: 1px solid var(--border); display: block; }
  #attachments button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 12px; line-height: 14px; padding: 0; cursor: pointer; }
  #form.dragover textarea { outline: 2px dashed var(--accent); }
  .msg.user.queued { opacity: .75; border: 1px dashed var(--border); }
  details.tool .sub { margin: 6px 0 2px 10px; padding-left: 8px; border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
  details.tool .sub:empty { display: none; }
  details.tool.nested { font-size: 12px; padding: 3px 8px; }
  .panel { max-width: 860px; margin: 6px auto 0; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .panel:empty { display: none; }

    background: var(--user-bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }

  /* In the VS Code extension's webview (?embed=vscode) only the chat column stays: VS Code has the
     explorer, editor and terminal, and the extension shows projects, history, processes and subagents
     in its own views. The voice, microphone and settings buttons move into the chat head. */
  html.embed header, html.embed nav.activity, html.embed #sidebar, html.embed #viewer { display: none !important; }

  html.embed #tasks, html.embed #procs { display: none !important; }
  #counts { display: flex; gap: 14px; flex-wrap: wrap; max-width: 860px; margin: 6px auto 0; font-size: 12px; }

  .act-spacer { flex: 1; }
  /* Side-bar buttons in two groups (upper / lower half of the panel); buttons can be dragged between them. */
  .act-group { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 36px; width: 100%; border-radius: 8px; }
  .act-group.drop { background: var(--user-bg); box-shadow: inset 0 0 0 1px var(--accent); }

  .act-btn.dragging { opacity: .4; }
  /* The voice menu opens to the right of its button at the bottom of the side bar. */
  .menu {
    position: absolute; left: calc(100% + 10px); bottom: 0; z-index: 40; min-width: 230px;

  .menu-section { margin-top: 8px; padding: 6px 8px 2px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .menu-select { justify-content: space-between; gap: 10px; }

  .menu-select .rate-val { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .menu-select select, .menu-select input { max-width: 200px; background: var(--bg); color: inherit; border: 1px solid var(--border); border-radius: 6px; padding: 2px 4px; font: inherit; font-size: 13px; }
  .menu-note { padding: 2px 8px 6px; color: var(--muted); font-size: 12px; white-space: normal; max-width: 280px; }
  #dictBar { max-width: 860px; margin: 0 auto 6px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }

    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }

  .workspace { flex: 1; display: flex; min-height: 0; position: relative; }
  .chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .activity {
    width: 48px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px 0; background: var(--panel); border-right: 1px solid var(--border); z-index: 31;
  }
  .act-btn {
    position: relative; width: 36px; height: 36px; display: grid; place-items: center;
    background: none; border: none; border-radius: 8px; color: var(--muted); cursor: pointer;
  }
  .act-btn:hover { background: var(--user-bg); color: var(--text); }
  .act-btn.on { color: var(--text); background: var(--user-bg); }

  .act-btn .badge {
    position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); font: 600 10px/16px -apple-system, sans-serif; text-align: center;
  }
  .act-btn .badge[hidden] { display: none; }
  /* The panel animates its width; the content keeps its own width so it doesn't reflow while sliding. */
  #sidebar {
    width: var(--side-w, 280px); flex: none; min-height: 0; overflow: hidden; position: relative;
    background: var(--panel); border-right: 1px solid var(--border);
    transition: width .22s ease, border-color .22s ease;

  .side-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; background: var(--user-bg); }

  .btn.icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  #viewerClose.armed { color: #e5534b; border-color: #e5534b; }
  #tree { flex: 1; overflow: auto; padding: 4px 0 16px; font-size: 13px; }

  .session-rename { display: block; width: calc(100% - 16px); margin: 4px 8px; padding: 4px 6px; font: inherit; font-size: 13px; color: inherit;
    background: var(--bg); border: 1px solid var(--accent); border-radius: 6px; }

  /* Search in files (the navigator's panel under its header; results replace the tree while a query is typed). */

  .tree-results { flex: 1; overflow: auto; padding: 4px 0 16px; font-size: 13px; }
  .tree-results[hidden], #tree[hidden] { display: none; }
  .sr-head { display: flex; align-items: center; gap: 4px; padding: 2px 8px; cursor: pointer; white-space: nowrap; user-select: none; }
  .sr-head:hover, .sr-line:hover, .sr-name:hover { background: var(--user-bg); }
  .sr-head .twisty { width: 12px; flex: none; color: var(--muted); font-size: 10px; text-align: center; }
  .sr-head .name { overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 70%; }
  .sr-head .dir { overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 11px; min-width: 0; }

  .sr-line .t { overflow: hidden; text-overflow: ellipsis; font: 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace; }

  .sr-name { padding-left: 22px; }
  .sr-name .t { overflow: hidden; text-overflow: ellipsis; }
  .sr-group[data-collapsed] > :not(.sr-head) { display: none; }
  .sr-note { padding: 2px 8px 2px 30px; color: var(--muted); font-size: 12px; }
  .tree-flash { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 5; padding: 6px 10px; border-radius: 8px;
    font-size: 13px; background: var(--panel); border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  .tree-flash.error { border-color: #e5534b; color: #e5534b; }
  .tree-flash[hidden] { display: none; }
  .tree-note { padding: 2px 8px; color: var(--muted); font-size: 12px; }
  .side-resize { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; z-index: 5; }
  /* Two halves, one per group of side-bar buttons; with both open the divider between them can be dragged. */

  /* File viewer between the side panel and the chat */
  #viewer {
    width: var(--viewer-w, 560px); flex: none; min-width: 0; min-height: 0; position: relative;

    display: flex; align-items: center; gap: 4px; max-width: 220px; padding: 7px 6px 7px 12px; font-size: 13px;

  .viewer-tab .x { background: none; border: none; color: inherit; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; border-radius: 4px; opacity: .6; }
  .viewer-tab .x:hover { opacity: 1; background: var(--user-bg); }
  .viewer-head { display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--border); flex: none; }
  .viewer-path { flex: 1; min-width: 0; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-body { flex: 1; overflow: auto; padding: 18px 28px 48px; min-height: 0; }
  .viewer-resize { position: absolute; top: 0; right: -3px; width: 6px; height: 100%; cursor: col-resize; z-index: 5; }
  /* Text files: monospace with line numbers (CSS counters, so wrapped lines stay aligned) */
  .code-view { margin: 0; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; counter-reset: ln; white-space: pre; width: max-content; min-width: 100%; }
  .code-view.wrap { white-space: pre-wrap; overflow-wrap: anywhere; width: auto; }
  .code-view .l { counter-increment: ln; position: relative; padding-left: 4.4em; min-height: 1.6em; }
  .code-view .l::before {
    content: counter(ln); position: absolute; left: 0; width: 3.4em; text-align: right;
    color: var(--muted); opacity: .55; user-select: none;
  }
  /* File editor (Monaco): fills the body; a bar above it for save conflicts and errors */
  .viewer-body:has(> .viewer-editor) { padding: 0; overflow: hidden; }
  .viewer-editor { width: 100%; height: 100%; }
  .viewer-bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; font-size: 12px;
    border-bottom: 1px solid #d29922; background: color-mix(in srgb, #d29922 12%, var(--bg)); }
  .viewer-bar[hidden] { display: none; }
  .viewer-bar .msg { flex: 1; min-width: 200px; }
  .viewer-bar .btn { font-size: 12px; padding: 2px 8px; }
  .viewer-tab .dirty { color: var(--accent); }
  /* Search in the preview (the editor has Monaco's own): a row above the body */
  .viewer-find { flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .viewer-find[hidden] { display: none; }
  .viewer-find input { flex: 1; min-width: 80px; font: 13px inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }
  .viewer-find input:focus { outline: none; border-color: var(--accent); }
  .viewer-find .count { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 7ch; text-align: right; white-space: nowrap; }
  .viewer-find .count.none { color: #e5534b; }
  #viewerFindCase { font: 600 12px/16px ui-monospace, SFMono-Regular, Menlo, monospace; min-width: 30px; }
  #viewerFindCase.on, #viewerFindBtn.on { border-color: var(--accent); color: var(--accent); }
  ::highlight(viewer-find) { background: rgba(255, 200, 0, .4); }
  ::highlight(viewer-find-cur) { background: #ff9632; color: #000; }
  #viewerMode .caret { width: 10px; height: 10px; margin-left: 1px; }
  #viewerModeMenu .menu-row svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #viewerModeMenu .menu-row .check { margin-left: auto; padding-left: 16px; color: var(--accent); }
  /* Hex view (any file size): virtual rows inside a native scroller, status line below */
  .viewer-body:has(> .hex-view) { padding: 0; overflow: hidden; }
  .hex-view { display: flex; flex-direction: column; height: 100%; outline: none; font: 12.5px/18px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .hex-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: auto; }
  .hex-rows { position: sticky; top: 0; height: 100%; overflow: hidden; padding: 4px 10px; box-sizing: border-box; white-space: pre; }
  .hex-row { height: 18px; display: flex; gap: 14px; }
  .hex-off { color: var(--muted); user-select: none; }
  .hex-bytes span, .hex-text span { cursor: text; border-radius: 2px; }
  .hex-bytes span { display: inline-block; width: 2ch; margin-right: 1ch; }
  .hex-bytes span.g { margin-right: 2ch; }
  .hex-text span { display: inline-block; width: 1ch; }
  .hex-view .m { color: var(--accent); font-weight: 600; }
  .hex-view .z { opacity: .45; }
  .hex-view .c { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .hex-view.focus .c.on { background: var(--accent); color: var(--accent-text); opacity: 1; }
  .hex-status { flex: none; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 4px 10px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 12px; background: var(--panel); }
  .hex-status input { width: 12ch; font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .hex-status button { font: inherit; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; }
  .hex-status button:disabled { color: var(--muted); cursor: default; }
  .hex-status .warn { color: #d29922; flex-basis: 100%; }
  .hex-view.ins.focus .c.on { background: none; color: var(--accent); box-shadow: inset 2px 0 0 var(--accent); }
  .viewer-tab .x.armed { color: #e5534b; opacity: 1; }
  .viewer-lang { display: inline-flex; align-items: center; gap: 2px; margin-right: 4px; }
  .viewer-lang[hidden] { display: none; }
  /* Same height as the icon buttons next to it: 16px icon + 2 * 4px padding + 2 * 1px border. */
  .viewer-lang select { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; height: 26px; box-sizing: border-box; padding: 0 4px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; cursor: pointer; }
  .viewer-lang select.on { border-color: var(--accent); color: var(--accent); }
  .viewer-lang select:disabled { opacity: .85; cursor: wait; }
  .viewer-reading { display: inline-flex; gap: 4px; }
  #viewerPause, #viewerSpeak { gap: 4px; }
  #viewerSpeak .time { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; color: var(--muted); }
  #viewerPause .time { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .viewer-reading[hidden] { display: none; }
  .viewer-lang .st { font-size: 11px; color: var(--muted); margin-left: 4px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .txt-doc { max-width: 820px; line-height: 1.6; }
  .txt-doc p { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 1em; }
  .viewer-body:has(> .html-frame) { padding: 0; overflow: hidden; }
  .html-frame { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .viewer-more { color: var(--muted); font-size: 12px; padding: 8px 0 0 4.4em; }
  .viewer-body:has(.code-view) { padding: 12px 16px 40px 8px; }
  details.tool summary .file-link { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  details.tool summary .file-link:hover { text-decoration: underline; }
  .tool-image { display: block; max-width: min(100%, 384px); margin: 8px 0; border-radius: 8px; border: 1px solid var(--border); }
  .viewer-image { max-width: 100%; border: 1px solid var(--border); border-radius: 6px;
    background: repeating-conic-gradient(var(--panel) 0 25%, var(--bg) 0 50%) 0 0 / 16px 16px; }
  .viewer-meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .viewer-audio { display: block; width: 100%; max-width: 560px; }
  .viewer-video { display: block; max-width: 100%; max-height: calc(100vh - 160px); background: #000; border-radius: 6px; }
  .viewer-wave { position: relative; width: 100%; max-width: 560px; height: 72px; margin-top: 10px; cursor: pointer; }
  .viewer-wave canvas { display: block; width: 100%; height: 100%; }
  .viewer-cover { display: block; max-width: min(240px, 100%); max-height: 240px; margin-top: 10px; border-radius: 6px; border: 1px solid var(--border); }
  .viewer-tags { max-width: 560px; margin-top: 10px; font-size: 13px; }
  .viewer-tags .head { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .viewer-tags dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
  .viewer-tags dt { color: var(--muted); }
  .viewer-tags dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 12em; overflow-y: auto; }
  .viewer-wave .note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
  #viewerSpeak.on, #viewerWrap.on { border-color: var(--accent); color: var(--accent); }
  .md { max-width: 820px; line-height: 1.65; overflow-wrap: anywhere; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { line-height: 1.3; margin: 1.4em 0 .5em; }
  .md h1 { font-size: 1.7em; border-bottom: 1px solid var(--border); padding-bottom: .3em; margin-top: .2em; }
  .md h2 { font-size: 1.35em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
  .md h3 { font-size: 1.15em; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md .md-table { margin: 0 0 1em; }
  .md ul, .md ol { padding-left: 1.6em; }
  .md li > ul, .md li > ol, .md li > p { margin: .25em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md blockquote { border-left: 3px solid var(--border); padding: .1em 1em; color: var(--muted); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }
  .md img { max-width: 100%; }
  .md a { color: var(--accent); }
  .md .md-table { overflow-x: auto; }
  .md table { border-collapse: collapse; font-size: 14px; }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 10px; }
  .md th { background: var(--panel); }
  @media (max-width: 760px) {
    #viewer { position: absolute; left: 48px; right: 0; top: 0; bottom: 0; width: auto; z-index: 25; }
    .viewer-resize { display: none; }
  }
  @media (max-width: 760px) {
    /* On phones the panel slides over the chat instead of squeezing it. */
    #sidebar {
      position: absolute; left: 48px; top: 0; bottom: 0; z-index: 30; width: min(80vw, 320px); --side-w: min(80vw, 320px);
      box-shadow: 4px 0 24px rgba(0,0,0,.25); transition: transform .22s ease;
    }
    body.side-collapsed #sidebar { width: min(80vw, 320px); transform: translateX(-110%); box-shadow: none; }
    .side-resize { display: none; }
  }
</style>

    <button class="btn icon" id="viewerInsert" type="button" title="Insert the path into the message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 10l-5 5 5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg></button>
    <button class="btn icon" id="viewerSave" type="button" title="Save (⌘S)" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 3v5h7V3"/><path d="M7 21v-7h10v7"/></svg></button>
    <button class="btn icon" id="viewerReload" type="button" title="Reload the file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
    <button class="btn icon" id="viewerClose" type="button" title="Close the viewer panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="menu ctx-menu" id="viewerModeMenu" role="menu" hidden></div>
  <div class="viewer-bar" id="viewerBar" hidden></div>
  <div class="viewer-find" id="viewerFind" role="search" hidden>
    <input id="viewerFindInput" type="text" placeholder="Find" spellcheck="false" autocomplete="off" aria-label="Find in the text">
    <span class="count" aria-live="polite"></span>

    <button class="btn icon" id="viewerFindPrev" type="button" title="Previous (⇧Enter, ⇧⌘G)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="btn icon" id="viewerFindNext" type="button" title="Next (Enter, ⌘G)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="btn icon" id="viewerFindClose" type="button" title="Close the search (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="viewer-body" id="viewerBody"></div>
  <div class="viewer-resize" id="viewerResize" title="Drag to change the width"></div>
</section>
<div class="chat-col">
<div class="chat-head">
  <span class="chat-title" id="chatTitle">New chat</span>
  <button id="ctxMeter" type="button" title="Context fill — click for details" hidden></button>
  <button id="usageMeter" type="button" hidden></button>
  <select id="modelSel" title="Model (/model)">
    <option value="">def</option>
    <option value="claude-fable-5-1">Fable 5.1</option>
    <option value="claude-opus-5-5">Opus 5.5</option>
    <option value="claude-sonnet-5-5">Sonnet 5.5</option>
    <option value="claude-haiku-5-5">Haiku 5.5</option>
  </select>
  <select id="effortSel" title="Effort — thinking depth; ultracode — orchestration through Workflow on top of any level (/effort)"></select>
  <select id="mode" title="Permission mode (Shift+Tab in the input box switches it, like in the console)"></select>
</div>
<main id="scroller"><div id="log"></div></main>





<footer>
  <button class="jump" id="jumpBtn" type="button" hidden>↓ New messages</button>
  <div id="dictBar" hidden aria-live="polite"><span class="txt"></span><button class="btn" id="dictCancel" type="button" hidden>Cancel</button></div>
  <div id="spinner" aria-live="off"><span class="glyph">✻</span><span class="verb"></span> <span class="info"></span><button type="button" class="queued-count" title="Show the first queued message" hidden></button></div>
  <div id="attachments" hidden></div>
  <form id="form">
    <div class="composer">
      <div id="slash" role="listbox"></div>
      <div id="mention" role="listbox" hidden></div>
      <textarea id="prompt" rows="1" placeholder="Message for Claude…" autofocus></textarea>
    </div>
    <button id="stopSpeech" type="button" title="Stop speech" aria-label="Stop speech" hidden></button>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="hint">Enter — send (also while working), Shift+Enter — new line, <span id="histKeys">⌘↑/⌘↓</span> — past messages, Shift+Tab — mode, / — commands, @ — file, paste an image — ⌘V, Esc — interrupt</div>
  <div class="panel" id="tasks" aria-live="off"></div>
  <div class="panel" id="procs" aria-live="off"></div>
  <div id="counts" hidden></div>
</footer>
</div>
</div>

<script>
  i18nDom(document.body); // static markup into the UI language (i18n.js)
  const $ = (id) => document.getElementById(id);
  const log = $('log'), scroller = $('scroller'), form = $('form');
  const promptEl = $('prompt'), sendBtn = $('send'), modeEl = $('mode'), metaEl = $('meta');

  // Per-browser convenience storage; the page works without it.
  /**
   * Settings live in localStorage (shared by all tabs). The working context of a tab — project,
   * session, model, effort, permission mode — lives in sessionStorage, so switching the project in one
   * tab leaves the others alone and each tab keeps its own context across reloads. A new tab
   * starts from the last used project/model/effort/mode ("seed"), but never from another tab's session.
   * '' in sessionStorage means "explicitly empty" (don't fall back to the seed).
   */
  const TAB_KEYS = {
    'claude.cwd': 'seed', 'claude.model': 'seed', 'claude.effort': 'seed', 'claude.ultracode': 'seed', 'claude.permMode': 'seed',
    'claude.sessionId': 'tab', 'claude.tabId': 'tab',
  };
  const store = {
    get(k) {
      try {
        if (!(k in TAB_KEYS)) return localStorage.getItem(k);
        const v = sessionStorage.getItem(k);
        if (v !== null) return v === '' ? null : v;
        return TAB_KEYS[k] === 'seed' ? localStorage.getItem(k) : null;
      } catch { return null; }
    },
    set(k, v) {
      try {
        if (k in TAB_KEYS) {
          sessionStorage.setItem(k, v ?? '');
          if (TAB_KEYS[k] !== 'seed') return;
        }
        v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v);
      } catch {}
    },
  };

  let sessionId = store.get('claude.sessionId');
  let model = store.get('claude.model') || '';   // '' = CLI default
  let activeModel = '';                          // model reported by the CLI on init
  let effort = store.get('claude.effort') || ''; // --effort level; '' = the CLI's settings
  let ultracode = store.get('claude.ultracode') === '1';
  let applied = null;                            // effort/ultracode the live process applies (get_settings)
  let cliDefaults = null;                        // what the CLI does in this project unasked: { applied, defaults } (server.js settingsDefaults)
  let cwd = store.get('claude.cwd') || '';        // project folder; '' until /api/info answers
  // In the VS Code extension the window's folder is the project; a session remembered for another
  // folder is not restored. The extension's webview sets window.CW (and window.cwHost, its channel,
  // see vscode-shim.js); in a browser the same comes as ?embed=vscode&cwd=….
  const pageParam = (name) => window.CW?.[name] ?? new URLSearchParams(location.search).get(name);
  const EMBED = pageParam('embed') === 'vscode';
  const HOST_ORIGIN = EMBED && window.cwHost ? 'vscode' : null;
  if (EMBED) {
    const want = pageParam('cwd');
    if (want && want !== cwd) {
      cwd = want;
      store.set('claude.cwd', want);
      sessionId = null;
      store.set('claude.sessionId', null);
    }
  }
  /**
   * Inside VS Code: under the input only how many processes and subagents this project has; a click
   * opens that view in VS Code's side bar (the extension focuses it). Elsewhere: nothing.
   */
  const embedCounts = (() => {
    const counts = { processes: 0, agents: 0 };
    let shown = '';
    const render = () => {
      const box = $('counts');
      const key = JSON.stringify(counts);
      if (!EMBED || !box || key === shown) return;
      shown = key;
      box.replaceChildren();
      for (const [view, label] of [['processes', tl('Processes: {0}', counts.processes)], ['agents', tl('Subagents: {0}', counts.agents)]]) {
        if (!counts[view]) continue;
        const b = Object.assign(document.createElement('button'), { type: 'button', textContent: (view === 'agents' ? '◐ ' : '⚙ ') + label, title: tl('Show in the side bar') });
        b.onclick = () => toHost({ type: 'showView', view });
        box.appendChild(b);
      }
      box.hidden = !box.childElementCount;
    };
    return { set(view, n) { counts[view] = n; render(); } };
  })();

  /** A message to the extension's webview (state, files to open in VS Code); only inside it. */
  function toHost(msg) {
    if (HOST_ORIGIN) window.cwHost.postMessage({ source: 'claude-wrapper', ...msg });
  }

  /**
   * Coordination between tabs over BroadcastChannel: "Duplicate tab" copies sessionStorage, so a
   * copy must be recognised (it then starts a new chat instead of continuing the same session),
   * and a tab can ask whether a session is already open elsewhere.
   */
  const tabs = (() => {
    const ch = 'BroadcastChannel' in window ? new BroadcastChannel('claude-web-tabs') : null;
    const newId = () => crypto.randomUUID?.() || String(Math.random()).slice(2);
    let id = store.get('claude.tabId');
    const waiting = new Map(); // question id -> resolve
    let checking = false;

    ch?.addEventListener('message', ({ data: m }) => {
      if (m.type === 'who' && m.id === id && !checking) ch.postMessage({ type: 'mine', id });
      else if (m.type === 'mine' && m.id === id && checking) waiting.get('dup')?.(true);
      else if (m.type === 'session?' && m.from !== id && sessionId && m.sessionId === sessionId) {
        ch.postMessage({ type: 'session!', to: m.from, q: m.q });
      } else if (m.type === 'session!' && m.to === id) waiting.get(m.q)?.(true);
    });

    function ask(key, msg) {
      if (!ch) return Promise.resolve(false);
      return new Promise((resolve) => {
        const done = (v) => { waiting.delete(key); resolve(v); };
        waiting.set(key, done);
        ch.postMessage(msg);
        setTimeout(() => done(false), 200);
      });
    }

    const ready = (async () => {
      if (!id) { id = newId(); store.set('claude.tabId', id); return false; }
      checking = true;
      const duplicate = await ask('dup', { type: 'who', id });
      checking = false;
      if (duplicate) {
        // A copy of another tab: same project, but its own new chat.
        id = newId();
        store.set('claude.tabId', id);
        sessionId = null;
        store.set('claude.sessionId', null);
      }
      return duplicate;
    })();

    return {
      ready,
      /** True if another open tab currently works in session `sid`. */
      sessionInUse(sid) {
        const q = newId();
        return ask(q, { type: 'session?', sessionId: sid, from: id, q });
      },
    };
  })();
  let controller = null;
  let runId = null;
  // The run answered and its process waits for the next message (wrapper_idle): the page is idle,
  // but the next message goes into the same process. runEnded resolves when send() is over.
  let runWaiting = false;
  let runEnded = Promise.resolve();
  const busy = () => !!controller && !runWaiting;
  /** The chat's Claude process while it lives (it also waits between messages), or null. */
  const liveRun = () => (controller && runId) || null;
  let currentState = null; // state of the running send() (interrupt flag, first bubble…)
  let sessionTitle = '';     // title of the current session (generated or renamed)
  let pendingFork = null;    // { sessionId, uuid }: the next message continues from before that message
  let interruptAt = 0;       // time of the last soft stop (a second Esc soon after terminates)
  const alwaysAllowed = new Set();               // tool names auto-approved in the current chat

  // Handled by the page itself: in `claude -p` each message is a new process,
  // so /model and /clear would not survive to the next message.
  const LOCAL_COMMANDS = {
    model: tl('choose the chat model (sonnet, opus, haiku, fable…)'),
    effort: tl('thinking depth (low … max, default) and ultracode [off]'),
    btw: tl('a side question: Claude answers without interrupting the work or recording it in the session'),
    resume: tl('continue a past session'),
    project: tl('choose the project folder'),
    clear: tl('start a new chat'),
    help: tl('list of commands'),
  };
  // The CLI's slash commands: [{ name, description, argumentHint }] from the `initialize` answer
  // (wrapper_init) and system commands_changed; init's slash_commands has the names only.
  let cliCommands = [];
  try { cliCommands = JSON.parse(store.get('claude.slash') || '[]').map((c) => (typeof c === 'string' ? { name: c } : c)); } catch {}

  function setCliCommands(list) {
    if (!Array.isArray(list)) return;
    // Names-only lists keep the descriptions already known.
    const known = new Map(cliCommands.map((c) => [c.name, c]));
    cliCommands = list
      .map((c) => (typeof c === 'string' ? known.get(c) || { name: c } : { name: c.name, description: c.description || '', argumentHint: c.argumentHint || '' }))
      .filter((c) => c.name && !c.name.startsWith('__'));
    store.set('claude.slash', JSON.stringify(cliCommands));
  }
  // Model dropdown; values are exact model IDs passed to --model. Aliases are not used: the CLI may
  // resolve them to an older model than the catalog's (e.g. opus -> claude-opus-4-6). The static
  // options are replaced from the CLI's model catalog on load (/api/info `models`).
  const modelSel = $('modelSel');

  /** "claude-opus-5-5" -> "Opus 5.5", "claude-haiku-4-5-20251001" -> "Haiku 4.5". */
  function prettyModel(id) {
    const m = /^claude-([a-z]+)-(\d+)(?:-(\d{1,2}))?(?:-\d{8})?(\[1m\])?$/.exec(id || '');
    if (!m) return id;
    return m[1][0].toUpperCase() + m[1].slice(1) + ' ' + m[2] + (m[3] ? '.' + m[3] : '');
  }

  /** Family alias -> exact ID of the dropdown's model of that family ("opus" -> "claude-opus-5-5"). */
  function familyIds() {
    const ids = {};
    for (const o of modelSel.options) {
      const family = (/^claude-([a-z]+)-/.exec(o.value) || [])[1];
      if (family && !ids[family]) ids[family] = o.value;
    }
    return ids;
  }

  /** Turns an alias ("opus", "opus[1m]") into the exact ID from the dropdown; other values pass as is. */
  function exactModel(value) {
    const m = /^(fable|opus|sonnet|haiku)(\[1m\])?$/.exec(value || '');
    const id = m && familyIds()[m[1]];
    return id ? id + (m[2] || '') : value;
  }

  // What the CLI says about each model (efforts: its effort levels, [] = none) and its default.
  const modelInfo = new Map();
  let defaultModelId = '';

  /**
   * Rebuilds the options from the CLI's /model picker ([{ id, name, main, efforts }] from /api/info
   * and wrapper_init): the family entries first, other versions in a group below.
   */
  function applyModelCatalog(models, defaultModel) {
    if (!Array.isArray(models) || !models.length) return;
    modelInfo.clear();
    for (const m of models) modelInfo.set(m.id, m);
    if (defaultModel) defaultModelId = defaultModel;
    if (!activeModel && defaultModelId) activeModel = defaultModelId;
    const options = (list) => list.map((m) => new Option(m.name, m.id));
    const others = Object.assign(document.createElement('optgroup'), { label: tl('Other versions') });
    others.append(...options(models.filter((m) => m.main === false)));
    modelSel.replaceChildren(modelSel.options[0], ...options(models.filter((m) => m.main !== false)), ...(others.children.length ? [others] : []));
    model = exactModel(model);
    store.set('claude.model', model || null);
    syncModelSelect();
    syncEffortSelect();
  }

  function setModel(value, { announce = true } = {}) {
    model = exactModel(value);
    store.set('claude.model', model || null);
    syncModelSelect();
    syncEffortSelect();
    renderMeta();
    if (controller && runId) {
      // The running turn switches too (control request), not only the next message.
      postJson('/api/chat/control', { runId, request: { subtype: 'set_model', ...(model ? { model } : {}) } })
        .then(() => {
          el('div', 'status', tl('Model switched right away, in the current answer: {0}', model || tl('default')));
          refreshApplied(); // the default effort and ultracode support depend on the model
        })
        .catch(() => announce && el('div', 'status', tl('Model for the next messages: {0}', model || tl('default'))));
      return;
    }
    if (announce) el('div', 'status', tl('Model for the next messages: {0}', model || tl('default')));
  }

  /** Reflects `model` in the dropdown, adding an option for custom IDs set via /model. */
  function syncModelSelect() {
    if (model && ![...modelSel.options].some((o) => o.value === model)) {
      modelSel.add(new Option(prettyModel(model.replace(/\[1m\]$/, '')) + (model.endsWith('[1m]') ? ' · ' + tl('1M context') : ''), model));
    }
    modelSel.value = model;
    // The default option shows the model the CLI resolves the default to, marked "(def)".
    const def = (!model && activeModel) || defaultModelId || cliDefaults?.applied?.model || '';
    modelSel.options[0].textContent = def ? `${prettyModel(def.replace(/\[1m\]$/, ''))} (def)` : 'def';
  }

  modelSel.onchange = () => setModel(modelSel.value);
  model = exactModel(model); // a value saved before the dropdown switched from aliases to IDs
  syncModelSelect();

  // Effort dropdown: the level for --effort ('' = the CLI's settings, e.g. modelSettings) and
  // ultracode — standing orchestration through the Workflow tool on top of any level, so its
  // option toggles instead of staying selected. A live process gets both at once
  // (apply_flag_settings); what it actually applies comes back from get_settings (`applied`).
  const EFFORT_LEVELS = ['low', 'medium', 'high', 'xhigh', 'max'];
  const effortSel = $('effortSel');
  effortSel.append(
    new Option('', ''),
    ...EFFORT_LEVELS.map((l) => new Option('', l)),
    new Option('', 'ultracode'),
  );

  /** Effort levels of the chosen model (for '' the one the CLI runs), [] = none, null = unknown. */
  function modelEfforts() {
    return modelInfo.get((model || activeModel || defaultModelId).replace(/\[1m\]$/, ''))?.efforts || null;
  }

  function syncEffortSelect() {
    const ultra = ultracode ? ' · ultracode' : '';
    const levels = modelEfforts();
    const o = effortSel.options;
    // The default option shows the level the CLI applies, marked "(def)": the live process's, else
    // the project settings' for the model (modelSettings, effortLevel), else a flagless process's.
    const id = (model || activeModel || defaultModelId).replace(/\[1m\]$/, '');
    const d = cliDefaults?.defaults;
    const known = applied && !effort ? applied.effort
      : d ? d.modelEfforts?.[id] || d.effort || (!model || model === cliDefaults.applied?.model ? cliDefaults.applied?.effort : null)
      : null;
    const fact = levels && !levels.length ? tl('not in the model') : known || '';
    o[0].textContent = (fact ? fact + ' (def)' : 'def') + ultra;
    EFFORT_LEVELS.forEach((l, i) => {
      const off = !!levels && !levels.includes(l);
      o[i + 1].disabled = off;
      o[i + 1].textContent = l + (off ? ' — ' + tl('not in the model') : '') + ultra;
    });
    o[o.length - 1].textContent = (ultracode ? '☑' : '☐') + ' ultracode' + (applied?.ultracodeAvailable === false ? ` (${tl('unavailable for the model')})` : '');
    effortSel.value = effort;
  }

  /** What the live process applies: "effort xhigh · ultracode"; `fallback` when it is unknown. */
  function appliedText(fallback) {
    if (!applied) return fallback;
    const ultra = applied.ultracode ? ' · ultracode' : applied.ultracodeRequested ? ' · ' + tl('ultracode is unavailable for this model') : '';
    return (applied.effort ? 'effort ' + applied.effort : tl('model without effort levels')) + ultra;
  }

  /** Asks the live process which effort it applies and whether ultracode works with its model. */
  async function refreshApplied() {
    const id = runId;
    if (!id) return;
    let r = null;
    try { r = (await postJson('/api/chat/control', { runId: id, request: { subtype: 'get_settings' } })).applied || null; } catch {}
    if (runId !== id) return;
    applied = r;
    syncEffortSelect();
  }

  function setEffort(level, ultra = ultracode, { announce = true } = {}) {
    effort = level;
    ultracode = ultra;
    store.set('claude.effort', effort || null);
    store.set('claude.ultracode', ultracode ? '1' : null);
    syncEffortSelect();
    const chosen = (effort ? 'effort ' + effort : tl('default effort')) + (ultracode ? ' · ultracode' : '');
    if (controller && runId) {
      // Both keys every time: a level alone turns ultracode off (the CLI's /effort rule). null
      // brings back the model's own default, not the one from the CLI's settings.
      postJson('/api/chat/control', { runId, request: { subtype: 'apply_flag_settings', settings: { effortLevel: effort || null, ultracode } } })
        .then(refreshApplied)
        .then(() => announce && el('div', 'status', tl('Applied right away, the process runs with: {0}', appliedText(chosen))))
        .catch(() => announce && el('div', 'status', tl('For the next messages: {0}', chosen)));
      return;
    }
    if (announce) el('div', 'status', tl('For the next messages: {0}', chosen));
  }

  effortSel.onchange = () => {
    if (effortSel.value === 'ultracode') setEffort(effort, !ultracode);
    else setEffort(effortSel.value);
  };
  syncEffortSelect();

  // Permission modes, short names (the same in every UI language); the hint explains each.
  // `cycle` marks modes reachable with Shift+Tab, in the terminal's order.
  const MODES = [
    { value: 'default', label: 'ask', hint: tl('ask permission for edits and commands'), cycle: true },
    { value: 'acceptEdits', label: 'edits', hint: tl('file edits without asking, commands with confirmation'), cycle: true },
    { value: 'plan', label: 'plan', hint: tl('read and plan only, nothing changes'), cycle: true },
    { value: 'auto', label: 'auto', hint: tl('Claude decides itself what is safe to run without asking'), cycle: true },
    { value: 'bypassPermissions', label: 'bypass', hint: tl('everything without asking or limits — dangerous'), cycle: false },
    { value: 'dontAsk', label: "don't ask", hint: tl('don’t ask: everything that needs permission is denied'), cycle: false },
  ];
  // '' = no --permission-mode: the project settings' defaultMode, shown as "<mode> (def)".
  const defaultMode = () => cliDefaults?.defaults?.mode || 'default';
  const modeInfo = (v) => MODES.find((m) => m.value === (v || defaultMode())) || MODES[0];

  modeEl.add(new Option('def', ''));
  for (const m of MODES) {
    const o = new Option(m.label, m.value);
    o.title = m.hint;
    modeEl.add(o);
  }
  function syncModeSelect() {
    const m = modeInfo('');
    modeEl.options[0].textContent = cliDefaults ? `${m.label} (def)` : 'def';
    modeEl.options[0].title = m.hint;
  }

  function setMode(value, { announce = true } = {}) {
    const m = modeInfo(value);
    modeEl.value = value && MODES.some((x) => x.value === value) ? value : '';
    modeEl.title = `${m.label}: ${m.hint} (${tl('Shift+Tab — switch')})`;
    store.set('claude.permMode', modeEl.value || null);
    if (controller && runId) {
      postJson('/api/chat/control', { runId, request: { subtype: 'set_permission_mode', mode: m.value } })
        .then(() => { if (currentState) currentState.permissionMode = currentState.requestedMode = m.value; el('div', 'status', tl('Mode switched right away: {0} — {1}', m.label, m.hint)); })
        .catch(() => announce && el('div', 'status', tl('Mode for the next messages: {0} — {1}', m.label, m.hint)));
      return;
    }
    if (announce) el('div', 'status', tl('Mode for the next messages: {0} — {1}', m.label, m.hint));
  }

  function cycleMode() {
    const ring = MODES.filter((m) => m.cycle);
    const i = ring.findIndex((m) => m.value === modeInfo(modeEl.value).value);
    setMode(ring[(i + 1) % ring.length].value);
  }

  syncModeSelect();
  setMode(store.get('claude.permMode') || '', { announce: false });

  /** The CLI's defaults for this project (model, effort, permission mode) for the "(def)" options. */
  function loadCliDefaults() {
    const forCwd = cwd;
    sessionControl({ subtype: 'get_settings' }, null).then((d) => {
      if (cwd !== forCwd || !d?.defaults) return;
      cliDefaults = d;
      syncModelSelect();
      syncEffortSelect();
      syncModeSelect();
      modeEl.title = `${modeInfo(modeEl.value).label}: ${modeInfo(modeEl.value).hint} (${tl('Shift+Tab — switch')})`;
    }).catch(() => {});
  }
  modeEl.onchange = () => setMode(modeEl.value);

  let homeDir = '';
  // Block input until the previous session is restored: restoring resets the log and
  // aborts any running request, so a message typed earlier would be silently lost.
  promptEl.disabled = sendBtn.disabled = true;
  Promise.all([fetch('/api/info').then((r) => r.json()), tabs.ready]).then(async ([d]) => {
    homeDir = d.home;
    if (!cwd) cwd = d.cwd;
    voice.setSilero(d.tts);
    applyModelCatalog(d.models, d.defaultModel);
    loadCliDefaults();
    usageMeter.refresh();
    renderMeta();
    if (sessionId) await loadSession(sessionId, { quiet: true });
    refreshHistoryCount();
  }).catch((e) => el('div', 'error', tl('Server unavailable: {0}', e.message)))
    .finally(() => { promptEl.disabled = sendBtn.disabled = false; promptEl.focus(); sidePanel.refresh(); viewer.syncProject(); });

  function shortPath(p) {
    return homeDir && p.startsWith(homeDir) ? '~' + p.slice(homeDir.length) : p;
  }
  // The name of Claude Code's history dir for a folder (~/.claude/projects/<it>), as sessions.js.
  const encodeProjectDir = (p) => p.replace(/[^a-zA-Z0-9]/g, '-');

  function renderMeta() {
    $('projectsTitle').textContent = tl('Projects') + ' · ' + (cwd ? cwd.split('/').filter(Boolean).pop() || '/' : '…');
    $('projectsTitle').title = cwd;
    metaEl.textContent = `${shortPath(cwd)} · ${sessionId ? (sessionTitle || tl('session {0}', sessionId.slice(0, 8))) : tl('new session')}`;
    metaEl.title = sessionId || '';
    toHost({ type: 'state', cwd, sessionId, title: sessionTitle || '', busy: busy(), runId: liveRun() });
    $('chatTitle').textContent = sessionId ? (sessionTitle || tl('Session {0}', sessionId.slice(0, 8))) : tl('New chat');
    $('chatTitle').title = sessionId ? `${sessionTitle || tl('Session')} · ${sessionId}` : '';
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const sameDay = d.toDateString() === new Date().toDateString();
    return sameDay
      ? d.toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleString(LOCALE, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  async function getJson(url) {
    const r = await fetch(url);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(tlMsg(d.error || r.statusText)), { status: r.status });
    return d;
  }

  function rowButton(title, sub, onClick, current) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'row' + (current ? ' current' : '');
    const t = document.createElement('span'); t.className = 't'; t.textContent = title;
    b.appendChild(t);
    if (sub) { const s = document.createElement('span'); s.className = 's'; s.textContent = sub; b.appendChild(s); }
    b.onclick = onClick;
    return b;
  }

  document.querySelectorAll('dialog [data-close]').forEach((b) => (b.onclick = () => b.closest('dialog').close()));
  // Close a dialog by clicking the backdrop.
  document.querySelectorAll('dialog').forEach((d) => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));

  // --- Project picker ---
  // In the side panel ("Projects" view): browse folders or pick one of Claude Code's projects.
  const fsPathEl = $('fsPath'), fsListEl = $('fsList');

  /** Switches the project; while Claude works, asks first (the switch stops the run). */
  async function setProject(dir) {
    if (busy()) {
      const choice = await askStop(tl('Switching the project to {0} stops it. Stop it now, or ask it to finish first (the project switches when it is done)?', shortPath(dir)));
      if (!choice) return false;
      if (choice === 'finish') {
        askToFinish();
        el('div', 'status', tl('The project switches to {0} when Claude finishes', shortPath(dir)));
        await whenIdle();
      } else {
        stopRun();
        await whenIdle(10000);
      }
    }
    setProjectNow(dir);
    return true;
  }

  function setProjectNow(dir) {
    setTimeout(refreshHistoryCount, 0);
    setTimeout(refreshProcs, 0); // badge and list follow this tab's project
    setTimeout(() => viewer.syncProject(), 0); // open files of that project
    setTimeout(() => sidePanel.refresh(), 0);
    if (controller) controller.abort();
    cwd = dir;
    store.set('claude.cwd', dir);
    cliDefaults = null;
    loadCliDefaults();
    resetChat();
    el('div', 'status', tl('Project folder: {0}', dir));
    if (sidePanel.isShowing('projects')) openProjects(); // the new current project gets its mark
    promptEl.focus();
  }

  /** A folder browser (path field, up button, subfolders): a click opens a folder, a double click picks it. */
  function folderBrowser({ pathEl, upEl, listEl, onPick }) {
    async function browse(dir) {
      listEl.innerHTML = `<div class="empty">${tl('Loading…')}</div>`;
      try {
        const d = await getJson('/api/fs?path=' + encodeURIComponent(dir));
        pathEl.value = d.path;
        upEl.disabled = !d.parent;
        upEl.onclick = () => d.parent && browse(d.parent);
        listEl.innerHTML = '';
        if (!d.dirs.length) listEl.innerHTML = `<div class="empty">${tl('No subfolders')}</div>`;
        for (const name of d.dirs) {
          const b = rowButton('📁 ' + name, '', () => browse(d.path.replace(/\/$/, '') + '/' + name));
          b.ondblclick = () => onPick(d.path.replace(/\/$/, '') + '/' + name);
          listEl.appendChild(b);
        }
      } catch (e) {
        listEl.innerHTML = '';
        listEl.appendChild(Object.assign(document.createElement('div'), { className: 'error', textContent: e.message }));
      }
    }
    pathEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); browse(pathEl.value); } });
    return browse;
  }
  const browse = folderBrowser({ pathEl: fsPathEl, upEl: $('fsUp'), listEl: fsListEl, onPick: (dir) => setProject(dir) });

  /**
   * A project whose folder is gone (moved or renamed): the user points at where it lives now, its
   * history moves there (/api/project/relink) and `then` gets the folder (default: open it).
   * `p`: { dir (history dir name), cwd (the old folder), sessions }.
   */
  /** After relinking the tab's own project: the tab follows it, keeping the open session. */
  function followProject(dir) {
    cwd = dir;
    store.set('claude.cwd', dir);
    el('div', 'status', tl('Project folder: {0}', dir));
    renderMeta();
    sidePanel.refresh();
    refreshProcs();
    refreshHistoryCount();
    viewer.syncProject();
  }

  /** What /api/project/relink moved, for a status line. */
  function relinkSummary(r) {
    const parts = [];
    if (r.sessions) parts.push(tl('sessions: {0}', r.sessions));
    if (r.prompts) parts.push(tl('input history entries: {0}', r.prompts));
    if (r.settings) parts.push(tl('Claude Code project settings'));
    return parts.length ? tl('Project history moved ({0})', parts.join(', ') + (r.merged ? '; ' + tl('merged with this folder’s history') : '')) : tl('There was nothing to move');
  }

  function relinkProject(p, { then = (dir) => setProject(dir) } = {}) {
    const gone = p.exists === false || p.exists == null;
    const body = infoDialog(gone ? tl('Project folder not found') : tl('Move the project history'));
    const dlg = body.closest('dialog');
    const name = p.cwd.split('/').filter(Boolean).pop() || '/';
    const what = tl('its session history') + (p.sessions ? ` (${p.sessions})` : '') +
      ', ' + tl('input history and Claude Code settings for the project (trust, permissions, MCP servers)');
    body.textContent = '';
    body.append(node('p', 'relink-note', gone
      ? tl('Project “{0}” was in {1}, and that folder is gone. Point to where it is now: {2} will move to the chosen folder, and the sessions can be continued from there.', name, shortPath(p.cwd), what)
      : tl('Project “{0}” in {1}. If it has moved, point to the new folder: {2} will move to it. If it already has a history of its own, they will be merged.', name, shortPath(p.cwd), what)));
    const bar = node('div', 'pathbar');
    const up = Object.assign(node('button', 'btn', '↑'), { type: 'button', title: tl('Up') });
    const input = Object.assign(node('input'), { spellcheck: false, autocomplete: 'off' });
    const choose = Object.assign(node('button', 'btn allow', tl('Choose')), { type: 'button', title: tl('Move the project history to this folder') });
    bar.append(up, input, choose);
    const list = node('div', 'browser');
    const err = node('div');
    body.append(bar, list, err);
    const pick = async (dir) => {
      if (choose.disabled) return;
      choose.disabled = true;
      err.textContent = '';
      try {
        const r = await postJson('/api/project/relink', { dir: p.dir, cwd: dir });
        dlg.close();
        then(r.cwd);
        el('div', 'status', relinkSummary(r));
      } catch (e) {
        alertInline(err, tl('Could not move the history: {0}', e.message));
        choose.disabled = false;
      }
    };
    const browseIn = folderBrowser({ pathEl: input, upEl: up, listEl: list, onPick: pick });
    choose.onclick = () => pick(input.value);
    // Start from the nearest folder of the old path that still exists.
    (async () => {
      let dir = p.cwd;
      for (;;) {
        const parent = dir.replace(/\/[^/]*$/, '') || '/';
        if (parent === dir) break;
        dir = parent;
        try { await getJson('/api/fs?path=' + encodeURIComponent(dir)); break; } catch { /* gone too: go up */ }
      }
      browseIn(dir);
      input.focus();
    })();
  }
  $('fsChoose').onclick = async () => {
    try {
      const d = await getJson('/api/fs?path=' + encodeURIComponent(fsPathEl.value));
      setProject(d.path);
    } catch (e) { alertInline(fsListEl, e.message); }
  };

  function alertInline(container, msg) {
    container.prepend(Object.assign(document.createElement('div'), { className: 'error', textContent: msg }));
  }

  /** Fills the "Projects" view (its load()). */
  async function openProjects() {
    browse(cwd || homeDir || '/');
    const list = $('projectList');
    list.innerHTML = `<div class="empty">${tl('Loading…')}</div>`;
    try {
      const { projects } = await getJson('/api/projects');
      list.innerHTML = '';
      // A project is a folder, not a name: the folder open now is listed even before its first
      // session, next to a project of the same name elsewhere.
      const isCurrent = (p) => p.cwd === cwd || (cwd && p.dir === encodeProjectDir(cwd));
      const rows = cwd && !projects.some(isCurrent) ? [{ cwd, exists: true, sessions: 0 }, ...projects] : projects;
      if (!rows.length) list.innerHTML = `<div class="empty">${tl('No projects yet')}</div>`;
      for (const p of rows) {
        const sub = (p.sessions ? tl('{0} sess. · {1}', p.sessions, fmtDate(p.updated)) : tl('no sessions')) + (p.exists ? '' : ' · ' + tl('folder not found'));
        // A missing folder asks where the project went (its history follows the answer).
        const b = rowButton(p.cwd.split('/').filter(Boolean).pop() || '/', sub, () => (p.exists ? setProject(p.cwd) : relinkProject(p)), isCurrent(p));
        b.append(Object.assign(document.createElement('span'), { className: 's where', textContent: shortPath(p.cwd), title: p.cwd })); // the folder: a third line
        if (!p.exists) {
          b.classList.add('missing');
          b.title = tl('Folder not found — click to point to where the project is now');
        }
        if (p.dir) {
          const move = Object.assign(document.createElement('span'), { className: 'row-act', textContent: '⇢', title: tl('Has the project moved? Move its history to another folder'), role: 'button', tabIndex: 0 });
          move.onclick = (e) => { e.stopPropagation(); relinkProject(p); };
          b.append(move);
        }
        list.appendChild(b);
      }
    } catch (e) {
      list.innerHTML = '';
      alertInline(list, e.message);
    }
  }

  /**
   * A folder with no sessions yet may be a project that moved here: projects of the same name
   * elsewhere with a history are offered, a click moves that history here (/api/project/relink).
   */
  async function offerHistoryFrom(list) {
    const here = cwd;
    const name = here.split('/').filter(Boolean).pop();
    let projects;
    try { ({ projects } = await getJson('/api/projects')); } catch { return; }
    if (cwd !== here || !list.isConnected) return;
    for (const p of projects.filter((p) => p.sessions && p.cwd !== here && p.dir !== encodeProjectDir(here) && p.cwd.split('/').filter(Boolean).pop() === name)) {
      const box = node('div', 'relink-offer', tl('Project “{0}” with a history exists in {1} ({2}). If it has moved here, its history can move to this folder.', name, shortPath(p.cwd), tl('{0} sess.', p.sessions) + (p.exists ? '' : ', ' + tl('the folder is gone'))) + ' ');
      const go = Object.assign(node('button', 'btn', tl('Move here')), { type: 'button', title: tl('The sessions, input history and Claude Code settings of this project will move to this folder') });
      go.onclick = async () => {
        go.disabled = true;
        try {
          const r = await postJson('/api/project/relink', { dir: p.dir, cwd: here });
          el('div', 'status', relinkSummary(r));
          refreshHistoryCount();
          sidePanel.refresh(); // the history here and the projects list
        } catch (e) {
          go.disabled = false;
          alertInline(box, tl('Could not move: {0}', e.message));
        }
      };
      box.append(go);
      list.append(box);
    }
  }

  // --- Sessions (/resume), shown in the side panel ---
  async function renderSessions() {
    $('sessionTitle').textContent = tl('History') + ' · ' + (cwd.split('/').filter(Boolean).pop() || '/');
    $('sessionTitle').title = tl('Sessions in {0}', shortPath(cwd));
    const list = $('sessionList');
    if (!list.childElementCount) list.innerHTML = `<div class="empty">${tl('Loading…')}</div>`;
    try {
      const d = await getJson('/api/sessions?cwd=' + encodeURIComponent(cwd));
      list.innerHTML = '';
      if (!d.sessions.length) list.innerHTML = `<div class="empty">${tl('No sessions in this folder yet')}</div>`;
      if (!d.sessions.length && d.exists !== false) offerHistoryFrom(list);
      if (d.exists === false) {
        // The tab's folder is gone (the project moved): its sessions still list, and can follow it.
        const note = Object.assign(node('div', 'error', tl('The project folder is gone.') + ' '), { title: cwd });
        if (d.projectDir) {
          const fix = Object.assign(node('button', 'btn', tl('Point to the folder…')), { type: 'button', title: tl('Point to where the project is now: the history will move there') });
          fix.onclick = () => relinkProject({ dir: d.projectDir, cwd, sessions: d.sessions.length }, { then: followProject });
          note.append(fix);
        }
        list.prepend(note);
      }
      for (const s of d.sessions) {
        const sub = tl('{0} · {1} msg.', fmtDate(s.updated), s.messages) + (s.lastPrompt && s.lastPrompt !== s.title ? ' · ' + s.lastPrompt : '');
        const row = rowButton(s.title, sub, () => {
          loadSession(s.id, { title: s.title });
          if (matchMedia('(max-width: 760px)').matches) sidePanel.hide(); // the panel covers the chat on phones
        }, s.id === sessionId);
        const ren = Object.assign(document.createElement('span'), { className: 'row-act', textContent: '✎', title: tl('Rename the session'), role: 'button', tabIndex: 0 });
        ren.onclick = (e) => {
          e.stopPropagation();
          // The input goes next to the row: inputs inside a <button> don't take typing reliably.
          const input = Object.assign(document.createElement('input'), { className: 'rename-input session-rename', value: s.title });
          row.hidden = true;
          row.after(input);
          input.focus();
          input.select();
          let done = false;
          const finish = async (save) => {
            if (done) return;
            done = true;
            const title = input.value.trim();
            if (save && title && title !== s.title) {
              try { await renameSession(s.id, title); s.title = title; } catch (err) { alertInline(list, tl('Could not rename: {0}', err.message)); }
            }
            row.querySelector('.t').textContent = s.title;
            input.remove();
            row.hidden = false;
          };
          input.onkeydown = (ev) => { ev.stopPropagation(); if (ev.key === 'Enter') { ev.preventDefault(); finish(true); } if (ev.key === 'Escape') finish(false); };
