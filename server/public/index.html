          input.onclick = (ev) => ev.stopPropagation();
          input.onblur = () => finish(true);
        };
        const del = Object.assign(document.createElement('span'), { className: 'row-act del', textContent: '✕', title: tl('Move the session to the Trash (click twice)'), role: 'button', tabIndex: 0 });
        // Two-step confirmation instead of confirm(), which would block the page.
        del.onclick = async (e) => {
          e.stopPropagation();
          if (!del.classList.contains('armed')) {
            del.classList.add('armed');
            del.textContent = tl('delete?');
            setTimeout(() => { del.classList.remove('armed'); del.textContent = '✕'; }, 3000);
            return;
          }
          try {
            await postJson('/api/session/delete', { sessionId: s.id });
            if (s.id === sessionId) resetChat();
            row.remove();
            if (!list.querySelector('.row')) list.innerHTML = `<div class="empty">${tl('No sessions in this folder yet')}</div>`;
            refreshHistoryCount();
          } catch (err) {
            alertInline(list, tl('Could not delete: {0}', err.message));
          }
        };
        row.append(ren, del);
        list.appendChild(row);
      }
    } catch (e) {
      list.innerHTML = '';
      alertInline(list, e.message);
    }
  }

  /** Number on a side-bar button; hidden at zero, 99+ above that. */
  function setBadge(id, n) {
    const b = $(id).querySelector('.badge');
    b.hidden = !n;
    b.textContent = n > 99 ? '99+' : String(n);
  }

  /** Number of saved sessions of the current project on the History button. */
  async function refreshHistoryCount() {
    if (!cwd) return;
    try {
      const { count } = await getJson('/api/sessions/count?cwd=' + encodeURIComponent(cwd));
      setBadge('historyBtn', count);
      $('historyBtn').title = tl('Past sessions (/resume): {0} in this folder', count);
    } catch {}
  }

  // --- Processes started through the wrapper (registry in .run/processes.json) ---
  const KIND_LABELS = { server: tl('server'), claude: 'claude', bridge: tl('bridge'), child: tl('process') };

  /** Shows the number of live processes besides the server and bridges on the header button. */
  function renderProcCount(processes) {
    const n = processes.filter((p) => !p.exited && p.kind !== 'server' && p.kind !== 'bridge').length;
    setBadge('procBtn', n);
    $('procBtn').title = tl('Processes started by Claude: {0}', n || tl('none'));
  }


  // The processes view is a tree, like the subagents view: each process under its parent (ppid;
  // pids are reused, so the newest one with that pid started no later than the child), and a
  // run's jobs whose parent has exited (reparented to launchd) under the run itself. Folded
  // nodes (procFolded, by pid@start) stay folded across the periodic re-renders.
  const procFolded = new Set();
  const procKey = (p) => `${p.pid}@${p.started}`;
  const fmtKb = (kb) => (kb < 1024 ? tl('{0} KB', kb) : kb < 1024 * 1024 ? tl('{0} MB', Math.round(kb / 1024)) : tl('{0} GB', (kb / 1024 / 1024).toFixed(1)));

  // A click on a process's name opens its details under the row, like a subagent's: the whole
  // command, its folder, where its output goes and, when that is a file, the end of it
  // (/api/processes/detail, re-read every few seconds while open). Open rows (procOpen) and the
  // last answers (procDetails) outlive the periodic re-renders.
  const procOpen = new Set();
  const procDetails = new Map(); // pid@start -> { at, d | error }
  const OUTPUT_WHERE = {
    file: (o) => tl('to the file {0}', shortPath(o.path)),
    pipe: () => tl('to a pipe to the parent process — it can’t be read from outside'),
    tty: (o) => (o.path === '(revoked)' ? tl('to a terminal that is already closed') : tl('to the terminal {0}', o.path)),
    null: () => tl('nowhere (/dev/null)'),
    socket: (o) => tl('to the network connection {0}', o.path),
    closed: () => tl('closed'),
    other: (o) => `${o.type || ''} ${o.path || ''}`.trim(),
  };

  function fillProcDetail(box, p) {
    const c = procDetails.get(procKey(p));
    const add = (title, text, cls) => {
      const row = Object.assign(document.createElement('div'), { className: cls || '' });
      row.append(Object.assign(document.createElement('b'), { textContent: title + ': ' }), text);
      box.append(row);
    };
    const prevPre = box.querySelector('pre');
    const atEnd = !prevPre || prevPre.scrollTop + prevPre.clientHeight >= prevPre.scrollHeight - 4;
    box.textContent = '';
    add(tl('Command'), p.command, 'proc-cmdline');
    if (p.exited) return add(tl('State'), tl('the process has finished'));
    if (!c?.d && !c?.error) return box.append(tl('Loading…'));
    if (c.error) return add(tl('Error'), c.error);
    const d = c.d;
    if (d.cwd) add(tl('Folder'), shortPath(d.cwd));
    const say = (o) => (OUTPUT_WHERE[o.kind] || OUTPUT_WHERE.other)(o);
    add(tl('Output'), say(d.stdout));
    add(tl('Errors'), d.stderr.kind === d.stdout.kind && d.stderr.path === d.stdout.path ? tl('the same place') : say(d.stderr));
    for (const o of d.output || []) {
      if (o.error) { add(shortPath(o.path), o.error); continue; }
      box.append(Object.assign(document.createElement('div'), { className: 'menu-note', textContent: o.truncated ? tl('End of the file: the last 16 KB of {0}', fmtKb(Math.round(o.size / 1024))) : tl('The whole file ({0})', fmtKb(Math.ceil(o.size / 1024))) }));
      const pre = Object.assign(document.createElement('pre'), { className: 'proc-out', textContent: stripAnsi(o.text) || tl('(empty)') });
      box.append(pre);
      if (atEnd) requestAnimationFrame(() => { pre.scrollTop = pre.scrollHeight; });
    }
  }

  async function loadProcDetail(p) {
    const key = procKey(p);
    const c = procDetails.get(key);
    if (p.exited || c?.loading || (c?.at && Date.now() - c.at < 3000)) return;
    procDetails.set(key, { ...c, loading: true });
    let next;
    try {
      next = { at: Date.now(), d: await getJson(`/api/processes/detail?pid=${p.pid}&started=${encodeURIComponent(p.started)}`) };
    } catch (e) {
      next = { at: Date.now(), error: e.message };
    }
    procDetails.set(key, next);
    const box = document.querySelector(`#procList .proc-more[data-key="${CSS.escape(key)}"]`);
    if (box && procOpen.has(key)) fillProcDetail(box, p);
  }

  function procTree(list) {
    const byPid = new Map();
    for (const p of list) {
      if (!byPid.has(p.pid)) byPid.set(p.pid, []);
      byPid.get(p.pid).push(p);
    }
    const runs = new Map(list.filter((p) => p.kind === 'claude' && p.runId).map((p) => [p.runId, p]));
    const kids = new Map(), roots = [], detached = new Set();
    for (const p of list) {
      let parent = (byPid.get(p.ppid) || []).filter((q) => q !== p && q.started <= p.started).sort((a, b) => b.started.localeCompare(a.started))[0];
      if (!parent && p.kind !== 'claude') {
        parent = runs.get(p.parentRun?.runId);
        if (parent === p) parent = null;
        if (parent) detached.add(p);
      }
      if (!parent) { roots.push(p); continue; }
      if (!kids.has(parent)) kids.set(parent, []);
      kids.get(parent).push(p);
    }
    const byStart = (a, b) => a.started.localeCompare(b.started);
    const count = (p) => (kids.get(p) || []).reduce((n, c) => n + 1 + count(c), 0);
    const out = [], seen = new Set();
    const hide = (p) => { seen.add(p); for (const c of kids.get(p) || []) if (!seen.has(c)) hide(c); };
    const walk = (p, depth) => {
      if (seen.has(p)) return;
      seen.add(p);
      const folded = procFolded.has(procKey(p));
      out.push({ p, depth, detached: detached.has(p), children: (kids.get(p) || []).length, below: count(p), folded });
      for (const c of (kids.get(p) || []).sort(byStart)) folded ? hide(c) : walk(c, depth + 1);
    };
    // Live runs first, newest first; within a parent, in the order they started.
    roots.sort((a, b) => Number(!!a.exited) - Number(!!b.exited) || b.started.localeCompare(a.started));
    for (const p of roots) walk(p, 0);
    for (const p of list) walk(p, 0); // only a ppid cycle (pid reuse) leaves anything unvisited
    return out;
  }

  async function renderProcesses() {
    const list = $('procList');
    if (!list.childElementCount) list.innerHTML = `<div class="empty">${tl('Loading…')}</div>`;
    let d;
    try {
      const q = new URLSearchParams();
      if ($('procAll').checked) q.set('all', '1');
      if (!$('procAllProjects').checked && cwd) q.set('cwd', cwd); // this tab's project only
      d = await getJson('/api/processes?' + q);
    } catch (e) {
      list.innerHTML = '';
      return alertInline(list, e.message);
    }
    renderProcCount(d.processes);
    list.innerHTML = '';
    // Only what Claude started: the server (started by the user) and the wrapper's own
    // permission bridges are not listed.
    const shown = d.processes.filter((p) => p.kind !== 'server' && p.kind !== 'bridge');
    if (!shown.length) list.innerHTML = `<div class="empty">${tl('Claude has no processes running now')}</div>`;
    for (const { p, depth, detached, children, below, folded } of procTree(shown)) {
      const row = document.createElement('div');
      row.className = 'proc' + (p.exited ? ' exited' : '');
      row.style.paddingLeft = 6 + depth * 16 + 'px';
      // Fold / unfold its children; a leaf gets a spacer so the marks line up.
      const fold = document.createElement(children ? 'button' : 'span');
      fold.className = 'fold';
      if (children) {
        fold.type = 'button';
        fold.textContent = folded ? '▸' : '▾';
        fold.title = folded ? tl('Show the child processes ({0})', below) : tl('Collapse the child processes');
        fold.onclick = () => { if (folded) procFolded.delete(procKey(p)); else procFolded.add(procKey(p)); renderProcesses(); };
      }
      row.appendChild(fold);
      const info = document.createElement('div');
      info.className = 'info';
      const cmd = document.createElement('div');
      cmd.className = 'cmd';
      cmd.title = p.command;
      const kind = document.createElement('span');
      kind.className = 'kind';
      // The same marks as the list under the input.
      kind.textContent = p.kind === 'claude' ? '✻' : '⚙';
      kind.title = KIND_LABELS[p.kind] || p.kind;
      cmd.append(kind, p.kind === 'claude' && p.prompt ? 'claude -p «' + p.prompt + '»' : p.command);
      const session = p.sessionId || p.parentRun?.sessionId;
      const sub = document.createElement('div');
      sub.className = 's';
      // Bare values; what each one is shows on hover. Session and folder tell runs apart only
      // across projects, so they come (on a third line) only with "all projects".
      const full = (iso) => new Date(iso).toLocaleString(LOCALE, { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const fill = (line, parts) => parts.filter(Boolean).forEach(([text, title], i) => {
        if (i) line.append(' · ');
        line.append(Object.assign(document.createElement('span'), { textContent: text, title }));
      });
      fill(sub, [
        [String(p.pid), tl('PID — the process number')],
        p.exited
          ? [fmtDate(p.exited), tl('Finished {0} (started {1})', full(p.exited), full(p.started))]
          : [fmtDate(p.started), tl('Started {0}', full(p.started))],
        !p.exited && p.cpu != null ? [`${p.cpu < 10 ? p.cpu.toFixed(1) : Math.round(p.cpu)}%`, tl('CPU: % of one core, averaged over the last minute')] : null,
        !p.exited && p.rss != null ? [fmtKb(p.rss), tl('Memory: how much RAM the process takes (RSS)')] : null,
        // Under its run because its own parent is gone: a detached job (`cmd &`, nohup).
        detached ? [tl('detached from the parent'), tl('The parent has finished; the process is shown under its run')] : p.ppid === 1 && !p.exited ? [tl('no parent'), tl('The parent has finished (the process went to launchd)')] : null,
        folded ? [tl('hidden children: {0}', below), ''] : null,
      ]);
      info.append(cmd, sub);
      if ($('procAllProjects').checked && depth === 0 && (session || p.cwd)) {
        const where = Object.assign(document.createElement('div'), { className: 's' });
        fill(where, [session ? [session.slice(0, 8), tl('Session {0}', session)] : null, p.cwd ? [shortPath(p.cwd), tl('Project folder: {0}', p.cwd)] : null]);
        info.append(where);
      }
      const key = procKey(p);
      const more = Object.assign(document.createElement('div'), { className: 'proc-more', hidden: !procOpen.has(key) });
      more.dataset.key = key;
      more.style.marginLeft = 6 + depth * 16 + 22 + 'px';
      cmd.title = (p.command || '') + '\n\n' + tl('Click for details: the folder, where the output goes');
      info.onclick = () => {
        if (procOpen.has(key)) procOpen.delete(key); else procOpen.add(key);
        more.hidden = !procOpen.has(key);
        if (!more.hidden) { fillProcDetail(more, p); loadProcDetail(p); }
      };
      if (!more.hidden) { fillProcDetail(more, p); loadProcDetail(p); }
      row.appendChild(info);

      if (!p.exited && p.pid !== d.serverPid) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'x';
        btn.textContent = '✕';
        btn.title = tl('Stop: SIGTERM to the process and its descendants (click twice)');
        // Two-step confirmation instead of confirm(), which would block the page.
        btn.onclick = async () => {
          if (!btn.dataset.armed) {
            btn.dataset.armed = '1';
            btn.classList.add('armed');
            btn.textContent = tl('stop?');
            setTimeout(() => { delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent = '✕'; }, 3000);
            return;
          }
          btn.disabled = true;
          try {
            const r = await fetch('/api/processes', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ pid: p.pid }),
            });
            const res = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(tlMsg(res.error || r.statusText));
            setTimeout(renderProcesses, 500);
          } catch (e) {
            btn.disabled = false;
            alertInline(list, e.message);
          }
        };
        row.appendChild(btn);
      }
      list.appendChild(row);
      list.appendChild(more);
    }
  }
  $('procRefresh').onclick = renderProcesses;
  $('procAll').onchange = renderProcesses;
  $('procAllProjects').onchange = renderProcesses;

  // --- Subagents of every run (server: agent-tasks.js) ---
  // A subagent has no process of its own, so the processes view can't list it. Like the agent map
  // of the VS Code extension: a tree per run, rooted in its main agent (the claude -p run), each
  // agent under the one that started it; working ones first, then failed, then the latest
  // finished. While shown it refreshes every 2 s when an agent works or this tab is busy, else every
  // 5 s, and at once when this tab's run starts or finishes one; rows keep their elements between
  // refreshes, so a click or a text selection in them survives. A click on an agent shows its task, activity, model,
  // recent steps and result; ⇣ moves a foreground agent to the background, ✕ stops it (stop_task
  // to its run, from any tab).
  const agentEls = new Map();   // task id -> row
  const runEls = new Map();     // run id -> its root row
  const agentsOpen = new Set(); // task ids with details shown
  let agentsTimer = null;
  const setText = (el, text) => { if (el.textContent !== text) el.textContent = text; };
  const AGENT_STATUS = { running: tl('working'), pending: tl('waiting'), paused: tl('paused'), completed: tl('done'), failed: tl('failed'), killed: tl('stopped'), stopped: tl('stopped') };
  const AGENT_KINDS = { remote_agent: tl('cloud agent'), local_workflow: 'workflow', in_process_teammate: tl('teammate') };

  /** Running subagents of this tab's project on the side-bar button. */
  async function refreshAgentCount() {
    try {
      const { agents } = await getJson('/api/agents' + (cwd ? '?cwd=' + encodeURIComponent(cwd) : ''));
      setBadge('agentsBtn', agents.length);
      embedCounts.set('agents', agents.length);
      $('agentsBtn').title = agents.length ? tl('Subagents: {0} working', agents.length) : tl('Subagents: none now');
    } catch {}
  }

  function agentControl(a, request, failure) {
    return postJson('/api/chat/control', { runId: a.runId, request })
      .then(() => setTimeout(renderAgents, 500))
      .catch((e) => alertInline($('agentList'), `${failure}: ${e.message}`));
  }

  function agentRow(a) {
    let row = agentEls.get(a.id);
    if (!row) {
      row = document.createElement('div');
      row.className = 'agent';
      const head = Object.assign(document.createElement('div'), { className: 'proc' });
      const info = Object.assign(document.createElement('div'), { className: 'info', title: tl('Task and result') });
      const cmd = Object.assign(document.createElement('div'), { className: 'cmd' });
      cmd.append(Object.assign(document.createElement('span'), { className: 'kind' }), Object.assign(document.createElement('span'), { className: 'what' }));
      info.append(cmd, Object.assign(document.createElement('div'), { className: 's' }), Object.assign(document.createElement('div'), { className: 's spend', hidden: true }));
      const more = Object.assign(document.createElement('div'), { className: 'agent-more', hidden: true });
      info.onclick = () => {
        if (agentsOpen.has(a.id)) agentsOpen.delete(a.id); else agentsOpen.add(a.id);
        more.hidden = !agentsOpen.has(a.id);
      };
      const bg = Object.assign(document.createElement('button'), { type: 'button', className: 'btn bg', textContent: '⇣', title: tl('Send to the background: the agent keeps working and Claude keeps answering') });
      bg.onclick = () => agentControl(a, { subtype: 'background_tasks', tool_use_id: a.toolUseId }, tl('Could not send to the background'));
      const stop = Object.assign(document.createElement('button'), { type: 'button', className: 'x stop', textContent: '✕', title: tl('Stop the subagent (click twice)') });
      // Two-step confirmation instead of confirm(), which would block the page.
      stop.onclick = () => {
        if (!stop.dataset.armed) {
          stop.dataset.armed = '1';
          stop.classList.add('armed');
          stop.textContent = tl('stop?');
          setTimeout(() => { delete stop.dataset.armed; stop.classList.remove('armed'); stop.textContent = '✕'; }, 3000);
          return;
        }
        delete stop.dataset.armed;
        stop.classList.remove('armed');
        stop.textContent = '✕';
        agentControl(a, { subtype: 'stop_task', task_id: a.id }, tl('Could not stop'));
      };
      head.append(info, bg, stop);
      row.append(head, more);
      agentEls.set(a.id, row);
    }
    const set = setText;
    row.classList.toggle('ended', !!a.ended);
    const mark = a.ended ? (a.status === 'completed' ? '✓' : a.status === 'failed' ? '✗' : '■') : '◐';
    set(row.querySelector('.kind'), mark);
    const who = a.workflow ? `workflow ${a.workflow}` : a.agent || AGENT_KINDS[a.kind] || 'agent';
    set(row.querySelector('.what'), `${who}${a.background ? ' ' + tl('(background)') : ''}: ${a.description || tl('no description')}`);
    row.querySelector('.cmd').title = a.description || '';
    const u = a.usage || {};
    // Bare values like the processes view; what each one is shows on hover. Rebuilt only on change.
    const line = row.querySelector('.s:not(.spend)');
    const values = [
      [fmtDur(u.duration_ms != null && a.ended ? u.duration_ms : (a.ended || Date.now()) - a.started), a.ended ? tl('How long it worked') : tl('How long it has been working')],
      a.model ? [prettyModel(a.model), tl('Model: {0}', a.model)] : null,
      u.total_tokens ? [fmtTok(u.total_tokens), tl('Context + output — the CLI counter: the context of the last request plus all of the agent’s output (not the spend; the spend is on the line below)')] : null,
      u.tool_uses ? [String(u.tool_uses), tl('Actions: tool calls')] : null,
      !a.ended && a.lastTool ? [a.lastTool, tl('Current tool')] : null,
      [AGENT_STATUS[a.status] || a.status, tl('State')],
    ].filter(Boolean);
    const lineKey = JSON.stringify(values);
    if (line.dataset.key !== lineKey) {
      line.dataset.key = lineKey;
      line.replaceChildren(...values.flatMap(([text, title], i) => [...(i ? [' · '] : []), Object.assign(document.createElement('span'), { textContent: text, title })]));
    }
    // What it really used, summed over its API calls (from its transcript; the server reads it).
    const sp = a.spend;
    const spend = row.querySelector('.spend');
    spend.hidden = !sp?.requests;
    if (sp?.requests) {
      set(spend, tl('spent: from cache {0} · to cache {1} · input {2} · output {3} · requests {4}', fmtTok(sp.cacheRead), fmtTok(sp.cacheWrite), fmtTok(sp.input), fmtTok(sp.output), sp.requests));
      spend.title = tl('The total over all of the agent’s API requests. “Context+output” above is the CLI counter: the context of the last request plus all of the output');
    }
    row.querySelector('.bg').hidden = !a.live || a.background || !a.toolUseId;
    row.querySelector('.stop').hidden = !a.live;
    const more = row.querySelector('.agent-more');
    more.hidden = !agentsOpen.has(a.id);
    const parts = [
      a.activity && !a.ended ? [tl('Now'), a.activity] : null,
      a.prompt ? [tl('Task'), a.prompt] : null,
      a.steps?.length ? [a.messages > a.steps.length ? tl('Last steps ({0} of {1} messages)', a.steps.length, a.messages) : tl('Last steps ({0})', a.steps.length), '\n' + a.steps.map((st) => `• ${st.name}${st.detail ? ': ' + st.detail : ''}`).join('\n')] : null,
      a.result ? [tl('Result'), a.result] : null,
      a.error ? [tl('Error'), a.error] : null,
      a.model ? [tl('Model'), a.model] : null,
    ].filter(Boolean);
    const key = JSON.stringify(parts);
    if (more.dataset.key !== key) { // rebuilt only on change: a selection in it survives refreshes
      more.dataset.key = key;
      more.replaceChildren(...parts.flatMap(([title, text], i) => [
        ...(i ? [document.createElement('br'), document.createElement('br')] : []),
        Object.assign(document.createElement('b'), { textContent: title + ': ' }),
        document.createTextNode(text),
      ]));
    }
    row.style.paddingLeft = (a.depthShown || 0) * 14 + 'px';
    return row;
  }

  /** The root of a run's tree: its main agent (the claude -p run of a chat). */
  function runRow(rid, info, list) {
    let row = runEls.get(rid);
    if (!row) {
      row = document.createElement('div');
      row.className = 'proc agent-run';
      const info_ = Object.assign(document.createElement('div'), { className: 'info' });
      const cmd = Object.assign(document.createElement('div'), { className: 'cmd' });
      cmd.append(Object.assign(document.createElement('span'), { className: 'kind', textContent: '✻' }), Object.assign(document.createElement('span'), { className: 'what' }));
      info_.append(cmd, Object.assign(document.createElement('div'), { className: 's' }));
      row.append(info_);
      runEls.set(rid, row);
    }
    row.classList.toggle('ended', !info.alive);
    setText(row.querySelector('.what'), `“${info.prompt || tl('run')}”`);
    row.querySelector('.cmd').title = info.prompt || '';
    const working = list.filter((a) => !a.ended).length;
    setText(row.querySelector('.s'), [
      rid === runId ? tl('this tab') : '',
      info.alive ? (info.waiting ? tl('waiting for a message') : tl('working')) : tl('finished'),
      working && working !== list.length ? tl('agents: {0}, working {1}', list.length, working) : tl('agents: {0}', list.length),
      info.sessionId ? tl('session {0}', info.sessionId.slice(0, 8)) : '',
      $('agentAllProjects').checked && info.cwd ? shortPath(info.cwd) : '',
    ].filter(Boolean).join(' · '));
    return row;
  }

  let agentsSeq = 0; // an older answer arriving late is dropped

  async function renderAgents() {
    clearTimeout(agentsTimer);
    const seq = ++agentsSeq;
    const list = $('agentList');
    if (!list.childElementCount) list.innerHTML = `<div class="empty">${tl('Loading…')}</div>`;
    let agents, runInfo;
    try {
      const q = new URLSearchParams();
      if ($('agentAll').checked) q.set('all', '1');
      if (!$('agentAllProjects').checked && cwd) q.set('cwd', cwd); // this tab's project only
      q.set('spend', '1');
      ({ agents, runs: runInfo = {} } = await getJson('/api/agents?' + q));
    } catch (e) {
      if (seq !== agentsSeq) return;
      list.innerHTML = '';
      alertInline(list, e.message);
      if (sidePanel.isShowing('agents')) agentsTimer = setTimeout(renderAgents, 5000);
      return;
    }
    if (seq !== agentsSeq) return;
    // The extension's order: working (oldest first), then failed, then the latest finished.
    const rank = (a) => (!a.ended ? 0 : a.status === 'failed' ? 1 : 2);
    const order = (x, y) => rank(x) - rank(y) || (rank(x) === 0 ? x.started - y.started : y.ended - x.ended || y.started - x.started);
    const groups = new Map();
    for (const a of agents) {
      if (!groups.has(a.runId)) groups.set(a.runId, []);
      groups.get(a.runId).push(a);
    }
    // Runs with working agents first, then the one whose agent started last.
    const busyRun = (l) => l.some((a) => !a.ended);
    const latest = (l) => Math.max(...l.map((a) => a.started));
    const runOrder = [...groups].sort(([, x], [, y]) => Number(busyRun(y)) - Number(busyRun(x)) || latest(y) - latest(x));
    const rows = [];
    for (const [rid, runAgents] of runOrder) {
      rows.push(runRow(rid, runInfo[rid] || {}, runAgents));
      // A nested agent right under the one that started it.
      const ids = new Set(runAgents.map((a) => a.id));
      const children = new Map();
      for (const a of runAgents.sort(order)) {
        const p = ids.has(a.parentId) ? a.parentId : null;
        if (!children.has(p)) children.set(p, []);
        children.get(p).push(a);
      }
      const walk = (p, depth) => { for (const a of children.get(p) || []) { a.depthShown = depth; rows.push(agentRow(a)); walk(a.id, depth + 1); } };
      walk(null, 1);
    }
    const ids = new Set(agents.map((a) => a.id));
    for (const id of agentEls.keys()) if (!ids.has(id)) agentEls.delete(id);
    for (const id of runEls.keys()) if (!groups.has(id)) runEls.delete(id);
    if (!rows.length) {
      list.innerHTML = `<div class="empty">${$('agentAll').checked ? tl('No subagents in the last hour') : tl('No subagent is working now')}</div>`;
    } else if (rows.length !== list.children.length || rows.some((r, i) => list.children[i] !== r)) {
      list.replaceChildren(...rows);
    }
    // While shown it keeps polling even with no agents: one may start any moment (in any tab).
    if (sidePanel.isShowing('agents')) agentsTimer = setTimeout(renderAgents, agents.some((a) => !a.ended) || busy() ? 2000 : 5000);
  }
  /** This tab's run started or finished an agent: the view and the badge follow at once. */
  function agentsChanged() {
    refreshAgentCount();
    if (!sidePanel.isShowing('agents')) return;
    clearTimeout(agentsTimer);
    agentsTimer = setTimeout(renderAgents, 300); // a burst of events, one refresh
  }
  $('agentRefresh').onclick = renderAgents;
  $('agentAll').onchange = renderAgents;
  $('agentAllProjects').onchange = renderAgents;
  // Live processes under the hint, like the terminal's list of background tasks.
  const procsEl = $('procs');
  const PROCS_SHOWN = 5;
  let procsTimer = null;

  function uptime(iso) { return fmtDur(Date.now() - Date.parse(iso)); }

  function renderProcs(processes) {
    // The current run's own claude process and the permission bridges are implied.
    const live = processes.filter((p) => !p.exited && p.kind !== 'server' && p.kind !== 'bridge' && p.pid !== runPid);
    embedCounts.set('processes', live.length);
    // MCP servers the current run started from the user's config are infrastructure: count only.
    const isRunMcp = (p) => runPid && p.parentRun?.pid === runPid && /mcp/i.test(p.command);
    const mcpCount = live.filter(isRunMcp).length;
    const list = live.filter((p) => !isRunMcp(p));
    procsEl.innerHTML = '';
    for (const p of list.slice(0, PROCS_SHOWN)) {
      const line = document.createElement('div');
      line.className = 'row-line';
      const mark = document.createElement('span');
      mark.className = 'mark';
      mark.textContent = p.kind === 'claude' ? '✻' : '⚙';
      const txt = document.createElement('span');
      txt.className = 'txt';
      const what = p.kind === 'claude' ? `claude -p «${p.prompt || ''}»` : p.command;
      const orphan = p.ppid === 1 ? ' · ' + tl('no parent') : '';
      txt.textContent = `${p.pid}  ${what}  (${uptime(p.started)}${orphan})`;
      txt.title = p.command;
      const x = document.createElement('button');
      x.type = 'button';
      x.className = 'x';
      x.textContent = '✕';
      x.title = tl('Stop (click twice)');
      x.onclick = async () => {
        if (!x.classList.contains('armed')) {
          x.classList.add('armed');
          x.textContent = tl('stop?');
          setTimeout(() => { x.classList.remove('armed'); x.textContent = '✕'; }, 3000);
          return;
        }
        x.disabled = true;
        await fetch('/api/processes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pid: p.pid }),
        }).catch(() => {});
        setTimeout(refreshProcs, 500);
      };
      line.append(mark, txt, x);
      procsEl.appendChild(line);
    }
    if (mcpCount) {
      const line = document.createElement('div');
      line.className = 'row-line done';
      line.innerHTML = `<span class="mark">·</span><span class="txt">+ ${tl('{0} MCP server(s) of the current run', mcpCount)}</span>`;
      procsEl.appendChild(line);
    }
    if (list.length > PROCS_SHOWN) {
      const more = document.createElement('button');
      more.type = 'button';
      more.className = 'more';
      more.textContent = tl('{0} more — show all', list.length - PROCS_SHOWN);
      more.onclick = () => sidePanel.show('procs');
      procsEl.appendChild(more);
    }
  }

  /** Polls often while Claude works (new jobs appear), rarely when idle. */
  async function refreshProcs() {
    clearTimeout(procsTimer);
    try {
      // The badge and the list under the input: this tab's project.
      const d = await getJson('/api/processes' + (cwd ? '?cwd=' + encodeURIComponent(cwd) : ''));
      renderProcCount(d.processes);
      renderProcs(d.processes);
      refreshAgentCount();
      // Keep the panel list in step, but don't reset an armed "Sure?" button or the scroll position.
      const plist = $('procList');
      const sel = getSelection();
      const selecting = sel && !sel.isCollapsed && plist.contains(sel.anchorNode); // copying from the details
      if (sidePanel.isShowing('procs') && !plist.querySelector('[data-armed]') && !selecting) {
        const top = plist.scrollTop;
        renderProcesses().then(() => { plist.scrollTop = top; });
      }
    } catch {
      procsEl.innerHTML = '';
    }
    procsTimer = setTimeout(refreshProcs, busy() ? 2000 : 10000);
  }
  // Deferred: renderProcs uses helpers declared further down in this script.
  setTimeout(refreshProcs, 0);

  /** Loads a saved transcript into the log and makes it the active session. */
  // A long session (tens of thousands of items) would freeze the window if drawn at once: the
  // end is shown, earlier pages come with "Show earlier".
  const HISTORY_PAGE = 300;

  /** Draws history items at the end of the log. */
  function renderHistoryItems(items) {
    for (const it of items) {
      if (it.role === 'user') decorateUserBubble(el('div', 'msg user', it.text), { uuid: it.uuid, ts: it.ts });
      else if (it.role === 'command') el('div', 'msg user', it.text);
      else if (it.role === 'assistant') { const a = el('div', 'msg assistant'); a.innerHTML = renderMarkdown(it.text); addTime(a, it.ts); }
      else if (it.role === 'thinking') thinkingBlock(it.text);
      else if (it.role === 'stdout') el('div', 'status', it.text);
      else if (it.role === 'compact') { compactNote.done(it, it.ts); compactNote.summary(it.summary); }
      else if (it.role === 'tool') {
        addToolCard({ id: it.id, name: it.name, input: it.input });
        if (it.result != null) addToolResult({ tool_use_id: it.id, content: it.result, is_error: it.isError }, it.denied);
      }
    }
  }

  /** The button above a loaded session's history: draws the page before `start` above it. */
  function earlierButton(id, start) {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'btn history-more', textContent: tl('Show earlier ({0} more)', start) });
    b.onclick = async () => {
      b.disabled = true;
      b.textContent = tl('Loading…');
      let h;
      try {
        h = await getJson(`/api/history?id=${encodeURIComponent(id)}&before=${start}&limit=${HISTORY_PAGE}`);
      } catch (e) {
        b.disabled = false;
        b.textContent = tl('Could not load: {0}', e.message);
        return;
      }
      if (sessionId !== id || !b.isConnected) return;
      // Drawn at the end like everything else, then moved up here; the view stays where it was.
      const ref = b.nextElementSibling;
      const refTop = ref?.getBoundingClientRect().top;
      const last = log.lastChild;
      renderHistoryItems(h.items);
      const added = [];
      for (let n = last.nextSibling; n; n = n.nextSibling) added.push(n);
      b.replaceWith(...(h.start > 0 ? [earlierButton(id, h.start)] : []), ...added);
      if (ref) scroller.scrollTop += ref.getBoundingClientRect().top - refTop;
    };
    return b;
  }

  async function loadSession(id, { quiet = false, title = '' } = {}) {
    if (controller) controller.abort();
    let h;
    const loading = el('div', 'status', tl('Loading the session…'));
    try {
      h = await getJson(`/api/history?id=${encodeURIComponent(id)}&limit=${HISTORY_PAGE}`);
    } catch (e) {
      loading.remove();
      if (!quiet) el('div', 'error', tl('Could not load the session: {0}', e.message));
      return;
    }
    resetChat();
    sessionId = h.sessionId;
    store.set('claude.sessionId', sessionId);
    // --resume finds a session only in the history dir of the folder it runs in: this tab's folder
    // stays when that dir is its own, else the tab moves to the project's folder (h.cwd: where the
    // project is now, not the path the transcript recorded — stale after the project moved).
    if (h.cwd && h.cwd !== cwd && encodeProjectDir(cwd) !== h.projectDir) { cwd = h.cwd; store.set('claude.cwd', cwd); }
    sessionTitle = title || h.title || '';
    if (h.start > 0) log.appendChild(earlierButton(id, h.start));
    renderHistoryItems(h.items);
    el('div', 'history-sep', tl('Continuing session {0} — new messages will be added to it', id.slice(0, 8)));
    if (h.cwdExists === false && encodeProjectDir(cwd) === h.projectDir) {
      const note = el('div', 'error', tl('Project folder not found: {0}. To continue the session, point to where the project is now.', shortPath(cwd)) + ' ');
      const fix = Object.assign(node('button', 'btn', tl('Point to the folder…')), { type: 'button' });
      fix.onclick = () => relinkProject({ dir: h.projectDir, cwd }, { then: (dir) => { note.remove(); followProject(dir); } });
      note.append(fix);
    }
    ctxMeter.reset();
    if (h.usage) ctxMeter.fromUsage(h.usage);
    ctxMeter.refresh(); // the transcript's last usage is a guess at best; the CLI knows
    // Two tabs continuing one session would interleave their messages in the CLI's history.
    tabs.sessionInUse(id).then((inUse) => {
      if (inUse && sessionId === id) {
        el('div', 'error', tl('⚠️ This session is open in another tab too. Writing to it from both will mix up the history — better start a new chat in one of them.'));
      }
    });
    renderMeta();
    sidePanel.refresh(); // the session may belong to another project folder
    refreshProcs();
    viewer.syncProject();
    toBottom(); // an opened session starts at its end
  }

  /**
   * The log sticks to the bottom like a terminal: while the user is at the bottom, any change of
   * size (new content, a card expanding, the footer panels growing) keeps the end in view.
   * Scrolling up releases it; scrolling back down re-attaches.
   */
  let stickToBottom = true;
  scroller.addEventListener('scroll', () => {
    stickToBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 40;
    if (stickToBottom) hideJump();
  });
  const keepAtBottom = () => { if (stickToBottom) scroller.scrollTop = scroller.scrollHeight; };
  new ResizeObserver(keepAtBottom).observe(scroller); // footer grew/shrank
  new ResizeObserver(keepAtBottom).observe(log); // content grew

  /** New content: follow it only if the log was at the bottom; otherwise offer a jump. */
  function scrollDown(urgent = false) {
    if (stickToBottom) keepAtBottom();
    else showJump(urgent);
  }

  /** Jumps to the end and re-attaches (the user sent a message or pressed the jump button). */
  function toBottom() {
    stickToBottom = true;
    scroller.scrollTop = scroller.scrollHeight;
    hideJump();
  }

  // "↓ New messages" while reading above; "↓ Claude is waiting" when a prompt/question arrived.
  const jumpBtn = $('jumpBtn');
  function showJump(urgent) {
    jumpBtn.hidden = false;
    if (urgent) jumpBtn.classList.add('urgent');
    jumpBtn.textContent = jumpBtn.classList.contains('urgent') ? tl('↓ Claude is waiting for an answer') : tl('↓ New messages');
  }
  function hideJump() {
    jumpBtn.hidden = true;
    jumpBtn.classList.remove('urgent');
  }
  jumpBtn.onclick = () => { toBottom(); promptEl.focus({ preventScroll: true }); };

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    log.appendChild(n);
    scrollDown();
    return n;
  }

  /**
   * Compaction line in the log. The CLI reports no progress while compacting (stream-json has only
   * status "compacting" and its end), so the line shows the elapsed time, then the numbers from
   * compact_boundary: "History compacted: 23,045 → 1,144 tokens in 3.6 s"; the summary that
   * replaced the history follows as a collapsed card, like a tool call.
   */
  const compactNote = (() => {
    let live = null, timer = null, started = 0;
    let awaiting = null; // a finished line still waiting for its summary message (live runs)
    const num = (n) => Number(n).toLocaleString(LOCALE);
    const dur = (ms) => {
      const sec = ms / 1000;
      return sec < 60 ? tl('{0} s', sec.toLocaleString(LOCALE, { minimumFractionDigits: 1, maximumFractionDigits: 1 })) : tl('{0} min {1} s', Math.floor(sec / 60), Math.round(sec % 60));
    };
    const stopTimer = () => { clearInterval(timer); timer = null; };
    const create = () => {
      const n = el('div', 'status compact');
      n.appendChild(Object.assign(document.createElement('span'), { className: 'compact-text' }));
      return n;
    };
    const setText = (n, t) => { n.querySelector('.compact-text').textContent = t; };
    const take = () => { stopTimer(); const n = live || create(); live = null; return n; };
    return {
      start() {
        stopTimer();
        live = live || create();
        started = Date.now();
        const tick = () => {
          const sec = Math.floor((Date.now() - started) / 1000);
          setText(live, `🗜 ${tl('Compacting the history…')} ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`);
        };
        tick();
        timer = setInterval(tick, 1000);
      },
      failed(reason) {
        const n = take();
        n.className = 'error compact';
        setText(n, '🗜 ' + tl('Could not compact the history') + (reason ? ': ' + reason : ''));
      },
      /** m: { trigger, preTokens, postTokens, durationMs } (camelCase, as in history items). */
      done(m, ts) {
        const n = take();
        const parts = [];
        if (m.preTokens != null && m.postTokens != null) {
          parts.push(tl('{0} → {1} tokens', num(m.preTokens), num(m.postTokens)));
          if (m.preTokens > 0) parts.push(`(−${Math.round((1 - m.postTokens / m.preTokens) * 100)}%)`);
        }
        if (m.durationMs != null) parts.push(tl('in {0}', dur(m.durationMs)));
        setText(n, `🗜 ${m.trigger === 'auto' ? tl('History compacted automatically') : tl('History compacted')}${parts.length ? ': ' + parts.join(' ') : ''}`);
        if (ts) n.title = new Date(ts).toLocaleString(LOCALE);
        awaiting = n;
        return n;
      },
      /** Adds the summary card after the last finished line; false if no line is waiting for one. */
      summary(text) {
        if (!awaiting || !text) return false;
        awaiting = null;
        const d = el('details', 'tool');
        const s = document.createElement('summary');
        s.innerHTML = tl('🗜 <b>Summary</b> — replaced the history before compaction');
        const pre = Object.assign(document.createElement('pre'), { className: 'wrap', textContent: text });
        d.append(s, pre);
        return true;
      },
      /** The run ended: a compaction still shown as running was cut off. */
      end() {
        awaiting = null;
        if (!live) return;
        setText(take(), '🗜 ' + tl('Compaction interrupted'));
      },
      reset() { stopTimer(); live = null; awaiting = null; },
    };
  })();

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /** Minimal markdown: fenced code, inline code, bold, paragraphs. Input is escaped first. */
  function renderMarkdown(src) {
    const parts = src.split(/```(\w*)\n?([\s\S]*?)(?:```|$)/g);
    let html = '';
    for (let i = 0; i < parts.length; i += 3) {
      const text = parts[i];
      if (text.trim()) {
        html += text.trim().split(/\n{2,}/).map((p) => '<p>' + escapeHtml(p)
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
          .replace(/\n/g, '<br>') + '</p>').join('');
      }
      if (i + 2 < parts.length) html += '<pre><code>' + escapeHtml(parts[i + 2]) + '</code></pre>';
    }
    return html;
  }

  function truncate(s, n = 4000) {
    return s.length > n ? s.slice(0, n) + `\n… (${tl('+{0} characters', s.length - n)})` : s;
  }

  function toolSummary(name, input) {
    const hint = input.command || input.file_path || input.pattern || input.url || input.description || '';
    return String(hint).split('\n')[0].slice(0, 120);
  }

  /**
   * Tool call card. Live cards (current run) stay expanded while the tool runs
   * and collapse once its result arrives; history cards start collapsed.
   */
  function addToolCard(block, { live = false, parentId = null } = {}) {
    // Subagent tool calls go inside the Agent card that spawned them.
    const sub = parentId && document.querySelector(`#tool-${CSS.escape(parentId)} > .sub`);
    const d = sub ? document.createElement('details') : el('details', 'tool');
    if (sub) { d.className = 'tool nested'; sub.appendChild(d); scrollDown(); }
    if (live) { d.open = true; d.classList.add('running'); }
    const s = document.createElement('summary');
    const file = (block.input || {}).file_path || (block.input || {}).notebook_path;
    if (typeof file === 'string' && file) {
      // The file is a link: it opens in the viewer (without toggling the card).
      s.innerHTML = `🔧 <b>${escapeHtml(block.name)}</b> `;
      const a = Object.assign(document.createElement('a'), { href: '#', className: 'file-link', textContent: shortPath(file), title: tl('Open the file') });
      a.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        viewer.openPath(file.startsWith('/') ? file : `${cwd.replace(/\/$/, '')}/${file}`);
      };
      s.appendChild(a);
    } else {
      s.innerHTML = `🔧 <b>${escapeHtml(block.name)}</b> ${escapeHtml(toolSummary(block.name, block.input || {}))}`;
    }
    const pre = document.createElement('pre');
    pre.textContent = truncate(JSON.stringify(block.input, null, 2));
    d.append(s, pre);
    showAsDiff(pre, editDiff(block.name, block.input));
    if (block.name === 'Agent' || block.name === 'Task') {
      const box = document.createElement('div');
      box.className = 'sub';
      d.appendChild(box);
    }
    d.id = 'tool-' + block.id;
    // A running tool, like a permission prompt, is shown in full: scroll the log to the card's
    // end (el() scrolled while the card was still empty) and a long command to its last line.
    if (live) revealEnd(pre);
  }

  /**
   * A new block to show in full (running tool, permission prompt, question): its own scroll goes
   * to the end; the log follows only if it was at the bottom — reading above is not interrupted.
   */
  function revealEnd(pre, { urgent = false } = {}) {
    pre.scrollTop = pre.scrollHeight;
    if (stickToBottom) keepAtBottom();
    else showJump(urgent);
  }

  // Human-readable reasons for tool calls the CLI did not execute.
  const DENIAL_REASONS = {
    'user-rejected': tl('rejected by the user'),
    'permission-rule': tl('forbidden by a rule or the mode'),
    'automode-blocked': tl('blocked by auto mode'),
    'automode-unavailable': tl('auto mode is unavailable'),
  };

  // permission_denied's decision_reason_type, for an event without its own text.
  const DENIAL_TYPES = {
    classifier: tl('blocked by the auto mode classifier'),
    mode: tl('forbidden by the permission mode'),
    rule: tl('forbidden by a rule'),
    asyncAgent: tl('a background agent can’t ask for permission'),
  };

  /** Marks a tool card as not executed: red frame and the reason in the summary. */
  function markDenied(toolUseId, kind) {
    const card = document.getElementById('tool-' + toolUseId);
    if (!card || card.classList.contains('denied')) return;
    card.classList.add('denied');
    const summary = card.querySelector('summary');
    // Replace the generic " — error" suffix with the denial reason.
    const last = summary.lastChild;
    if (last?.nodeType === Node.TEXT_NODE && last.textContent === ' — ' + tl('error')) last.remove();
    summary.insertAdjacentText('beforeend', ' — ⛔ ' + tl('not done: {0}', DENIAL_REASONS[kind] || kind || tl('no permission')));
  }

  function addToolResult(block, deniedKind) {
    const card = document.getElementById('tool-' + block.tool_use_id);
    if (!card) return;
    const content = Array.isArray(block.content)
      ? block.content.map((c) => c.text || `[${c.type}]`).join('\n')
      : String(block.content ?? '');
    const pre = document.createElement('pre');
    pre.textContent = truncate(content);
    if (block.is_error) pre.classList.add('error');
    card.appendChild(pre);
    // Images in the result (generate_image): shown in the card, which stays open.
    const images = Array.isArray(block.content) ? block.content.filter((c) => c.type === 'image' && c.source?.data) : [];
    for (const im of images) {
      card.appendChild(Object.assign(document.createElement('img'), {
        className: 'tool-image', alt: tl('Generated image'), src: `data:${im.source.media_type || 'image/png'};base64,${im.source.data}`,
      }));
    }
    const saved = /Saved to (\S+) \(/.exec(content);
    if (images.length && saved) {
      const open = Object.assign(document.createElement('button'), { type: 'button', className: 'btn', textContent: tl('Open in the viewer') });
      open.onclick = () => viewer.open(saved[1]);
      card.appendChild(open);
    }
    card.querySelector('summary').insertAdjacentText('beforeend', ' — ' + (block.is_error ? tl('error') : tl('done')));
    card.classList.remove('running');
    card.open = images.length > 0;
    if (deniedKind) markDenied(block.tool_use_id, deniedKind);
  }

  /** Collapses cards whose tool never returned (run stopped or failed). */
  function finishRunningTools() {
    for (const card of document.querySelectorAll('details.tool.running')) {
      card.classList.remove('running');
      card.open = false;
      card.querySelector('summary').insertAdjacentText('beforeend', ' — ' + tl('interrupted'));
    }
  }

  /**
   * Spoken alerts for permission prompts (Web Speech API, voices of the OS — no network).
   * Reminds again if the prompt stays unanswered. Chrome only speaks after the user has
   * interacted with the page, which sending a message already counts as.
   */
  /**
   * Voice answers to permission prompts (Web Speech API recognition, ru-RU).
   * Only explicit words decide: "разрешаю" → allow, "всегда разрешаю" → allow the tool for this
   * chat, "запрещаю" / "отклоняю" / "не разрешаю" → deny. Anything with a negation or with both
   * roots is a denial. Only final results count. Through speakers recognition is paused while the
   * page speaks — its own phrases contain "разреш…" and would otherwise approve themselves; in
   * headphones it keeps listening (for prompts and dictation), with the page's own words filtered
   * out as echo. A prompt is listened for only once its spoken announcement has started.
   * Note: Chrome may send the audio to Google's speech service.
   */
  const ICONS = {
    speaker: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
    speechStop: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5 5.5 9H3v6h2.5l4.5 4z"/><rect x="14" y="9" width="7" height="7" rx="1.5"/></svg>',
    speakerOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>',
    mic: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>',
    micOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 10V6a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 5 2.2"/><path d="M5 11a7 7 0 0 0 11.5 5.4M19 11a7 7 0 0 1-.6 2.8M12 18v3M8 21h8M3 3l18 18"/></svg>',
  };

  /**
   * Headphones or speakers? Browsers don't say it directly; the name of the default output device
   * does ("AirPods Pro", "External Headphones" vs "MacBook Pro Speakers"). Names are only exposed
   * after microphone permission. Unknown devices count as speakers — the safe side, since through
   * speakers an always-open microphone would hear the page's own speech. A manual override exists.
   */
  const audioOut = (() => {
    const HEADPHONES = /headphone|headset|earphone|наушник|гарнитур|airpods|earpods|buds|beats|bose|jabra|plantronics|sennheiser|shokz|\bwh-|\bwf-/i;
    const listeners = new Set();
    let mode = store.get('claude.audioOut') || 'auto'; // auto | headphones | speakers
    let detected = { kind: 'unknown', label: '' };

    async function detect() {
      try {
        const outs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audiooutput');
        const def = outs.find((d) => d.deviceId === 'default') || outs[0];
        const label = (def?.label || '').replace(/^(Default|По умолчанию)\s*-\s*/i, '');
        detected = { kind: !label ? 'unknown' : HEADPHONES.test(label) ? 'headphones' : 'speakers', label };
      } catch {
        detected = { kind: 'unknown', label: '' };
      }
      listeners.forEach((fn) => fn());
    }

    /** Asks for the microphone once so that device names become visible, then re-detects. */
    async function unlockLabels() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach((t) => t.stop());
      } catch {}
      await detect();
    }

    navigator.mediaDevices?.addEventListener?.('devicechange', detect);
    detect();

    return {
      get mode() { return mode; },
      setMode(m) { mode = m; store.set('claude.audioOut', m); listeners.forEach((fn) => fn()); },
      get detected() { return detected; },
      isHeadphones() { return mode === 'headphones' || (mode === 'auto' && detected.kind === 'headphones'); },
      onChange(fn) { listeners.add(fn); },
      detect, unlockLabels,
    };
  })();

  /**
   * webkitSpeechRecognition relies on a Google service: Chrome only, and not always reachable; in
   * Electron it does not work at all. Recognition through the macOS Speech framework (app/stt)
   * replaces it: inside the desktop app over IPC (window.ninebits.stt), in a normal browser through
   * the server (POST /api/stt, see server/stt.js; the server sets SERVER_STT when it can). Both
   * backends have start(lang) / stop() / onEvent(fn), and stop() is always answered with an "end".
   * The class below gives them the Web Speech API shape the code further down uses: lang /
   * continuous / interimResults, onstart / onresult / onerror / onend, start() / stop() / abort().
   */
  const SERVER_STT = /*@SERVER_STT@*/false;
  const serverStt = () => {
    let listener = null;
    let ctrl = null; // the open /api/stt stream
    const emit = (ev) => listener?.(ev);
    return {
      start(lang) {
        ctrl?.abort(); // the server ends the previous stream anyway (one listener at a time)
        const c = (ctrl = new AbortController());
        fetch('/api/stt', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lang }), signal: c.signal,
        }).then(async (r) => {
          if (!r.ok) {
            const e = await r.json().catch(() => ({}));
            emit({ type: 'error', error: 'service-not-allowed', message: e.error || `HTTP ${r.status}` });
            return emit({ type: 'end' });
          }
          const reader = r.body.getReader();
          const dec = new TextDecoder();
          let buf = '';
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            let nl;
            while ((nl = buf.indexOf('\n')) >= 0) {
              const line = buf.slice(0, nl);
              buf = buf.slice(nl + 1);
              if (line && ctrl === c) emit(JSON.parse(line));
            }
          }
        }).catch((e) => {
          if (c.signal.aborted) return;
          emit({ type: 'error', error: 'network', message: e.message });
          emit({ type: 'end' });
        }).finally(() => { if (ctrl === c) ctrl = null; });
      },
      stop() {
        // Closing the stream stops the microphone on the server; answer with an "end" like the app.
        const c = ctrl;
        ctrl = null;
        c?.abort();
        setTimeout(() => emit({ type: 'end' }), 0);
      },
      onEvent(fn) { listener = fn; },
    };
  };
  const sttBackend = window.ninebits?.stt || (SERVER_STT ? serverStt() : null);
  if (sttBackend) {
    let current = null;    // the instance that owns the microphone
    let staleEnds = 0;     // "end" events still due for stop() calls of earlier instances
    class NinebitsRecognition {
      constructor() {
        this.lang = LOCALE;
        this.continuous = false;
        this.interimResults = false;
        this.onresult = this.onerror = this.onend = this.onstart = null;
        this._results = [];
        this._open = null; // index of the phrase being recognized
      }
      start() {
        if (current && current !== this) current._stop();
        current = this;
        sttBackend.start(this.lang);
      }
      stop() { this.abort(); }
      abort() {
        if (current !== this) return;
        this._stop();
        // Like Chrome: onend follows an abort (the code that aborts usually has removed it first).
        setTimeout(() => this.onend?.({}), 0);
      }
      _stop() {
        current = null;
        staleEnds++;
        sttBackend.stop();
      }
      _event(ev) {
        if (ev.type === 'ready') this.onstart?.({});
        else if (ev.type === 'result') {
          const i = this._open ?? this._results.length;
          const item = Object.assign([{ transcript: ev.text, confidence: 1 }], { isFinal: !!ev.final });
          this._results[i] = item;
          this._open = ev.final ? null : i;
          if (ev.final || this.interimResults) this.onresult?.({ resultIndex: i, results: this._results });
        } else if (ev.type === 'error') {
          this.onerror?.({ error: ev.error, message: ev.message });
        } else if (ev.type === 'end') {
          current = null;
          this.onend?.({});
        }
      }
    }
    sttBackend.onEvent((ev) => {
      if (ev.type === 'end' && staleEnds > 0) { staleEnds--; return; } // answer to an earlier stop()
      current?._event(ev);
    });
    window.SpeechRecognition = window.webkitSpeechRecognition = NinebitsRecognition;
  }

  const hearing = (() => {
    // In VS Code there is no recognition yet (the Web Speech one needs Google's service, which
    // Electron lacks; TTS / STT MD Aloud doesn't recognize speech yet): the microphone is off and hidden.
    const SR = EMBED ? null : window.SpeechRecognition || window.webkitSpeechRecognition;
    const supported = !!SR;
    const btn = $('micBtn');
    const menu = $('micMenu');
    const LISTEN_MS = 120000; // per prompt; after that only the buttons remain
    const queue = []; // pending prompts, the first one is being listened to
    // Two independent switches (mic menu): answers to permission prompts, and dictation.
    let promptsOn = supported && store.get('claude.voiceAnswer') !== 'off';
    let rec = null;
    let paused = false;
    let fatal = null; // microphone denied / no service: stop retrying

    const FATAL = {
      'not-allowed': tl('no access to the microphone — allow it for this page'),
      'service-not-allowed': tl('speech recognition is unavailable in this browser'),
      'audio-capture': tl('microphone not found'),
      network: tl('no connection to the recognition service'),
    };

    /** 'allow' | 'always' | 'deny' | null. Denial wins over anything ambiguous. */
    function classify(text) {
      const t = text.toLowerCase().replace(/ё/g, 'е');
      if (/(^|[^а-я])не\s*разреш|запрещ|запрет|отклон|отказ|\bden(y|ied)\b|\breject|\bdecline|\bdon'?t allow|\bdo not allow|\bnot allow/.test(t)) return 'deny';
      if (/разреш|\ballow|\bapprove/.test(t)) return /всегда|\balways/.test(t) ? 'always' : 'allow';
      return null;
    }

    // Text the page is speaking right now; a phrase that matches it is our own echo.
    let spokenText = '';
    const norm = (t) => t.toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9 ]+/gi, ' ').replace(/\s+/g, ' ').trim();
    function isEcho(text) {
      if (!spokenText) return false;
      const heardN = norm(text);
      if (!heardN) return false;
      if (spokenText.includes(heardN)) return true;
      const words = heardN.split(' ');
      const hits = words.filter((w) => w.length > 2 && spokenText.includes(w)).length;
      return words.length >= 3 && hits / words.length >= 0.6;
    }

    /**
     * While the page speaks, keep listening only in headphones (for a prompt or for dictation): the
     * answer or the next message can be given right away. Through speakers the microphone would
     * hear the page, so there everything waits for the phrase to end.
     */
    const listenWhileSpeaking = () => (!!activePrompt() || dictating()) && audioOut.isHeadphones();

    /** Always-on dictation: only with headphones (no echo of the page's own speech). */
    // Only the tab in front dictates — otherwise every open tab would send the same phrase.
    const dictating = () => dictation.enabled && audioOut.isHeadphones() && document.visibilityState === 'visible';
    /** The prompt the next phrase answers, if answering by voice is on and it has been announced. */
    const activePrompt = () => (promptsOn && queue[0]?.armed ? queue[0] : null);
    const WAIT_TEXT = tl('🎙️ I’ll start listening for the answer once I’ve read the request out');

    function render() {
      const anyOn = supported && !fatal && (promptsOn || dictation.enabled);
      btn.classList.toggle('off', !anyOn);
      btn.classList.toggle('live', !!rec?.ready);
      btn.innerHTML = anyOn ? ICONS.mic : ICONS.micOff;
      btn.title = !supported
        ? tl('The browser doesn’t support speech recognition (Chrome or Edge is needed)')
        : fatal ? tl('Microphone: {0}', FATAL[fatal])
        : rec?.ready ? tl('The microphone is listening — settings')
        : tl('Microphone settings');
      if (!menu.hidden) renderMenu();
    }

    function status(p, text, listening = false) {
      p.statusEl.textContent = text;
      p.statusEl.classList.toggle('listening', listening);
      if (listening || text === OFF_TEXT) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn mic-toggle';
        b.textContent = promptsOn ? tl('don’t listen for the answer') : tl('answer by voice');
        b.onclick = () => setPrompts(!promptsOn);
        p.statusEl.appendChild(b);
      }
      render();
    }
    const OFF_TEXT = tl('🎙️ Voice answers are off — answer with a button');
    const listenText = (p) => p.kind !== 'question'
      ? tl('🎙️ Listening: say “allow” or “deny”')
      : dictation.sendMode === 'word'
        ? tl('🎙️ Listening: dictate the answer — it goes into the “Other” field. “Answer” sends it, “skip” goes on without an answer')
        : tl('🎙️ Listening: dictate the answer — I’ll send it after a pause. “Skip” goes on without an answer');

    function stopRec() {
      if (!rec) return;
      const r = rec;
      rec = null;
      r.onend = r.onresult = r.onerror = null;
      try { r.abort(); } catch {}
      dictation.listening(false);
      render();
    }

    function startRec() {
      if (!supported || rec || fatal) return;
      const p = activePrompt();
      if (paused && !listenWhileSpeaking()) return;
      if (p && Date.now() - p.started > LISTEN_MS) {
        status(p, tl('🎙️ The time for a voice answer is up — answer with a button'));
        queue.shift(); // the buttons stay; listen for the next prompt or for dictation
        return startRec();
      }
      if (!p && !dictating()) return;
      const r = new SR();
      r.lang = LOCALE;
      r.continuous = true;
      r.interimResults = true;
      // Routed when a phrase arrives: a pending permission prompt takes priority over dictation.
      r.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const text = e.results[i][0].transcript.trim();
          if (!text) continue;
          const final = e.results[i].isFinal;
          const prompt = activePrompt();
          if (!prompt) {
            // In headphones dictation goes on while the page speaks; its own words are skipped.
            if (dictating() && (!paused || audioOut.isHeadphones()) && !isEcho(text)) dictation.heard(text, final);
            continue;
          }
          // The page's own phrase picked up by the microphone. Not for questions: an answer usually
          // repeats one of the options that were just read out, and would be dropped as "echo".
          if (prompt.kind !== 'question' && isEcho(text)) continue;
          if (!final) {
            prompt.onInterim?.(); // still speaking: a question postpones its auto-send
            status(prompt, '🎙️ ' + tl('I hear: “{0}”', text), true);
            continue;
          }
          if (prompt.kind === 'question') {
            // Claude's question: the form decides what the phrase means (skip / submit / answer text).
            const note = prompt.onPhrase(text);
            if (note === 'done') return; // answered: the prompt already left the queue
            status(prompt, note, true);
            continue;
          }
          const decision = classify(text);
          if (decision) return decide(prompt, decision, text);
          status(prompt, '🎙️ ' + tl('Didn’t get “{0}” — say “allow” or “deny”', text), true);
        }
      };
      r.onerror = (e) => {
        if (FATAL[e.error]) {
          fatal = e.error;
          render();
          for (const q of queue) status(q, '🎙️ ' + tl('Voice answers are unavailable: {0}', FATAL[e.error]));
        }
        // 'no-speech' / 'aborted': onend restarts listening.
      };
      // "Listening" only once the microphone really listens: starting it takes a moment, and it may fail.
      r.onstart = () => {
        if (rec !== r) return;
        r.ready = true;
        const q = activePrompt();
        if (q) status(q, listenText(q), true);
        else dictation.listening(true);
        render();
      };
      // Chrome ends recognition after a pause in speech — keep listening while needed.
      r.onend = () => {
        if (rec !== r) return;
        rec = null;
        dictation.listening(false);
        render();
        setTimeout(startRec, 250);
      };
      rec = r;
      try {
        r.start();
        render();
      } catch {
        rec = null;
      }
    }

    function decide(p, decision, text) {
      stopRec();
      queue.splice(queue.indexOf(p), 1);
      const verdict = decision === 'deny' ? tl('denied') : decision === 'always' ? tl('allowed for the whole chat') : tl('allowed');
      status(p, '🎙️ ' + tl('“{0}” → {1} by voice', text, verdict));
      p.onDecision(decision);
      setTimeout(startRec, 300); // next pending prompt, or dictation
    }

    /** Re-evaluates whether to listen (a switch, the output device or the prompts changed). */
    function update() {
      fatal = null; // let the user retry after granting the microphone
      stopRec();
      for (const [i, q] of queue.entries()) {
        if (!promptsOn) status(q, OFF_TEXT);
        else if (i > 0) status(q, tl('🎙️ Waiting: answer the previous request first'));
        else if (!q.armed) status(q, WAIT_TEXT);
      }
      startRec();
      render();
    }

    function setPrompts(v) {
      promptsOn = v;
      store.set('claude.voiceAnswer', v ? 'on' : 'off');
      update();
    }

    // --- menu ---
    function renderMenu() {
      menu.innerHTML = '';
      if (!supported) {
        menu.textContent = tl('The browser doesn’t support speech recognition (Chrome or Edge is needed)');
        return;
      }
      const row = (label, checked, onChange, hint) => {
        const l = document.createElement('label');
        l.className = 'menu-row';
        if (hint) l.title = hint;
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = checked;
        cb.onchange = () => onChange(cb.checked);
        l.append(cb, ' ' + label);
        menu.appendChild(l);
      };
      const select = (label, value, options, onChange) => {
        const l = document.createElement('label');
        l.className = 'menu-row menu-select';
        const sel = document.createElement('select');
        for (const [v, t] of options) sel.add(new Option(t, v));
        sel.value = value;
        sel.onchange = () => onChange(sel.value);
        l.append(label, sel);
        menu.appendChild(l);
      };
      const note = (text) => {
        const n = document.createElement('div');
        n.className = 'menu-note';
        n.textContent = text;
        menu.appendChild(n);
      };

      row(tl('Answers to permission requests'), promptsOn, setPrompts,
        tl('While a permission request waits, the microphone listens for “allow” or “deny”'));
      row(tl('Voice input of messages'), dictation.enabled, (v) => dictation.setEnabled(v),
        tl('Dictating and sending messages; headphones only'));
      if (fatal) note('⚠️ ' + FATAL[fatal]);

      const head = document.createElement('div');
      head.className = 'menu-section';
      head.textContent = tl('Voice input');
      menu.appendChild(head);
      const d = audioOut.detected;
      const found = d.kind === 'headphones' ? `🎧 ${d.label}` : d.kind === 'speakers' ? `🔈 ${d.label}` : tl('not detected');
      select(tl('Sound output'), audioOut.mode, [
        ['auto', tl('Auto: {0}', found)],
        ['headphones', tl('🎧 Headphones')],
        ['speakers', tl('🔈 Speakers')],
      ], (v) => audioOut.setMode(v));
      if (audioOut.mode === 'auto' && !d.label) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn menu-stop';
        b.textContent = tl('Detect the device');
        b.title = tl('The browser shows device names only after microphone access is granted');
        b.onclick = async () => { await audioOut.unlockLabels(); renderMenu(); };
        menu.appendChild(b);
      }
      select(tl('Sending'), dictation.sendMode, [
        ['pause', tl('after a pause')],
        ['word', tl('on the word “send”')],
      ], (v) => { dictation.setSendMode(v); renderMenu(); });
      if (dictation.sendMode === 'pause') {
        const l = document.createElement('label');
        l.className = 'menu-row menu-select';
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.min = String(dictation.pauseLimits.min);
        inp.max = String(dictation.pauseLimits.max);
        inp.step = '0.1';
        inp.value = String(dictation.pauseSeconds);
        inp.style.width = '64px';
        inp.onchange = () => { inp.value = String(dictation.setPauseSeconds(inp.value)); };
        l.append(tl('Pause before sending, s'), inp);
        menu.appendChild(l);
      }
      note(dictation.sendMode === 'pause'
        ? tl('Messages and answers to Claude’s questions go out by themselves after a pause in speech of the set length.')
        : tl('Messages go on the word “send”, answers to Claude’s questions on the word “answer”.'));
      note(!dictation.enabled ? tl('Voice input of messages is off.')
        : audioOut.isHeadphones() ? tl('In headphones I listen all the time. Before sending I read the message back and give 2.5 s for “cancel”.')
        : tl('Voice input doesn’t work through speakers: the microphone would hear the page’s speech. Choose headphones.'));
    }

    function toggleMenu(open = menu.hidden) {
      menu.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
      if (open) renderMenu();
    }
    btn.onclick = (e) => { e.stopPropagation(); voice.closeMenu(); toggleMenu(); };
    document.addEventListener('click', (e) => {
      if (!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) toggleMenu(false);
    });
    // Deferred: render() reads `dictation`, which is declared further down in this script.
    setTimeout(render, 0);

    return {
      get active() { return supported && promptsOn && !fatal; },
      get menuOpen() { return !menu.hidden; },
      closeMenu() { if (!menu.hidden) toggleMenu(false); },
      /** Starts listening for a prompt (queued behind earlier ones). */
      /**
       * Starts listening for a prompt (queued behind earlier ones). A permission prompt gets
       * onDecision('allow' | 'always' | 'deny'); a question (kind 'question') gets every phrase
       * via onPhrase(text), which returns 'done' once answered or a status line to show.
       */
      listen(id, statusEl, onDecision, { kind = 'permission', onPhrase, onInterim } = {}) {
        if (!supported) return;
        // Not armed yet: voice.permission() arms it when its announcement starts (or at once
        // when nothing will be said).
        const p = { id, statusEl, onDecision, kind, onPhrase, onInterim, armed: false, started: Date.now() };
        queue.push(p);
        if (!promptsOn) return status(p, OFF_TEXT);
        if (queue.length > 1) statusEl.textContent = tl('🎙️ Waiting: answer the previous request first');
        else status(p, WAIT_TEXT);
      },
      /** The prompt's announcement started (or won't be spoken): start listening for its answer. */
      arm(id) {
        const p = queue.find((q) => q.id === id);
        if (!p || p.armed) return;
        p.armed = true;
        p.started = Date.now(); // LISTEN_MS counts from here
        if (!promptsOn || p !== queue[0]) return;
        // Already listening (dictation): the next phrase goes to this prompt.
        if (rec?.ready) status(p, listenText(p), true);
        else stopRec(); // a recognizer that is still starting gets restarted for the prompt
        setTimeout(startRec, 0);
      },
      update,
      /** The page starts speaking: the microphone pauses, except in headphones. */
      pause() {
        paused = true;
        if (!listenWhileSpeaking()) stopRec();
      },
      resume() { paused = false; setTimeout(startRec, 400); },
      speaking(text) { spokenText = text ? norm(text) : ''; },
      /** The prompt was answered another way (button, run ended). */
      stop(id) {
        const i = queue.findIndex((q) => q.id === id);
        if (i < 0) return;
        const wasCurrent = i === 0;
        const [p] = queue.splice(i, 1);
        status(p, ''); // answered by a button; voice decisions leave the queue before this
        if (wasCurrent && promptsOn && queue[0] && !queue[0].armed) status(queue[0], WAIT_TEXT);
        if (wasCurrent) { stopRec(); setTimeout(startRec, 300); }
      },
      /** Run ended: prompts are gone; dictation (if any) goes on. */
      clear() { queue.length = 0; stopRec(); setTimeout(startRec, 300); },
    };
  })();
  audioOut.onChange(() => hearing.update());
  document.addEventListener('visibilitychange', () => hearing.update());

  /**
   * Speech output (Web Speech API, system voices — no network; in VS Code the TTS / STT MD Aloud
   * extension speaks when it is installed — its voice, speed and volume). Categories can be switched
   * separately in the 🔊 menu: permission prompts, Claude's answers, tool calls, end of work.
   * Phrases go through one queue so they don't cut each other off; a permission prompt or question
   * waits its turn too (nothing already queued is interrupted), and the microphone starts listening
   * for its answer when its announcement starts. Through speakers recognition is paused while
   * anything is spoken (the page's phrases contain "разреш…" / "allow"); in headphones it goes on.
   */
  const voice = (() => {
    const supported = 'speechSynthesis' in window;
    const btn = $('voiceBtn');
    const menu = $('voiceMenu');
    const REMIND_AFTER_MS = [30000, 90000];
    const CATS = {
      permissions: tl('Permission requests'),
      answers: tl('Claude’s answers'),
      tools: tl('Command calls'),
      done: tl('Task completion'),
      sent: tl('Messages being sent'),
      thinking: tl('Claude’s thinking'),
    };
    const DEFAULTS = { permissions: true, answers: true, tools: false, done: true, sent: true, thinking: false };
    const CHUNK_CHARS = 220; // Chrome cuts long utterances (~15 s); speak sentence by sentence
    // How much of an answer is read aloud (characters; 0 = all of it). The rest is on screen.
    const ANSWER_LIMITS = [[0, tl('whole')], [1500, tl('up to 1500 characters (~2 min)')], [600, tl('up to 600 characters (~40 s)')]];
    let answerMaxChars = Number(store.get('claude.voiceAnswerMax') ?? 0);

    const reminders = new Map(); // permission id -> timeout ids
    let enabled = store.get('claude.voice') !== 'off';
    const cats = { ...DEFAULTS };
    try { Object.assign(cats, JSON.parse(store.get('claude.voiceCats') || '{}')); } catch {}
    let ruVoice = null;
    let enVoice = null;
    const queue = []; // { cat, text } | { cat, chime: failed } ; permission items carry permId
    let current = null;
    let blockedNote = '';

    // Silero (built-in TTS service, via /api/tts) or the browser's system voice.
    const SILERO_SPEAKERS = [['xenia', tl('Xenia')], ['kseniya', tl('Xenia 2')], ['baya', tl('Baya')], ['aidar', tl('Aidar (male)')], ['eugene', tl('Eugene (male)')]];
    const SILERO_RETRY_MS = 60000;
    let sileroAvailable = false; // the server has a Silero service (from /api/info)
    let engine = store.get('claude.voiceEngine') || 'silero';
    if (!['silero', 'system'].includes(engine)) engine = 'silero'; // a voice that no longer exists
    let speaker = store.get('claude.voiceSpeaker') || 'xenia';
    let sileroDownUntil = 0;
    let sileroError = '';
    let playing = null; // <audio> of the current Silero phrase
    // In VS Code: the TTS / STT MD Aloud extension speaks each phrase (through this page's
    // extension, see extension.js `aloud`) with the voice, speed and volume of its settings.
    let host = null; // { available, enabled, driver } from the extension
    let hostError = '';
    const hostWaits = new Map(); // phrase id -> its answer handler
    let hostSeq = 0;
    const useHost = () => !!host?.available;
    let docPaused = false; // the file viewer's reading is paused (voice.pauseReading)
    // Speech rate for both voices: Silero audio plays faster/slower with its pitch kept
    // (playbackRate, applied at once, also to the phrase playing); the system voice reads at it
    // (utterance.rate, from the next phrase — a started utterance can't be changed).
    const RATE_MIN = 0.5, RATE_MAX = 2;
    const clampRate = (v) => Math.round(Math.min(RATE_MAX, Math.max(RATE_MIN, Number(v) || 1)) * 10) / 10;
    let rate = clampRate(store.get('claude.voiceRate') || 1);
    function setRate(v) {
      rate = clampRate(v);
      store.set('claude.voiceRate', String(rate));
      if (playing) playing.playbackRate = rate;
    }
    const useSilero = () => sileroAvailable && engine === 'silero' && Date.now() >= sileroDownUntil;

    const on = (cat) => supported && enabled && cats[cat] && !(useHost() && !host.enabled);

    function pickVoices() {
      // Prefer the higher-quality "Enhanced"/"Premium" system voices, then local ones.
      const score = (v) => (/enhanced|premium/i.test(v.name) ? 2 : 0) + (v.localService ? 1 : 0);
      const best = (re) => speechSynthesis.getVoices().filter((v) => re.test(v.lang)).sort((a, b) => score(b) - score(a))[0] || null;
      ruVoice = best(/^ru/i);
      enVoice = best(/^en/i);
    }

    /** The language of a phrase for TTS / STT MD Aloud's voice choice: as voiceFor, by its letters. */
    function langOf(text) {
      const cyr = (text.match(/[а-яё]/gi) || []).length;
      const lat = (text.match(/[a-z]/gi) || []).length;
      return lat > cyr * 2 ? 'en' : cyr ? 'ru' : LOCALE.slice(0, 2);
    }

    /** Mostly Latin text is read by an English voice, everything else by the Russian one. */
    function voiceFor(text) {
      const cyr = (text.match(/[а-яё]/gi) || []).length;
      const lat = (text.match(/[a-z]/gi) || []).length;
      return lat > cyr * 2 && enVoice ? enVoice : ruVoice;
    }

    // --- queue ---
    const stopBtn = $('stopSpeech');
    stopBtn.innerHTML = ICONS.speechStop;
    stopBtn.onclick = () => { stopAll(); promptEl.focus({ preventScroll: true }); };
    // The stop button and the pulsing speaker button both mean "the page is speaking".
    function syncStopBtn() {
      const speaking = !!current || queue.length > 0;
      stopBtn.hidden = !speaking;
      btn.classList.toggle('live', speaking);
    }

    function pump() {
      renderMenu();
      syncStopBtn();
      if (current) return;
      if (!queue.length) { hearing.resume(); return; }
      const item = (current = queue.shift());
      item.onStart?.();
      hearing.pause();
      hearing.speaking(item.text || null);
      const finish = () => { if (current === item) { current = null; hearing.speaking(null); item.onDone?.('spoken'); pump(); } };
